  if(p===G.carrier){
    ctx.save(); ctx.translate(4.8,HIP-9); ctx.rotate(-0.45);
    ctx.fillStyle='#7a4a28'; ctx.beginPath(); ctx.ellipse(0,0,4,2.5,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(0,0,0,.22)';
    ctx.beginPath(); ctx.ellipse(-1.2,0.5,2.4,1.6,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#f1f1ec'; ctx.lineWidth=0.7;
    ctx.beginPath(); ctx.moveTo(-1.8,-0.2); ctx.lineTo(1.8,-0.2); ctx.stroke();
    ctx.restore();
  }
}

// ---- knockdown: fall, stay down, then climb back to his feet -------------
// Poses are in the player's own frame (after the facing flip), so everyone
// goes over backwards from the way he was facing. rot turns the body about
// the hip; drop lowers the hip toward the turf. Leg and arm angles are the
// same bone angles drawSprite uses, so the whole rig moves, not a stiff cutout.
var KD_STAND={rot:0,    drop:0,   lt:0.17, ls:0.03, bt:-0.17, bs:-0.31, af:-0.15, ef:0.45,  ab:0.15,  eb:0.45};
var KD_LIE  ={rot:-1.45,drop:10.5,lt:-0.15,ls:0.0,  bt:0.45,  bs:-0.55, af:-2.3,  ef:0.4,   ab:-2.9,  eb:0.2};
var KD_SIT  ={rot:-0.2, drop:13,  lt:1.3,  ls:1.2,  bt:0.9,   bs:-0.5,  af:0.2,   ef:0.5,   ab:-0.8,  eb:0};
var KD_KNEEL={rot:0.35, drop:5.5, lt:1.8,  ls:0.4,  bt:0.25,  bs:-1.15, af:1.25,  ef:0.4,   ab:0.65,  eb:0.5};
var KD_FALL=0.25, KD_GETUP=0.75;
function kdMix(a,b,t){
  t=t*t*(3-2*t);
  var o={}; for(var k in a) o[k]=a[k]+(b[k]-a[k])*t; return o;
}
function knockPose(p){
  var r=Math.max(p.down||0,p.stun||0);
  if(!(r>0)){ p._kd0=0; p._kdLast=0; return null; }
  if(!p._kd0 || r>p._kdLast+0.02){
    // a fresh knockdown starts from the fall; a second hit on a man already
    // down keeps him down rather than replaying the fall
    p._kd0 = r + (p._kd0 ? KD_FALL : 0);
  }
  p._kdLast=r;
  var total=p._kd0, e=total-r;
  var fall=Math.min(KD_FALL,total*0.3);
  var up=Math.min(KD_GETUP,total*0.55);
  var pose;
  if(e<fall){
    var u=e/fall; pose=kdMix(KD_STAND,KD_LIE,u*u);        // gravity: slow, then fast
  } else if(r>up){
    pose=kdMix(KD_LIE,KD_LIE,0);
  } else {
    var g=1-r/up;                                         // 0 flat, 1 standing
    pose = g<0.35 ? kdMix(KD_LIE,KD_SIT,g/0.35)
         : g<0.70 ? kdMix(KD_SIT,KD_KNEEL,(g-0.35)/0.35)
         :          kdMix(KD_KNEEL,KD_STAND,(g-0.70)/0.30);
  }
  pose.flat=Math.min(1,Math.abs(pose.rot)/1.45);
  return pose;
}

// A tackler who loses his grip ends up on the grass.
function breakWrap(t,car){
  t.wrapT=0; t.tackleCd=1.1; t.arm=0;
  t.down=Math.max(t.down||0,0.85);
  var bx=t.x-car.x, by=t.y-car.y, bm=Math.hypot(bx,by)||1;
  t.vx=bx/bm*90; t.vy=by/bm*90;
}

var GUY_PASS=null, OUTL=null, OUTLINE_W=0.85;   // outline thickness, world units
function drawGuy(p){
  if(!SPR.ready){ drawGuyRaw(p); return; }
  var lift=p.z*15 + (p.cel>0?Math.abs(Math.sin(p.cel*9))*10:0);
  GUY_PASS='marks'; drawGuyRaw(p);
  var R=4, L=38, T=76, W=76, H=94;              // offscreen box round the man, world units
  if(!OUTL){
    OUTL={a:document.createElement('canvas'), b:document.createElement('canvas')};
    OUTL.a.width=OUTL.b.width=W*R; OUTL.a.height=OUTL.b.height=H*R;
    OUTL.ga=OUTL.a.getContext('2d'); OUTL.gb=OUTL.b.getContext('2d');
  }
  var ga=OUTL.ga, gb=OUTL.gb;
  ga.setTransform(1,0,0,1,0,0); ga.globalAlpha=1; ga.clearRect(0,0,W*R,H*R);
  ga.setTransform(R,0,0,R,(L-p.x)*R,(T-p.y)*R);
  var main=ctx; ctx=ga; GUY_PASS='body';
  try{ drawGuyRaw(p); } finally { ctx=main; GUY_PASS=null; }
  gb.setTransform(1,0,0,1,0,0); gb.globalCompositeOperation='source-over';
  gb.clearRect(0,0,W*R,H*R);
  var o=OUTLINE_W*R;
  for(var k=0;k<8;k++){ var an=k*Math.PI/4; gb.drawImage(OUTL.a, Math.cos(an)*o, Math.sin(an)*o); }
  gb.globalCompositeOperation='source-in';
  gb.fillStyle='#0a0c10'; gb.fillRect(0,0,W*R,H*R);
  gb.globalCompositeOperation='source-over';
  ctx.drawImage(OUTL.b, p.x-L, p.y-T, W, H);
  ctx.drawImage(OUTL.a, p.x-L, p.y-T, W, H);
  heroTag(p,lift);
}
function drawGuyRaw(p){
  var K=KITS[p.team];
  var ctrl=(p===G.controlled), carry=(p===G.carrier);
  var lift=p.z*15 + (p.cel>0?Math.abs(Math.sin(p.cel*9))*10:0);
  var sp=Math.hypot(p.vx,p.vy), moving=sp>8;
  var ph=p.run;
  var legF=moving?Math.sin(ph):0.18, legB=moving?Math.sin(ph+Math.PI):-0.18;

  // ---- ground marks (stay flat on the turf)
  var sh=1-Math.min(0.6,p.z*0.6);
  var kd=p._pose=knockPose(p);
  var lay=kd?kd.flat:0;
  if(GUY_PASS!=='body'){
  ctx.fillStyle='rgba(0,0,0,'+(0.38*sh)+')';
  ctx.beginPath();
  ctx.ellipse(p.x, p.y+lay*5, (8.5+lay*8)*sh, (3.4+lay*1.2)*sh,
              0, 0, Math.PI*2);
  ctx.fill();
  if(ctrl){
    ctx.strokeStyle='rgba(238,243,232,.9)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.ellipse(p.x,p.y,13,5.2,0,0,Math.PI*2); ctx.stroke();
    if(G.switchFlash>0){
      var sf=G.switchFlash/0.5, rr=13+(1-sf)*18;
      ctx.strokeStyle='rgba(255,210,63,'+sf.toFixed(2)+')'; ctx.lineWidth=2.2;
      ctx.beginPath(); ctx.ellipse(p.x,p.y,rr,rr*0.4,0,0,Math.PI*2); ctx.stroke();
    }
  }
  if(NET.on && p===G.controlled2){
    // the other human. The host has to be able to see which Rival is a person.
    ctx.strokeStyle='rgba(224,56,78,.95)'; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.ellipse(p.x,p.y,13,5.2,0,0,Math.PI*2); ctx.stroke();
  }
  if(carry){
    ctx.strokeStyle='#c78a3e'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.ellipse(p.x,p.y,16.5,6.6,0,0,Math.PI*2); ctx.stroke();
    // footing bar: how much fight he has left before he goes down
    var hpv=Math.max(0,Math.min(100,p.hp===undefined?100:p.hp));
    if(hpv<100){
      var bw=22, bx2=p.x-bw/2, by2=p.y-48-lift;
      ctx.fillStyle='rgba(8,12,16,.72)';
      roundRect(bx2-1,by2-1,bw+2,4.4,1.4); ctx.fill();
      ctx.fillStyle = hpv>55?'#4fd18b' : (hpv>25?'#ffd23f':'#e0384e');
      roundRect(bx2,by2,bw*(hpv/100),2.4,1.2); ctx.fill();
    }
  }
  }
  if(GUY_PASS==='marks') return;

  if(p.spin>0) swirl(p,lift,false);
  ctx.save();
  ctx.translate(p.x,p.y-lift);
  ctx.scale(p.face,1);
  if(p.spin>0){
    var spc=Math.cos(p.spin*Math.PI*4);
    ctx.scale(Math.abs(spc)<0.14 ? (spc<0?-0.14:0.14) : spc, 1);
  }
  ctx.rotate(p.lean);
  // three-point stance before the snap
  if(p.stance>0){ ctx.translate(0,3.4); ctx.scale(1,0.79); ctx.rotate(0.24); }
  if(p.phase>0) ctx.globalAlpha=1-p.phase*0.62;
  if(kd){                            // on the turf, or climbing off it
    ctx.translate(0,kd.drop);
    ctx.translate(0,-16); ctx.rotate(kd.rot); ctx.translate(0,16);
  }
  if(p.stun>0) ctx.globalAlpha=0.62;

  if(SPR.ready){ drawSprite(p); ctx.restore(); if(p.spin>0) swirl(p,lift,true); heroTag(p,lift); return; }

  // Vector fallback, used until the art finishes loading.
  // Flat-vector athlete, ~36 tall. Head a fifth, legs just under half.
  var HIP=-17, SHO=-25.5, HY=-31.2, HR=4.3;
  var TH=9, SH=8.5;
  var UA=7,  FA=6.5;
  var DK='rgba(0,0,0,.20)';

  // ---- back leg
  var tB=legB*0.84, sB=tB+Math.max(0,-legB)*1.15;
  var footB=limb(-1.8,HIP,tB,TH,sB,SH, 5,3.5, shade(K.pants,-26), shade(K.sock,-4));
  ctx.fillStyle='#14161a';
  ctx.beginPath(); ctx.ellipse(footB.x+1.5,footB.y+0.5,3,1.5,0,0,Math.PI*2); ctx.fill();

  // ---- back arm
  var aB=-legB*0.78, eB=aB-0.62;
  var hB=limb(-3.6,SHO+1,aB,UA,eB,FA, 3.6,2.9, shade(K.sleeve,-26), shade(p.skin,-22));
  ctx.fillStyle=shade(K.glove,-8);
  ctx.beginPath(); ctx.arc(hB.x,hB.y,2,0,Math.PI*2); ctx.fill();

  // ---- pants
  ctx.fillStyle=K.pants;
  ctx.beginPath();
  ctx.moveTo(-5,HIP-6.5); ctx.lineTo(5,HIP-6.5);
  ctx.lineTo(5.6,HIP+1.5); ctx.lineTo(-5.6,HIP+1.5);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle=DK; ctx.fillRect(-5.6,HIP-6.5,2.2,8);          // shade plane
  // side stripe: team colour with a gold hairline, like the reference
  ctx.fillStyle=K.jersey; ctx.fillRect(3.2,HIP-6.5,1.5,8);
  ctx.fillStyle=K.stripe; ctx.fillRect(4.7,HIP-6.5,0.7,8);

  // ---- torso
  ctx.fillStyle=K.jersey;
  ctx.beginPath();
  ctx.moveTo(-4.6,HIP-4.5);
  ctx.quadraticCurveTo(-6,HIP-11, -6,SHO+2);
  ctx.lineTo(6,SHO+2);
  ctx.quadraticCurveTo(6,HIP-11, 4.6,HIP-4.5);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle=DK;
  ctx.beginPath();
  ctx.moveTo(-4.6,HIP-4.5);
  ctx.quadraticCurveTo(-6,HIP-11, -6,SHO+2);
  ctx.lineTo(-3,SHO+2); ctx.lineTo(-2.4,HIP-4.5);
  ctx.closePath(); ctx.fill();

  // ---- shoulder pads under the jersey: broad but not cartoonish
  ctx.fillStyle=K.jersey;
  ctx.beginPath();
  ctx.moveTo(-6.2,SHO+3);
  ctx.quadraticCurveTo(-8.6,SHO+0.4, -6.6,SHO-2.4);
  ctx.quadraticCurveTo(-3.4,SHO-4, 0,SHO-4);
  ctx.quadraticCurveTo(3.4,SHO-4, 6.6,SHO-2.4);
  ctx.quadraticCurveTo(8.6,SHO+0.4, 6.2,SHO+3);
  ctx.closePath(); ctx.fill();
  // gold shoulder flashes
  ctx.fillStyle=K.stripe;
  ctx.beginPath();
  ctx.moveTo(-7.2,SHO+0.6); ctx.quadraticCurveTo(-5.4,SHO-2.8, -2.6,SHO-3.6);
  ctx.lineTo(-2.6,SHO-2.1); ctx.quadraticCurveTo(-4.8,SHO-1.4, -6.2,SHO+1.4);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(7.2,SHO+0.6); ctx.quadraticCurveTo(5.4,SHO-2.8, 2.6,SHO-3.6);
  ctx.lineTo(2.6,SHO-2.1); ctx.quadraticCurveTo(4.8,SHO-1.4, 6.2,SHO+1.4);
  ctx.closePath(); ctx.fill();

  // number
  ctx.save(); ctx.scale(p.face,1);
  ctx.fillStyle=K.num; ctx.font='700 6.2px "JetBrains Mono", monospace';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(String(p.num),0,SHO+8);
  ctx.restore();

  // ---- front leg
  var tF=legF*0.84, sF=tF+Math.max(0,-legF)*1.15;
  var footF=limb(1.8,HIP,tF,TH,sF,SH, 5.4,3.8, K.pants, K.sock);
  ctx.fillStyle='#1c1f25';
  ctx.beginPath(); ctx.ellipse(footF.x+1.6,footF.y+0.5,3.2,1.6,0,0,Math.PI*2); ctx.fill();

  // ---- neck
  ctx.strokeStyle=shade(p.skin,-14); ctx.lineWidth=3; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(0.2,SHO-1); ctx.lineTo(0.7,SHO-4); ctx.stroke();

  // ---- helmet: flat shell, gold stripe, dark cage
  ctx.fillStyle=p.skin;
  ctx.beginPath(); ctx.arc(1.2,HY+1.4,HR-0.7,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=K.helmet;
  ctx.beginPath(); ctx.arc(0.4,HY,HR,0,Math.PI*2); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.arc(0.4,HY,HR,0,Math.PI*2); ctx.clip();
  ctx.fillStyle=DK; ctx.fillRect(-HR-1,HY-HR,HR*0.9,HR*2.2);
  ctx.fillStyle=K.stripe; ctx.fillRect(-0.6,HY-HR-1,1.7,HR*1.1);
  ctx.restore();
  ctx.fillStyle='rgba(0,0,0,.30)';
  ctx.beginPath(); ctx.arc(-1.5,HY+0.5,1.1,0,Math.PI*2); ctx.fill();
  // facemask
  ctx.strokeStyle=K.mask; ctx.lineCap='round'; ctx.lineWidth=1.25;
  ctx.beginPath(); ctx.arc(1.8,HY+1.2,3.7,-0.9,1.05); ctx.stroke();
  ctx.lineWidth=0.9;
  ctx.beginPath(); ctx.moveTo(2.6,HY-1.1); ctx.lineTo(5.2,HY+0.6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(2.4,HY+2.3); ctx.lineTo(4.9,HY+2.3); ctx.stroke();

  // ---- front arm + ball
  if(p.arm>0){
    var k=p.arm/0.55;
    var hS=limb(3.6,SHO+1, 1.38*k, UA, 1.52*k, FA, 3.9,3.1, K.sleeve, p.skin);
    ctx.fillStyle=K.glove;
    ctx.beginPath(); ctx.arc(hS.x,hS.y,2.3,0,Math.PI*2); ctx.fill();

    var aF=-legF*0.78, eF=aF-0.62;

  }

    ctx.save(); ctx.translate(4.8,HIP-9); ctx.rotate(-0.45);
    ctx.fillStyle='#7a4a28'; ctx.beginPath(); ctx.ellipse(0,0,4,2.5,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(0,0,0,.22)';
    ctx.beginPath(); ctx.ellipse(-1.2,0.5,2.4,1.6,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#f1f1ec'; ctx.lineWidth=0.7;
    ctx.beginPath(); ctx.moveTo(-1.8,-0.2); ctx.lineTo(1.8,-0.2); ctx.stroke();
    ctx.restore();

  ctx.restore();

function heroTag(p,lift){
  if(GUY_PASS==='body') return;               // drawn on top of the outline instead
  // Labelling all sixteen turns to mush the moment two players overlap.
  var ctrl=(p===G.controlled), carry=(p===G.carrier);
  if(!ctrl && !carry && !p.hero) return;
  var last=(p.name.split(' ').pop()||p.name).toUpperCase();
  ctx.save();
  ctx.textAlign='center'; ctx.textBaseline='top';
  ctx.font=(ctrl?'700 7.6px':'700 6.8px')+' "Barlow Condensed", sans-serif';
  var w=ctx.measureText(last).width;
  ctx.fillStyle='rgba(10,14,18,.66)';
  roundRect(p.x-w/2-2.4, p.y+4.2, w+4.8, 8.8, 1.8); ctx.fill();
  ctx.fillStyle = ctrl ? '#ffd23f' : (carry ? '#ffe9a8' : 'rgba(226,234,244,.85)');
  ctx.fillText(last, p.x, p.y+5);
  ctx.restore();
}


// lighten (+) or darken (-) a hex colour by an amount
function shade(hex,amt){
  var n=parseInt(hex.slice(1),16);
  var r=Math.max(0,Math.min(255,(n>>16)+amt));
  var g=Math.max(0,Math.min(255,((n>>8)&255)+amt));
  var b=Math.max(0,Math.min(255,(n&255)+amt));
  return 'rgb('+r+','+g+','+b+')';
}
// A thrown ball spirals: nose along the flight path, laces rotating around
// the long axis. A fumble tumbles end over end instead.
function drawBall(){
  var t=G.thrown, spiral=!!t && !t.lat;
  var ang, phase, hh=(t&&t.h)||0;
  if(t){
    ang=Math.atan2(t.ty-t.y, t.tx-t.x);
    phase=(t.t/GAME_SPEED)*(t.lat?11:52);
  } else if(G.loose){
    ang=Math.atan2(G.loose.vy,G.loose.vx);
    phase=G.loose.t*11;               // loose ball tumbles
    ang+=phase;
  } else { ang=0; phase=0; }

  // vapour trail along the flight path
  if(t&&t.trail&&t.trail.length>1){
    for(var i=1;i<t.trail.length;i++){
      var a0=t.trail[i-1], a1=t.trail[i], f=i/t.trail.length;
      ctx.strokeStyle = t.homing ? ('rgba(127,216,255,'+(f*0.85).toFixed(3)+')')
                                 : ('rgba(241,241,236,'+(f*0.5).toFixed(3)+')');
      ctx.lineWidth=(t.homing?1.1:0.5)+f*2.2; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(a0.x,a0.y); ctx.lineTo(a1.x,a1.y); ctx.stroke();
    }
  }
  // ground shadow tracks the ball while it hangs
  if(hh>0.5){
    ctx.fillStyle='rgba(0,0,0,'+(0.30-Math.min(0.2,hh/140)).toFixed(3)+')';
    ctx.beginPath();
    ctx.ellipse(G.ball.x,G.ball.y,5.5-hh*0.05,2.4-hh*0.02,0,0,Math.PI*2);
    ctx.fill();
  }

  ctx.save();
  ctx.translate(G.ball.x,G.ball.y-hh);
  ctx.rotate(ang);

  // nose wobble on a spiral, full tumble on a fumble
  var wob = spiral ? Math.sin(phase*0.5)*0.05 : 0;
  ctx.rotate(wob);

  // body
  if(BALL_IMG.ready){
    ctx.drawImage(BALL_IMG,-7.9,-4.9,15.8,9.8);
  } else {
    ctx.fillStyle='#7a4a28';
    ctx.beginPath(); ctx.ellipse(0,0,7.1,4.2,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(0,0,0,.22)';
    ctx.beginPath(); ctx.ellipse(0,1.3,7.1,2.9,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#f1f1ec'; ctx.lineWidth=0.9;
    ctx.beginPath(); ctx.arc(4.5,0,2.2,-1.05,1.05); ctx.stroke();
    ctx.beginPath(); ctx.arc(-4.5,0,2.2,Math.PI-1.05,Math.PI+1.05); ctx.stroke();
  }

  if(spiral){
    // Two seams half a turn apart. One of them is always on the near side, so
    // the spin reads as continuous rotation instead of the laces blinking on
    // and off once a revolution.
    // A spiral turns about the LONG axis, so a seam travels across the ball,
    // up and over and under, not from nose to tail. It was sliding lengthways,
    // which reads as the ball rolling end over end.
    for(var sg=0; sg<2; sg++){
      var ph=phase+sg*Math.PI, c2=Math.cos(ph);
      if(c2<=0.02) continue;                      // that seam is round the back
      var sy=Math.sin(ph)*3.5;                    // how far across the face
      var half=6.0*Math.sqrt(Math.max(0.04,1-(sy/4.3)*(sy/4.3)));
      ctx.globalAlpha=0.26+0.50*c2;
      ctx.strokeStyle='#f1f1ec'; ctx.lineWidth=0.8;
      ctx.beginPath(); ctx.moveTo(-half,sy); ctx.lineTo(half,sy); ctx.stroke();
      ctx.globalAlpha=1;
    }
    // the laces ride the near seam, so they travel across it too
    var c=Math.cos(phase);
    if(c>0){
      var ly=Math.sin(phase)*3.5;
      ctx.globalAlpha=Math.min(1,c*1.6);
      ctx.strokeStyle='#f1f1ec';
      ctx.lineWidth=0.95;
      ctx.beginPath(); ctx.moveTo(-2.7,ly); ctx.lineTo(2.7,ly); ctx.stroke();
      ctx.lineWidth=0.75;
      var rung=0.85+0.5*c;                        // rungs foreshorten near the rim
      for(var i=-2;i<=2;i++){
        ctx.beginPath();
        ctx.moveTo(i*1.25,ly-rung); ctx.lineTo(i*1.25,ly+rung); ctx.stroke();
      }
      ctx.globalAlpha=1;
    }
    // faint motion streak behind the nose
    ctx.globalAlpha=0.28; ctx.strokeStyle='#f1f1ec'; ctx.lineWidth=0.7;
    ctx.beginPath(); ctx.moveTo(-7,0); ctx.lineTo(-13,0); ctx.stroke();
    ctx.globalAlpha=1;
  } else {
    ctx.strokeStyle='#f1f1ec'; ctx.lineWidth=0.9;
    ctx.beginPath(); ctx.moveTo(-2.4,0); ctx.lineTo(2.4,0); ctx.stroke();
  }
  ctx.restore();
}

function roundRect(x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

// Which team this browser is driving. The guest is always the Rivals.
function mySide(){ return (NET.on && !NET.host) ? 'A' : 'H'; }

  elDD.textContent=ord+' & '+Math.max(1,Math.round(G.toGo))+'  ·  ball on '+yardLineLabel(G.los);

      '  ·  HIKE :'+(G.playClock<10?'0':'')+Math.max(0,Math.ceil(G.playClock));

  } else {
    elPoss.textContent=iHaveBall()?'Your ball':(mySide()==='H'?'Rivals ball — you’re on D':'Heroes ball — you’re on D');
    elPoss.style.color=iHaveBall()?'#ffd23f':'#e0384e';
  }

                        ' · room '+NET.code+
                        ' · '+((NET.conn&&NET.conn.open)?'linked':'dropped')) : '';

    dbg.textContent = net && thr ? (net+'  ·  '+thr) : (net||thr);
    dbg.style.color = NET.on ? ((NET.conn&&NET.conn.open)?'#4fd18b':'#e0384e') : '#6d818f';
  }
  var guest=(NET.on&&!NET.host);
  var pw=guest?G.M2.power:G.power;
  var st=guest?G.M2.stam:G.stam;
  barPw.style.width=pw+'%'; barSt.style.width=st+'%';
  var onD=!iHaveBall();
  var rdy = onD ? (G.hitCd>0?0:Math.min(100,(G.power/45)*100))
                : (HERO.move==='cannon'?100:(G.moveCd>0?0:Math.min(100,(G.power/Math.max(1,HERO.cost))*100)));
  barMv.style.width=rdy+'%';
  elMvName.textContent = onD ? 'Big Hit' : HERO.moveName;

// ---- ability icons: label, key and whether they are ready right now -----
var AB=[null,null,null,null,null,null];
function ab(i){ return AB[i] || (AB[i]=document.getElementById('ab'+i)); }
function setAb(i,cap,key,ready,live,cd,icon){
  var e=ab(i); if(!e) return;
  if(icon && e.dataset.icon!==icon){
    var sv=e.querySelector('svg');
    if(sv){ sv.innerHTML=icon; e.dataset.icon=icon; }
  }
  e.querySelector('.cap').textContent = (cd&&cd>0.05) ? (cd.toFixed(1)+'s') : cap;
  e.querySelector('.key').textContent=key;
  var ok = !!ready && !!live && !(cd>0.05);
  e.classList.toggle('on', ok);
  e.classList.toggle('off', !ok);
}
function abilities(onD){
  var live=(G.phase==='live'), pre=(G.phase==='presnap');
  var me = G.controlled;                 // on the guest this is its own man
  var kit = kitFor(me);
  var KEYS=['Q','R','T'];
  var net = (NET.on && !NET.host) ? (G.netAb||[0,0,0]) : null;
  for(var i=0;i<3;i++){
    var id=kit[i];
    if(!id){ setAb(i+1,'\u2014',KEYS[i],false,false); continue; }
    var left = Math.min(net ? net[i] : abLeft(me,id), ABIL[id].cd);
    setAb(i+1, left>0 ? (left+(left===1?' PLAY':' PLAYS')) : ABIL[id].name,
          KEYS[i], left===0, live, 0, AB_ICON[id]);
  }
}

// ---- the play card: who just made something happen ----------------------
var cardEl=null, cardTimer=null;
function showCard(p, action){
  if(!p) return;
  if(!cardEl) cardEl=document.getElementById('card');
  if(!cardEl) return;
  var POS={QB:'QB',WR:'WR',TE:'TE',RB:'RB',C:'C',OL:'OL',RUSH:'DL',COV:'DB',BL:'OL'};
  document.getElementById('pcPos').textContent=POS[p.role]||p.role;
  document.getElementById('pcNum').textContent='#'+p.num;
  document.getElementById('pcName').textContent=(p.name||'PLAYER').toUpperCase();
  document.getElementById('pcAct').textContent=action;
  cardEl.classList.toggle('away', p.team!=='H');

  // portrait: the real rig, posed mid-stride, so it is a person not a helmet
  var cc=document.getElementById('pcArt'), x=cc.getContext('2d');
  x.setTransform(1,0,0,1,0,0);
  x.clearRect(0,0,cc.width,cc.height);

  // stadium wash behind him
  var g1=x.createLinearGradient(0,0,0,cc.height);
  if(p.team==='H'){ g1.addColorStop(0,'#2d477f'); g1.addColorStop(1,'#0d1527'); }
  else { g1.addColorStop(0,'#95242f'); g1.addColorStop(1,'#280b10'); }
  x.fillStyle=g1; x.fillRect(0,0,cc.width,cc.height);
  x.save();
  x.globalAlpha=0.10; x.strokeStyle='#fff'; x.lineWidth=7;
  for(var i=-3;i<11;i++){ x.beginPath(); x.moveTo(i*46+60,0); x.lineTo(i*46,cc.height); x.stroke(); }
  x.restore();
  // spotlight
  var rg=x.createRadialGradient(cc.width*0.5,cc.height*0.44,6,cc.width*0.5,cc.height*0.44,cc.height*0.9);
  rg.addColorStop(0,'rgba(255,255,255,.18)'); rg.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=rg; x.fillRect(0,0,cc.width,cc.height);

  // borrow the game's own renderer, pointed at the card canvas
  if(SPR.ready){
    var realCtx=ctx, realG=G.carrier;
    try{
      ctx=x;
      var pose={ team:p.team, num:p.num, name:p.name, role:p.role,
                 x:0, y:0, vx:150, vy:0, face:1, run:0.95,
                 spd:1, pwr:1, agi:1, lean:0.16, spin:0, z:0,
                 arm:0, throwArm:0, phase:0, stun:0, cel:0, burst:0, hero:false };
      G.carrier=null;                       // no ball tucked in the portrait
      x.save();
      x.translate(cc.width/2, cc.height*0.92);
      x.scale(3.6,3.6);
      drawSprite(pose);
      x.restore();
    }catch(e){ /* portrait is decoration, never let it break the card */ }
    ctx=realCtx; G.carrier=realG;
  }
  // floor shadow and a base bar
  x.fillStyle='rgba(0,0,0,.35)';
  x.beginPath(); x.ellipse(cc.width/2,cc.height*0.93,44,9,0,0,Math.PI*2); x.fill();
  x.fillStyle='rgba(0,0,0,.34)'; x.fillRect(0,cc.height-14,cc.width,14);

  cardEl.classList.add('in');
  if(cardTimer) clearTimeout(cardTimer);
  cardTimer=setTimeout(function(){ cardEl.classList.remove('in'); }, 2300);
}



// A card used to pop for every hit, block and spin, so the corner of the
// screen was a slideshow. Nothing shows a card mid-play now; the play is
// credited as it goes, and one card comes up at the whistle for whoever
// actually decided it.
var ACT_WEIGHT = {
  'TOUCHDOWN':100, 'PICK SIX':100, 'INTERCEPTION':90, 'FORCED FUMBLE':85,
  'SCOOP':80, 'SACK':70, 'RECOVERY':60, 'PASS DEFENDED':55,
  'GROUND POUND':50, 'BIG HIT':45, 'CLOTHESLINE':42, 'SLAM':42,
  'SUPER BLOCK':32, 'STIFF ARM':30, 'TACKLE':20
};
function credit(p, action){
  if(!G.cur || !p) return;
  var side = (p.team===G.cur.team) ? 'o' : 'd';
  var w = ACT_WEIGHT[action] || 10;
  if(w >= (G.cur[side+'W']||0)){
    G.cur[side+'Star']=p; G.cur[side+'Act']=action; G.cur[side+'W']=w;
  }
}

// ================================================================== the book
// Every play gets written down: who called what, who touched it, how far it
// went and how it ended. The box score is just the log added up.
function freshSide(){
  return {plays:0, yards:0, pa:0, pc:0, py:0, ptd:0, ints:0,
          ra:0, ry:0, rtd:0, sacks:0, sy:0, fum:0, fd:0};
}
function freshStats(){ return {log:[], H:freshSide(), A:freshSide()}; }

function playName(id){
  var all=PLAYS.H.concat(PLAYS.A);
  for(var i=0;i<all.length;i++) if(all[i].id===id) return all[i].name;
  if(id==='punt') return 'PUNT';
  if(id==='fg')   return 'FIELD GOAL';
  return String(id||'').toUpperCase();
}
function surname(p){
  if(!p||!p.name) return '';
  var bits=p.name.split(' ');
  return bits[bits.length-1].toUpperCase();
}

// opened at the snap, closed at the whistle
function openPlay(playId){
  G.cur = {no:G.playNo, team:G.offense, down:G.down, toGo:Math.max(1,Math.round(G.toGo)),
           los:G.los, play:playName(playId), passer:null, target:null,
           comp:false, pick:false, rusher:null, fum:false, kick:null, qb:null,
           oStar:null, oAct:'', oW:0, dStar:null, dAct:'', dW:0};
}

function logPlay(atX, label, scored){
  var c=G.cur; if(!c) return;
  G.cur=null;                                  // exactly one entry per play
  var d=(c.team==='H')?1:-1;
  var gained=Math.round((atX-c.los)*d/YD);
  var S=G.stats[c.team];
  var car=G.carrier;
  var designedRun = (c.play==='POWER RUN'||c.play==='DRAW');
  var sack = !c.comp && !c.pick && !c.passer && !c.rusher && !c.kick &&
             !designedRun && gained<0;

  S.plays++;
  if(!c.kick){
    S.yards+=gained;
    if(c.passer){
      S.pa++;
      if(c.comp){ S.pc++; S.py+=gained; if(scored) S.ptd++; }
      if(c.pick) S.ints++;
    } else if(sack){
      S.sy+=gained;                        // a sack is not a carry
    } else {
      S.ra++; S.ry+=gained; if(scored) S.rtd++;
    }
  }
  if(sack) S.sacks++;
  if(c.fum) S.fum++;

  var who = c.comp  ? (surname(c.passer)+' to '+surname(c.target))
          : c.pick  ? (surname(c.passer)+' picked off')
          : c.rusher? surname(c.rusher)
          : c.passer? (surname(c.passer)+' incomplete')
          : sack    ? surname(c.qb)
          : car     ? surname(car) : '';

  // Five yards or a score is the offence's play. Anything less, or a pick or
  // a fumble, belongs to whoever on defence made it that way.
  var offenceWon = scored || gained >= 5;
  var star, act;
  if(scored && car && car.team!==c.team){
    star=car; act = c.pick ? 'PICK SIX' : 'SCOOP AND SCORE';
  } else if(offenceWon){
    star = c.oStar || car || c.target || c.rusher || c.qb;
    act  = scored ? 'TOUCHDOWN'
         : (c.oAct && c.oStar===star) ? c.oAct
         : c.comp ? 'BIG CATCH' : 'BIG GAIN';
  } else {
    star = c.dStar;
    act  = c.dAct || (c.pick?'INTERCEPTION' : c.fum?'FORCED FUMBLE'
         : sack?'SACK' : (c.passer&&!c.comp)?'PASS DEFENDED' : 'TACKLE');
    if(!star){ star = car || c.qb; act = c.passer?'INCOMPLETE':'NO GAIN'; }
  }
  if(star) showCard(star, act);

  G.stats.log.push({no:c.no, team:c.team, down:c.down, toGo:c.toGo,
                    spot:yardLineLabel(c.los), play:c.play, yds:gained,
                    res: scored?'TOUCHDOWN':(sack?'SACK':(label||'')), who:who});
  if(G.stats.log.length>60) G.stats.log.shift();
}

function lastPlayLine(){
  var L=(G.stats&&G.stats.log)||[];
  if(!L.length) return '';
  var e=L[L.length-1];
  var sign=e.yds>0?'+':'';
  return '<div style="margin:-6px 0 12px;font-size:13px;color:#8fa3b0;letter-spacing:.02em">'+
    '<b style="color:#e8eef2">Last play:</b> '+e.play+' &middot; '+sign+e.yds+
    ' yd'+(Math.abs(e.yds)===1?'':'s')+' &middot; '+e.res+
    (e.who?(' &middot; '+e.who):'')+'</div>';
}

function statRow(label,h,a,hi){
  var c=hi?'#ffd23f':'#e8eef2';
  return '<div style="display:flex;padding:3px 0;border-bottom:1px solid #22303a">'+
    '<div style="flex:1;color:#8fa3b0">'+label+'</div>'+
    '<div style="width:104px;text-align:right;white-space:nowrap;color:'+c+';font-family:\'JetBrains Mono\',monospace">'+h+'</div>'+
    '<div style="width:104px;text-align:right;white-space:nowrap;color:'+c+';font-family:\'JetBrains Mono\',monospace">'+a+'</div></div>';
}

function showStats(){
  var H=G.stats.H, A=G.stats.A, L=G.stats.log;
  var html='<h2>Box score</h2>'+
    '<p class="sub">Heroes '+G.scoreH+' &middot; Rivals '+G.scoreA+'</p>'+
    '<div style="display:flex;padding:2px 0 5px;font-size:11px;letter-spacing:.12em;font-weight:700">'+
      '<div style="flex:1"></div>'+
      '<div style="width:104px;text-align:right;white-space:nowrap;color:#ffd23f">HEROES</div>'+
      '<div style="width:104px;text-align:right;white-space:nowrap;color:#e0384e">RIVALS</div></div>'+
    statRow('Plays', H.plays, A.plays)+
    statRow('Total yards', H.yards, A.yards, true)+
    statRow('First downs', H.fd, A.fd)+
    statRow('Passing', H.pc+'/'+H.pa+'  '+H.py+'yd', A.pc+'/'+A.pa+'  '+A.py+'yd')+
    statRow('Rushing', H.ra+' for '+H.ry+'yd', A.ra+' for '+A.ry+'yd')+
    statRow('Touchdowns', H.ptd+H.rtd, A.ptd+A.rtd)+
    statRow('Sacks taken', H.sacks+' for '+H.sy+'yd', A.sacks+' for '+A.sy+'yd')+
    statRow('Interceptions thrown', H.ints, A.ints)+
    statRow('Fumbles', H.fum, A.fum);

  html+='<div style="margin:14px 0 4px;font-size:11px;letter-spacing:.14em;'+
        'font-weight:700;color:#8fa3b0">PLAY BY PLAY</div>'+
        '<div style="max-height:190px;overflow:auto;font-size:12.5px">';
  if(!L.length) html+='<div style="color:#8fa3b0">Nothing yet.</div>';
  for(var i=L.length-1;i>=0;i--){

        ' &amp; '+e.toGo+'</div>'+
      '<div style="flex:1;color:#e8eef2">'+e.play+(e.who?(' &middot; '+e.who):'')+'</div>'+
      '<div style="width:46px;text-align:right;font-family:\'JetBrains Mono\',monospace">'+sign+e.yds+'</div>'+
      '<div style="width:96px;text-align:right;color:#8fa3b0">'+e.res+'</div></div>';
  }
  html+='</div><div style="margin-top:10px">'+
    '<button class="card" id="statBack" type="button" style="width:100%">'+
    '<div class="k">BACK</div><div class="t">Back to the play</div></button></div>';

  elSheet.innerHTML=html; elOv.classList.add('show');
  document.getElementById('statBack').addEventListener('click',function(){
    G.showingStats=false;
    if(G.phase==='over') showOver(); else showPlaycall();
  });

    b.addEventListener('click',function(){ choose(b.getAttribute('data-id')); });

function choose(id){
  // The guest owns no simulation. It posts its call and waits.
  if(NET.on && !NET.host){
    netSend({t:'play', id:id, pn:G.playNo});
    NET.sentPick=true;
    elOv.classList.remove('show');
    say('PLAY IN \u2014 WAITING ON THEM', 1000);
    return;
  }
  elOv.classList.remove('show');
  if(NET.on && NET.host){
    G.hostPick=id; G.pickAt=performance.now();
    tryStartPlay();
    return;
  }
  if(id==='punt'||id==='fg'){ startKick(id); return; }
  G.aiPlay = (G.offense==='H') ? pickAiDefense() : pickAiOffense();
  setupPlay(id);
}

// Host only. Both calls are in (or the other coach has stalled long enough
// that we stop waiting on them), so run the down.
function tryStartPlay(force){
  if(!G.hostPick) return;
  var theirs = NET.guestPick;
  if(theirs == null && !force) return;
  NET.guestPick = null;
  var mine = G.hostPick; G.hostPick = null; G.pickAt = 0;

  // a kick ends the down on its own, whoever called it
  if(G.offense==='H' && (mine==='punt'||mine==='fg')){ startKick(mine); return; }
  if(G.offense==='A' && (theirs==='punt'||theirs==='fg')){ startKick(theirs); return; }
  // a kick called by the side without the ball is not a thing
  if(mine==='punt'||mine==='fg') mine='run';
  if(theirs==='punt'||theirs==='fg') theirs='blitz';

  G.aiPlay = theirs || ((G.offense==='H') ? pickAiDefense() : pickAiOffense());
  setupPlay(mine);
}

// Host only, while one coach is still staring at the sheet.

  if(!G.hostPick) return;

// ==================================================================== net
// Authoritative host. The host runs the entire simulation and publishes the
// world twenty times a second. The guest sends only its input and renders
// whatever it is told, so the two machines can never disagree.
var NET={on:false,host:false,peer:null,conn:null,
           remoteIn:null,world:null,acc:0,rate:1/20,code:'',msg:'',
           guestPick:null,sentPick:false,remoteHike:false,choosing:false,
           remoteThrow:null,remoteTarget:-1};

function netReady(){ return typeof window.Peer!=='undefined'; }

// Four characters, none of them a lookalike, so a code read down the phone
// lands on the first try.
var CODE_CHARS='ACDEFGHJKLMNPQRTUVWXY349';
function newCode(){
  var s=''; for(var i=0;i<4;i++) s+=CODE_CHARS[(Math.random()*CODE_CHARS.length)|0];
  return s;
}
function peerId(code){ return 'gridiron-heroes-v1-'+code; }
function shareLink(code){
  return location.origin+location.pathname+'?r='+code;
}

function netSay(t){
  NET.msg=t;
  var el=document.getElementById('netMsg');
  if(el) el.innerHTML=t;
}

function netTeardown(){
  try{ if(NET.conn) NET.conn.close(); }catch(e){}
  try{ if(NET.peer) NET.peer.destroy(); }catch(e){}
  NET.on=false; NET.conn=null; NET.peer=null; NET.remoteIn=null; NET.world=null;
}

function netDropped(){
  if(!NET.on) return;
  netTeardown();
  say('THE OTHER PLAYER LEFT',2000);
  setTimeout(function(){ G=freshGame(); G.phase='intro'; PICK_THEN='solo'; showStart(); },2000);
}

// ---- host ------------------------------------------------------------------
function hostOnline(tries){
  tries=tries||0;
  if(tries>4){ netSay('Could not open a room. Try again in a moment.'); return; }
  if(!document.getElementById('netMsg')){
    // arriving from the hero pick: put the two-player panel back up first
    showOnline();
    document.getElementById('netForm').style.display='none';
  }
  netTeardown();
  NET.host=true;
  var code=newCode(); NET.code=code;
  netSay('Opening a room...');

  var p=new Peer(peerId(code),{debug:0});
  NET.peer=p;

  p.on('open',function(){
    netSay('<div style="font-family:\'Anton\',sans-serif;font-size:15px;color:#e8eef2">'+
             'Your code is <span style="font-family:\'JetBrains Mono\',monospace;font-size:30px;'+
             'color:#ffd23f;letter-spacing:.26em">'+code+'</span></div>'+
           '<div style="margin-top:6px">Send them this link, or just the four letters:</div>'+
           '<div style="font-family:\'JetBrains Mono\',monospace;font-size:12px;color:#8fa3b0;'+
             'word-break:break-all;margin-top:2px">'+shareLink(code)+'</div>'+
           '<div style="margin-top:10px;color:#4fd18b">Waiting for them to join...</div>');
  });

  p.on('error',function(e){
    if(e&&e.type==='unavailable-id'){ hostOnline(tries+1); return; }   // code collision
    netSay('Connection problem: '+((e&&e.type)||'unknown')+'. Try again.');
  });

  p.on('connection',function(c){
    if(NET.conn&&NET.conn.open){ try{ c.close(); }catch(e){} return; }  // room is full
    NET.conn=c;
    c.on('data',function(d){
      if(!d) return;
      if(d.t==='play'){
        if(G && d.pn===G.playNo){ NET.guestPick=d.id; tryStartPlay(); }
        return;
      }
      if(d.t==='hero'){ GUEST_HERO=heroById(d.id)||GUEST_HERO; return; }
      if(d.t==='dive'){ swipeTackle(d.x,d.y,'A'); return; }
      if(d.t==='hike'){ NET.remoteHike=true; return; }
      if(d.t==='thr'){ NET.remoteThrow={x:d.x,y:d.y}; return; }
      if(d.t==='tgt'){ NET.remoteTarget=d.i; return; }
      if(d.t!=='in') return;
      var r=NET.remoteIn||(NET.remoteIn={x:0,y:0,sp:0,b1:0,b2:0,b3:0,sw:0,k1:0,k2:0,k3:0});
      r.x=d.x; r.y=d.y; r.sp=d.sp;
      if(d.b1) r.b1=1;                 // taps latch until the sim consumes them
      if(d.b2) r.b2=1;
      if(d.b3) r.b3=1;
      if(d.sw) r.sw=1;
      if(d.k1) r.k1=1;
      if(d.k2) r.k2=1;
      if(d.k3) r.k3=1;
    });
    c.on('open',function(){
      NET.on=true;
      elOv.classList.remove('show');
      G=freshGame(); G.phase='playcall';
      say('THEY ARE IN - YOU ARE THE HEROES',2000);
    });
    c.on('close',netDropped);
    c.on('error',netDropped);
  });
}

// ---- guest -----------------------------------------------------------------
function joinOnline(code){
  code=String(code||'').trim().toUpperCase();
  if(code.length!==4){ netSay('A code is four letters. Check what they sent you.'); return; }
  netTeardown();
  NET.host=false; NET.code=code;
  netSay('Looking for room '+code+'...');

  var p=new Peer({debug:0});
  NET.peer=p;

  p.on('error',function(e){
    var t=(e&&e.type)||'';
    if(t==='peer-unavailable') netSay('No room called '+code+'. Ask them to read it out again.');
    else netSay('Connection problem: '+(t||'unknown')+'. Try again.');
  });

  p.on('open',function(){
    var c=p.connect(peerId(code),{serialization:'json'});
    if(!c){ netSay('Could not reach that room.'); return; }
    NET.conn=c;
    c.on('open',function(){
      NET.on=true;
      if(!G) G=freshGame();
      say('YOU ARE THE RIVALS',2000);
      NET.choosing=true;
      PICK_THEN='guest';
      showHeroPick();
    });
    c.on('data',function(d){ if(d&&d.t==='w') NET.world=d; });
    c.on('close',netDropped);
    c.on('error',netDropped);
    setTimeout(function(){
      if(!NET.on) netSay('Still trying to reach '+code+'...');
    },4000);
    setTimeout(function(){
      if(NET.on) return;
      netTeardown();
      netSay('No room called '+code+' is open. A code only lasts while the '+
             'other person has the page open, so have them press HOST again '+
             'and read you the new one.');
    },13000);
  });
}

// guest: publish my stick and my taps
function netSend(msg){
  if(!NET.conn||!NET.conn.open) return;
  try{ NET.conn.send(msg); }catch(e){}
}

function publishInput(){
  if(!NET.on||NET.host||!NET.conn||!NET.conn.open) return;
  var a=axis();
  var tk=tapTarget();                       // 4/5/6/7 throw straight to a man
  if(tk>=0) netSend({t:'tgt', i:tk});
  if(tapHike()) netSend({t:'hike'});
  netSend({t:'in',
    x:+a.x.toFixed(2), y:+a.y.toFixed(2),
    sp:wantSprint()?1:0,
    b1:tapJuke()?1:0, b2:tapMove()?1:0, b3:tapQ()?1:0, sw:tapSwitch()?1:0,
    k1:tapAb1()?1:0, k2:tapAb2()?1:0, k3:tapAb3()?1:0
  });
}

// host: drive the Rivals man from whatever the guest sent
function applyRemoteInput(dt){
  // Only the throw mailbox now. Movement, abilities, switching and the meters
  // all run through driveHuman(guestSeat()), the same path the host uses.
  if(!NET.on||!NET.host) return;
  if(G.offense==='A' && G.phase==='live' && NET.remoteThrow){
    var rt=NET.remoteThrow; NET.remoteThrow=null;
    throwAt(rt.x, rt.y, 'A');
  } else if(G.offense!=='A' || G.phase!=='live'){
    NET.remoteThrow=null;
  }
}

function pickRemoteMan(cycle){
  // when the Rivals have the ball the guest drives whoever is carrying it,
  // exactly the way the host drives his own carrier
  if(!cycle && G.offense==='A' && G.carrier && G.carrier.team==='A') return G.carrier;
  var pool=[];
  for(var i=0;i<G.players.length;i++){
    var q=G.players[i];
    if(q.team==='A'&&q.stun<=0) pool.push(q);
  }
  if(!pool.length) return null;
  var bx=G.ball?G.ball.x:0, by=G.ball?G.ball.y:0;
  pool.sort(function(a,b){
    return Math.hypot(a.x-bx,a.y-by)-Math.hypot(b.x-bx,b.y-by);
  });
  if(cycle){
    var idx=pool.indexOf(G.controlled2);
    return pool[(idx+1)%pool.length];
  }
  return pool[0];
}

// host: push the world out
function publishWorld(dt){
  if(!NET.on||!NET.host) return;
  if(!NET.conn||!NET.conn.open) return;
  NET.acc+=dt; if(NET.acc<NET.rate) return; NET.acc=0;
  var ps=[];
  for(var i=0;i<G.players.length;i++){
    var q=G.players[i];
    ps.push([Math.round(q.x),Math.round(q.y),q.face,+q.run.toFixed(2),
             q.team==='H'?1:0,q.num,q.role,q.name,
             Math.round(q.hp),+q.stun.toFixed(2),+q.down.toFixed(2),
             +q.z.toFixed(2),+q.arm.toFixed(2),+q.spin.toFixed(2),
             +q.lean.toFixed(2),+q.throwArm.toFixed(2),
             Math.round(q.vx),Math.round(q.vy),
             q===G.carrier?1:0, q===G.controlled?1:0, q===G.controlled2?1:0,
             +(q.stance||0).toFixed(2), q.skin, q.hero?1:0, +(q.cel||0).toFixed(2)]);
  }
  try{ NET.conn.send({
    t:'w', pn:G.playNo, p:ps,
    b:G.ball?[Math.round(G.ball.x),Math.round(G.ball.y),G.ball.held?1:0]:null,
    ph:G.phase, lo:Math.round(G.los), dn:G.down, tg:Math.round(G.toGo),
    sh:G.scoreH, sa:G.scoreA, ck:Math.round(G.clock), pc:Math.round(G.playClock),
    of:G.offense, cr:G.clockRunning?1:0,
    p2:Math.round(G.M2.power), s2:Math.round(G.M2.stam),
    h2:+G.M2.hitCd.toFixed(2), m2:+G.M2.moveCd.toFixed(2),
    ab:(function(){
      var k=kitFor(G.controlled2), o=[0,0,0];
      for(var i=0;i<3;i++) o[i]=k[i]?abLeft(G.controlled2,k[i]):0;
      return o;
    })()
  }); }catch(e){}
}

// The guest gets its own play sheet, driven off the phase the host reports.
function guestSheet(){
  if(!G) return;
  if(NET.choosing) return;          // the guest is picking a hero; leave it alone
  if(G.showingStats) return;
  if(G.phase==='playcall'){
    if(!NET.sentPick && !elOv.classList.contains('show')) showPlaycall();
  } else {
    NET.sentPick=false;
    if(elOv.classList.contains('show')) elOv.classList.remove('show');
  }
}

// guest: rebuild a renderable world out of what arrived
function consumeWorld(){
  var w=NET.world; if(!w||!w.p) return false;
  if(!G) G=freshGame();
  G.players.length=0; G.carrier=null; G.controlled=null;
  for(var i=0;i<w.p.length;i++){
    var a=w.p[i];
    var q={x:a[0],y:a[1],face:a[2],run:a[3],team:a[4]?'H':'A',num:a[5],role:a[6],
           name:a[7],hp:a[8],stun:a[9],down:a[10],z:a[11],arm:a[12],spin:a[13],
           lean:a[14],throwArm:a[15],vx:a[16],vy:a[17],
           phase:0,burst:0,wrapped:0,iFrames:0,
           stance:a[21]||0, skin:a[22]||'#c98f63', hero:!!a[23], cel:a[24]||0,
           spd:1,pwr:1,agi:1,engaged:0,shedAt:2,lane:0,cover:null,
           pos:'',assign:null,blockIdx:0,aiCd:0,route:null};
    G.players.push(q);
    if(a[18]) G.carrier=q;
    if(a[20]) G.controlled=q;   // highlight the man this guest is driving
  }
  if(w.b) G.ball={x:w.b[0],y:w.b[1],held:!!w.b[2]};
  G.phase=w.ph; G.los=w.lo; G.down=w.dn; G.toGo=w.tg;
  G.scoreH=w.sh; G.scoreA=w.sa; G.clock=w.ck; G.playClock=w.pc;
  G.offense=w.of; G.clockRunning=!!w.cr; G.playNo=w.pn|0;
  G.M2.power=w.p2===undefined?100:w.p2;
  G.M2.stam=w.s2===undefined?100:w.s2;
  G.M2.hitCd=w.h2||0; G.M2.moveCd=w.m2||0;
  G.netAb=w.ab||[0,0,0];
  G.thrown=null; G.loose=null; G.windup=null; G.fx=G.fx||[];
  return true;
}

// ================================================================ loop
var last=0;
function frame(ts){
  if(!last) last=ts;
  var dt=Math.min(0.05,(ts-last)/1000)*GAME_SPEED; last=ts;
  if(NET.on && !NET.host){
    // guest: render only, no simulation
    try{
      publishInput();
      if(consumeWorld() && G.players.length) draw();
      if(G) hud();
      guestSheet();
    }catch(err){
      if(!frame._gerr){ frame._gerr=true; console.error('guest frame error:',err); }
      ctx.setTransform(dpr,0,0,dpr,0,0);
    }
    requestAnimationFrame(frame);
    return;
  }
  if(G){
    // one bad frame must never stop the loop
    try{
      if(G.phase==='kick') kickTick(dt);
    if(G.phase==='dead'){ if(G.hitStop>0) G.hitStop-=dt; else deadTick(dt); }
    if(G.phase==='presnap') presnap(dt);
      if(G.phase==='live'){
        if(G.hitStop>0) G.hitStop-=dt;             // frozen on the impact
        else {
          var sh0=G.shake; step(dt);
          // a hard hit is whatever just kicked the screen shake: hold that frame
          if(G.shake>sh0+5 && !REDUCED) G.hitStop=Math.min(0.13, 0.05+(G.shake-sh0)*0.005);
        }
      }
      if(G.phase==='playcall'){
        if(G.showingStats){ /* reading the book */ }
        else if(G.hostPick) waitTick();
        else if(!elOv.classList.contains('show')) showPlaycall();
      }
      if(G.players.length||G.kick) draw();
      else { ctx.setTransform(dpr,0,0,dpr,0,0); ctx.fillStyle='#0c1114'; ctx.fillRect(0,0,VW,VH); }
      hud();
      publishWorld(dt);
    }catch(err){
      if(!frame._logged){ frame._logged=true; console.error('frame error:',err); }
      ctx.restore(); ctx.setTransform(dpr,0,0,dpr,0,0);
    }
  }
  requestAnimationFrame(frame);
}

// a small window into the sim, for diagnosing input problems
window.GH = {
  state:function(){ return !G?null:{
    phase:G.phase, offense:G.offense, mine:mySide(), iHaveBall:iHaveBall(),
    dragging:!!G.drag, controlled:G.controlled?(G.controlled.name||G.controlled.role):null,
    diveCd:+(G.diveCd||0).toFixed(2), diveUntil:Math.max(0,Math.round(G.diveUntil-performance.now()))
  };},
  dive:function(dx,dy){ return swipeTackle(dx||60,dy||0,'H'); }
};

function boot(){
  resize(); G=freshGame(); G.phase='intro';
  elMvName.textContent=HERO.moveName;
  showStart();
  requestAnimationFrame(frame);
  // a shared link drops you straight into their room
  var m=/[?&]r=([A-Za-z0-9]{4})\b/.exec(location.search);
  if(m && netReady()){
    showOnline();
    document.getElementById('netForm').style.display='flex';
    document.getElementById('netCode').value=m[1].toUpperCase();
    joinOnline(m[1]);
  }
}
if(window.claude&&window.claude.hot){
  window.claude.hot.snapshot(function(){ return G?{scoreH:G.scoreH,scoreA:G.scoreA}:{}; });
}
if(window.claude&&window.claude.hot&&window.claude.hot.ready) window.claude.hot.ready(boot);
else boot();
})();
</script>
