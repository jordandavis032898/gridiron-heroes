<style>

         padding-bottom: env(safe-area-inset-bottom, 0px); }
  html,body{height:100%;}

<title>3D demo · Gridiron Heroes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root{
    color-scheme: dark;
    --chalk:#eef3e8; --gold:#ffd23f; --navy:#16233f; --red:#e0384e;
    --ground:#0c1114; --panel:#141c22; --panel-2:#1b262e;
    --line:#2b3a45; --text:#e8eef2; --muted:#8fa3b0;
  }
  html,body{height:100%;}
  body{
    margin:0; background:var(--ground); color:var(--text);
    font-family:'Barlow Condensed',system-ui,-apple-system,sans-serif;
    overflow:hidden; -webkit-user-select:none; user-select:none; touch-action:none;
  }
  #wrap{height:100%; display:flex; flex-direction:column;}

  #board{
    flex:0 0 auto; background:var(--panel); border-bottom:1px solid var(--line);
    display:flex; font-family:'Anton',Impact,sans-serif; letter-spacing:.02em;
  }
  .team{display:flex; align-items:center; gap:8px; padding:8px 12px; min-width:0;}
  .team .chip{width:12px; height:22px; border-radius:2px; flex:0 0 auto;}
  .team .nm{font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .team .sc{font-family:'JetBrains Mono',monospace; font-size:21px; font-variant-numeric:tabular-nums;}
  .home .chip{background:var(--gold);} .home .sc{color:var(--gold);}
  .away .chip{background:var(--red);}  .away .sc{color:var(--red);}
  #mid{
    flex:1 1 auto; display:flex; flex-direction:column; align-items:center;
    justify-content:center; padding:6px 8px; border-left:1px solid var(--line);
    border-right:1px solid var(--line); min-width:0;
  }
  #clock{font-family:'JetBrains Mono',monospace; font-size:20px; font-variant-numeric:tabular-nums; line-height:1;}
  #dd{font-weight:700; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-top:3px; white-space:nowrap;}
  #poss{font-size:11px; letter-spacing:.16em; text-transform:uppercase; font-weight:700; margin-top:2px;}
  #dbg{font-family:'JetBrains Mono',monospace; font-size:9px; color:#6d818f; margin-top:2px; min-height:11px;}

  #stage{flex:1 1 auto; position:relative; min-height:0;}
  canvas{display:block; width:100%; height:100%; cursor:crosshair;
    touch-action:none; -webkit-user-drag:none; user-select:none;}
  #stage{touch-action:none;}

  .overlay{position:absolute; inset:0; display:none; align-items:center; justify-content:center; padding:16px; z-index:5; overflow-y:auto;}
  .overlay.show{display:flex;}
  .sheet{
    background:rgba(12,17,20,.95); border:1px solid var(--line); border-radius:4px;
    padding:18px 16px; max-width:640px; width:100%; box-shadow:0 18px 50px rgba(0,0,0,.6);
  }
  .sheet h2{font-family:'Anton',Impact,sans-serif; font-size:22px; margin:0 0 2px; letter-spacing:.03em; text-wrap:balance;}
  .sheet .sub{font-size:13px; color:var(--muted); margin:0 0 14px; letter-spacing:.06em; text-transform:uppercase; font-weight:600;}
  .grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .grid2{display:grid; grid-template-columns:repeat(2,1fr); gap:8px;}
  @media (max-width:480px){ .grid3,.grid2{grid-template-columns:1fr;} }
  .card{
    background:var(--panel-2); border:1px solid var(--line); border-radius:3px;
    padding:11px 10px; cursor:pointer; text-align:left; color:var(--text);
    font-family:inherit; transition:border-color .12s, background .12s;
  }
  .card:hover,.card:focus-visible{border-color:var(--gold); background:#22303a; outline:none;}
  .card .k{font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--gold); letter-spacing:.1em;}
  .card .t{font-family:'Anton',sans-serif; font-size:15px; margin:3px 0 1px; letter-spacing:.02em;}
  .card .pos{font-size:11px; color:var(--gold); letter-spacing:.12em; font-weight:700; text-transform:uppercase;}
  .card .d{font-size:12.5px; color:var(--muted); line-height:1.35; margin-top:4px;}
  .stats{display:flex; gap:7px; margin-top:6px;}
  .stat{flex:1;}
  .stat .sl{font-size:9px; letter-spacing:.12em; color:var(--muted); text-transform:uppercase;}
  .stat .sb{height:4px; background:rgba(0,0,0,.5); border-radius:2px; overflow:hidden; margin-top:2px;}
  .stat .sb i{display:block; height:100%; background:var(--gold);}

  #callout{
    position:absolute; left:50%; top:32%; transform:translate(-50%,-50%);
    font-family:'Anton',Impact,sans-serif; font-size:clamp(28px,7.5vw,60px);
    letter-spacing:.02em; color:var(--gold); text-shadow:0 4px 0 rgba(0,0,0,.6);
    pointer-events:none; opacity:0; z-index:4; white-space:nowrap; text-align:center;
  }

  #legend{
    flex:0 0 auto; background:var(--panel); border-top:1px solid var(--line);
    padding:7px 12px calc(7px + env(safe-area-inset-bottom,0px));
    display:flex; gap:13px; flex-wrap:wrap; justify-content:center;
    font-size:12px; color:var(--muted); letter-spacing:.04em;
  }
  #legend b{color:var(--text); font-weight:600;}
  kbd{font-family:'JetBrains Mono',monospace; font-size:10px; background:var(--panel-2); border:1px solid var(--line); border-radius:2px; padding:1px 4px; color:var(--chalk);}

  #meters{position:absolute; left:10px; bottom:10px; z-index:3; width:140px; font-size:10px; letter-spacing:.13em; text-transform:uppercase; font-weight:700;}
  .meter{margin-bottom:5px;}
  .meter .lbl{color:rgba(238,243,232,.42); margin-bottom:2px; display:flex; justify-content:space-between;}
  .bar{height:6px; background:rgba(0,0,0,.55); border:1px solid var(--line); border-radius:2px; overflow:hidden;}
  .bar i{display:block; height:100%; width:100%; transition:width .09s linear;}
  #pw i{background:var(--gold);} #st i{background:#4fd18b;} #mv i{background:#48b8ff;}

  /* ---------- ability icons ---------- */
  #legend{
    flex:0 0 auto; background:var(--panel); border-top:1px solid var(--line);
    padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));
    display:flex; gap:10px; justify-content:center; align-items:flex-end;
  }
  .ab{
    width:50px; display:flex; flex-direction:column; align-items:center; gap:3px;
    background:none; border:0; padding:0; cursor:pointer; font-family:inherit;
    color:var(--muted); transition:color .12s, opacity .12s;
  }
  .ab .ring{
    width:42px; height:42px; border-radius:50%; display:grid; place-items:center;
    background:var(--panel-2); border:1.5px solid var(--line); position:relative;
    transition:border-color .12s, background .12s, transform .08s;
  }
  .ab svg{width:21px; height:21px; stroke:currentColor; fill:none;
    stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round;}
  .ab .cap{font-size:9.5px; letter-spacing:.09em; text-transform:uppercase; font-weight:700;}
  .ab .key{
    position:absolute; right:-3px; bottom:-3px; min-width:13px; height:13px; padding:0 2px;
    border-radius:3px; background:var(--panel); border:1px solid var(--line);
    font-family:'JetBrains Mono',monospace; font-size:8px; line-height:11px; color:var(--chalk);
  }
  .ab.on{color:var(--gold);} .ab.on .ring{border-color:var(--gold); background:#2a2517;}
  .ab.off{opacity:.34;}
  .ab:active .ring{transform:scale(.92);}

  /* ---------- play card ---------- */
  #card{
    position:absolute; left:50%; top:46%; z-index:7; width:240px;
    transform:translate(-50%,-50%) scale(.6); opacity:0; pointer-events:none;
    transition:transform .34s cubic-bezier(.2,1.3,.4,1), opacity .24s;
    background:linear-gradient(160deg,#1b262e,#101820);
    border:2px solid var(--gold); border-radius:6px; overflow:hidden;
    box-shadow:0 14px 40px rgba(0,0,0,.65);
  }
  #card.in{transform:translate(-50%,-50%) scale(1); opacity:1;}
  #card .pcTop{
    display:flex; align-items:center; gap:6px; padding:5px 8px;
    background:var(--gold); color:#14181c;
    font-family:'Anton',sans-serif; font-size:12px; letter-spacing:.06em;
  }
  #card.away{border-color:var(--red);} #card.away .pcTop{background:var(--red); color:#fff;}
  #card .pcNum{margin-left:auto; font-family:'JetBrains Mono',monospace; font-size:13px;}
  #card canvas{display:block; width:100%; height:144px; background:rgba(0,0,0,.25);}
  #card .pcName{
    font-family:'Anton',sans-serif; font-size:17px; padding:7px 8px 1px;
    letter-spacing:.02em; color:var(--text);
  }
  #card .pcAct{
    padding:0 8px 8px; font-size:12px; font-weight:700; letter-spacing:.13em;
    text-transform:uppercase; color:var(--gold);
  }
  #card.away .pcAct{color:#ff8a94;}

  #touch{position:absolute; inset:0; z-index:6; display:none; pointer-events:none;}
  #touch.on{display:block;}
  #stick{position:absolute; left:16px; bottom:16px; width:118px; height:118px; border-radius:50%; background:rgba(20,28,34,.5); border:1px solid var(--line); pointer-events:auto;}
  #nub{position:absolute; left:50%; top:50%; width:46px; height:46px; margin:-23px 0 0 -23px; border-radius:50%; background:rgba(255,210,63,.8);}
  .tbtn{position:absolute; width:66px; height:66px; border-radius:50%; border:1px solid var(--line); background:rgba(20,28,34,.65); color:var(--text); font-family:'Anton',sans-serif; font-size:12px; letter-spacing:.03em; pointer-events:auto;}
  #bJuke{right:100px; bottom:22px;} #bSpr{right:18px; bottom:76px;}
  #bMove{right:100px; bottom:104px; background:rgba(72,184,255,.25);}
  #bQ{right:18px; bottom:158px; background:rgba(255,210,63,.20); font-size:11px;}
</style>

<div id="wrap">
  <div id="board">

</div>
</div>

<script>
(function(){
"use strict";

// ================================================================ constants
var YD=14, EZ=10*YD, FW=100*YD+EZ*2, FH=53*YD, VIEW_YDS=41;

// uniforms, drawn as real kit: helmet / jersey / pants / trim
var KITS={
  H:{helmet:'#1f2d54', mask:'#14161a', jersey:'#1f2d54', sleeve:'#1f2d54',
     pants:'#f1f1ec', sock:'#14161a', num:'#c8a63c', stripe:'#c8a63c', glove:'#191b1f'},
  A:{helmet:'#f1f1ec', mask:'#14161a', jersey:'#b8232f', sleeve:'#b8232f',
     pants:'#e8e8e2', sock:'#14161a', num:'#f1f1ec', stripe:'#8c1a24', glove:'#191b1f'}
};
var BASE_SPD=118, SPRINT=1.34, DEF_SPD=123;
// Everything ran at real time and plays were over before you could read them.
// One dial slows the whole simulation together: movement, animation, the
// clock, cooldown timers and the routes all scale off the same number, so
// nothing drifts out of step with anything else.
var GAME_SPEED=0.70;
var TACKLE_R=23, CATCH_R=17, BLOCK_R=21;
var SIDE_OUT=3*14;   // how far past the sideline a man can run: the out of bounds area
var RUSH_MOVES=['rip','swim','spin','bull'];
var JUKE_MS=330, JUKE_COST=28, TRUCK_COST=50, GAME_SECONDS=180;
var REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// ================================================================ roster
// Real players, described by what they are genuinely known for on the field.
// Fan-made: no team marks, no league branding, no endorsement implied.
// Original characters. No real players, no team marks, nothing licensed.
var HEROES = [
  { id:'tank', name:'Tank Mallory', pos:'Running Back', num:34,
    spd:1.00, pwr:1.35, agi:0.86, skin:'#6b4630',
    move:'quake', moveName:'Earthquake', cost:46,
    desc:'Stomps the turf. Every defender in range loses their footing at once.' },
  { id:'rafe', name:'Rafe Solomon', pos:'Running Back', num:26,
    spd:1.12, pwr:1.05, agi:1.18, skin:'#8a5c3b',
    move:'skyhop', moveName:'Sky Hop', cost:40,
    desc:'Launches clean over the pile and lands ten yards downfield, untouchable.' },
  { id:'dex', name:'Dex Rivera', pos:'Wide Receiver', num:10,
    spd:1.30, pwr:0.76, agi:1.14, skin:'#5e3a26',
    move:'afterburner', moveName:'Afterburner', cost:44,
    desc:'Lights the jets. Nobody catches him from behind once it is burning.' },
  { id:'milo', name:'Milo Vance', pos:'Running Back', num:23,
    spd:1.10, pwr:0.95, agi:1.28, skin:'#e0b48e',
    move:'phase', moveName:'Phase Spin', cost:38,
    desc:'Spins so hard he goes half-transparent and comes out the other side of you.' },
  { id:'cass', name:'Cass Okoye', pos:'Quarterback', num:8,
    spd:1.22, pwr:0.88, agi:1.22, skin:'#5a3623',
    move:'blur', moveName:'Blur Step', cost:34,
    desc:'Blinks forward through traffic and reappears past the rush.' },
  { id:'rex', name:'Rex Stallings', pos:'Quarterback', num:15,
    spd:0.98, pwr:0.92, agi:1.04, skin:'#c98f63',
    move:'rocket', moveName:'Rocket Pass', cost:36,
    desc:'Fires a flat bullet that arrives before anyone can break on it.' }
];
function heroById(id){ for (var i=0;i<HEROES.length;i++) if (HEROES[i].id===id) return HEROES[i]; return HEROES[0]; }

var SUPPORT = {
  QB:{name:'Nico Hale',      num:9,  skin:'#e0b48e'},
  WR1:{name:'Amari Voss',    num:18, skin:'#6b4630'},
  WR2:{name:'Sol Nakamura',  num:14, skin:'#a9744c'},
  TE:{name:'Bo Kestrel',     num:87, skin:'#e6bd97'},
  RB:{name:'Trey Lomax',     num:29, skin:'#7a5035'},
  C:{name:'Ivan Petrov',     num:55, skin:'#d8a87e'},
  OL1:{name:'Nate Marchetti',num:71, skin:'#c98f63'},
  OL2:{name:'Duke Ferreira', num:66, skin:'#8a5c3b'}
};
var DEFENDERS = [
  {name:'Wolf Bremner', num:93, skin:'#6b4630'},   // DE
  {name:'Axel Drake',   num:91, skin:'#5a3623'},   // DE
  {name:'Kato Reyes',   num:97, skin:'#a9744c'},   // DE
  {name:'Gus Halloran', num:54, skin:'#d8a87e'},   // LB
  {name:'Rhys Okafor',  num:52, skin:'#7a5035'},   // LB
  {name:'Jett Malone',  num:2,  skin:'#8a5c3b'},   // CB
  {name:'Isaiah Frost', num:24, skin:'#6b4630'},   // CB
  {name:'Cree Danvers', num:31, skin:'#c98f63'}    // S
];

var PLAYS = {
  H:[{id:'short', name:'QUICK SLANT', desc:'Receivers cut inside fast. Safe, 6 to 10 yards.'},
     {id:'deep',  name:'GO ROUTE',    desc:'Both streak downfield. Risky, big payoff.'},
     {id:'outs',  name:'OUT ROUTES',  desc:'Break for the sideline. Stops the clock if he gets out.'},
     {id:'run',   name:'POWER RUN',   desc:'Hand it to the back. Receivers lead the way.'},
     {id:'draw',  name:'DRAW',        desc:'Sell the pass, then give it late. Beats a blitz.'},
     {id:'screen',name:'SCREEN',      desc:'Let them come, slip the back out with blockers.'}],
  A:[{id:'blitz', name:'ALL-OUT BLITZ',desc:'Everyone rushes. Kill it behind the line.'},
     {id:'zone',  name:'ZONE COVER',   desc:'Two rush. The rest guard grass, not men.'},
     {id:'spy',   name:'CONTAIN',      desc:'Two rush, a backer shadows the passer. Kills scrambles.'},
     {id:'press', name:'MAN PRESS',    desc:'Man coverage, tight. Three rush, no free release.'},
     {id:'prevent',name:'PREVENT',     desc:'Deep zone, two rush. Nothing gets behind you.'}]
};

// ================================================================ dom
var cv=document.getElementById('cv'); var ctx=cv.getContext('2d');
var stage=document.getElementById('stage');
var elClock=document.getElementById('clock'), elDD=document.getElementById('dd'), elPoss=document.getElementById('poss');
var elH=document.getElementById('scH'), elA=document.getElementById('scA'), elNmH=document.getElementById('nmH');
var elOv=document.getElementById('ov'), elSheet=document.getElementById('sheet'), elCall=document.getElementById('callout');
var barPw=document.querySelector('#pw i'), barSt=document.querySelector('#st i'), barMv=document.querySelector('#mv i');
var elMvName=document.getElementById('mvName'), elTouch=document.getElementById('touch');

// ================================================================ state
var G=null, HERO=HEROES[0];

function freshGame(){
  return { scoreH:0, scoreA:0, clock:GAME_SECONDS, offense:'H',
    los:EZ+25*YD, down:1, toGo:10, phase:'intro', play:null, aiPlay:'spy',
    players:[], ball:null, carrier:null, controlled:null, controlled2:null, thrown:null,
    shake:0, snapT:0, gt:0, power:100, stam:100, moveCd:0, jukeUntil:0,
    diveUntil:0, hitCd:0, loose:null, windup:null, playClock:15, assistCd:0, switchFlash:0, newSeries:false, clockRunning:false, jukeCd:0, latCd:0, lastThrow:'', kick:null,
    celebrate:0, celAt:null, scoringTeam:'H',
    playNo:0, hostPick:null, pickAt:0, handoffAt:null,
    cushion:0, covType:'man', zoneDeep:0, diveCd:0, drag:null,
    lockMan:null, lockT:0, freeT:0,
    abCd:{}, rocketArmed:false, perfectArmed:false, netAb:[0,0,0],
    stats:freshStats(), cur:null, showingStats:false,
    M2:{power:100, stam:100, moveCd:0, hitCd:0, jukeCd:0, latCd:0,
        assistCd:0, jukeUntil:0, diveUntil:0, diveCd:0},
    fx:[], over:false, mouse:{x:0,y:0,on:false} };
}

// ================================================================ input
var keys=Object.create(null), touchVec={x:0,y:0}, touchJuke=false, touchSprint=false, touchMove=false, touchQ=false, touchSwitch=false;
var touchAb=[false,false,false];
window.addEventListener('keydown',function(e){
  var k=e.key.toLowerCase();
  if(!e.repeat) pressed[k]=true;        // latched; a lost keyup must not kill the key
  keys[k]=true;
  if(k===' '||k==='tab'||k.indexOf('arrow')===0) e.preventDefault();
});
window.addEventListener('keyup',function(e){ keys[e.key.toLowerCase()]=false; });
window.addEventListener('blur',function(){ keys=Object.create(null); pressed=Object.create(null); });

function axis(){
  var x=0,y=0;
  if(keys['a']||keys['arrowleft'])x-=1; if(keys['d']||keys['arrowright'])x+=1;
  if(keys['w']||keys['arrowup'])y-=1;   if(keys['s']||keys['arrowdown'])y+=1;
  x+=touchVec.x; y+=touchVec.y;
  var m=Math.hypot(x,y); return m>1?{x:x/m,y:y/m}:{x:x,y:y};
}
function wantSprint(){ return !!(keys['shift']||touchSprint); }
var pressed=Object.create(null);
function eat(k){ if(pressed[k]){ pressed[k]=false; return true; } return false; }
function tapJuke(){ if(eat('1')){return true;} if(touchJuke){touchJuke=false;return true;} return false; }
function tapMove(){ if(eat('2')){return true;} if(touchMove){touchMove=false;return true;} return false; }
function tapQ(){ if(eat('3')){return true;} if(touchQ){touchQ=false;return true;} return false; }
// 4/5/6/7 throw straight to a receiver, no aiming required
function tapTarget(){
  for(var i=0;i<4;i++){ if(eat(String(4+i))) return i; }
  return -1;
}
function eligibleReceivers(){
  var out=[];
  for(var i=0;i<G.players.length;i++){
    var q=G.players[i];
    if(q.team!==G.offense||q===G.carrier) continue;
    if(q.role==='C'||q.role==='OL'||q.role==='BL') continue;
    out.push(q);
  }
  var d=dir();
  out.sort(function(a,b){ return (b.x-a.x)*d; });   // deepest first
  return out;
}

// ---- mouse passing
var cam={x:FW/2,y:FH/2}, scale=1, VW=0, VH=0, dpr=1;
function screenToWorld(cx,cy){
  var r=cv.getBoundingClientRect();
  if(VIEW3D && P3LAST){
    var P=P3LAST, sy2=cy-r.top, sx2=cx-r.left;
    var zc=P.K/Math.max(1,(sy2-P.hz));
    return { x: P.camx + (sx2-P.cx)*zc/(P.S0*P.Z0), y: P.camy + P.Z0 - zc };
  }
  return { x: cam.x + (cx-r.left-VW/2)/scale, y: cam.y + (cy-r.top-VH/2)/scale };
}

// ================================================================ 2.5D view
// Flat 2D players standing on a field seen from a broadcast camera up in the
// stands. The ground is drawn in perspective row by row (far rows shrink),
// and each player is drawn at his projected spot, scaled by his distance.
var VIEW3D=true, P3LAST=null;
var Z3=820, TILT3=0.60, BASE3=1.7;    // camera distance, ground foreshortening, base zoom
window.addEventListener('keydown',function(e){
  if(e.key==='v'||e.key==='V'){ VIEW3D=!VIEW3D; }

var W3=null, MAIN3=null;
function makeW3(){
  var M=300, MT=640, MB=220;
  var c=document.createElement('canvas');
  c.width=FW+2*M; c.height=MT+FH+MB;
  var base=document.createElement('canvas'); base.width=c.width; base.height=c.height;
  var g=base.getContext('2d');
  // apron round the field
  g.fillStyle='#16311f'; g.fillRect(0,0,base.width,base.height);
  // the far stands: tiers of crowd climbing away from the field
  var top=MT-120;
  var sg=g.createLinearGradient(0,0,0,top);
  sg.addColorStop(0,'#0b0f16'); sg.addColorStop(1,'#1c2433');
  g.fillStyle=sg; g.fillRect(0,0,base.width,top);
  var seed=7; function rnd(){ seed=(seed*16807)%2147483647; return seed/2147483647; }
  var cols=['#c9d3e0','#2d477f','#8c1a24','#e8c14a','#f1f1ec','#51607a','#a8232f','#233a6e'];
  for(var ty=18; ty<top-8; ty+=9){
    g.fillStyle='rgba(0,0,0,.35)'; g.fillRect(0,ty+6,base.width,2);        // tier edge
    for(var tx=4; tx<base.width; tx+=5+rnd()*3){
      g.fillStyle=cols[(rnd()*cols.length)|0];
      g.globalAlpha=0.45+rnd()*0.45;
      g.fillRect(tx, ty+rnd()*2, 3, 4);
    }
  }
  g.globalAlpha=1;
  // wall and ad boards between the stands and the field
  g.fillStyle='#0d1a2e'; g.fillRect(0,top,base.width,26);
  g.fillStyle='#ffd23f'; g.font='700 18px "Anton", sans-serif'; g.textBaseline='middle';
  for(var ax=40; ax<base.width; ax+=420){
    g.fillText('GRIDIRON HEROES', ax, top+13);
  }
  // near side: bench area
  g.fillStyle='#12281a'; g.fillRect(0,MT+FH+40,base.width,MB-40);
  // the field itself
  g.drawImage(fieldCanvas, M, MT);
  // the white border: out of bounds starts on the paint
  var BW=YD*0.9;
  g.fillStyle='#eef3e8';
  g.fillRect(M-BW, MT-BW, FW+2*BW, BW);            // far sideline
  g.fillRect(M-BW, MT+FH, FW+2*BW, BW);            // near sideline
  g.fillRect(M-BW, MT-BW, BW, FH+2*BW);            // end lines
  g.fillRect(M+FW, MT-BW, BW, FH+2*BW);
  // coaching box dashes on the near side
  g.strokeStyle='rgba(255,210,63,.55)'; g.lineWidth=2; g.setLineDash([10,8]);
  g.beginPath(); g.moveTo(M+EZ+25*YD, MT+FH+BW+2.2*YD); g.lineTo(M+FW-EZ-25*YD, MT+FH+BW+2.2*YD); g.stroke();
  g.setLineDash([]);
  return {cv:c, g:c.getContext('2d'), base:base, M:M, MT:MT};
}
// Everything that must stay on screen this frame.
function camPoints(){
  var pts=[]; if(!G) return pts;
  if(G.ball) pts.push([G.ball.x,G.ball.y]);
  if(G.thrown){
    pts.push([G.thrown.tx,G.thrown.ty]);
    if(G.thrown.target) pts.push([G.thrown.target.x,G.thrown.target.y]);
  }
  var c=G.carrier, bx=G.ball?G.ball.x:FW/2, by=G.ball?G.ball.y:FH/2;
  var live=(G.phase==='live');
  var passing=live && c && c.role==='QB' && !G.thrown && !pastTheLine(c);
  for(var i=0;i<G.players.length;i++){
    var q=G.players[i];
    if(!isFinite(q.x)||!isFinite(q.y)) continue;
    if(!live){
      if(Math.hypot(q.x-bx,q.y-by)<24*YD) pts.push([q.x,q.y]);
      continue;
    }
    if(q===c || q===G.controlled){ pts.push([q.x,q.y]); continue; }
    // while you are passing, every man you can throw to has to be visible
    if(passing && q.team===G.offense && q.role!=='C' && q.role!=='OL' && q.role!=='BL'){
      if(Math.hypot(q.x-c.x,q.y-c.y)<45*YD) pts.push([q.x,q.y]);
      continue;
    }
    // with a runner, the men closing on him
    if(c && !passing && q.team!==c.team && Math.hypot(q.x-c.x,q.y-c.y)<9*YD) pts.push([q.x,q.y]);
  }
  return pts;
}
// Largest zoom that keeps every point inside the safe frame. Screen offsets
// from centre are exactly proportional to the zoom for a fixed camera, so
// this is one pass, no search.
function camFit(pts,camx,camy){
  var Z0=Z3, c=TILT3, best=9;
  for(var i=0;i<pts.length;i++){
    var zc=Math.max(160, Z0-(pts[i][1]-camy));
    var ox=(pts[i][0]-camx)*Z0/zc, oy=c*Z0*(Z0/zc-1);
    if(Math.abs(ox)>1) best=Math.min(best,(VW/2-60)/Math.abs(ox));
    if(oy<-1) best=Math.min(best,(VH/2-100)/(-oy));
    else if(oy>1) best=Math.min(best,(VH/2-80)/oy);
  }
  return best;
}
function setupProj(sx,sy){
  var want=BASE3*CAM3.z, fit=camFit(camPoints(),cam.x,cam.y);
  var tgt=Math.max(0.35,Math.min(want,fit));
  if(!CAM3.S) CAM3.S=tgt;
  // pull out fast so nothing leaves the frame, push in gently
  CAM3.S += (tgt-CAM3.S)*(tgt<CAM3.S?0.3:0.06);
  var S0=CAM3.S, Z0=Z3, c=TILT3;
  var K=c*S0*Z0*Z0;
  var P={S0:S0, Z0:Z0, K:K, hz:VH/2+sy - c*S0*Z0, cx:VW/2+sx, camx:cam.x, camy:cam.y};
  P3LAST=P; return P;
}
function proj3(P,wx,wy){
  var zc=Math.max(60, P.Z0-(wy-P.camy)), s=P.S0*P.Z0/zc;
  return {x:P.cx+(wx-P.camx)*s, y:P.hz+P.K/zc, s:s};
}
function at3D(P,wx,wy){
  var q=proj3(P,wx,wy);
  ctx.setTransform(dpr*q.s,0,0,dpr*q.s, dpr*(q.x-wx*q.s), dpr*(q.y-wy*q.s));
}
function blit3D(P){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  // night sky and the upper deck, behind everything
  var sk=ctx.createLinearGradient(0,0,0,VH*0.5);
  sk.addColorStop(0,'#05070b'); sk.addColorStop(1,'#141b27');
  ctx.fillStyle=sk; ctx.fillRect(0,0,VW,VH);
  var src=W3.cv, STEP=2;
  for(var y=0; y<VH; y+=STEP){
    if(y-P.hz<2) continue;
    var zc0=P.K/(y-P.hz), zc1=P.K/(y+STEP-P.hz);
    var wy0=P.camy+P.Z0-zc0, wy1=P.camy+P.Z0-zc1;
    var s=P.S0*P.Z0/zc0, hw=(VW/2)/s;
    var sx0=P.camx-hw+W3.M, sy0=wy0+W3.MT, sw=2*hw, sh=Math.max(0.35,wy1-wy0);
    var dx=P.cx-VW/2, dw=VW;
    // clip the source to the canvas, moving the destination with it
    if(sy0<0 || sy0+sh>src.height) continue;
    if(sx0<0){ var cut=-sx0; dx+=cut*s; dw-=cut*s; sw-=cut; sx0=0; }
    if(sx0+sw>src.width){ var cut2=sx0+sw-src.width; dw-=cut2*s; sw-=cut2; }
    if(sw<=1||dw<=1) continue;
    ctx.drawImage(src, sx0, sy0, sw, sh, dx, y, dw, STEP+0.6);
  }
  // haze toward the far side sells the distance
  var hz=ctx.createLinearGradient(0,0,0,VH*0.45);
  hz.addColorStop(0,'rgba(10,14,22,.55)'); hz.addColorStop(1,'rgba(10,14,22,0)');
  ctx.fillStyle=hz; ctx.fillRect(0,0,VW,VH*0.45);
  // stadium lights
  for(var li=0; li<4; li++){
    var lx=VW*(0.12+li*0.25), ly=VH*0.03;
    var lg=ctx.createRadialGradient(lx,ly,0,lx,ly,VW*0.14);
    lg.addColorStop(0,'rgba(255,250,225,.30)'); lg.addColorStop(1,'rgba(255,250,225,0)');
    ctx.fillStyle=lg; ctx.fillRect(lx-VW*0.14,0,VW*0.28,VW*0.14);
  }
}

// ---- dynamic camera: wide before the snap, tight on the action, a quick
// punch-in on big hits and hero moves, and a pull-back on a breakaway so you
// can see the end zone and whoever is chasing.
var CAM3={z:0.86, actUntil:0, ax:0, ay:0, prevShake:0, prevSpin:0};
function camMood(now){
  if(CAM3.actUntil>now) return 1.55;
  if(!G || G.phase!=='live') return 0.86;
  if(G.thrown) return 0.92;
  var c=G.carrier;
  if(!c) return 1.0;
  if(c.role==='QB' && !pastTheLine(c)) return 1.0;
  var dfn=nearestOf(c, c.team==='H'?'A':'H');
  var dd=dfn?Math.hypot(dfn.x-c.x,dfn.y-c.y):999;
  var past=(c.x-G.los)*dir();
  if(dd>8*YD && past>3*YD) return 0.8;
  return 1.14;
}
function camDirect(){
  var now=performance.now();
  if(G && G.phase==='live'){
    var c=G.carrier, sp=c?(c.spin||0):0;
    if(G.shake > CAM3.prevShake+2 || (sp>0.85 && CAM3.prevSpin<=0.85)){
      CAM3.actUntil=now+620; CAM3.ax=G.ball.x; CAM3.ay=G.ball.y;
    }
    CAM3.prevSpin=sp;
  }
  CAM3.prevShake=G?G.shake:0;
  var zt=camMood(now), act=CAM3.actUntil>now;
  CAM3.z += (zt-CAM3.z)*(act?0.2:0.05);
  return act;
}

// A proper spin: two quick turns, a whirl round his waist, afterimages.
function swirl(p,lift,front){
  var u=p.spin, ph=u*Math.PI*6;
  ctx.save();
  ctx.lineCap='round';
  for(var k=0;k<3;k++){
    var a0=ph+k*2.09;
    var a=((a0%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
    var isFront = a<Math.PI;
    if(isFront!==front) continue;
    ctx.strokeStyle='rgba(190,230,255,'+(0.75*Math.min(1,u*2)).toFixed(2)+')';
    ctx.lineWidth=2.2;
    ctx.beginPath();
    ctx.ellipse(p.x, p.y-15-lift, 14, 5, 0, a, a+1.1);
    ctx.stroke();
  }
  ctx.restore();
}
stage.addEventListener('pointermove',function(e){
  // measure the flick before anything else moves the cursor record
  if(G && G.phase==='live'){
    var r0=cv.getBoundingClientRect();
    var w0=screenToWorld(e.clientX,e.clientY);
    var tn=performance.now(), gap=tn-SWIPE.t;
    if(gap>4 && gap<110){
      var sx=(w0.x-SWIPE.x)/(gap/1000), sy=(w0.y-SWIPE.y)/(gap/1000);
      if(!G.drag && Math.hypot(sx,sy) > 620){
        if(NET.on && !NET.host) netSend({t:'dive', x:+sx.toFixed(0), y:+sy.toFixed(0)});
        else swipeTackle(sx,sy,'H');
      }
    }
    SWIPE.x=w0.x; SWIPE.y=w0.y; SWIPE.t=tn;
  }
  var w=screenToWorld(e.clientX,e.clientY);
  G && (G.mouse.x=w.x, G.mouse.y=w.y, G.mouse.on=true);
});
stage.addEventListener('pointerleave',function(){ G && (G.mouse.on=false); });

// release the drag: dive along it
function endDrag(e){
  if(!G||!G.drag) return;
  var d0=G.drag; G.drag=null;
  if(G.phase!=='live'||iHaveBall()) return;
  var w=screenToWorld(e.clientX,e.clientY);
  var dx=w.x-d0.x, dy=w.y-d0.y;
  if(Math.hypot(dx,dy) < 10) return;          // that was a click, not a drag
  if(NET.on && !NET.host) netSend({t:'dive', x:Math.round(dx*9), y:Math.round(dy*9)});
  else swipeTackle(dx,dy,'H');
}
stage.addEventListener('pointerup',endDrag);
stage.addEventListener('pointercancel',function(){ if(G) G.drag=null; });
stage.addEventListener('pointerdown',function(e){
  e.preventDefault();
  if(!G) return;
  if(G.phase==='live' && !iHaveBall()){
    var wd=screenToWorld(e.clientX,e.clientY);
    G.drag={x:wd.x,y:wd.y,t:performance.now()};
    return;                                   // on defence the button tackles
  }
  if(NET.on && !NET.host){
    // the guest aims in its own camera, then posts field coordinates
    if(G.phase!=='live') return;
    var wg=screenToWorld(e.clientX,e.clientY);
    netSend({t:'thr', x:Math.round(wg.x), y:Math.round(wg.y)});
    return;
  }
  if(G.phase==='presnap'){ say('HIT SPACE TO HIKE FIRST',800); return; }
  if(G.phase!=='live'){ G.lastThrow='not live ('+G.phase+')'; return; }
  var w=screenToWorld(e.clientX,e.clientY);
  throwAt(w.x,w.y,'H');
});

// ================================================================ setup
function dir(){ return G.offense==='H'?1:-1; }

function mk(team,role,x,y,info){
  var p={team:team,role:role,x:x,y:y,vx:0,vy:0,route:null,stun:0,
         num:info&&info.num||0, name:info&&info.name||'', skin:info&&info.skin||'#c98f63',
         spd:1,pwr:1,agi:1, run:0, lean:0, spin:0, z:0, arm:0, hero:false, cel:0,
         face:(team==='H'?1:-1), burst:0, aiCd:0, iFrames:0, phase:0, throwArm:0, stance:0, assign:null, blockIdx:0, engaged:0, shedAt:1.6, shed:false, lane:0, cover:null, spy:false, brk:1, zy:0, zdepth:10, pos:'', hp:100, wrapped:0, down:0};
  G.players.push(p); return p;
}

function setupPlay(playId){
  G.playNo=(G.playNo|0)+1;
  G.controlled2=null;
  openPlay(playId);
  G.play=playId; G.players=[]; G.thrown=null; G.fx=[]; G.snapT=G.gt;
  G.loose=null; G.hitCd=0; G.diveUntil=0; G.windup=null;
  var d=dir(), mid=FH/2;
  var offCol=G.offense, defCol=G.offense==='H'?'A':'H';
  var youOnO = G.offense==='H';

  // the hero belongs to whoever has the ball, not always to the Heroes
  var OH = sideHero(G.offense);
  var heroIsQB = !!OH && OH.pos==='Quarterback';
  var heroIsWR = !!OH && OH.pos==='Wide Receiver';
  var heroIsRB = !!OH && OH.pos==='Running Back';

  // ---- OFFENSE: C, OL, OL, TE, QB, WR, WR, RB
  var qb=mk(offCol,'QB',G.los-5.5*YD*d,mid, heroIsQB?OH:SUPPORT.QB); if(heroIsQB) applyHero(qb,OH);
  var c =mk(offCol,'C', G.los-1.5*YD*d,mid, SUPPORT.C);
  var o1=mk(offCol,'OL',G.los-1*YD*d,mid-4.5*YD, SUPPORT.OL1);
  var o2=mk(offCol,'OL',G.los-1*YD*d,mid+4.5*YD, SUPPORT.OL2);
  var te=mk(offCol,'TE',G.los,mid+7.5*YD, SUPPORT.TE);
  var w1=mk(offCol,'WR',G.los,mid-14*YD, heroIsWR?OH:SUPPORT.WR1); if(heroIsWR) applyHero(w1,OH);
  var w2=mk(offCol,'WR',G.los,mid+14*YD, SUPPORT.WR2);
  var rb=mk(offCol,'RB',G.los-11*YD*d,mid+3*YD, heroIsRB?OH:SUPPORT.RB); if(heroIsRB) applyHero(rb,OH);

  var off = youOnO ? G.play : G.aiPlay;
  // the book records the play the offence ran, not your defensive call
  if(G.cur) G.cur.play = playName(off);
  if(off==='deep'){ w1.route='go'; w2.route='go'; te.route='slant'; rb.route='block'; }
  else if(off==='outs'){ w1.route='out'; w2.route='out'; te.route='curl'; rb.route='wheel'; }
  else if(off==='run'){ w1.route='lead'; w2.route='lead'; te.route='block'; rb.route='mesh'; }
  else if(off==='draw'){ w1.route='go'; w2.route='curl'; te.route='block'; rb.route='mesh'; }
  else if(off==='screen'){ w1.route='lead'; w2.route='lead'; te.route='block'; rb.route='screen'; }
  else { w1.route='slant'; w2.route='slant'; te.route='flat'; rb.route='flat'; }
  c.route='block'; o1.route='block'; o2.route='block';
  // lock in which way each man breaks now, so it cannot flip mid-route
  [w1,w2,te,rb].forEach(function(rr){ rr.brk = (rr.y < mid) ? 1 : -1; });
  // ---- DEFENSE: DE, DE, DE, LB, LB, CB, CB, S
  var dplay = youOnO ? G.aiPlay : G.play;
  // What the call actually changes. Until now every defence played man with
  // a different number of rushers, so ZONE COVER was not zone and CONTAIN did
  // not contain anything.
  G.cushion  = (dplay==='press') ? -6 : (dplay==='prevent' ? 7 : 0);
  G.covType  = (dplay==='zone'||dplay==='prevent') ? 'zone' : 'man';
  G.zoneDeep = (dplay==='prevent') ? 8 : 0;
  var lbRush = (dplay==='blitz');
  var deCount = (dplay==='zone'||dplay==='prevent'||dplay==='spy') ? 2 : 3;
  var spec=[
    {r:'RUSH', x:0.9, y:-6,   pos:'DE'},
    {r:'RUSH', x:0.9, y:0,    pos:'DE'},
    {r: deCount>2?'RUSH':'COV', x:0.9, y:6, pos:'DE'},
    {r: lbRush?'RUSH':'COV', x:4.5, y:-5, pos:'LB'},
    {r: lbRush?'RUSH':'COV', x:4.5, y:5,  pos:'LB'},
    {r:'COV', x:6.5,  y:-13.5,  pos:'CB'},
    {r:'COV', x:6.5,  y:13.5,   pos:'CB'},
    {r:'COV', x:13,   y:0,      pos:'S'}
  ];
  var secondary=[], spyMan=null;
  for(var i=0;i<spec.length;i++){
    var dp=mk(defCol, spec[i].r, G.los+spec[i].x*YD*d, mid+spec[i].y*YD, DEFENDERS[i]);
    dp.pos=spec[i].pos;
    // where he sits if he is playing a zone rather than a man
    dp.zy = mid + spec[i].y*YD*1.45;
    dp.zdepth = (spec[i].pos==='S' ? 20 : spec[i].pos==='CB' ? 13 : 7) + G.zoneDeep;
    if(dp.role==='COV') secondary.push(dp);
  }

  // Pair the line man-on-man across the formation. Without a locked
  // assignment every blocker re-solves "who is nearest the ball" each frame
  // and they all end up stacked on the same defender.
  var blockers=[], rushers=[];
  for(var bq=0;bq<G.players.length;bq++){
    var bp=G.players[bq];
    if(bp.team===offCol && bp.route==='block') blockers.push(bp);
    if(bp.team===defCol && bp.role==='RUSH')   rushers.push(bp);
  }
  blockers.sort(function(a,b){return a.y-b.y;});
  rushers.sort(function(a,b){return a.y-b.y;});
  for(var bk=0;bk<blockers.length;bk++){
    blockers[bk].assign = rushers.length ? rushers[bk % rushers.length] : null;
    blockers[bk].blockIdx = bk;
  }
  // how long each rusher needs to work free of his man
  for(var rk=0;rk<rushers.length;rk++){
    rushers[rk].shedAt = 2.30 + Math.random()*1.40;
    rushers[rk].engaged = 0;
    rushers[rk].shed = false;
  }
  // each defender attacks from his own lane so they arrive on angles
  var dn=0;
  for(var lk=0;lk<G.players.length;lk++){
    var lp=G.players[lk];
    if(lp.team===defCol){ lp.lane=(dn-3.5)*13; dn++; }
  }


  // CONTAIN keeps a backer home on the passer so he cannot just run out of
  // the pocket, which is the entire point of the call.
  if(dplay==='spy'){
    for(var sy2=0;sy2<G.players.length;sy2++){
      var sp3=G.players[sy2];
      if(sp3.team===defCol && sp3.pos==='LB'){ sp3.spy=true; spyMan=sp3; break; }
    }
  }

  // ---- coverage: corners take the receivers, backers take the underneath
  //      men, the safety plays over the top of everything.
  var eligible=[];
  for(var eq=0;eq<G.players.length;eq++){
    var ep=G.players[eq];
    if(ep.team===offCol && (ep.role==='WR'||ep.role==='TE'||ep.role==='RB')) eligible.push(ep);
  }
  var taken=[];
  for(var cq=0;cq<secondary.length;cq++){
    var cb=secondary[cq];
    if(cb.pos==='S'||cb===spyMan){ cb.cover=null; continue; }        // deep zone, no man
    var pick=null, pd=Infinity;
    for(var eq2=0;eq2<eligible.length;eq2++){
      var cand=eligible[eq2];
      if(taken.indexOf(cand)>=0) continue;
      var dd3=Math.abs(cand.y-cb.y);
      if(dd3<pd){ pd=dd3; pick=cand; }
    }
    cb.cover=pick; if(pick) taken.push(pick);
  }

  G.ball={x:qb.x,y:qb.y,held:true};
  G.carrier=qb;
  if(G.cur) G.cur.qb=qb;
  // The back used to start the play already holding it. Now the passer takes
  // the snap and gives it to him at the mesh point, and you can beat the
  // timer by handing off yourself.
  G.handoffAt = (off==='run') ? 0.30 : (off==='draw' ? 0.85 : null);
  G.controlled = youOnO ? G.carrier : nearestDef();
  if(NET.on && NET.host) G.controlled2 = pickRemoteMan(false);
  G.jukeUntil=0;
  G.phase='presnap'; G.playClock=15;
  // when the CPU has the ball it snaps on its own after a beat
  G.autoSnapAt = (G.offense==='H' || NET.on) ? null : (1.1+Math.random()*1.6);
  for(var s2=0;s2<G.players.length;s2++){ G.players[s2].stance=1; G.players[s2].vx=0; G.players[s2].vy=0; }
}

// The drop, in yards, for each call. Quick game is three steps, intermediate
// five, the deep shot seven. The run is a handoff, so no drop at all.
var DROP_YDS = {short:3, outs:5, screen:5, draw:5, deep:7, run:0};
function snapBall(){
  if(G.phase!=='presnap') return;
  G.phase='live'; G.snapT=G.gt;
  for(var i=0;i<G.players.length;i++) G.players[i].stance=0;
  G.dropLeft = (DROP_YDS[G.play]||0)*YD;         // yards of drop still to take
  burst(G.ball.x,G.ball.y,'#f1f1ec');
  say('HIKE!',480);
}
// Both sides get one. Without this the guest drove a stock Rival at spd 1.00
// against a hero at up to 1.30 with a signature move, and simply could not
// keep up.
function applyHero(p, h){
  h = h || HERO;
  p.hero=true; p.spd=h.spd; p.pwr=h.pwr; p.agi=h.agi;
  p.name=h.name; p.num=h.num; p.skin=h.skin;
}

// whichever hero the guest picked, defaulted so a game works before they choose
var GUEST_HERO = null;
function sideHero(side){
  if(side==='H') return HERO;
  return NET.on ? (GUEST_HERO || HEROES[1]) : null;
}
// One frame of the drop: straight back, quick feet, facing the way he throws.
function dropBack(qb, fwd, dt){
  var v=BASE_SPD*0.95;
  qb.vx=-fwd*v; qb.vy=0;
  qb.backpedal=0.12; qb.dropFace=fwd;
  G.dropLeft=Math.max(0, G.dropLeft - v*dt);
}
function nearestDef(){
  var best=null,bd=Infinity,me=G.offense==='H'?'A':'H';
  for(var i=0;i<G.players.length;i++){var p=G.players[i];
    if(p.team!==me)continue; var d=Math.hypot(p.x-G.ball.x,p.y-G.ball.y);
    if(d<bd){bd=d;best=p;} }
  return best;
}
function nearestOf(p,team){
  var best=null,bd=Infinity;
  for(var i=0;i<G.players.length;i++){var q=G.players[i];
    if(q.team!==team)continue; var d=Math.hypot(q.x-p.x,q.y-p.y);
    if(d<bd){bd=d;best=q;} }
  return best;
}
// Blockers divide the rush between them. Without this every blocker solves
// the same "who is nearest the ball" sum and they all stack on one defender.
function nearestRusher(p){
  var dt2=G.offense==='H'?'A':'H';
  var rush=[];
  for(var i=0;i<G.players.length;i++){
    var q=G.players[i];
    if(q.team!==dt2||q.stun>0) continue;
    if(q.role!=='RUSH' && Math.hypot(q.x-G.ball.x,q.y-G.ball.y)>26*YD) continue;
    rush.push(q);
  }
  if(!rush.length) return null;
  rush.sort(function(a,b){
    return Math.hypot(a.x-G.ball.x,a.y-G.ball.y)-Math.hypot(b.x-G.ball.x,b.y-G.ball.y);
  });
  return rush[(p.blockIdx||0) % rush.length];
}

// ================================================================ passing
// A forward pass is only legal from behind the line of scrimmage. Half a yard
// of grace so a passer standing right on it is not punished for sprite width.
function pastTheLine(p){
  return p && ((p.x - G.los) * dir()) > 7;
}

// The one place a pass target is decided. The aiming ring and the throw both
// call this, so the man with the circle on him is always the man it goes to.
function pickTarget(wx,wy){
  if(!G.carrier) return null;
  var best=null,bd=Infinity,any=false;
  for(var i=0;i<G.players.length;i++){
    var q=G.players[i];
    if(q.team!==G.offense||q===G.carrier) continue;
    if(q.role==='C'||q.role==='OL'||q.role==='BL') continue;
    any=true;
    var dd=Math.hypot(q.x-wx,q.y-wy);
    if(dd<bd){bd=dd;best=q;}
  }
  if(!any) return null;
  if(best && bd<=26*YD) return best;
  // the cursor missed everybody, so take whoever lies nearest that bearing
  var ax=wx-G.carrier.x, ay=wy-G.carrier.y, am=Math.hypot(ax,ay)||1;
  ax/=am; ay/=am;
  var pick=null, bestDot=-2;
  for(var j=0;j<G.players.length;j++){
    var r2=G.players[j];
    if(r2.team!==G.offense||r2===G.carrier) continue;
    if(r2.role==='C'||r2.role==='OL'||r2.role==='BL') continue;
    var rx=r2.x-G.carrier.x, ry=r2.y-G.carrier.y, rm=Math.hypot(rx,ry)||1;
    var dot=(rx/rm)*ax+(ry/rm)*ay;
    if(dot>bestDot){ bestDot=dot; pick=r2; }
  }
  return (pick && bestDot>=0.25) ? pick : null;
}

function throwAt(wx,wy,side){
  if(G.offense!==(side||'H')){ return; }
  if(G.phase!=='live'){ say('BALL IS DEAD',700); G.lastThrow='phase '+G.phase; return; }
  if(G.thrown){ say('ALREADY IN THE AIR',600); G.lastThrow='already in the air'; return; }
  if(G.windup){ G.lastThrow='already throwing'; return; }
  if(G.loose){ say('LOOSE BALL — GO GET IT',700); return; }
  if(!G.carrier){ say('NOBODY HAS THE BALL',900); G.lastThrow='no carrier'; return; }
  if(G.carrier.role!=='QB'){ say('CANNOT PASS — '+G.carrier.role+' HAS IT',1100); G.lastThrow='carrier is '+G.carrier.role; return; }
  if(pastTheLine(G.carrier)){
    say('PAST THE LINE — RUN IT',1000);
    G.lastThrow='past the line'; return;
  }

  var best=pickTarget(wx,wy);
  if(!best){ say('THROWN AWAY',700); G.lastThrow='no target that way'; return; }

  // Throw NOW. The windup state machine could cancel itself between frames
  // (carrier changes, play ends, an exception upstream) and swallow the pass.
  // The arm animation plays out after the release instead.
  G.carrier.throwArm=1;
  if(G.cur){ G.cur.passer=G.carrier; G.cur.target=best; }
  releaseThrow(best);
  G.lastThrow='to '+(best.name||best.role);
}

function releaseThrow(best){
  var qb=G.carrier;
  if(!qb||!best){ G.windup=null; G.lastThrow='no passer/target'; return; }
  if(G.thrown){ return; }
  if(pastTheLine(qb)){                      // illegal forward pass; he keeps it
    G.windup=null; qb.throwArm=0;
    G.rocketArmed=false; G.perfectArmed=false;
    G.lastThrow='past the line'; return;
  }
  var fast = (HERO.move==='rocket' && qb.hero) ? 1.4 : 1;
  var rocket = !!(G.windupWasRocket) || !!G.rocketArmed;
  var perfect = !!G.perfectArmed;
  G.rocketArmed=false; G.perfectArmed=false;
  var speed = (rocket?1500:(perfect?690:530))*fast;

  // Lead by the actual flight time, not a fixed 0.42 seconds. That constant
  // was about right for a five yard out, but a deep ball hangs for a second
  // and the receiver covers nine yards in it, so the pass landed five yards
  // behind him every time and the catch window is under three. Solve for the
  // meeting point: the further he is, the longer the ball is up, the further
  // ahead he will be when it lands.
  var tx=best.x, ty=best.y, flight=0.14;
  for(var it=0; it<4; it++){
    flight = Math.max(0.14, Math.hypot(tx-G.ball.x, ty-G.ball.y)/speed);
    tx = best.x + best.vx*flight;
    ty = best.y + best.vy*flight;
  }
  // A snap throw scatters; a held lock does not. A perfect pass is exempt,
  // and so is a rocket, because that is what those cost a cooldown for.
  if(!perfect && !rocket){
    var reach = Math.hypot(tx-G.ball.x, ty-G.ball.y);  // how far it has to go
    var lock = (best===G.lockMan) ? Math.min(1, G.lockT/1.05) : 0;
    var miss = (1-lock)*(1-lock);                      // falls away quickly
    if(miss>0.01){
      var spread = (3.0 + Math.min(3.4, reach/(14*YD))) * YD * miss;
      var ma=Math.random()*Math.PI*2, mr=Math.sqrt(Math.random())*spread;
      tx += Math.cos(ma)*mr; ty += Math.sin(ma)*mr;
    }
  }
  if(!isFinite(tx)||!isFinite(ty)){ tx=best.x; ty=best.y; }
  tx = Math.max(6, Math.min(FW-6, tx));
  ty = Math.max(10, Math.min(FH-10, ty));               // not out of bounds
  var dist=Math.hypot(tx-G.ball.x,ty-G.ball.y);
  var hx=qb.x + (qb.face||1)*8, hy=qb.y-25;     // the throwing hand
  burst(hx,hy,'#f1f1ec');
  G.thrown={x:hx,y:hy,tx:tx,ty:ty,target:best,t:0,
            dur:Math.max(0.14,dist/speed),
            arc: rocket ? 4 : Math.max(7, Math.min(56, (dist/YD)*1.65)),
            sure: rocket||perfect,
            fire: rocket,
            homing: perfect,
            deep: dist > 22*YD};
  G.windupWasRocket=false;
  G.ball.held=false; G.carrier=null;
  qb.throwArm=1;
  say(fast>1?'FIRED!':'IN THE AIR',400);
}

var KITS_AB = {
  QB:['rocket','perfect','forcefield'],
  RB:['dash','stiffarm','teleport'],
  OL:['superblock','clothesline'],
  C: ['superblock','clothesline'],
  WR:['superspeed','spin'],
  TE:['stiffarm','slam'],
  DE:['clothesline','slam'],
  LB:['dash','fumblegen'],
  CB:['aagun'],
  S: ['aagun']
};

// defenders are identified by pos (DE/LB/CB/S), the offence by role
function kitFor(p){
  if(!p) return [];
  return KITS_AB[p.pos] || KITS_AB[p.role] || [];
}

// Cooldowns outlive the play, and players are rebuilt every snap, so they are
// keyed by shirt rather than by object.
function abKey(p,id){ return p.team+':'+p.num+':'+id; }
function abLeft(p,id){
  if(!p) return 0;
  var due=G.abCd[abKey(p,id)];
  if(due===undefined) return 0;
  return Math.max(0, due-G.playNo);
}
function abReady(p,id){ return abLeft(p,id)===0; }
function abSpend(p,id){
  G.abCd[abKey(p,id)] = G.playNo + (ABIL[id]?ABIL[id].cd:2) + 1;
}

function fireAbility(seat, IN, slot){
  var me=seat.man;
  if(!me || G.phase!=='live' || me.stun>0) return;
  var kit=kitFor(me), id=kit[slot];
  if(!id || !abReady(me,id)) return;

  var d=dir(), mine=seat.local;
  var foeTeam=(me.team==='H')?'A':'H';
  var fwd;
  if(IN && (IN.x||IN.y)) fwd={x:IN.x, y:IN.y};
  else if(me.team===G.offense) fwd={x:d, y:0};
  else {
    var bx=G.ball?G.ball.x:me.x, by=G.ball?G.ball.y:me.y;
    var mx=bx-me.x, my=by-me.y, mm=Math.hypot(mx,my)||1;
    fwd={x:mx/mm, y:my/mm};
  }
  function tell(t,ms){ if(mine||!NET.on) say(t,ms||600); }
  function foeNear(r){
    var best=null,bd=r;
    for(var i=0;i<G.players.length;i++){
      var q=G.players[i];
      if(q.team!==foeTeam||q.stun>0) continue;
      var dd=Math.hypot(q.x-me.x,q.y-me.y);
      if(dd<bd){ bd=dd; best=q; }
    }
    return best;
  }
  function flatten(rad,stun,push){
    var n=0;
    for(var i=0;i<G.players.length;i++){
      var q=G.players[i];
      if(q.team===me.team) continue;
      var dd=Math.hypot(q.x-me.x,q.y-me.y);
      if(dd>rad) continue;
      n++; q.stun=stun; q.wrapped=0; q.down=Math.max(q.down,0.8);
      q.vx=(q.x-me.x)/(dd||1)*push; q.vy=(q.y-me.y)/(dd||1)*push;
    }
    return n;
  }

  // ---- quarterback ---------------------------------------------------
  if(id==='rocket'){
    if(me!==G.carrier){ return; }
    G.rocketArmed=true; me.arm=0.5;
    var rhx=me.x+(me.face||1)*9, rhy=me.y-25;
    flash(rhx,rhy,'rgba(255,210,63,.95)',26);
    shock(rhx,rhy,'rgba(255,210,63,.85)',3,26,0.30);
    for(var rk2=0;rk2<5;rk2++){
      streak(rhx,rhy-4+rk2*2, rhx+(me.face||1)*(18+rk2*5), rhy-4+rk2*2,
             'rgba(255,210,63,.6)',1.3,0.22);
    }
    tell('ROCKET ARMED',700);
  }
  else if(id==='perfect'){
    if(me!==G.carrier){ return; }
    G.perfectArmed=true; me.arm=0.5;
    flash(me.x,me.y-24,'rgba(127,216,255,.9)',22);
    shock(me.x,me.y,'rgba(127,216,255,.9)',4,30,0.38);
    var lock=pickTarget(G.mouse&&G.mouse.on?G.mouse.x:me.x+dir()*200,
                        G.mouse&&G.mouse.on?G.mouse.y:me.y);
    if(lock){
      shock(lock.x,lock.y,'rgba(127,216,255,.95)',26,9,0.5);
      streak(me.x,me.y-22,lock.x,lock.y-14,'rgba(127,216,255,.45)',1.2,0.5);
    }
    tell('PERFECT PASS ARMED',800);
  }
  else if(id==='forcefield'){
    var hit=flatten(52,1.3,210);
    me.iFrames=Math.max(me.iFrames,1.4);
    flash(me.x,me.y-16,'rgba(127,216,255,.95)',46);
    G.fx.push({dome:true,x:me.x,y:me.y+4,c:'rgba(127,216,255,.95)',
               r:52,life:0.75,max:0.75});
    shock(me.x,me.y,'rgba(255,255,255,.95)',6,58,0.34);
    shock(me.x,me.y,'rgba(127,216,255,.6)',6,48,0.55);
    dust(me.x,me.y,14,1.3); G.shake=REDUCED?0:18;
    tell(hit?'FORCEFIELD!':'FORCEFIELD',800);
  }

  // ---- backs and backers ----------------------------------------------
  else if(id==='dash'){
    me.burst=1.7;
    me.vx=fwd.x*BASE_SPD*2.9*(me.spd||1); me.vy=fwd.y*BASE_SPD*2.9*(me.spd||1);
    shock(me.x,me.y,'rgba(255,140,43,.9)',4,34,0.32);
    dust(me.x,me.y,12,1.1);
    for(var dk=0;dk<4;dk++){
      streak(me.x-fwd.x*(8+dk*7), me.y-fwd.y*(8+dk*7)-12-dk*4,
             me.x-fwd.x*(26+dk*8), me.y-fwd.y*(26+dk*8)-12-dk*4,
             'rgba(255,140,43,.65)',1.7,0.26);
    }
    tell('SUPER DASH!',600);
  }
  else if(id==='stiffarm'){
    var v=foeNear(36);
    if(!v) return;                              // nothing to put down, no charge
    v.stun=1.3; v.down=Math.max(v.down,1.0); v.wrapped=0;
    v.vx=(v.x-me.x)*5.5; v.vy=(v.y-me.y)*5.5;
    me.arm=0.6; G.shake=REDUCED?0:10;
    flash(v.x,v.y-14,'rgba(255,255,255,.95)',24);
    shock(v.x,v.y,'rgba(255,210,63,.9)',3,26,0.26);
    dust(v.x,v.y,7,0.9);
    tell('STIFF ARM!',600); credit(me,'STIFF ARM');
  }
  else if(id==='teleport'){
    var hop=62;
    for(var t=0;t<9;t++){
      G.fx.push({x:me.x+fwd.x*hop*(t/9), y:me.y+fwd.y*hop*(t/9)-8,
                 vx:0,vy:-10,life:0.36,max:0.36,r:3.4,c:'#7fd8ff'});
    }
    me.x=Math.max(6,Math.min(FW-6,me.x+fwd.x*hop));
    me.y=Math.max(8,Math.min(FH-8,me.y+fwd.y*hop));
    me.iFrames=Math.max(me.iFrames,0.5); me.phase=0.6; me.wrapped=0;
    flash(me.x,me.y-16,'rgba(127,216,255,.95)',30);
    shock(me.x,me.y,'rgba(127,216,255,.9)',2,30,0.30);
    for(var tg=0;tg<4;tg++){
      G.fx.push({gh:true,x:me.x-fwd.x*hop*(tg/4),y:me.y-fwd.y*hop*(tg/4),
                 face:me.face,c:'#7fd8ff',life:0.26,max:0.26});
    }
    tell('TELEPORT!',700);
  }

  // ---- the line --------------------------------------------------------
  else if(id==='superblock'){
    var n2=flatten(46,1.5,195);
    me.z=0.5; G.shake=REDUCED?0:16;
    flash(me.x,me.y-10,'rgba(255,210,63,.85)',40);
    shock(me.x,me.y,'rgba(255,255,255,.9)',5,50,0.30);

// ================================================================ specials
function fireSpecial(seat,IN){
  seat=seat||{side:'H',man:G.controlled,M:G,hero:HERO};
  var me=seat.man; if(!me) return;
  var M=seat.M;
  if(M.moveCd>0) return;
  var d=dir();
  var a=IN?{x:IN.x,y:IN.y}:axis();
  var fwd=(a.x||a.y)?a:{x:(seat.side==='H'?d:-d),y:0};

  // a seat without a hero (the guest drives ordinary Rivals) gets a truck
  if(!seat.hero || !me.hero){
    if(M.power<TRUCK_COST) return;
    M.power-=TRUCK_COST; M.moveCd=1.4; me.arm=0.6;
    G.shake=REDUCED?0:12; ring(me.x,me.y,'#e0384e');
    var tn=0;
    for(var tk=0;tk<G.players.length;tk++){
      var vt=G.players[tk];
      if(vt.team===me.team) continue;
      var vd=Math.hypot(vt.x-me.x,vt.y-me.y);
      if(vd>32) continue;
      tn++; vt.stun=0.9+Math.random()*0.4; vt.wrapped=0;
      vt.vx=(vt.x-me.x)/(vd||1)*180; vt.vy=(vt.y-me.y)/(vd||1)*180;
    }
    me.vx=fwd.x*BASE_SPD*1.7*(me.pwr||1); me.vy=fwd.y*BASE_SPD*1.7*(me.pwr||1);
    if(seat.side==='H'||!NET.on||!NET.host) say(tn?'TRUCKED!':'TRUCK',700);
    return;
  }

  var HRO=seat.hero, m=HRO.move;
  if(M.power<HRO.cost) return;
  M.power-=HRO.cost;

  if(m==='quake'){
    // stomp: everyone nearby loses their footing
    M.moveCd=1.5; me.z=0.7; G.shake=REDUCED?0:20;
    ring(me.x,me.y,'#ffd23f'); burst(me.x,me.y,'#ffd23f'); burst(me.x,me.y,'#c8a63c');
    var n=0, foe=G.offense==='H'?'A':'H';
    for(var i=0;i<G.players.length;i++){
      var q=G.players[i];
      if(q.team!==foe) continue;
      var dd=Math.hypot(q.x-me.x,q.y-me.y);
      if(dd>44) continue;
      n++; q.stun=1.25+Math.random()*0.4;
      q.vx=(q.x-me.x)/(dd||1)*150; q.vy=(q.y-me.y)/(dd||1)*150;
    }
    say(n?'EARTHQUAKE!':'EARTHQUAKE',760);

  } else if(m==='skyhop'){
    M.moveCd=1.6; me.z=1.6;
    M.jukeUntil=performance.now()+900;
    me.vx=fwd.x*BASE_SPD*2.6; me.vy=fwd.y*BASE_SPD*2.6;
    burst(me.x,me.y,'#f1f1ec');
    say('SKY HOP!',760);

  } else if(m==='afterburner'){
    me.burst=2.0; M.moveCd=2.0; M.stam=Math.min(100,M.stam+45);
    ring(me.x,me.y,'#ff8c2b');
    say('AFTERBURNER!',760);

  } else if(m==='phase'){
    me.spin=1.4; M.moveCd=1.2;
    me.phase=0.75;                            // goes half-transparent
    M.jukeUntil=performance.now()+780;
    me.vx=fwd.x*BASE_SPD*2.9; me.vy=fwd.y*BASE_SPD*2.9;
    burst(me.x,me.y,'#7fd8ff');
    say('PHASE SPIN!',760);

  } else if(m==='blur'){
    // short teleport through the rush
    M.moveCd=1.3;
    var hop=34;
    for(var t=0;t<7;t++){
      G.fx.push({x:me.x+fwd.x*hop*(t/7), y:me.y+fwd.y*hop*(t/7)-8,
                 vx:0,vy:-8,life:0.34,max:0.34,r:3.2,c:'#7fd8ff'});
    }
    me.x=Math.max(6,Math.min(FW-6,me.x+fwd.x*hop));
    me.y=Math.max(8,Math.min(FH-8,me.y+fwd.y*hop));
    M.jukeUntil=performance.now()+260;
    if(G.carrier===me){ G.ball.x=me.x; G.ball.y=me.y; }
    say('BLUR STEP!',700);

  } else if(m==='rocket'){
    // flat uninterceptable bullet to whoever is most open
    if(me.role!=='QB'||G.carrier!==me||G.thrown||G.windup){ M.power+=HRO.cost; return; }
    var best=null,bs=-1e9;
    for(var j=0;j<G.players.length;j++){
      var r=G.players[j];
      if(r.team!==G.offense||r===me||r.route==='block') continue;
      var cov=nearestOf(r,G.offense==='H'?'A':'H');
      var op=cov?Math.hypot(cov.x-r.x,cov.y-r.y):70;
      var sc=op*1.2+(r.x-G.los)*d/YD*1.4;
      if(sc>bs){bs=sc;best=r;}
    }
    if(!best){ M.power+=HRO.cost; return; }
    M.moveCd=1.4;
    G.windup={target:best,t:0,dur:0.14,qb:me,rocket:true};
    say('ROCKET!',700);
  }
}

// an expanding shockwave ring

// ---- take over any of your players --------------------------------------
function switchPlayer(side){
  side=side||'H';
  var cur=(side==='H')?G.controlled:G.controlled2;
  var pool=[];
  for(var i=0;i<G.players.length;i++){
    var q=G.players[i];
    if(q.team===side && q.stun<=0) pool.push(q);
  }
  if(pool.length<2) return;
  var bx=G.ball?G.ball.x:0, by=G.ball?G.ball.y:0;
  pool.sort(function(a,b){
    return Math.hypot(a.x-bx,a.y-by)-Math.hypot(b.x-bx,b.y-by);
  });
  var idx=pool.indexOf(cur);
  var nxt=pool[(idx+1)%pool.length];
  if(side==='H'){ G.controlled=nxt; G.switchFlash=0.5; }
  else { G.controlled2=nxt; }
  if(side==='H'||!NET.on||!NET.host) say((nxt.name||'').split(' ').pop().toUpperCase(),600);
}



// ------------------------------------------------- effect art
// Five of these are painted white on solid black and composited with
// 'lighter', so the black contributes nothing and the edges blend for free,
// no keying and no fringe. The dust puff is an ordinary opaque sprite, so it
// is the one that gets the magenta treatment.
var FXI={}, FXTINT={};
(function(){
  ['impact','shock','dome','streak','bolt'].forEach(function(n){
    var i=new Image(); i.ready=false; i.tag=n;
    i.onload=function(){ i.ready=true; };
    i.src='parts/fx/fx-'+n+'.png';
    FXI[n]=i;
  });
  var d=new Image();
  d.onload=function(){
    var c=document.createElement('canvas'); c.width=d.width; c.height=d.height;
    var x=c.getContext('2d'); x.drawImage(d,0,0);
    try{
      var im=x.getImageData(0,0,c.width,c.height), a=im.data;
      for(var i=0;i<a.length;i+=4){
        if(a[i]>195 && a[i+1]<80 && a[i+2]>195) a[i+3]=0;
      }
      x.putImageData(im,0,0);
    }catch(e){}
    FXI.dust=c; FXI.dust.ready=true;
  };
  d.src='parts/fx/fx-dust.png';
})();

// rgba(...) or #hex down to a solid colour we can multiply by
function solidOf(c){
  if(!c) return '#ffffff';
  if(c.charAt(0)==='#') return c;
  var m=/rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/.exec(c);
  return m ? ('rgb('+m[1]+','+m[2]+','+m[3]+')') : '#ffffff';
}
// white art multiplied by a colour, cached, because these repeat constantly
function fxTint(img,col){
  if(!img||!img.ready) return null;
  var key=img.tag+'|'+col;
  if(FXTINT[key]) return FXTINT[key];
  var c=document.createElement('canvas'); c.width=img.width; c.height=img.height;
  var x=c.getContext('2d');
  x.drawImage(img,0,0);
  x.globalCompositeOperation='multiply';
  x.fillStyle=col; x.fillRect(0,0,c.width,c.height);
  FXTINT[key]=c; c.ready=true;
  return c;
}
function addSprite(img,x,y,w,h,a,rot,sy){
  if(!img) return false;
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  ctx.globalAlpha=a;
  ctx.translate(x,y);
  if(rot) ctx.rotate(rot);
  if(sy&&sy!==1) ctx.scale(1,sy);
  ctx.drawImage(img,-w/2,-h/2,w,h);
  ctx.restore();
  return true;
}
