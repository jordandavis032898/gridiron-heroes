// ---- swipe to tackle -----------------------------------------------------
// On defence, a quick flick of the cursor sends your man into a diving
// tackle along the swipe. Nothing to click; the gesture is the input.
var SWIPE={x:0,y:0,t:0};
function swipeTackle(dx,dy,side){
  if(!G||G.phase!=='live') return false;
  var mine=((side||'H')==='H')?G.controlled:G.controlled2;
  if(!mine||mine.stun>0) return false;
  if(G.offense===((side||'H'))) return false;          // defence only
  var M=((side||'H')==='H')?G:G.M2;
  if(M.diveCd>0) return false;
  M.diveCd=0.75;
  var m=Math.hypot(dx,dy)||1; dx/=m; dy/=m;
  mine.vx=dx*BASE_SPD*3.1; mine.vy=dy*BASE_SPD*3.1;
  mine.z=0.4;
  if(side==='H') G.diveUntil=performance.now()+430;
  else G.M2.diveUntil=performance.now()+430;
  streak(mine.x,mine.y-16, mine.x+dx*38, mine.y-16+dy*38,'rgba(255,255,255,.75)',2.2,0.20);
  dust(mine.x,mine.y,7,0.9);
  if(side==='H'||!NET.on) say('DIVE!',420);
  return true;
}

// ---- handoff: give it to the back, no risk, no air under it --------------
var HANDOFF_R = 30;
function handoffTarget(){
  if(!G.carrier || G.carrier.role!=='QB') return null;
  var best=null, bd=Infinity;
  for(var i=0;i<G.players.length;i++){
    var q=G.players[i];
    if(q.team!==G.offense||q===G.carrier||q.stun>0) continue;
    if(q.role!=='RB'&&q.role!=='TE') continue;
    var dd=Math.hypot(q.x-G.carrier.x,q.y-G.carrier.y);
    if(dd<bd && dd<HANDOFF_R){ bd=dd; best=q; }
  }
  return best;
}

function handoff(side, auto){
  if(!G.carrier||G.thrown||G.loose||G.windup) return false;
  if(!auto){
    var mine=((side||'H')==='H')?G.controlled:G.controlled2;
    if(mine!==G.carrier) return false;
  }
  var back=handoffTarget();
  if(!back) return false;
  var qb=G.carrier;
  qb.throwArm=0.4;
  if(G.cur && !G.cur.rusher) G.cur.rusher=back;
  G.carrier=back; G.ball.held=true; G.ball.x=back.x; G.ball.y=back.y;
  back.route=null;                       // he is running now, not running a route
  back.burst=0.45;
  G.handoffAt=null;
  if(G.offense==='H') G.controlled=back; else if(NET.on) G.controlled2=back;
  if(!auto || G.offense==='H' || !NET.on) say('HANDOFF',450);
  return true;
}

// ---- lateral: pitch it backwards to a trailing team-mate -----------------
function lateral(side){
  var mine=((side||'H')==='H')?G.controlled:G.controlled2;
  if(!G.carrier||mine!==G.carrier||G.thrown||G.loose||G.windup) return;
  var d=dir(), best=null, bd=Infinity;
  for(var i=0;i<G.players.length;i++){
    var q=G.players[i];
    if(q.team!==G.offense||q===G.carrier||q.stun>0) continue;
    if((q.x-G.carrier.x)*d > -2) continue;          // must be behind the ball
    var dd=Math.hypot(q.x-G.carrier.x,q.y-G.carrier.y);
    if(dd<bd && dd<30*YD){ bd=dd; best=q; }
  }
  if(!best){ say('NO ONE BACK THERE',600); return; }
  G.thrown={x:G.ball.x,y:G.ball.y,tx:best.x,ty:best.y,target:best,t:0,
            dur:Math.max(0.16,bd/900), lat:true, arc:4};
  G.ball.held=false; G.carrier=null;
  say('LATERAL!',600);
}

// ---- the ball comes loose ------------------------------------------------
function fumble(from,vx,vy){
  if(G.cur && from && from.team===G.cur.team) G.cur.fum=true;
  G.carrier=null; G.thrown=null; G.windup=null;
  G.ball.held=false;
  G.loose={vx:vx,vy:vy,t:0};
  if(from) from.stun=1.2;
}

function recoverBall(p){
  G.loose=null; G.ball.held=true;
  var wasOff=G.offense;
  var scoopSix = (p.team!==wasOff);

  // Whoever falls on it picks it up and keeps running. A defence that
  // recovers is now the offence and is going the other way.
  G.carrier=p;
  p.iFrames=0.35;                       // a moment to gather it before contact
  if(scoopSix){
    G.offense=p.team;
    G.newSeries=true;                   // endPlay starts a fresh set of downs
    say(p.team==='H'?'YOU SCOOP IT — RUN!':'THEY SCOOP IT',1200);
  } else {
    say('HE HAS IT — GO!',1000);
  }
  if(p.team==='H') G.controlled=p;      // you take over the recovery
  else if(NET.on) G.controlled2=p;
  credit(p, scoopSix?'SCOOP':'RECOVERY');
  burst(p.x,p.y,'#f1f1ec');
  G.shake=REDUCED?0:10;
  // the play stays live
}

// ---- defensive brawling --------------------------------------------------
function bigHit(me,M){
  M=M||G;
  if(!G.carrier||M.power<45||M.hitCd>0) return;
  var dd=Math.hypot(G.carrier.x-me.x,G.carrier.y-me.y);
  M.hitCd=0.8; M.power-=45; me.arm=0.5;
  if(dd>28){ say('WHIFF',420); return; }
  var c=G.carrier;
  G.shake=REDUCED?0:18;
  burst(c.x,c.y,'#ffd23f'); burst(c.x,c.y,'#ffffff');
  if(Math.random() < 0.055/Math.max(0.8,c.pwr||1)){
    fumble(c,(c.x-me.x)*3.2,(c.y-me.y)*3.2);
    say('FUMBLE!',1200); credit(me,'FORCED FUMBLE');
  } else {
    c.hp-=72; c.vx*=0.2; c.vy*=0.2;
    say('BIG HIT!',700); credit(me,'BIG HIT');
    if(c.hp<=0){ c.down=1.6; endPlay(c.x,'BIG HIT'); }
  }
}

function groundPound(me,M){
  M=M||G;
  if(M.power<58||M.hitCd>0) return;
  M.power-=58; M.hitCd=1.3; me.z=0.85;
  G.shake=REDUCED?0:22;
  ring(me.x,me.y,'#ffd23f');
  burst(me.x,me.y,'#ffd23f'); burst(me.x,me.y,'#ff8c2b');
  var hit=0;
  for(var i=0;i<G.players.length;i++){
    var q=G.players[i];
    if(q===me||q.team===me.team) continue;
    var dd=Math.hypot(q.x-me.x,q.y-me.y);
    if(dd>38) continue;
    hit++; q.stun=1.5;
    q.vx=(q.x-me.x)/(dd||1)*190; q.vy=(q.y-me.y)/(dd||1)*190;
  }
  if(G.carrier && Math.hypot(G.carrier.x-me.x,G.carrier.y-me.y)<38){
    if(Math.random()<0.10){
      fumble(G.carrier,(G.carrier.x-me.x)*3.4,(G.carrier.y-me.y)*3.4);
      say('POUND — FUMBLE!',1300); credit(me,'GROUND POUND'); return;
    }
    G.carrier.hp-=88; G.carrier.vx*=0.15; G.carrier.vy*=0.15;
    say('GROUND POUND!',760); credit(me,'GROUND POUND');
    if(G.carrier.hp<=0) endPlay(G.carrier.x,'POUNDED');
    return;
  }
  say(hit?'GROUND POUND!':'GROUND POUND',700);
}

function burst(x,y,c){
  for(var i=0;i<10;i++){
    var a=Math.random()*Math.PI*2, s=40+Math.random()*90;
    G.fx.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.45,max:0.45,c:c});
  }
}

// ================================================================ simulation
function routePoint(p,since){
  var d=dir(), mid=FH/2;
  // never send a man past the back of the end zone; in the red zone he
  // works across the face of the goal line instead
  var endLine = d>0 ? (FW-EZ*0.45) : (EZ*0.45);
  if(p.route==='go'){
    var cap=G.los+38*YD*d;                        // a streak is not a marathon
    var tx=p.x+40*YD*d;
    if((d>0&&tx>cap)||(d<0&&tx<cap)) tx=cap;
    if((d>0&&tx>endLine)||(d<0&&tx<endLine)){
      return {x:endLine, y:p.y+Math.sin(since*1.9)*5*YD};
    }
    return {x:tx, y:p.y+Math.sin(since*1.6)*1.4*YD};
  }
  var br=p.brk||1;                       // which way he broke, fixed at the snap
  if(p.route==='slant'){
    if(since<0.45) return {x:p.x+6*YD*d, y:p.y};        // stem, then break in
    return {x:p.x+5*YD*d, y:mid+br*6*YD};
  }
  if(p.route==='flat')  return {x:p.x+5*YD*d,  y:p.y-br*9*YD};

  // break for the sideline once he has the depth
  if(p.route==='out'){
    if(since<1.05) return {x:p.x+12*YD*d, y:p.y};
    return {x:p.x+2*YD*d, y:(br>0 ? 4*YD : FH-4*YD)};
  }
  // get depth, then come back to the ball
  if(p.route==='curl'){
    if(since<1.35) return {x:p.x+12*YD*d, y:p.y};
    var cq=G.carrier;
    return {x:p.x-4*YD*d, y:cq?(p.y*0.75+cq.y*0.25):p.y};
  }
  // widen, then straight up the sideline
  if(p.route==='wheel'){
    if(since<0.75) return {x:p.x+2*YD*d, y:p.y-br*8*YD};
    return {x:p.x+30*YD*d, y:p.y};
  }
  // the mesh point: run at the passer and take the ball off him
  if(p.route==='mesh'){
    var mq=G.carrier;
    return mq ? {x:mq.x+1.6*YD*d, y:mq.y} : {x:p.x, y:p.y};
  }
  // slip out behind the rush, then turn upfield
  if(p.route==='screen'){
    if(since<0.8) return {x:G.los-4*YD*d, y:p.y-br*7*YD};
    return {x:p.x+20*YD*d, y:p.y};
  }
  return null;
}
// Full pursuit speed only once the ball is at or past the line. Applying it
// to a pocket rush makes blocking mathematically impossible.
function openChase(){
  if(!G.carrier) return 1.0;
  var past=(G.carrier.x-G.los)*dir();
  return past > -2 ? 1.5 : 1.0;
}

// Sample headings and take the one with the most daylight toward the goal.
// A carrier who only flees the nearest man runs straight into everyone else.
function runLane(p,d){
  var best={x:d,y:0}, bestScore=-1e9;
  var foes=[], foeTeam=(p.team==='H'?'A':'H');
  for(var i=0;i<G.players.length;i++){
    var q=G.players[i];
    if(q.team!==foeTeam||q.stun>0) continue;
    if(Math.hypot(q.x-p.x,q.y-p.y)>34*YD) continue;
    foes.push(q);
  }
  for(var a=-1.15;a<=1.15;a+=0.19){
    var vx=Math.cos(a)*d, vy=Math.sin(a);
    var sc=vx*d*130;                                  // reward going forward
    var px=p.x+vx*58, py=p.y+vy*58;                   // where that heading puts him
    for(var f=0;f<foes.length;f++){
      var q2=foes[f];
      var qx=q2.x+q2.vx*0.4, qy=q2.y+q2.vy*0.4;       // lead their pursuit
      var gap=Math.hypot(qx-px,qy-py);
      if(gap<70) sc-=(70-gap)*(70-gap)*0.045;
    }
    if(py<52||py>FH-52) sc-=90;                       // do not run at the sideline
    if(sc>bestScore){ bestScore=sc; best={x:vx,y:vy}; }
  }
  return best;
}

function aim(p,tx,ty,spd){
  if(!isFinite(tx)||!isFinite(ty)||!isFinite(spd)) return;   // refuse nowhere
  var dx=tx-p.x,dy=ty-p.y,m=Math.hypot(dx,dy)||1;
  p.vx=dx/m*spd; p.vy=dy/m*spd;
}

// ---- CPU signature moves, so the AI is not just running in a straight line
// How often each move gets considered, per frame, once the situation fits.
// The cheap ones fire freely; the ones that decide a play are rationed hard
// so the computer cannot open with a teleport on every snap.
var AI_ODDS = {
  stiffarm:0.045, spin:0.040, clothesline:0.032, superblock:0.030,
  dash:0.030, superspeed:0.028, slam:0.024, rocket:0.020,
  forcefield:0.018, fumblegen:0.018, teleport:0.014, perfect:0.014,
  aagun:0.011
};

// The computer now plays out of the same kits the player does, rather than a
// separate hard-coded set of specials.
function cpuAbilities(dt,now){
  if(!G.carrier||G.phase!=='live') return;
  var car=G.carrier, d=dir();

  for(var i=0;i<G.players.length;i++){
    var q=G.players[i];
    if(q===G.controlled||q===G.controlled2||q.stun>0) continue;
    if(q.aiCd>0){ q.aiCd-=dt; continue; }
    var kit=kitFor(q);
    if(!kit.length) continue;

    var foe=(q.team==='H')?'A':'H';
    var near=nearestOf(q,foe);
    var nd=near?Math.hypot(near.x-q.x,near.y-q.y):9999;
    var toCar=Math.hypot(car.x-q.x,car.y-q.y);
    var want=null;

    if(q.team===G.offense){
      if(q===car){
        if(q.role==='QB'){
          if(nd<28 && kit.indexOf('forcefield')>=0) want='forcefield';
        } else {
          if(nd<34 && kit.indexOf('stiffarm')>=0)        want='stiffarm';
          else if(nd<30 && kit.indexOf('spin')>=0)       want='spin';
          else if(nd<46 && kit.indexOf('teleport')>=0)   want='teleport';
          else if(nd>62 && kit.indexOf('dash')>=0)       want='dash';
          else if(nd>54 && kit.indexOf('superspeed')>=0) want='superspeed';
        }
      } else if(q.route==='block'||q.route==='lead'){
        if(nd<36){
          if(kit.indexOf('superblock')>=0 && Math.random()<0.5) want='superblock';
          else if(kit.indexOf('clothesline')>=0)               want='clothesline';
          else if(kit.indexOf('slam')>=0)                      want='slam';
        }
      } else if(q.route){
        if(nd<26 && kit.indexOf('superspeed')>=0) want='superspeed';
        else if(nd<22 && kit.indexOf('spin')>=0)  want='spin';
      }
    } else {
      if(G.thrown && kit.indexOf('aagun')>=0 &&
         Math.hypot(G.thrown.tx-q.x,G.thrown.ty-q.y) < 24*YD){
        want='aagun';
      }
      else if(toCar<46 && kit.indexOf('fumblegen')>=0)  want='fumblegen';
      else if(toCar<38 && kit.indexOf('clothesline')>=0) want='clothesline';
      else if(toCar<40 && kit.indexOf('slam')>=0)        want='slam';
      else if(toCar>74 && toCar<190 && kit.indexOf('dash')>=0) want='dash';
    }

    if(!want) continue;
    if(!abReady(q,want)) continue;
    if(Math.random() > (AI_ODDS[want]||0.02)) continue;

    fireAbility({man:q, local:false}, null, kit.indexOf(want));
    q.aiCd = 1.4 + Math.random()*1.3;
  }
}

// ---- the CPU quarterback: drop, read the field, throw or scramble -------
function cpuQB(now){
  if(G.offense==='H') return;
  if(NET.on) return;          // the Rivals offence is the guest, a person
  if(G.handoffAt!=null) return;   // he is giving it to the back, not throwing
  if(pastTheLine(G.carrier)) return;   // he has crossed; he is a runner now
  if(!G.carrier||G.carrier.role!=='QB'||G.thrown||G.windup||G.loose) return;
  var qb=G.carrier, d=dir(), since=G.gt-G.snapT;
  var rush=nearestOf(qb,'H');
  var pressure=rush?Math.hypot(rush.x-qb.x,rush.y-qb.y):999;
  if(since<0.55 && pressure>32) return;              // let him finish the drop

  var best=null, bestScore=-1e9;
  for(var i=0;i<G.players.length;i++){
    var r=G.players[i];
    if(r.team!==G.offense||r===qb||r.role==='BL') continue;
    var cov=nearestOf(r,'H');
    var open=cov?Math.hypot(cov.x-r.x,cov.y-r.y):70;
    var gain=Math.min((r.x-G.los)*d, Math.max(0,yardsToGoal()*YD))/YD;  // capped at the goal
    var score=open*1.6+gain*1.2;
    if(open<15) score-=70;                           // blanketed, do not force it
    if(r.role==='RB'||r.role==='TE') score+=9;       // the checkdown is always there
    if(score>bestScore){ bestScore=score; best=r; }
  }
  var desperate=(pressure<26||since>1.9);
  if(best && (bestScore>22 || desperate)){
    // arm a special throw before letting it go, same as a player would
    var qk=kitFor(qb);
    if(desperate && abReady(qb,'rocket') && Math.random()<0.45){
      fireAbility({man:qb,local:false}, null, qk.indexOf('rocket'));
    } else if(bestScore>46 && abReady(qb,'perfect') && Math.random()<0.30){
      fireAbility({man:qb,local:false}, null, qk.indexOf('perfect'));
    }
    G.windup={target:best,t:0,dur:0.17,qb:qb};
  }
}

// ---- CPU play calling, by down and distance rather than at random -------
function yardsToGoal(){
  var d=dir();
  return d>0 ? ((FW-EZ)-G.los)/YD : (G.los-EZ)/YD;
}
function pickAiOffense(){
  var r=Math.random(), togo=G.toGo, ytg=yardsToGoal();
  if(G.down>=4){
    if(ytg+17 <= 48) return 'fg';
    if(togo > 2) return 'punt';
  }
  // goal line: there is no deep, so pound it
  if(ytg<=5)  return r<0.74?'run':'short';
  if(ytg<=12) return r<0.60?'run':'short';
  if(ytg<=22) return r<0.46?'run':(r<0.90?'short':'deep');
  if(G.down>=3 && togo>=7) return r<0.44?'deep':(r<0.72?'outs':'screen');
  if(togo<=3) return r<0.52?'run':(r<0.78?'draw':'short');
  return r<0.28?'short':(r<0.48?'run':(r<0.64?'deep':(r<0.80?'outs':
         (r<0.92?'draw':'screen'))));
}
function pickAiDefense(){
  var r=Math.random(), togo=G.toGo, ytg=yardsToGoal();
  // backed up near their own goal line, crowd the box
  if(ytg<=8) return r<0.6?'blitz':'spy';
  if(G.down>=3 && togo>=12) return r<0.5?'prevent':'zone'; // sit on the sticks
  if(G.down>=3 && togo>=7) return r<0.42?'zone':(r<0.74?'press':'spy');
  if(togo<=3) return r<0.55?'blitz':'spy';                // they will run
  return r<0.26?'blitz':(r<0.48?'zone':(r<0.70?'spy':'press'));
}

// The whistle does not freeze a football field. Everyone coasts to a stop,
// the tackled man goes down, and the pile settles for a beat.
function deadTick(dt){
  var damp=Math.pow(0.035,dt);
  if(G.celebrate>0){
    G.celebrate-=dt;
    if(Math.random()<dt*22 && G.celAt) confetti(G.celAt.x,G.celAt.y);
    for(var ci=0;ci<G.players.length;ci++){
      var cp=G.players[ci];
      if(!G.celAt) break;
      if(cp.team===G.scoringTeam){
        var dx=G.celAt.x-cp.x, dy=G.celAt.y-cp.y, dm=Math.hypot(dx,dy)||1;
        if(dm>26){ cp.vx=dx/dm*150; cp.vy=dy/dm*150; }   // mob the scorer
        else { cp.cel=Math.max(cp.cel,0.6); }
      }
    }
    damp=Math.pow(0.6,dt);
  }
  for(var i=0;i<G.players.length;i++){
    var q=G.players[i];
    q.vx*=damp; q.vy*=damp;
    q.x+=q.vx*dt; q.y+=q.vy*dt;
    q.y=Math.max(-SIDE_OUT,Math.min(FH+SIDE_OUT,q.y)); q.x=Math.max(6,Math.min(FW-6,q.x));
    var sp=Math.hypot(q.vx,q.vy);
    q.run += (q.down>0||q.stun>0 ? 0 : Math.max(sp*0.075, 1.5))*dt;
    if(Math.abs(q.vx)>5) q.face=q.vx>0?1:-1;
    q.lean += ((sp>6?Math.min(0.3,sp*0.0016):0)-q.lean)*Math.min(1,dt*9);
    if(q.stun>0)   q.stun-=dt;
    if(q.down>0)   q.down-=dt;
    if(!isFinite(q.x)||!isFinite(q.y)){
      q.x=G.los; q.y=FH/2; q.vx=0; q.vy=0;
    }
    if(!isFinite(q.vx)) q.vx=0;
    if(!isFinite(q.vy)) q.vy=0;
    if(q.stun>0) q.down=Math.max(q.down, Math.min(q.stun,0.95));
    if(q.down>0||q.stun>0){ var dmp=Math.pow(0.002,dt); q.vx*=dmp; q.vy*=dmp; }
    if(q.burst>0 && sp>60){
      if(Math.random()<dt*26) ghost(q);
      if(Math.random()<dt*20) speedLines(q, q.team==='H'?'rgba(255,210,63,.5)':'rgba(255,138,148,.5)');
    }
    if(q.z>0)      q.z=Math.max(0,q.z-dt*1.7);
    if(q.spin>0)   q.spin=Math.max(0,q.spin-dt*2.1);
    if(q.arm>0)    q.arm=Math.max(0,q.arm-dt*1.9);
    if(q.cel>0)    q.cel-=dt;
    if(q.phase>0)  q.phase=Math.max(0,q.phase-dt*1.1);
  }
  // bodies still take up space in the pile
  var SEP=23;
  for(var a1=0;a1<G.players.length;a1++){
    for(var a2=a1+1;a2<G.players.length;a2++){
      var A=G.players[a1], B=G.players[a2];
      var dx=B.x-A.x, dy=B.y-A.y, dq=dx*dx+dy*dy;
      if(dq>SEP*SEP||dq<0.01) continue;
      var dl=Math.sqrt(dq), sh=(SEP-dl)/SEP*30*dt;
      A.x-=dx/dl*sh; A.y-=dy/dl*sh; B.x+=dx/dl*sh; B.y+=dy/dl*sh;
    }
  }
  for(var f=G.fx.length-1;f>=0;f--){
    var e=G.fx[f]; e.life-=dt;
    if(e.ringed) e.r+=dt*130;
    else { e.x+=e.vx*dt; e.y+=e.vy*dt; e.vx*=0.93; e.vy*=0.93; }
    if(e.life<=0) G.fx.splice(f,1);
  }
  if(G.thrown){ G.thrown=null; }
}


// ==================================================================== kicks
// Fourth down gives you a choice: go for it, punt it away, or take the three.

function fgDistance(){ return Math.round(yardsToGoal()) + 17; }   // snap + end zone

function fgChance(dist){
  if(dist < 25) return 0.94;
  if(dist < 35) return 0.86;
  if(dist < 45) return 0.68;
  if(dist < 55) return 0.44;
  return 0.20;
}

function offensePlays(){
  var list = PLAYS.H.slice();
  if(G.down >= 4){
    list.push({id:'punt', name:'PUNT', desc:'Kick it away and pin them deep.'});
    var dist = fgDistance();
    if(dist <= 58){
      list.push({id:'fg', name:'FIELD GOAL',
        desc: dist + ' yard try. About ' + Math.round(fgChance(dist)*100) + '% from here.'});
    }
  }
  return keyed(list);
}

// the sheet numbers itself, so the playbook can grow without renumbering
function keyed(list){
  for(var i=0;i<list.length;i++) list[i].key=String(i+1);
  return list;
}
function callSheet(){ return iHaveBall() ? offensePlays() : keyed(PLAYS.A.slice()); }

function startKick(kind){
  elOv.classList.remove('show');
  var d = dir();
  var k = { kind:kind, t:0, dur: kind==='fg' ? 1.5 : 1.9 };
  k.x0 = G.los - 6*YD*d;
  k.y0 = FH/2;
  if(kind === 'fg'){
    k.dist = fgDistance();
    k.good = Math.random() < fgChance(k.dist);
    k.x1 = (d > 0) ? (FW - EZ*0.35) : (EZ*0.35);
    k.y1 = FH/2 + (k.good ? (Math.random()-0.5)*5*YD : (Math.random()<0.5?-1:1)*(10+Math.random()*7)*YD);
    k.arc = 58;
  } else {
    var net = 36 + Math.random()*17;
    k.x1 = G.los + net*YD*d;
    k.y1 = FH/2 + (Math.random()-0.5)*16*YD;
    k.arc = 66;
    k.touchback = (d > 0) ? (k.x1 >= FW-EZ) : (k.x1 <= EZ);
  }
  G.playNo=(G.playNo|0)+1;
  openPlay(kind); if(G.cur) G.cur.kick=kind;
  G.kick = k;
  G.phase = 'kick';
  G.players.length = 0;
  G.ball = {x:k.x0, y:k.y0, held:false};
  G.carrier = null; G.thrown = null; G.loose = null;
  say(kind==='fg' ? (k.dist + ' YARD ATTEMPT') : 'PUNT IS AWAY', 1100);
}

function kickTick(dt){
  var k = G.kick; if(!k) return;
  k.t += dt;
  var p = Math.min(1, k.t / k.dur);
  G.ball.x = k.x0 + (k.x1-k.x0)*p;
  G.ball.y = k.y0 + (k.y1-k.y0)*p;
  k.h = Math.sin(p*Math.PI) * k.arc;
  (k.trail = k.trail || []).push({x:G.ball.x, y:G.ball.y - k.h});
  if(k.trail.length > 26) k.trail.shift();
  if(p < 1) return;

  var d = dir();
  if(k.kind === 'fg'){
    if(k.good){
      if(G.offense==='H') G.scoreH += 3; else G.scoreA += 3;
      say('IT IS GOOD!', 1700);
      for(var i=0;i<26;i++) confetti(k.x1, FH/2);
      G.shake = REDUCED?0:12;
    } else {
      say('NO GOOD', 1500);
    }
    G.kick = null; G.phase='dead'; G.clockRunning=false;
    turnover();
    G.los = (G.offense==='H') ? EZ+25*YD : FW-EZ-25*YD;
    setTimeout(function(){ if(!G.over) G.phase='playcall'; }, 1700);
  } else {
    burst(G.ball.x, G.ball.y, '#eef3e8');
    G.kick = null; G.phase='dead'; G.clockRunning=false;
    turnover();
    if(k.touchback){
      say('TOUCHBACK', 1300);
      G.los = (G.offense==='H') ? EZ+25*YD : FW-EZ-25*YD;
    } else {
      say('DOWNED AT THE ' + yardLineLabel(k.x1), 1400);
      G.los = Math.max(EZ+2, Math.min(FW-EZ-2, k.x1));
    }
    setTimeout(function(){ if(!G.over) G.phase='playcall'; }, 1500);
  }
}

function drawKick(){
  var k = G.kick; if(!k) return;
  if(k.trail){
    for(var i=1;i<k.trail.length;i++){
      var a=k.trail[i-1], b=k.trail[i], f=i/k.trail.length;
      ctx.strokeStyle='rgba(241,241,236,'+(f*0.45).toFixed(3)+')';
      ctx.lineWidth=0.6+f*2.4; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
    }
  }
  ctx.fillStyle='rgba(0,0,0,.28)';
  ctx.beginPath(); ctx.ellipse(G.ball.x, G.ball.y, 6-k.h*0.04, 2.6-k.h*0.02, 0, 0, Math.PI*2); ctx.fill();
  ctx.save();
  ctx.translate(G.ball.x, G.ball.y - (k.h||0));
  ctx.rotate(k.t*13);
  if(BALL_IMG.ready){
    ctx.drawImage(BALL_IMG,-7.0,-4.3,14.0,8.6);
  } else {
    ctx.fillStyle='#7a4a28';
    ctx.beginPath(); ctx.ellipse(0,0,6.2,3.7,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#f1f1ec'; ctx.lineWidth=0.9;
    ctx.beginPath(); ctx.moveTo(-2.4,0); ctx.lineTo(2.4,0); ctx.stroke();
  }
  ctx.restore();
}

function confetti(x,y){
  var cols=['#ffd23f','#f1f1ec','#c8a63c','#ff8c2b','#7fd8ff'];
  var a=Math.random()*Math.PI*2, s=60+Math.random()*180;
  G.fx.push({x:x+(Math.random()-0.5)*40, y:y-20-Math.random()*40,
             vx:Math.cos(a)*s, vy:Math.sin(a)*s-90,
             life:1.1+Math.random()*0.7, max:1.8,
             r:2.2+Math.random()*2.2, c:cols[(Math.random()*cols.length)|0]});
}

// ---- pre-snap: everyone set, play clock running, waiting on the hike -----
function presnap(dt){
  G.playClock-=dt;
  if(G.clockRunning){
    G.clock-=dt;
    if(G.clock<=0){ G.clock=0; gameOver(); return; }
  }
  for(var i=0;i<G.players.length;i++){
    var p=G.players[i];
    p.vx=0; p.vy=0;
    var tgt=(p.team===G.offense?0.07:-0.07)+Math.sin(p.run*0.9+p.num)*0.05;
    p.lean += (tgt-p.lean)*Math.min(1,dt*5);
  }
  if(G.autoSnapAt!==null && (15-G.playClock) >= G.autoSnapAt){ snapBall(); return; }
  if(NET.on && NET.host &&
     (!G.controlled2 || G.controlled2.team!=='A' || G.players.indexOf(G.controlled2)<0)){
    G.controlled2 = pickRemoteMan(false);
  }
  if(tapSwitch()) switchPlayer('H');
  // the guest can shuffle his man pre-snap too
  if(NET.on && NET.host && NET.remoteIn && NET.remoteIn.sw){
    NET.remoteIn.sw=0; switchPlayer('A');
  }
  // only the side with the ball can put it in play
  var mineToSnap = (G.offense==='H');
  if(mineToSnap && (tapHike()||tapJuke())){ snapBall(); return; }
  if(NET.on && NET.host && !mineToSnap && NET.remoteHike){ NET.remoteHike=false; snapBall(); return; }
  if(G.playClock<=0){ say('DELAY — SNAPPED',700); snapBall(); }
}


// =============================================================== the seats
// A seat is one person at the controls: the side they play, the man they are
// driving right now, and their own meters. Host sits in H, guest sits in A,
// and both run driveHuman(). Anything the host can do, the guest can do.

function hostSeat(){
  return {side:'H', man:G.controlled, M:G, hero:HERO, local:true};
}
function guestSeat(){
  if(!G.controlled2||G.controlled2.stun>0||G.controlled2.team!=='A'||
     G.players.indexOf(G.controlled2)<0){
    G.controlled2=pickRemoteMan(false);
  }
  return {side:'A', man:G.controlled2, M:G.M2, hero:sideHero('A'), local:false};
}

// keyboard, touch stick and the on-screen buttons, in the shape driveHuman wants
function localInput(){
  var a=axis();
  return {x:a.x, y:a.y, sp:wantSprint()?1:0,
          b1:tapJuke()?1:0, b2:tapMove()?1:0, b3:tapQ()?1:0,
          sw:tapSwitch()?1:0, tg:tapTarget(),
          k1:tapAb1()?1:0, k2:tapAb2()?1:0, k3:tapAb3()?1:0};
}

// whatever the guest last sent. Taps latch on arrival and are spent here.
function remoteInput(){
  var r=NET.remoteIn;
  if(!r) return {x:0,y:0,sp:0,b1:0,b2:0,b3:0,sw:0,tg:-1,k1:0,k2:0,k3:0};
  var out={x:r.x, y:r.y, sp:r.sp, b1:r.b1, b2:r.b2, b3:r.b3, sw:r.sw,
           k1:r.k1, k2:r.k2, k3:r.k3,
           tg:(NET.remoteTarget===undefined?-1:NET.remoteTarget)};
  r.b1=r.b2=r.b3=r.sw=r.k1=r.k2=r.k3=0;
  NET.remoteTarget=-1;
  return out;
}

function driveHuman(seat, IN, dt, now){
  var M=seat.M, me=seat.man, d=dir();
  if(M.moveCd>0) M.moveCd-=dt;
  if(M.hitCd>0)  M.hitCd-=dt;
  if(M.jukeCd>0) M.jukeCd-=dt;
  if(M.latCd>0)  M.latCd-=dt;
  if(M.diveCd>0) M.diveCd-=dt;
  if(M.assistCd>0) M.assistCd-=dt;
  if(!me) return;

  var onO = (G.offense===seat.side);
  var fwd = (seat.side==='H') ? d : -d;      // downfield, from this seat's view
  var a={x:IN.x, y:IN.y};
  var sprinting = IN.sp && M.stam>2 && (a.x||a.y);
  if(sprinting) M.stam=Math.max(0,M.stam-33*dt); else M.stam=Math.min(100,M.stam+20*dt);
  if(me.burst>0) me.burst-=dt;

  if(IN.sw){
    switchPlayer(seat.side);
    me = seat.man = (seat.side==='H') ? G.controlled : G.controlled2;
    if(!me) return;
  }
  // Flat on the turf is flat on the turf. The stick used to keep driving a
  // man who had been knocked down, so he slid along the grass on his side.
  if(me.stun>0 || me.down>0){ me.vx*=0.8; me.vy*=0.8; return; }
  if(IN.tg>=0 && onO){
    var rl=eligibleReceivers();
    if(rl[IN.tg]) throwAt(rl[IN.tg].x, rl[IN.tg].y, seat.side);
  }

  // Auto-assist: when a tackler is right on you, your man reacts by himself.
  // Same instinct the CPU carriers have, so you are never a sitting duck.
  if(onO && me===G.carrier && M.assistCd<=0){
    var foe=(seat.side==='H')?'A':'H';
    var thr=nearestOf(me,foe);
    var thd2=thr?Math.hypot(thr.x-me.x,thr.y-me.y):999;
    if(thd2<27){
      var roll=Math.random();
      if(roll<0.55 && M.power>=JUKE_COST){
        M.power-=JUKE_COST; M.assistCd=1.1;
        M.jukeUntil=now+JUKE_MS;
        var away=(me.y-thr.y)>=0?1:-1;
        me.vx=fwd*BASE_SPD*1.9*me.agi; me.vy=away*BASE_SPD*2.3*me.agi;
        if(seat.local) say('SIDESTEP!',420);
      } else if(roll<0.85 && M.power>=34){
        M.power-=34; M.assistCd=1.2; me.arm=0.5;
        thr.stun=1.0; thr.vx=(thr.x-me.x)*6.5; thr.vy=(thr.y-me.y)*6.5;
        burst(thr.x,thr.y,'#ffd23f'); G.shake=REDUCED?0:10;
        if(seat.local) say('STIFF ARM!',520);
      }
    }
  }

  if(!onO){
    // ---- you are on defense: brawler controls
    if(IN.b3) groundPound(me,M);
    if(IN.b2) bigHit(me,M);
    if(IN.b1 && M.power>=26 && M.jukeCd<=0){
      M.power-=26; M.jukeCd=1.05; M.diveUntil=now+400;
      var dv=(a.x||a.y)?a:{x:fwd,y:0};
      me.vx=dv.x*BASE_SPD*2.9; me.vy=dv.y*BASE_SPD*2.9;
      if(seat.local) say('DIVE!',320);
    }
  } else {
    if(IN.b3 && M.latCd<=0){
      if(handoff(seat.side)) M.latCd=0.9;
      else { M.latCd=1.4; lateral(seat.side); }
    }
    if(IN.b2) fireSpecial(seat, IN);
    if(IN.b1 && M.power>=JUKE_COST && M.jukeCd<=0){
      M.power-=JUKE_COST; M.jukeCd=0.95; M.jukeUntil=now+JUKE_MS;
      var jd=(a.x||a.y)?a:{x:fwd,y:0};
      me.vx=jd.x*BASE_SPD*2.6*me.agi; me.vy=jd.y*BASE_SPD*2.6*me.agi;
      if(seat.local) say('JUKE!',300);
    }
  }
  if(IN.k1) fireAbility(seat, IN, 0);
  if(IN.k2) fireAbility(seat, IN, 1);
  if(IN.k3) fireAbility(seat, IN, 2);
  M.power=Math.min(100,M.power+13*dt);

  var jk=now<M.jukeUntil, diving=now<M.diveUntil;
  // on defence the AI runs at DEF_SPD, so a human on that side has to as well
  // or he is permanently behind his own team-mates
  var base = onO ? BASE_SPD : DEF_SPD;
  var mult=(sprinting?SPRINT:1)*(me.burst>0?1.7:1)*me.spd;
  if(diving){ me.vx*=0.988; me.vy*=0.988; }          // ride the dive out
  else if(onO && me===G.carrier && me.role==='QB' && G.dropLeft>0 && !G.thrown){
    if(a.x||a.y){ G.dropLeft=0; me.vx=a.x*base*mult; me.vy=a.y*base*mult; }   // you took over
    else dropBack(me, fwd, dt);
  }
  else if(!jk||me.z>0){ me.vx=a.x*base*mult; me.vy=a.y*base*mult; }
  else { me.vx*=0.90; me.vy*=0.90; }
}

function step(dt){
  G.gt+=dt;
  var d=dir(), now=performance.now(), since=G.gt-G.snapT;
  G.clock-=dt;
  if(G.clock<=0){ G.clock=0; gameOver(); return; }
  if(G.handoffAt!=null && since>G.handoffAt && G.carrier && G.carrier.role==='QB'){
    if(handoff(G.offense,true)) G.handoffAt=null;
  }
  // Lock-on: the longer you keep the cursor on a receiver, the better the
  // ball goes. Snap it off the moment you see him and it sails.
  if(G.carrier && G.carrier.role==='QB' && !G.thrown && iHaveBall() &&
     G.mouse && G.mouse.on && !pastTheLine(G.carrier)){
    var lt=pickTarget(G.mouse.x,G.mouse.y);
    if(lt && lt===G.lockMan) G.lockT=Math.min(1.5, G.lockT+dt);
    else { G.lockMan=lt; G.lockT=0; }
  } else { G.lockMan=null; G.lockT=0; }

  applyRemoteInput(dt);
  driveHuman(hostSeat(), localInput(), dt, now);
  if(NET.on && NET.host) driveHuman(guestSeat(), remoteInput(), dt, now);

  // AI
  for(var i=0;i<G.players.length;i++){
    var p=G.players[i];
    if(p===G.controlled){ if(p.stun>0) p.stun-=dt; continue; }
    if(p===G.controlled2){
      // a human is driving this one; only run down his stun for him
      if(p.stun>0){ p.stun-=dt; p.vx*=0.8; p.vy*=0.8; }
      continue;
    }
    if(p.stun>0){ p.stun-=dt; if(!(p.z>0.02)){ p.vx*=0.9; p.vy*=0.9; } continue; }   // no drag in the air; a skid on landing
    if(p.down>0){ p.vx*=0.8; p.vy*=0.8; continue; }
    if(G.loose){ aim(p,G.ball.x,G.ball.y,BASE_SPD*1.06*p.spd); continue; }
    var offTeam=G.offense;
    if(p.team===offTeam){
      if(p===G.carrier){
        var th=nearestOf(p,offTeam==='H'?'A':'H');
        var thd=th?Math.hypot(th.x-p.x,th.y-p.y):999;
        // AI ball carriers evade: a juke, a spin, or a stiff arm under pressure
        if(p.aiCd>0) p.aiCd-=dt;
        else if(thd<30 && p.role!=='QB' && Math.random()<0.035){
          var pick=Math.random();
          p.aiCd=1.3;
          if(pick<0.4){
            p.spin=1; p.iFrames=0.28;
            p.vx=d*BASE_SPD*2.2; p.vy=(p.y-th.y>0?1:-1)*BASE_SPD*1.5;
            burst(p.x,p.y,'#7fd8ff');
          } else if(pick<0.75){
            p.iFrames=0.24;
            p.vx=d*BASE_SPD*1.6; p.vy=(p.y-th.y>0?1:-1)*BASE_SPD*2.4;
          } else {
            p.arm=0.5; th.stun=1.0;
            th.vx=(th.x-p.x)*6; th.vy=(th.y-p.y)*6;
            burst(th.x,th.y,'#ffd23f'); G.shake=REDUCED?0:9;
          }
        }
        if(p.role==='QB' && G.dropLeft>0 && !G.windup && thd>30){
          dropBack(p, d, dt);
        } else if(p.role==='QB' && since<1.5 && thd>30 && !G.windup){
          // stay in the pocket: drift back and slide off the rush
          var slide=th?Math.sign(p.y-th.y)||1:1;
          p.vx=-d*BASE_SPD*0.34; p.vy=slide*BASE_SPD*0.30;
        } else {
          // sprint, and pick the lane with the most daylight
          var lane2=runLane(p,d);
          var spd2=BASE_SPD*1.30*(p.spd||1);
          p.vx=lane2.x*spd2; p.vy=lane2.y*spd2;
        }
      } else if(p.route==='lead'){
        // Lead blocking: get out in front of whoever has the ball and go hit
        // the man closest to him. Not pass protection, which is what these
        // two used to do from fourteen yards outside.
        var car=G.carrier, dTeam=(offTeam==='H'?'A':'H');
        if(car){
          var mark=nearestOf(car,dTeam);
          if(mark && Math.hypot(mark.x-car.x,mark.y-car.y)<30*YD){
            aim(p, mark.x, mark.y, BASE_SPD*1.36*p.spd);
          } else {
            aim(p, car.x+d*7*YD, car.y, BASE_SPD*1.24*p.spd);
          }
        }
      } else if(p.route&&p.route!=='block'){
        var tp=routePoint(p,since);
        // Scramble drill. This used to fire on a timer: at 2.6 seconds every
        // receiver abandoned his route and ran back at the quarterback. Since
        // a deep ball needs longer than that to develop, the passer was
        // always throwing to a man who had just turned round, which read as a
        // badly underthrown pass. It now waits for him to actually break the
        // pocket, and a streak keeps streaking regardless.
        var qbOut = G.carrier && G.carrier.role==='QB' &&
                    ((G.carrier.x-G.los)*d > -3*YD);
        if(qbOut && since>1.6 && p.route!=='go'){
          tp={x:G.carrier.x+d*9*YD, y:p.y*0.7+G.carrier.y*0.3};
        }
        // Once the ball is his, he plays the ball, not the route. The throw
        // is led off his velocity at the release, so a man caught mid-cut,
        // or coming back to a scrambling passer, had the ball land where he
        // was heading and then ran off to finish his route, which is how a
        // good throw across the field landed ten yards short of everybody.
        if(G.thrown && G.thrown.target===p && !G.thrown.lat){
          tp={x:G.thrown.tx, y:G.thrown.ty};
          var tl=Math.hypot(tp.x-p.x,tp.y-p.y);
          aim(p,tp.x,tp.y, tl<5 ? 0 : BASE_SPD*1.08*p.spd);
        } else
        aim(p,tp.x,tp.y,BASE_SPD*1.02*p.spd);
      } else {
        // stay on the ball side of your man and wall him off
        var foe = (p.assign && p.assign.stun<=0) ? p.assign : nearestRusher(p);
        if(foe){
          // mirror him from the ball side; sprint to get square, then hold
          var gx=foe.x - d*9, gy=foe.y;
          // pass set: shade to the inside, between him and the quarterback
          if(G.carrier && G.carrier.role==='QB') gy=foe.y*0.8+G.carrier.y*0.2;
          var gd=Math.hypot(gx-p.x,gy-p.y);
          var spd = gd>34 ? 1.48 : (gd>14 ? 1.24 : 0.94);
          aim(p,gx,gy, BASE_SPD*spd);
        }
      }
    } else {
      // Still a passing play? Cover. Ball out or in a runner's hands? Rally.
      // A passer who steps up is still a passer. Coverage used to switch off
      // the instant he crossed the line by a single pixel, so every back
      // dropped his man and ran at the ball and the receivers were wide open.
      // The corners and the safety stay home until he is genuinely running;
      // the backers are the ones who come up to meet him.
      var hasBall = G.carrier && G.carrier.role==='QB' && !G.loose && !G.thrown;
      var past    = hasBall ? (G.carrier.x-G.los)*d : 9999;
      var inPocket = hasBall && past < 4;
      // He is a runner the moment he is a yard over the line. This used to be
      // nine yards, so a scrambling quarterback ran straight past corners who
      // were still carrying receivers down the field.
      var stillAThreat = hasBall && past < 1*YD;
      var deepBack = (p.pos==='CB'||p.pos==='S');
      if(p.role==='COV' && (inPocket || (stillAThreat && deepBack))){
        if(p.spy){
          // shadow the passer, stay between him and the open field
          var qs=G.carrier;
          if(qs){ aim(p, qs.x - d*3*YD, qs.y, DEF_SPD*1.02); continue; }
        }
        if(G.covType==='zone'){
          // Sit on your landmark and squeeze whoever walks into it. This is
          // the difference between zone and man: nobody is chasing a single
          // receiver across the field, they are guarding grass.
          var zx=G.los + d*(p.zdepth||10)*YD, zy=p.zy||FH/2;
          var claim=null, cbest=1e9;
          for(var zq=0;zq<G.players.length;zq++){
            var zp=G.players[zq];
            if(zp.team!==offTeam||zp.route==='block'||zp.role==='QB') continue;
            var zd=Math.hypot(zp.x-zx, zp.y-zy);
            if(zd<15*YD && zd<cbest){ cbest=zd; claim=zp; }
          }
          if(claim) aim(p, claim.x + d*3, claim.y, DEF_SPD*1.0);
          else      aim(p, zx, zy, DEF_SPD*0.95);
          continue;
        }
        if(p.pos==='S'){
          // safety over the top: split the deepest threats
          var deep=null, deepest=-1e9;
          for(var sq=0;sq<G.players.length;sq++){
            var sp2=G.players[sq];
            if(sp2.team!==offTeam||sp2.route==='block'||sp2.role==='QB') continue;
            var prog=(sp2.x-G.los)*d;
            if(prog>deepest){ deepest=prog; deep=sp2; }
          }
          var sy = deep?(deep.y*0.5+FH/2*0.5):FH/2;
          aim(p, G.los+Math.max(16,deepest/YD+6)*YD*d, sy, DEF_SPD*0.98);
        } else if(p.cover && p.cover.stun<=0){
          // trail your man with a cushion toward your own end zone
          var r=p.cover;
          var lead=0.13;
          aim(p, r.x + r.vx*lead + d*((p.pos==='CB'?9:6)+(G.cushion||0)),
                 r.y + r.vy*lead, DEF_SPD*1.02);
        } else {
          aim(p, G.ball.x+d*10*YD, G.ball.y, DEF_SPD*0.9);
        }
        continue;
      }
      var bx=G.ball.x,by=G.ball.y;
      if(G.thrown){ bx=G.thrown.tx; by=G.thrown.ty; }
      var lane=p.lane||0;
      var ax=bx, ay=by;
      if(G.carrier){
        var rx=G.carrier.x-p.x, ry=G.carrier.y-p.y;
        var dist=Math.hypot(rx,ry)||1;
        var cvx=G.carrier.vx, cvy=G.carrier.vy, cs=Math.hypot(cvx,cvy);
        // Only lead him when he is running away from me. A defender who is
        // already downfield of the carrier has him coming the other way, and
        // leading there aims at a spot further downfield still, so he backs
        // off the man he is supposed to be closing on. That looked exactly
        // like the defence running away.
        var away = cs>1 ? ((cvx*rx + cvy*ry)/(cs*dist)) : 0;   // +1 fleeing me
        var leadT = Math.min(1.2, dist/(DEF_SPD*1.15)) * Math.max(0, away);
        ax=G.carrier.x+cvx*leadT;
        ay=G.carrier.y+cvy*leadT;
        // The lane spreads the pursuit so they do not arrive in single file,
        // but it is an offset from the man. Held all the way in, it parked
        // rushers two or three yards beside a passer who stood still, and had
        // backs running alongside a carrier instead of hitting him. It shrinks
        // to nothing over the last few yards.
        lane *= Math.max(0, Math.min(1, (dist - 3*YD) / (6*YD)));
      }
      aim(p, ax, ay+lane, DEF_SPD*(p.role==='RUSH'?1.10:0.96)*openChase());
    }
  }

  // Blocking is a physical wall, not a speed penalty. A blocker who is
  // engaged holds his man on the far side of himself until the block is
  // shed. Slowing a rusher down was never enough to buy the passer time.
  var d2=dir();
  for(var b=0;b<G.players.length;b++){
    var blk=G.players[b];
    if(blk.team!==G.offense||blk.route!=='block') continue;
    if(blk===G.carrier||blk.stun>0) continue;
    for(var r2=0;r2<G.players.length;r2++){
      var ru=G.players[r2];
      if(ru.team===G.offense||ru.stun>0) continue;
      if(blk.assign && ru!==blk.assign) continue;
      var dy2=Math.abs(ru.y-blk.y);
      if(dy2>BLOCK_R) continue;                       // he is around the edge
      // and he has to be on him, not merely level with him. Only the width
      // was ever checked, so a rusher who had already beaten his man and was
      // yards past him got snapped straight back to the blocker's side of
      // the line, which read as the rush bouncing off an invisible wall.
      if(Math.abs(ru.x-blk.x) > BLOCK_R*1.8) continue;
      ru.engaged=(ru.engaged||0)+dt;
      if(ru.engaged > (ru.shedAt||2.5)) continue;     // he has beaten the block
      ru.eBlk=blk;

      // hand fighting: both men punch and grab while they are locked up
      if(Math.random()<dt*2.4) ru.arm=0.5;
      if(Math.random()<dt*2.4) blk.arm=0.5;

      // A rusher does not just lean on his man. A little way into the rep he
      // tries a move: rip, swim, spin or bull rush. Win it and he is through;
      // lose it and the blocker has him for longer.
      if(!(ru.moveT>0) && ru.engaged > (ru.moveAt||0.45)){
        ru.moveAt = ru.engaged + 0.8 + Math.random()*0.6;
        var mk = RUSH_MOVES[Math.floor(Math.random()*RUSH_MOVES.length)];
        var side = (ru.lane||0)>=0 ? 1 : -1;
        if(Math.random()<0.35) side=-side;
        var won = Math.random() < 0.34*(ru.pwr||1)/(blk.pwr||1);
        ru.moveKind=mk; ru.moveT=0.42; ru.moveSide=side; ru.moveWon=won;
        if(mk==='spin') ru.spin=1;
        if(mk==='swim') ru.throwArm=1;
        if(mk==='rip')  ru.arm=0.5;
        if(won){ ru.engaged=(ru.shedAt||2.5)+0.01; blk.beat=0.5; continue; }
        ru.shedAt=(ru.shedAt||2.5)+0.45;
      }

      // hard line: he may not get to the passer's side of his blocker
      var line = blk.x - d2*4;
      var past = (line - ru.x)*d2;                    // positive once he is through
      if(past > 0){
        ru.x = line;
        if(ru.vx*d2 < 0) ru.vx = 0;                   // kill the push through
        ru.vy *= 0.5;
      }
      // and he gets bogged down while engaged
      if(Math.abs(ru.x-blk.x) < BLOCK_R*1.4){
        ru.vx*=0.35; ru.vy*=0.55;
      }
    }
  }

  // rush moves in motion, and blockers who just got beaten
  for(var mv=0;mv<G.players.length;mv++){
    var mq=G.players[mv];
    if(mq.beat>0){ mq.beat-=dt; mq.vx*=0.3; mq.vy*=0.3; }
    if(!(mq.moveT>0)) continue;
    mq.moveT-=dt;
    if(mq.stun>0 || mq.down>0 || mq.team===G.offense){ mq.moveT=0; continue; }
    var toQB=-d2, ms=mq.moveSide||1, gain=mq.moveWon?1:0.4;
    if(mq.moveKind==='bull'){
      // drive him straight back into the pocket
      mq.vx=toQB*DEF_SPD*0.75*gain; mq.vy*=0.3;
      if(mq.eBlk && mq.moveWon){ mq.eBlk.vx=mq.vx*0.9; mq.eBlk.vy=mq.vy; }
    } else {
      // rip, swim and spin all get round the edge of him
      var lat = mq.moveKind==='spin' ? 1.35 : 1.2;
      mq.vx=toQB*DEF_SPD*0.5*gain; mq.vy=ms*DEF_SPD*lat*gain;
    }
    if(mq.moveKind==='rip') mq.arm=0.5;
  }

  // integrate + animation state
  for(var j=0;j<G.players.length;j++){
    var q=G.players[j];
    q.x+=q.vx*dt; q.y+=q.vy*dt;
    q.y=Math.max(-SIDE_OUT,Math.min(FH+SIDE_OUT,q.y)); q.x=Math.max(6,Math.min(FW-6,q.x));
    var sp=Math.hypot(q.vx,q.vy);
    q.run += (q.backpedal>0?-1:1)*Math.max(sp*0.075, 2.1)*dt;    // idle still animates; backpedal runs it backwards
    if(q.backpedal>0){
      // backpedalling: eyes downfield, weight back, never turn his back
      q.backpedal-=dt; q.face=q.dropFace||q.face;
      q.lean += (-0.10 - q.lean)*Math.min(1,dt*9);
    } else {
      if(Math.abs(q.vx)>5) q.face = q.vx>0?1:-1;
      q.lean += ((sp>6? Math.min(0.34, sp*0.0016) :0) - q.lean)*Math.min(1,dt*9);
    }
    if(q.spin>0){ q.spin=Math.max(0,q.spin-dt*2.1); if(Math.random()<dt*45) ghost(q); }
    // a fresh stun is a hit: put him in the air rather than just tipping him over
    if(q.stun > (q._pst||0)+0.5 && !(q.vz>0) && q.z<=0.01 && !REDUCED) q.vz=3.0;
    q._pst=q.stun;
    if(q.vz){
      q.vz-=9*dt; q.z=Math.max(0,q.z+q.vz*dt);
      if(q.z<=0){ q.vz=0; burst(q.x,q.y,'#cfd8cf'); }   // lands in a puff of turf
    }
    else if(q.z>0) q.z=Math.max(0,q.z-dt*1.7);
    if(q.arm>0)  q.arm=Math.max(0,q.arm-dt*1.9);
    if(q.throwArm>0 && !G.windup) q.throwArm=Math.max(0,q.throwArm-dt*2.3);
    if(q.phase>0) q.phase=Math.max(0,q.phase-dt*1.1);
    if(q.iFrames>0) q.iFrames-=dt;
    if(q.wrapped>0) q.wrapped-=dt;
    if(q.cel>0)  q.cel-=dt;
    if(q.down>0) q.down=Math.max(0,q.down-dt);
  }

  // flame trail behind anyone moving at full tilt
  var hot=G.controlled;
  if(hot && !REDUCED){
    var hs=Math.hypot(hot.vx,hot.vy);
    var burning = hot.burst>0 || (wantSprint()&&G.stam>2&&hs>140);
    if(burning && Math.random()<0.85){
      var big = hot.burst>0;
      G.fx.push({x:hot.x-hot.face*5+(Math.random()-0.5)*5, y:hot.y-6+(Math.random()-0.5)*7,
        vx:-hot.vx*0.28, vy:-26-Math.random()*22,
        life:big?0.5:0.34, max:big?0.5:0.34, r:big?4.4:3,
        c: Math.random()<0.45 ? '#ffd23f' : (Math.random()<0.6 ? '#ff8c2b' : '#ff4d2e')});
    }
  }

  // Bodies occupy space. Without this every pursuer converges on the exact
  // same point and the play collapses into a single stack of sprites.
  var SEP=23;
  for(var i1=0;i1<G.players.length;i1++){
    for(var i2=i1+1;i2<G.players.length;i2++){
      var A=G.players[i1], B=G.players[i2];
      var ddx=B.x-A.x, ddy=B.y-A.y;
      var dsq=ddx*ddx+ddy*ddy;
      if(dsq>SEP*SEP||dsq<0.01) continue;
      var dlen=Math.sqrt(dsq);
      var shove=(SEP-dlen)/SEP*46*dt;
      // the ball carrier holds his ground a little better than the crowd
      var wA=(A===G.carrier)?0.35:((A.down>0||A.stun>0)?0.06:1);
      var wB=(B===G.carrier)?0.35:((B.down>0||B.stun>0)?0.06:1);
      A.x-=ddx/dlen*shove*wA; A.y-=ddy/dlen*shove*wA;
      B.x+=ddx/dlen*shove*wB; B.y+=ddy/dlen*shove*wB;
    }
  }
  for(var i3=0;i3<G.players.length;i3++){
    var pp3=G.players[i3];
    pp3.y=Math.max(-SIDE_OUT,Math.min(FH+SIDE_OUT,pp3.y));
    pp3.x=Math.max(6,Math.min(FW-6,pp3.x));
  }

  // particles
  for(var f=G.fx.length-1;f>=0;f--){
    var e=G.fx[f]; e.life-=dt;
    if(e.ringed){ e.r+=dt*130; }
    else if(e.shock||e.flash||e.streak||e.gh||e.dome||e.bolt){ /* on a timer */ }
    else { e.x+=e.vx*dt; e.y+=e.vy*dt; e.vx*=0.93; e.vy*=0.93;
           if(e.grav){ e.vy+=e.grav*dt; } }
    if(e.life<=0) G.fx.splice(f,1);
  }

  cpuQB(now);
  cpuAbilities(dt,now);

  // ---- throwing motion: arm cocks back, then whips through
  if(G.windup){
    var W=G.windup; W.t+=dt;
    W.qb.throwArm=Math.min(1,W.t/W.dur);
    if(!G.carrier||G.carrier!==W.qb){ W.qb.throwArm=0; G.windup=null; }
    else if(W.t>=W.dur){ var tg=W.target; G.windupWasRocket=!!W.rocket; G.windup=null;
      if(G.cur){ G.cur.passer=W.qb; G.cur.target=tg; }
      releaseThrow(tg); }
  }

  // ball in flight
  if(G.thrown){
    var t=G.thrown; t.t+=dt;
    var k=Math.min(1,t.t/t.dur);
    if(t.homing && t.target && t.target.stun<=0){
      t.tx=t.target.x; t.ty=t.target.y;      // a perfect pass follows him
    }
    G.ball.x=t.x+(t.tx-t.x)*k; G.ball.y=t.y+(t.ty-t.y)*k;
    t.h=Math.sin(k*Math.PI)*(t.arc||0);          // height above the turf
    (t.trail=t.trail||[]).push({x:G.ball.x,y:G.ball.y-t.h});
    if(t.fire && !REDUCED){
      for(var fi=0;fi<3;fi++) G.fx.push({x:G.ball.x+(Math.random()-0.5)*5, y:G.ball.y-t.h+(Math.random()-0.5)*5,
        vx:(Math.random()-0.5)*30, vy:-12-Math.random()*16, life:0.34, max:0.34,
        r:2+Math.random()*2.4, c:['#ff5a1f','#ff9a2a','#ffd23f'][fi]});
    }
    if(t.trail.length>18) t.trail.shift();
    if(k>=1){
      var r=t.target, cov=nearestOf(r,G.offense==='H'?'A':'H');
      var covd=cov?Math.hypot(cov.x-r.x,cov.y-r.y):999;
      var near=Math.hypot(r.x-G.ball.x,r.y-G.ball.y);
      var wasLat=t.lat;
      var win = wasLat ? CATCH_R*3.4 : (t.sure ? CATCH_R*3.2 : CATCH_R*(t.deep?3.1:2.4));
      var caught = (wasLat||t.sure) ? (near<win) : (near<win && covd>16);
      G.thrown=null;
      if(wasLat && !caught){
        // a dropped pitch is a live ball, same as real football
        G.ball.held=false; G.loose={vx:(Math.random()-0.5)*220,vy:(Math.random()-0.5)*220,t:0};
        say('PITCH ON THE GROUND!',1100); G.shake=REDUCED?0:10;
        return;
      }
      if(caught && G.cur) G.cur.comp=true;
      if(caught){ G.carrier=r; G.ball.held=true; if(G.offense==='H') G.controlled=r;
        else if(NET.on) G.controlled2=r;
        if(t.homing){                        // caught in stride, not standing still
          r.iFrames=Math.max(r.iFrames,0.7); r.burst=1.1; r.wrapped=0;
          burst(r.x,r.y,'#7fd8ff'); ring(r.x,r.y,'#7fd8ff');
        }
                  say(wasLat?'GOT IT!':'CAUGHT!',500); }
      else if(cov && covd<10.5){
        // Picked off, and it is live. He can take it all the way back.
        if(G.cur) G.cur.pick=true;
        G.offense=cov.team;
        G.newSeries=true;
        G.carrier=cov; G.ball.held=true;
        G.ball.x=cov.x; G.ball.y=cov.y;
        cov.iFrames=0.4; cov.hp=100;
        if(cov.team==='H') G.controlled=cov; else if(NET.on) G.controlled2=cov;
        burst(cov.x,cov.y,'#ffd23f'); burst(cov.x,cov.y,'#ffffff');
        G.shake=REDUCED?0:14;
        say(cov.team==='H'?'PICKED OFF — RUN IT BACK!':'INTERCEPTED!',1400);
        credit(cov,'INTERCEPTION');
      }
      else { endPlay(G.los, covd<=16?'BROKEN UP':'INCOMPLETE'); return; }
    }
  } else if(G.loose){
    // ---- loose ball bouncing free
    G.loose.t+=dt;
    G.ball.x+=G.loose.vx*dt; G.ball.y+=G.loose.vy*dt;
    G.loose.vx*=0.955; G.loose.vy*=0.955;
    G.ball.x=Math.max(4,Math.min(FW-4,G.ball.x));
    G.ball.y=Math.max(4,Math.min(FH-4,G.ball.y));
    if(Math.random()<0.5) G.fx.push({x:G.ball.x,y:G.ball.y,vx:0,vy:-14,
      life:0.3,max:0.3,r:2,c:'#ffffff'});
    if(G.loose.t>0.35){
      for(var lb=0;lb<G.players.length;lb++){
        var pl=G.players[lb];
        if(pl.stun>0) continue;
        if(Math.hypot(pl.x-G.ball.x,pl.y-G.ball.y)<12){ recoverBall(pl); return; }
      }
    }
    if(G.loose.t>6){ endPlay(G.ball.x,'DEAD BALL'); return; }
  } else if(G.carrier){ G.ball.x=G.carrier.x; G.ball.y=G.carrier.y; }

  if(G.offense==='A'){
    if(!G.controlled||G.controlled.stun>0||G.controlled.team!=='H'){
      var n2=nearestDef(); if(n2) G.controlled=n2;
    }
  }
  if(G.switchFlash>0) G.switchFlash-=dt;

  // Tackling is a struggle, not a touch. Defenders wrap up and drain the
  // carrier's footing; he goes down when it runs out. One man takes a while,
  // three bring him down fast, and a powerful back resists all of it.
  if(G.carrier){
    var jking=(((G.controlled===G.carrier)&&(performance.now()<G.jukeUntil||G.carrier.z>0.15))
             ||((G.controlled2===G.carrier)&&performance.now()<G.M2.jukeUntil))
               || (G.carrier.iFrames>0) || (G.carrier.z>0.15);
    var defTeam=G.offense==='H'?'A':'H';
    var car=G.carrier, res=Math.max(0.7,car.pwr||1), tnow=performance.now();
    // a new ball carrier (a catch, a pick) starts with nobody on him
    if(G.wrapCar!==car){
      for(var wc=0;wc<G.players.length;wc++) G.players[wc].wrapT=0;
      G.wrapCar=car;
    }
    var grabbers=0, lastT=null;
    for(var m2=0;m2<G.players.length;m2++){
      var t2=G.players[m2];
      if(t2.team!==defTeam) continue;
      if(t2.tackleCd>0) t2.tackleCd-=dt;

      if(t2.wrapT>0){
        // already hanging on. A juke or spin shakes him, and so does a back
        // who keeps his legs churning long enough.
        if(jking || t2.stun>0){ breakWrap(t2,car); continue; }
        t2.wrapT-=dt;
        if(t2.wrapT<=0){
          breakWrap(t2,car);
          if(G.controlled===car||G.controlled2===car) say('BROKE THE TACKLE!',700);
          continue;
        }
        grabbers++; lastT=t2;
        continue;
      }
      if(jking || t2.stun>0 || t2.down>0 || t2.tackleCd>0) continue;

      var diving=((t2===G.controlled&&tnow<G.diveUntil)||
                  (t2===G.controlled2&&tnow<G.M2.diveUntil));
      var tdx=t2.x-car.x, tdy=t2.y-car.y, td=Math.hypot(tdx,tdy)||1;
      if(td>(diving?TACKLE_R+10:TACKLE_R)) continue;

      // trucking still blows one man clean off you
      var human=(G.controlled===car);
      if(human&&wantSprint()&&G.power>=TRUCK_COST/car.pwr){
        G.power-=TRUCK_COST/car.pwr;
        t2.stun=1.1; t2.vx=(t2.x-car.x)*7; t2.vy=(t2.y-car.y)*7;
        burst(t2.x,t2.y,'#ffd23f'); G.shake=REDUCED?0:13; say('TRUCKED!',520);
        continue;
      }

      // The tackle itself. Touching a man used to drain him for as long as
      // you stayed close, so defenders jogged alongside the carrier while
      // his bar ran down. Now contact is a hit: it takes a chunk, then the
      // tackler wraps up and hangs on, and the drain comes from the wrap.
      var hit=30*(t2.pwr||1)*(diving?1.7:1);
      var cs2=Math.hypot(car.vx,car.vy);
      if(cs2>1 && (tdx*car.vx+tdy*car.vy)/(cs2*td) > 0.5) hit*=1.3;  // met him head on
      car.hp-=hit/res;
      t2.wrapT=(0.85+Math.random()*0.7)*((t2.pwr||1)/res);
      t2.wrapA=Math.atan2(tdy,tdx);
      burst(car.x,car.y-8,'#ffffff');
      G.shake=REDUCED?0:Math.max(G.shake,6);
      grabbers++; lastT=t2;
    }
    if(grabbers>0){
      car.hp -= (58*grabbers/res)*dt;
      var drag=Math.max(0.18, 1-grabbers*0.42);       // dragged down as they hang on
      car.vx*=drag; car.vy*=drag;
      car.wrapped=0.25; G.freeT=0;
      // the men on him are dragged along with him, arms round him
      for(var w2=0;w2<G.players.length;w2++){
        var wq=G.players[w2];
        if(wq.team!==defTeam || !(wq.wrapT>0)) continue;
        wq.x=car.x+Math.cos(wq.wrapA)*11; wq.y=car.y+Math.sin(wq.wrapA)*7;
        wq.vx=car.vx; wq.vy=car.vy; wq.arm=0.5;
        wq.face=(car.x>=wq.x)?1:-1;
      }
      if(Math.random()<dt*7) burst(car.x,car.y-8,'#e8eef2');
      if(car.hp<=0){
        burst(car.x,car.y,'#ffffff');
        G.shake=REDUCED?0:10;
        car.down=1.5;
        for(var w3=0;w3<G.players.length;w3++){
          var wz=G.players[w3];
          if(wz.wrapT>0){ wz.wrapT=0; wz.down=0.8; }
        }
        if(lastT) lastT.down=0.8;
        credit(lastT, car.role==='QB' ? 'SACK' : 'TACKLE');
        endPlay(car.x,'TACKLED'); return;
      }
    } else {
      G.freeT=(G.freeT||0)+dt;
      if(G.freeT>0.7) G.carrier.hp=Math.min(100, G.carrier.hp + 7*dt);
    }
    // sideline: getting out stops the clock, which is the whole point
    if(G.carrier.y<=0 || G.carrier.y>=FH){          // over the white line
      burst(G.carrier.x,G.carrier.y,'#eef3e8');
      say('OUT OF BOUNDS',950);
      endPlay(G.carrier.x,'OUT OF BOUNDS'); return;
    }
    var goal=dir()>0?FW-EZ:EZ;
    if((dir()>0&&G.carrier.x>=goal)||(dir()<0&&G.carrier.x<=goal)){ score(); return; }
  }

  G.clock-=dt;
  if(G.clock<=0){ G.clock=0; gameOver(); }
}

// ================================================================ outcomes
function yardLineLabel(x){ var y=Math.round((x-EZ)/YD); return String(Math.max(1, y<=50?y:100-y)); }

function endPlay(atX,label){
  logPlay(atX,label,false);
  // an incompletion, a ball carrier out of bounds, or a score stops the clock;
  // a tackle in the field of play does not
  G.clockRunning = !(label==='OUT OF BOUNDS'||label==='INCOMPLETE'||
                     label==='BROKEN UP'||label==='DEAD BALL');
  G.phase='dead'; G.carrier=null; G.thrown=null; G.windup=null;
  if(G.newSeries){
    // possession changed hands during the play; spot it and reset the chains
    G.newSeries=false;
    G.los=Math.max(EZ+2,Math.min(FW-EZ-2,atX));
    G.down=1; G.toGo=10;
    say('TURNOVER — '+(G.offense==='H'?'YOUR BALL':'THEIR BALL'),1300);
    setTimeout(function(){ if(!G.over) G.phase='playcall'; },1350);
    return;
  }
  var gained=(atX-G.los)*dir()/YD;
  G.los=Math.max(EZ+2,Math.min(FW-EZ-2,atX));
  G.toGo-=gained;
  var txt=label;
  if(G.toGo<=0){ G.down=1; G.toGo=10; txt='FIRST DOWN'; G.stats[G.offense].fd++; }
  else { G.down+=1; if(G.down>4){ turnover(); txt='TURNOVER ON DOWNS'; } }
  say(txt,1100);
  setTimeout(function(){ if(!G.over) G.phase='playcall'; },1750);
}
function turnover(){ G.offense=G.offense==='H'?'A':'H'; G.down=1; G.toGo=10; }
function score(){
  logPlay(G.ball?G.ball.x:G.los, 'TOUCHDOWN', true);
  if(G.offense==='H') G.scoreH+=7; else G.scoreA+=7;
  G.scoringTeam=G.offense;
  credit(G.carrier,'TOUCHDOWN');
  if(G.carrier) G.carrier.cel=1.4;
  burst(G.ball.x,G.ball.y,'#ffd23f'); burst(G.ball.x,G.ball.y,'#ffffff');
  say('TOUCHDOWN!',2600); G.shake=REDUCED?0:18; G.clockRunning=false;
  for(var cf=0;cf<44;cf++) confetti(G.ball.x, G.ball.y);
  G.celebrate=2.6; G.celAt={x:G.ball.x,y:G.ball.y};
  G.phase='dead'; G.carrier=null; G.thrown=null; G.windup=null;
  G.newSeries=false;
  turnover();
  G.los = G.offense==='H' ? EZ+25*YD : FW-EZ-25*YD;
  G.clockRunning=false;
  setTimeout(function(){ if(!G.over) G.phase='playcall'; },2700);
}
function gameOver(){ G.over=true; G.phase='over'; showOver(); }

var callTimer=null;
function say(text,ms){
  elCall.textContent=text; elCall.style.transition=''; elCall.style.opacity='1';
  if(callTimer) clearTimeout(callTimer);
  callTimer=setTimeout(function(){
    elCall.style.transition='opacity .3s'; elCall.style.opacity='0';
  },ms||700);
}

// ================================================================ render
function resize(){
  dpr=Math.min(2,window.devicePixelRatio||1);
  VW=stage.clientWidth; VH=stage.clientHeight;
  cv.width=Math.round(VW*dpr); cv.height=Math.round(VH*dpr);
  if(!scale||scale<=0) scale=VH/(VIEW_YDS*YD);
}
window.addEventListener('resize',resize);


// ---- the static field, baked once -----------------------------------------
var fieldCanvas = (function(){
  var c=document.createElement('canvas');
  c.width=FW; c.height=FH;
  var g=c.getContext('2d');

  for(var s=0;s<FW;s+=5*YD){
    g.fillStyle=((s/(5*YD))%2===0)?'#1d4630':'#204d34';
    g.fillRect(s,0,5*YD,FH);
  }
  g.fillStyle='#153222'; g.fillRect(0,0,EZ,FH); g.fillRect(FW-EZ,0,EZ,FH);

  for(var y=0;y<=100;y+=5){
    var x=EZ+y*YD;
    g.strokeStyle = (y===50) ? 'rgba(238,243,232,.85)'
                  : (y%10===0) ? 'rgba(238,243,232,.62)'
                  : 'rgba(238,243,232,.26)';
    g.lineWidth=(y===50)?2.4:1.4;
    g.beginPath(); g.moveTo(x,0); g.lineTo(x,FH); g.stroke();
  }

  // hash marks: one path for all of them instead of 200 strokes
  g.strokeStyle='rgba(238,243,232,.3)'; g.lineWidth=1;
  g.beginPath();
  for(var h=0;h<=100;h++){
    var hx=EZ+h*YD;
    g.moveTo(hx,FH*0.36-3); g.lineTo(hx,FH*0.36+3);
    g.moveTo(hx,FH*0.64-3); g.lineTo(hx,FH*0.64+3);
  }
  g.stroke();

  g.strokeStyle='rgba(238,243,232,.55)'; g.lineWidth=2.5;
  g.strokeRect(0,0,FW,FH);

  var NUMY1=9*YD, NUMY2=FH-9*YD;
  g.textAlign='center'; g.textBaseline='middle';
  g.font='700 30px "Barlow Condensed", sans-serif';
  for(var y2=10;y2<=90;y2+=10){
    var nx=EZ+y2*YD, lb=(y2<=50?y2:100-y2);
    g.fillStyle='rgba(238,243,232,.30)';
    g.fillText(lb,nx,NUMY1); g.fillText(lb,nx,NUMY2);
    if(lb!==50){
      var toLeft=(y2<50);
      g.fillStyle='rgba(238,243,232,.26)';
      [NUMY1,NUMY2].forEach(function(ny){
        var ox=nx+(toLeft?-24:24);
        g.beginPath();
        g.moveTo(ox+(toLeft?-5:5), ny);
        g.lineTo(ox+(toLeft?2:-2), ny-6);
        g.lineTo(ox+(toLeft?2:-2), ny+6);
        g.closePath(); g.fill();
      });
    }
  }

  g.font='700 34px "Anton", sans-serif';
  g.fillStyle='rgba(238,243,232,.16)';
  g.save(); g.translate(EZ/2,FH/2); g.rotate(-Math.PI/2); g.fillText('END ZONE',0,0); g.restore();
  g.save(); g.translate(FW-EZ/2,FH/2); g.rotate(Math.PI/2); g.fillText('END ZONE',0,0); g.restore();
  return c;
})();

function draw(){
  // Frame everyone who matters: zoom out when the play spreads, in when it
  // collapses, so no player is ever off screen.
  // Frame the action, not the whole formation. Fitting every player means a
  // deep safety alone can shrink everyone to specks, so the window is capped
  // and weighted toward the ball.
  var minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9,n=0;
  var bx=G.ball?G.ball.x:FW/2, by=G.ball?G.ball.y:FH/2;
  var passing = (G.phase==='live' && G.carrier && G.carrier.role==='QB' && !G.thrown);
  for(var q=0;q<G.players.length;q++){
    var pl=G.players[q];
    // While the passer has the ball, the men he can throw to must be on
    // screen or he cannot pick them, which is why long passes felt impossible.
    var reach = 30*YD;
    if(passing && pl.team===G.offense && pl!==G.carrier &&
       pl.role!=='C' && pl.role!=='OL' && pl.role!=='BL') reach = 40*YD;
    if(!isFinite(pl.x)||!isFinite(pl.y)) continue;
    if(Math.hypot(pl.x-bx,pl.y-by) > reach) continue;
    if(pl.x<minX)minX=pl.x; if(pl.x>maxX)maxX=pl.x;
    if(pl.y<minY)minY=pl.y; if(pl.y>maxY)maxY=pl.y; n++;
  }
  if(!n){ minX=maxX=bx; minY=maxY=by; n=1; }
  if(bx<minX)minX=bx; if(bx>maxX)maxX=bx;
  if(by<minY)minY=by; if(by>maxY)maxY=by;

  var padX=64, padTop=76, padBot=34;
  var needW=Math.min((maxX-minX)+padX*2, (passing?86:62)*YD);
  var needH=Math.min((maxY-minY)+padTop+padBot, (passing?46:40)*YD);
  var want=Math.min(VW/needW, VH/needH);
  if(!isFinite(want)) want=1;
  want=Math.max(passing?0.76:0.82, Math.min(1.5, want));
  scale += (want-scale)*0.06;

  // centre mostly on the ball so the play stays where your eye already is
  var cx=(minX+maxX)/2, cy=(minY+maxY)/2+(padTop-padBot)/2;
  var tx=bx*0.62+cx*0.38, ty=by*0.62+cy*0.38;
  var actCam = VIEW3D ? camDirect() : false;
  if(actCam){ tx=CAM3.ax; ty=CAM3.ay; }
  else if(VIEW3D){
    var cp=camPoints();
    if(cp.length){
      var x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
      for(var ci=0;ci<cp.length;ci++){
        x0=Math.min(x0,cp[ci][0]); x1=Math.max(x1,cp[ci][0]);
        y0=Math.min(y0,cp[ci][1]); y1=Math.max(y1,cp[ci][1]);
      }
      tx=(x0+x1)/2*0.6+bx*0.4; ty=(y0+y1)/2*0.6+by*0.4;
    }
  }
  if(!isFinite(tx)) tx=FW/2;
  if(!isFinite(ty)) ty=FH/2;
  var follow = actCam ? 0.2 : (VIEW3D ? 0.15 : 0.11);
  cam.x += (tx-cam.x)*follow; cam.y += (ty-cam.y)*follow;

  // the viewport itself can come back wrong after a resize
  if(!isFinite(VW)||!isFinite(VH)||VW<40||VH<40){ resize(); }
  if(!isFinite(scale)||scale<=0.05) scale=VH/(VIEW_YDS*YD);
  scale=Math.max(0.45,Math.min(2.4,scale));
  if(!isFinite(cam.x)) cam.x=FW/2;
  if(!isFinite(cam.y)) cam.y=FH/2;

  var halfW=VW/scale/2, halfH=VH/scale/2;
  if(VIEW3D){
    // The 3D camera frames the play itself (camFit). The flat view's limits
    // pinned it near midfield, so a return toward either end zone ran off
    // the screen while the camera zoomed out after it.
    cam.x=Math.max(0,Math.min(FW,cam.x)); cam.y=Math.max(0,Math.min(FH,cam.y));
  } else {
    cam.x = (FW>halfW*2) ? Math.max(halfW,Math.min(FW-halfW,cam.x)) : FW/2;
    cam.y = (FH>halfH*2) ? Math.max(halfH,Math.min(FH-halfH,cam.y)) : FH/2;
  }

  var sx=0,sy=0;
  if(G.shake>0.3){ sx=(Math.random()-0.5)*G.shake; sy=(Math.random()-0.5)*G.shake; G.shake*=0.86; }

  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#0c1114'; ctx.fillRect(0,0,VW,VH);
  if(!MAIN3) MAIN3=ctx;
  ctx=MAIN3;                         // never left pointing at the ground canvas
  var P3 = VIEW3D ? setupProj(sx,sy) : null, realCtx3=ctx;
  if(P3){
    if(!W3) W3=makeW3();
    ctx=W3.g; ctx.setTransform(1,0,0,1,0,0); ctx.drawImage(W3.base,0,0);
    ctx.save(); ctx.translate(W3.M, W3.MT);
  } else {
    ctx.save();
    ctx.translate(VW/2+sx,VH/2+sy); ctx.scale(scale,scale); ctx.translate(-cam.x,-cam.y);
  }

  // The turf never changes, so it is painted once into an offscreen canvas
  // and blitted. Re-stroking 200-odd hash marks every frame was costing more
  // than everything else in the renderer put together.
  ctx.drawImage(fieldCanvas, 0, 0);

  var fd=G.los+G.toGo*YD*dir();
  ctx.lineWidth=2.5; ctx.strokeStyle='#3aa0ff';
  ctx.beginPath(); ctx.moveTo(G.los,0); ctx.lineTo(G.los,FH); ctx.stroke();
  if(fd>EZ&&fd<FW-EZ){ ctx.strokeStyle='#ffd23f';
    ctx.beginPath(); ctx.moveTo(fd,0); ctx.lineTo(fd,FH); ctx.stroke(); }

  // pass targeting reticle
  if((G.phase==='live'||G.phase==='presnap')&&G.mouse.on&&G.carrier&&G.carrier.role==='QB'&&iHaveBall()&&!G.thrown&&!pastTheLine(G.carrier)){
    var tgt=pickTarget(G.mouse.x,G.mouse.y);
    if(tgt && Math.hypot(tgt.x-G.carrier.x,tgt.y-G.carrier.y) < 46*YD){
      var lk=(tgt===G.lockMan)?Math.min(1,G.lockT/1.05):0;
      var col=lk>0.92 ? '79,209,139' : (lk>0.45 ? '255,210,63' : '224,140,63');
      ctx.strokeStyle='rgba('+col+',.85)'; ctx.lineWidth=2.1; ctx.setLineDash([6,5]);
      ctx.beginPath(); ctx.moveTo(G.carrier.x,G.carrier.y); ctx.lineTo(tgt.x,tgt.y); ctx.stroke();
      ctx.setLineDash([]);
      // the ring closes in as the lock builds
      var rw=17+(1-lk)*15;
      ctx.lineWidth=1.6+lk*2.0;
      ctx.strokeStyle='rgba('+col+',.95)';
      ctx.beginPath(); ctx.ellipse(tgt.x,tgt.y,rw,rw*0.41,0,0,Math.PI*2); ctx.stroke();
      if(lk>0.92){
        ctx.beginPath(); ctx.ellipse(tgt.x,tgt.y,rw+5,(rw+5)*0.41,0,0,Math.PI*2); ctx.stroke();
      }
      ctx.fillStyle='rgba('+col+',.95)';
      ctx.font='700 8px "Barlow Condensed", sans-serif'; ctx.textAlign='center';
      ctx.fillText(lk>0.92?'LOCKED':'THROW', tgt.x, tgt.y-24);
    }
  }

  // the tackle you are winding up, drawn while you hold the button
  if(G.drag && G.phase==='live' && G.mouse && G.mouse.on){
    var me0=G.controlled;
    if(me0){
      var ddx=G.mouse.x-G.drag.x, ddy=G.mouse.y-G.drag.y;
      var dm=Math.hypot(ddx,ddy);
      if(dm>8){
        var un=Math.min(1,dm/70);
        ctx.strokeStyle='rgba(255,255,255,'+(0.35+un*0.5).toFixed(2)+')';
        ctx.lineWidth=1.4+un*1.8; ctx.setLineDash([5,4]);
        ctx.beginPath(); ctx.moveTo(me0.x,me0.y-12);
        ctx.lineTo(me0.x+ddx/dm*(18+un*30), me0.y-12+ddy/dm*(18+un*30));
        ctx.stroke(); ctx.setLineDash([]);
      }
    }
  }

  if(P3){ ctx.restore(); ctx=realCtx3; blit3D(P3); ctx.save(); }

  // depth sort so players nearer the bottom overlap the ones behind them
  var order=G.players.slice().sort(function(a,b){ return a.y-b.y; });
  for(var i=0;i<order.length;i++){
    if(P3) at3D(P3,order[i].x,order[i].y);
    drawGuy(order[i]);
  }

  for(var f=0;f<G.fx.length;f++){
    var e=G.fx[f], k2=Math.max(0,e.life/e.max);
    // one bad number in a particle used to take the whole frame down with it
    if(!isFinite(e.x)||!isFinite(e.y)||!isFinite(k2)) continue;
    if(e.r!==undefined && !isFinite(e.r)) continue;
    if(e.x2!==undefined && (!isFinite(e.x2)||!isFinite(e.y2))) continue;
    if(P3) at3D(P3,e.x,e.y);
    ctx.globalAlpha=k2;
    if(e.ringed){
      ctx.strokeStyle=e.c; ctx.lineWidth=2.4*k2;
      ctx.beginPath(); ctx.ellipse(e.x,e.y,e.r,e.r*0.42,0,0,Math.PI*2); ctx.stroke();
    } else if(e.shock){
      var ggg=1-k2, rr2=e.r0+(e.r1-e.r0)*ggg;
      if(!addSprite(fxTint(FXI.shock,solidOf(e.c)),e.x,e.y,rr2*2.2,rr2*2.2,k2,e.rot,0.40)){
        ctx.strokeStyle=e.c; ctx.lineWidth=0.8+3.6*k2;
        ctx.beginPath(); ctx.ellipse(e.x,e.y,rr2,rr2*0.40,0,0,Math.PI*2); ctx.stroke();
      }
    } else if(e.dome){
      var dr=e.r*(0.5+(1-k2)*0.6);
      addSprite(fxTint(FXI.dome,solidOf(e.c)),e.x,e.y-dr*0.28,dr*2,dr*2,k2*0.9,0,0.8);
    } else if(e.bolt){
      var bl=Math.hypot(e.x2-e.x,e.y2-e.y), ba=Math.atan2(e.y2-e.y,e.x2-e.x);
      addSprite(fxTint(FXI.bolt,solidOf(e.c)),(e.x+e.x2)/2,(e.y+e.y2)/2,
                bl,bl*0.5*(128/256),k2,ba,1);
    } else if(e.flash){
      var fr=e.r*(0.45+(1-k2)*1.5);
      if(!addSprite(fxTint(FXI.impact,solidOf(e.c)),e.x,e.y,fr*2.6,fr*2.6,k2,e.rot,1)){
        var gr=ctx.createRadialGradient(e.x,e.y,0,e.x,e.y,fr);
        gr.addColorStop(0,e.c); gr.addColorStop(1,'rgba(255,255,255,0)');
        ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(e.x,e.y,fr,0,Math.PI*2); ctx.fill();
      }
    } else if(e.streak){
      var sl=Math.hypot(e.x2-e.x,e.y2-e.y), sa=Math.atan2(e.y2-e.y,e.x2-e.x);
      if(!addSprite(fxTint(FXI.streak,solidOf(e.c)),(e.x+e.x2)/2,(e.y+e.y2)/2,
                    sl,Math.max(3,e.w*3.2),k2,sa,1)){
        ctx.strokeStyle=e.c; ctx.lineWidth=e.w; ctx.lineCap='round';
        ctx.beginPath(); ctx.moveTo(e.x,e.y); ctx.lineTo(e.x2,e.y2); ctx.stroke();
      }
    } else if(e.puff){
      if(FXI.dust && FXI.dust.ready){
        ctx.save(); ctx.globalAlpha=k2*0.85;
        ctx.translate(e.x,e.y); ctx.rotate(e.rot);
        ctx.drawImage(FXI.dust,-e.r,-e.r,e.r*2,e.r*2);
        ctx.restore();
      } else {
        ctx.fillStyle=e.c; ctx.beginPath();
        ctx.arc(e.x,e.y,e.r*0.3,0,Math.PI*2); ctx.fill();
      }
    } else if(e.gh){
      ctx.globalAlpha=k2*0.40; ctx.fillStyle=e.c;
      ctx.beginPath(); ctx.ellipse(e.x,e.y-15,5.2,11,0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(e.x+e.face*0.8,e.y-28,4.3,0,Math.PI*2); ctx.fill();
    } else {
      ctx.fillStyle=e.c;
      ctx.beginPath(); ctx.arc(e.x,e.y,(e.r||2.6)*(0.4+k2*0.8),0,Math.PI*2); ctx.fill();
    }
  }
  ctx.globalAlpha=1;

  if(P3 && G.ball) at3D(P3,G.ball.x,G.ball.y);
  if(G.kick) drawKick();
  else if(G.thrown||(G.ball&&!G.ball.held)) drawBall();
  ctx.restore();
  if(P3){
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.fillStyle='rgba(8,12,16,.7)'; ctx.fillRect(VW/2-110,VH-30,220,22);
    ctx.fillStyle='#ffd23f'; ctx.font='700 12px "Barlow Condensed", sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('3D VIEW DEMO  ·  PRESS V FOR FLAT', VW/2, VH-19);
  }
}

// Flat-vector limb: solid colour with a darker plane down one side.
function limb(x0,y0,a1,l1,a2,l2,w1,w2,c1,c2){
  var kx=x0+Math.sin(a1)*l1, ky=y0+Math.cos(a1)*l1;
  var hx=kx+Math.sin(a2)*l2, hy=ky+Math.cos(a2)*l2;
  ctx.lineCap='round';
  ctx.strokeStyle=c1; ctx.lineWidth=w1;
  ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(kx,ky); ctx.stroke();
  ctx.strokeStyle=c2; ctx.lineWidth=w2;
  ctx.beginPath(); ctx.moveTo(kx,ky); ctx.lineTo(hx,hy); ctx.stroke();
  // shading plane on the trailing edge
  ctx.globalAlpha=0.22; ctx.strokeStyle='#000';
  ctx.lineWidth=w1*0.38; ctx.beginPath();
  ctx.moveTo(x0-w1*0.3,y0); ctx.lineTo(kx-w1*0.3,ky); ctx.stroke();
  ctx.lineWidth=w2*0.38; ctx.beginPath();
  ctx.moveTo(kx-w2*0.3,ky); ctx.lineTo(hx-w2*0.3,hy); ctx.stroke();
  ctx.globalAlpha=1;
  return {x:hx,y:hy};
}
function ink(){}   // flat-vector style carries no outline

// ================================================================ sprites
// Seven body parts, drawn once, rigged onto the same skeleton the vector
// version uses. Heroes wear the art as-is; Rivals get the navy recoloured.
var PART_FILES = {
  helmet:'parts/football-helmet.png', torso:'parts/football-torso.png',
  uarm:'parts/football-upper-arm.png', farm:'parts/football-forearm.png',
  thigh:'parts/football-thigh.png', shin:'parts/football-lower-leg.png',
  cleat:'parts/football-cleat.png',
  torsoOL:'parts/football-torso-lineman.png',      // heavier build for the line
  helmetAlt:'parts/football-helmet-alt.png',       // second lid, for variety
  farmHand:'parts/football-forearm-hand.png'       // open glove, for the reach
};
var SPR = { ready:false, H:{}, A:{}, pending:0 };

// The ball. Lace-free on purpose: a spiral is rotation about the long axis,
// so the laces sweep across the face rather than orbiting with the sprite,
// and they are drawn on top per frame.
var BALL_IMG = new Image(); BALL_IMG.ready=false;
BALL_IMG.onload = function(){ BALL_IMG.ready=true; };
BALL_IMG.src = 'parts/football-body.png';

// recolour the navy kit to crimson for the away side, leaving skin and white alone
function tintAway(img){
  var c=document.createElement('canvas'); c.width=img.width; c.height=img.height;
  var x=c.getContext('2d'); x.drawImage(img,0,0);
  try{
    var d=x.getImageData(0,0,c.width,c.height), a=d.data;
    for(var i=0;i<a.length;i+=4){
      if(a[i+3]<8) continue;
      var r=a[i],g=a[i+1],b=a[i+2];
      // navy = blue clearly dominant and not too bright
      if(b>r+24 && b>g+14 && b<210){
        var lum=(r*0.3+g*0.59+b*0.11)/255;
        a[i]=Math.min(255, 40+lum*215);
        a[i+1]=Math.round(18+lum*40);
        a[i+2]=Math.round(24+lum*46);
      }
    }
    x.putImageData(d,0,0);
  }catch(e){ /* tainted canvas: fall back to the untinted art */ }
  return c;
}

(function loadParts(){
  var keys=Object.keys(PART_FILES);
  SPR.pending=keys.length;
  keys.forEach(function(k){
    var im=new Image();
    im.onload=function(){
      SPR.H[k]=im; SPR.A[k]=tintAway(im);
      if(--SPR.pending===0) SPR.ready=true;
    };
    im.onerror=function(){ SPR.pending--; };   // stay on the vector fallback
    im.src=PART_FILES[k];
  });
})();

// A padded thigh in the team's pants, drawn rather than stretched from art.
// Swap back to boneV(S.thigh,...) the moment football-thigh.png is real.
function thighBone(x,y,a,len,wid,pants,stripe){
  ctx.save(); ctx.translate(x,y); ctx.rotate(-a);
  var w=wid*1.06;
  ctx.fillStyle=pants;
  roundRect(-w/2, 0, w, len, w*0.42); ctx.fill();
  ctx.fillStyle='rgba(0,0,0,.13)';                 // shaded back edge
  roundRect(w*0.12, 0, w*0.38, len, w*0.2); ctx.fill();
  ctx.fillStyle=stripe;                            // seam stripe
  ctx.fillRect(-w*0.46, len*0.10, w*0.17, len*0.82);
  ctx.restore();
  return {x:x+Math.sin(a)*len, y:y+Math.cos(a)*len};
}

// draw a part whose artwork runs top-to-bottom, pivoting at (x,y)
function boneV(img,x,y,a,len,wid){
  ctx.save(); ctx.translate(x,y); ctx.rotate(-a);
  ctx.drawImage(img,-wid/2,0,wid,len); ctx.restore();
  return {x:x+Math.sin(a)*len, y:y+Math.cos(a)*len};
}
// draw a part whose artwork runs left-to-right, pivoting at (x,y)
function boneH(img,x,y,a,len,thk){
  ctx.save(); ctx.translate(x,y); ctx.rotate(Math.PI/2-a);
  ctx.drawImage(img,0,-thk/2,len,thk); ctx.restore();
  return {x:x+Math.sin(a)*len, y:y+Math.cos(a)*len};
}

function drawSprite(p){
  var S = p.team==='H' ? SPR.H : SPR.A;
  var TORSO  = (p.role==='OL'||p.role==='C'||p.role==='BL') && S.torsoOL ? S.torsoOL : S.torso;
  var PANTS  = p.team==='H' ? '#f1f1ec' : '#e8e8e2';
  var STRIPE = p.team==='H' ? '#1f2d54' : '#8c1a24';
  var HELMET = (S.helmetAlt && (p.num%2===1)) ? S.helmetAlt : S.helmet;
  // Torso carries the figure; the helmet must read smaller than the shoulders.
  var HIP=-16, SHO=-28.5;
  var TH=9.6, WTH=5.6, SHN=7.6, WSHN=3.2, CL=4.5, HCL=2.2;
  var UA=7, HUA=4.16, FA=6.5, HFA=3.5;         // thicker arms for the padded sleeve and glove art
  var sp=Math.hypot(p.vx,p.vy), moving=sp>8 && p.down<=0 && p.stun<=0, ph=p.run;
  var gait=Math.min(1.25, 0.55+sp/150);       // stride opens up with speed

  // A running leg is not a pendulum: the knee tucks hard through the forward
  // recovery and straightens again just before the foot plants.
  function leg(phase){
    var thigh=Math.sin(phase)*0.95*gait;
    var tuck=Math.max(0,Math.cos(phase-0.3));     // swinging through: fold the knee
    return {t:thigh, s:thigh-0.20-tuck*1.7};
  }
  var LF,LB,bob,AF,AB,EF=0.45,EB=0.45, KD=p._pose;
  if(KD){
    // knocked down, or getting back up: see knockPose
    LF={t:KD.lt, s:KD.ls};
    LB={t:KD.bt, s:KD.bs};
    bob=0; AF=KD.af; AB=KD.ab; EF=KD.ef; EB=KD.eb;
  } else if(moving){
    LF=leg(ph); LB=leg(ph+Math.PI);
    bob=-Math.abs(Math.sin(ph))*2.2;                 // rises twice per stride
    var armSwing=1.05*gait;
    EF=1.2; EB=1.2;                                   // elbows at ninety, pumping
    AF=-Math.sin(ph)*armSwing; AB=-Math.sin(ph+Math.PI)*armSwing;
  } else {
    // idle: weight shifting foot to foot, chest rising, hands never still.
    // Linemen in a stance settle; skill players bounce on their toes.
    var amp = (p.role==='C'||p.role==='OL') ? 0.45 : 1.0;
    var w=Math.sin(ph*1.7), w2=Math.sin(ph*1.7+2.1), br=Math.sin(ph*2.6);
    LF={t: 0.17+w*0.10*amp,  s: 0.03+w*0.07*amp};
    LB={t:-0.17+w2*0.10*amp, s:-0.31+w2*0.07*amp};
    bob = br*0.85*amp - 0.4;
    AF = -0.15+Math.sin(ph*1.7+0.9)*0.22*amp;
    AB =  0.15+Math.sin(ph*1.7+2.6)*0.22*amp;
  }

  ctx.translate(0,bob);

  // ---- back leg, then back arm
  ctx.globalAlpha=0.82;
  var kB=thighBone(-1.8,HIP,LB.t,TH,WTH,PANTS,STRIPE);
  var fB=boneV(S.shin,kB.x,kB.y,LB.s,SHN,WSHN);
  boneH(S.cleat,fB.x-1,fB.y-0.6,LB.s+1.25,CL,HCL);
  var elB=boneH(S.uarm,-3.6,SHO+1,AB,UA,HUA);
  boneH(S.farm,elB.x,elB.y,AB+EB,FA,HFA);   // elbow held near 90 degrees
  ctx.globalAlpha=1;

  // ---- torso: the widest thing on the figure
  ctx.drawImage(TORSO, TORSO===S.torso?-5.4:-6.3, SHO-3.5, TORSO===S.torso?10.8:12.6, 15);

  // the art has a 12 painted on it, so patch it out and stamp the real number
  ctx.fillStyle = p.team==='H' ? '#223058' : '#a8232f';
  roundRect(-0.2, SHO+3.2, 3.6, 5.6, 0.9); ctx.fill();
  ctx.save(); ctx.scale(p.face,1);
  ctx.fillStyle = p.team==='H' ? '#c8a63c' : '#f1f1ec';
  ctx.font='700 4.4px "JetBrains Mono", monospace';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(String(p.num), p.face*1.6, SHO+6);
  ctx.restore();

  // ---- front leg
  var kF=thighBone(1.8,HIP,LF.t,TH,WTH,PANTS,STRIPE);
  var fF=boneV(S.shin,kF.x,kF.y,LF.s,SHN,WSHN);
  boneH(S.cleat,fF.x-1,fF.y-0.6,LF.s+1.25,CL,HCL);

  // ---- helmet: must sit narrower than the shoulders, or it reads bobblehead
  ctx.drawImage(HELMET,-4.4,SHO-10.7,9.2,8.2);

  // ---- front arm: throw, stiff arm, or normal swing
  if(!KD && p.throwArm>0){
    var u=1-p.throwArm;               // 0 at the release, 1 by the follow-through
    // cock it back, then whip over the top. This ran backwards before.
    var ta = u<0.32 ? (-0.5 - u*4.4)
                    : (-1.91 + (u-0.32)*5.0);
    var elT=boneH(S.uarm,3.6,SHO+1,ta,UA,HUA);
    boneH(S.farm,elT.x,elT.y,ta+0.35,FA,HFA);
  } else if(!KD && p.arm>0){
    var k=p.arm/0.55;
    var elS=boneH(S.uarm,3.6,SHO+1,1.38*k,UA,HUA);
    boneH(S.farmHand||S.farm,elS.x,elS.y,1.52*k,FA+1.4,HFA+0.5);
  } else {
    var elF=boneH(S.uarm,3.6,SHO+1,AF,UA,HUA);
    boneH(S.farm,elF.x,elF.y,AF+EF,FA,HFA);
  }
