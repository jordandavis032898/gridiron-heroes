<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Arcade American football. Four downs, a three-minute clock, and signature moves.">
<meta name="theme-color" content="#0c1114">
<style>
  :root{ color-scheme: light; padding-top: env(safe-area-inset-top, 0px);
         padding-bottom: env(safe-area-inset-bottom, 0px); }
  html,body{height:100%;}
  body{margin:0; font:14px system-ui,-apple-system,sans-serif; background:#0c1114;}
  img{max-width:100%;}
  [hidden]{display:none!important;}
</style>
<title>Hail Mythery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@400;600;700&family=JetBrains+Mono:wght@700&display=swap">
<style>
  :root{
    color-scheme: dark;
    --chalk:#eef3e8; --gold:#ffd23f; --navy:#16233f; --red:#e0384e;
    --ground:#0c1114; --panel:#141c22; --panel-2:#1b262e;
    --line:#2b3a45; --text:#e8eef2; --muted:#8fa3b0;
  }
  html,body{height:100%;}
  body{
    margin:0; background:var(--ground); color:var(--text);
    font-family:'Barlow Condensed',system-ui,-apple-system,sans-serif;
    overflow:hidden; -webkit-user-select:none; user-select:none; touch-action:none;
  }
  #wrap{height:100%; display:flex; flex-direction:column;}

  #board{
    flex:0 0 auto; background:var(--panel); border-bottom:1px solid var(--line);
    display:flex; font-family:'Anton',Impact,sans-serif; letter-spacing:.02em;
  }
  .team{display:flex; align-items:center; gap:8px; padding:8px 12px; min-width:0;}
  .team .chip{width:12px; height:22px; border-radius:2px; flex:0 0 auto;}
  .team .nm{font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .team .sc{font-family:'JetBrains Mono',monospace; font-size:21px; font-variant-numeric:tabular-nums;}
  .home .chip{background:var(--gold);} .home .sc{color:var(--gold);}
  .away .chip{background:var(--red);}  .away .sc{color:var(--red);}
  #mid{
    flex:1 1 auto; display:flex; flex-direction:column; align-items:center;
    justify-content:center; padding:6px 8px; border-left:1px solid var(--line);
    border-right:1px solid var(--line); min-width:0;
  }
  #clock{font-family:'JetBrains Mono',monospace; font-size:20px; font-variant-numeric:tabular-nums; line-height:1;}
  #dd{font-weight:700; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-top:3px; white-space:nowrap;}
  #poss{font-size:11px; letter-spacing:.16em; text-transform:uppercase; font-weight:700; margin-top:2px;}
  #dbg{font-family:'JetBrains Mono',monospace; font-size:9px; color:#6d818f; margin-top:2px; min-height:11px;}

  #stage{flex:1 1 auto; position:relative; min-height:0;}
  canvas{display:block; width:100%; height:100%; cursor:crosshair;
    touch-action:none; -webkit-user-drag:none; user-select:none;}
  #stage{touch-action:none;}

  .overlay{position:absolute; inset:0; display:none; align-items:center; justify-content:center; padding:16px; z-index:5; overflow-y:auto;}
  /* the controls card: once on your first game, and from the pause menu */
  #ctrlCard{z-index:12; background:rgba(6,10,16,.74);}
  #ctrlCard .cc{width:100%; max-width:760px; margin:auto; padding:16px 18px 14px; border-radius:6px;
    background:linear-gradient(180deg,#1b2b4c 0%,#111d35 100%); border:1px solid rgba(255,210,63,.5);
    box-shadow:0 14px 44px rgba(0,0,0,.6);}
  #ctrlCard h2{font-family:'Anton',Impact,sans-serif; font-size:26px; margin:0; letter-spacing:.04em; color:var(--gold); line-height:1.05;}
  #ctrlCard .sub{font-size:12px; color:#9fb0cf; margin:2px 0 12px; letter-spacing:.08em; text-transform:uppercase; font-weight:600;}
  #ctrlCard .cols{display:grid; grid-template-columns:1fr 1fr; gap:10px 22px;}
  #ctrlCard h3{margin:0 0 4px; padding-bottom:4px; border-bottom:1px solid rgba(255,255,255,.14);
    font:700 12px 'Barlow Condensed',sans-serif; letter-spacing:.16em; color:#ffffff; text-transform:uppercase;}
  #ctrlCard .cr{display:flex; gap:10px; align-items:center; margin:7px 0;}
  #ctrlCard .ci{flex:0 0 36px; height:36px; border-radius:50%; border:2px solid var(--gold); background:rgba(255,210,63,.10);
    display:flex; align-items:center; justify-content:center;}
  #ctrlCard .ci svg{width:20px; height:20px; stroke:#ffd23f; fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round;}
  #ctrlCard .ci.k{flex:0 0 64px; border-radius:18px;}
  #ctrlCard .ci kbd{font-size:11px; padding:0; border:0; background:none; color:#ffd23f; white-space:nowrap; font-weight:700;}
  #ctrlCard .cr b{display:block; font:700 13px 'Barlow Condensed',sans-serif; letter-spacing:.08em; color:#ffffff; text-transform:uppercase;}
  #ctrlCard .cr span{display:block; font-size:12.5px; color:#c9d4e6; line-height:1.3;}
  #ctrlCard .go{display:block; width:100%; margin-top:12px; padding:10px 0; border:0; border-radius:4px; cursor:pointer;
    background:var(--gold); color:#111a2c; font-family:'Anton',Impact,sans-serif; font-size:18px; letter-spacing:.08em;}
  #ctrlCard .go:focus-visible{outline:2px solid #ffffff; outline-offset:2px;}
  html.touchui #ctrlCard{padding:4px 10px; align-items:flex-start;}
  html.touchui #ctrlCard .cc{padding:8px 14px 8px; max-width:720px;}
  html.touchui #ctrlCard h2{font-size:19px; display:inline-block; margin-right:10px;}
  html.touchui #ctrlCard .sub{display:inline-block; margin:0 0 4px; font-size:10px;}
  html.touchui #ctrlCard h3{font-size:11px; margin-bottom:1px; padding-bottom:2px;}
  html.touchui #ctrlCard .cr{margin:3px 0; gap:8px;}
  html.touchui #ctrlCard .ci{flex-basis:26px; height:26px; border-width:1.6px;}
  html.touchui #ctrlCard .ci svg{width:15px; height:15px;}
  html.touchui #ctrlCard .cr b{font-size:11.5px;}
  html.touchui #ctrlCard .cr span{font-size:10.5px; line-height:1.18;}
  html.touchui #ctrlCard .go{margin-top:6px; padding:6px 0; font-size:15px;}
  @media (max-width:520px){ #ctrlCard .cols{grid-template-columns:1fr;} }
  .overlay.show{display:flex;}
  .sheet{
    background:rgba(12,17,20,.95); border:1px solid var(--line); border-radius:4px;
    padding:18px 16px; max-width:640px; width:100%; box-shadow:0 18px 50px rgba(0,0,0,.6);
  }
  .sheet h2{font-family:'Anton',Impact,sans-serif; font-size:22px; margin:0 0 2px; letter-spacing:.03em; text-wrap:balance;}
  .sheet .sub{font-size:13px; color:var(--muted); margin:0 0 14px; letter-spacing:.06em; text-transform:uppercase; font-weight:600;}
  .grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .grid2{display:grid; grid-template-columns:repeat(2,1fr); gap:8px;}
  @media (max-width:480px){ .grid3,.grid2{grid-template-columns:1fr;} }
  .card{
    background:var(--panel-2); border:1px solid var(--line); border-radius:3px;
    padding:11px 10px; cursor:pointer; text-align:left; color:var(--text);
    font-family:inherit; transition:border-color .12s, background .12s;
  }
  .card:hover,.card:focus-visible{border-color:var(--gold); background:#22303a; outline:none;}
  .card .k{font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--gold); letter-spacing:.1em;}
  .card .t{font-family:'Anton',sans-serif; font-size:15px; margin:3px 0 1px; letter-spacing:.02em;}
  .card .pos{font-size:11px; color:var(--gold); letter-spacing:.12em; font-weight:700; text-transform:uppercase;}
  .card .d{font-size:12.5px; color:var(--muted); line-height:1.35; margin-top:4px;}
  .stats{display:flex; gap:7px; margin-top:6px;}
  .stat{flex:1;}
  .stat .sl{font-size:9px; letter-spacing:.12em; color:var(--muted); text-transform:uppercase;}
  .stat .sb{height:4px; background:rgba(0,0,0,.5); border-radius:2px; overflow:hidden; margin-top:2px;}
  .stat .sb i{display:block; height:100%; background:var(--gold);}

  #callout{
    position:absolute; left:50%; top:32%; transform:translate(-50%,-50%);
    font-family:'Anton',Impact,sans-serif; font-size:clamp(28px,7.5vw,60px);
    letter-spacing:.02em; color:var(--gold); text-shadow:0 4px 0 rgba(0,0,0,.6);
    pointer-events:none; opacity:0; z-index:4; white-space:nowrap; text-align:center;
  }

  #legend{
    flex:0 0 auto; background:var(--panel); border-top:1px solid var(--line);
    padding:7px 12px calc(7px + env(safe-area-inset-bottom,0px));
    display:flex; gap:13px; flex-wrap:wrap; justify-content:center;
    font-size:12px; color:var(--muted); letter-spacing:.04em;
  }
  #legend b{color:var(--text); font-weight:600;}
  kbd{font-family:'JetBrains Mono',monospace; font-size:10px; background:var(--panel-2); border:1px solid var(--line); border-radius:2px; padding:1px 4px; color:var(--chalk);}

  #meters{display:none !important;}
  #meters{position:absolute; left:10px; bottom:10px; z-index:3; width:140px; font-size:10px; letter-spacing:.13em; text-transform:uppercase; font-weight:700;}
  .meter{margin-bottom:5px;}
  .meter .lbl{color:rgba(238,243,232,.42); margin-bottom:2px; display:flex; justify-content:space-between;}
  .bar{height:6px; background:rgba(0,0,0,.55); border:1px solid var(--line); border-radius:2px; overflow:hidden;}
  .bar i{display:block; height:100%; width:100%; transition:width .09s linear;}
  #pw i{background:var(--gold);} #st i{background:#4fd18b;} #mv i{background:#48b8ff;}

  /* ---------- ability icons ---------- */
  #legend{
    flex:0 0 auto; background:var(--panel); border-top:1px solid var(--line);
    padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));
    display:flex; gap:10px; justify-content:center; align-items:flex-end;
  }
  .ab{
    width:50px; display:flex; flex-direction:column; align-items:center; gap:3px;
    background:none; border:0; padding:0; cursor:pointer; font-family:inherit;
    color:var(--muted); transition:color .12s, opacity .12s;
  }
  .ab .ring{
    width:42px; height:42px; border-radius:50%; display:grid; place-items:center;
    background:var(--panel-2); border:1.5px solid var(--line); position:relative;
    transition:border-color .12s, background .12s, transform .08s;
  }
  .ab svg{width:21px; height:21px; stroke:currentColor; fill:none;
    stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round;}
  .ab .cap{font-size:9.5px; letter-spacing:.09em; text-transform:uppercase; font-weight:700;}
  .ab .key{
    position:absolute; right:-3px; bottom:-3px; min-width:13px; height:13px; padding:0 2px;
    border-radius:3px; background:var(--panel); border:1px solid var(--line);
    font-family:'JetBrains Mono',monospace; font-size:8px; line-height:11px; color:var(--chalk);
  }
  .ab.on{color:var(--gold);} .ab.on .ring{border-color:var(--gold); background:#2a2517;}
  .ab.off{opacity:.34;}
  .ab:active .ring{transform:scale(.92);}

  /* ---------- play card ---------- */
  #card{
    position:absolute; left:50%; top:46%; z-index:7; width:250px;
    transform:translate(calc(-50% - 60vw),-50%) scale(.5); opacity:0; pointer-events:none;
    transition:transform .5s cubic-bezier(.2,1.15,.4,1), opacity .3s;
    background:linear-gradient(160deg,#1b262e,#101820);
    border:2px solid var(--gold); border-radius:6px; overflow:hidden;
    box-shadow:0 14px 40px rgba(0,0,0,.65);
  }
  #card.in{transform:translate(-50%,-50%) scale(1); opacity:1;}
  /* the star intro puts the card to the right so the spotlight stays on him */
  #card.intro{left:auto; right:7%; transform:translate(40%,-50%) scale(.6);}
  #card.intro.in{transform:translate(0,-50%) scale(1.12);}
  /* a touchdown: the card pops up beside the scorer while the camera is in on him */
  #card.side{top:50%; transform:translate(-50%,-50%) scale(.35) rotate(-10deg); opacity:0;}
  #card.side.sL{left:23%;} #card.side.sR{left:77%;}
  #card.side.in{transform:translate(-50%,-50%) scale(1) rotate(0); opacity:1;}
  html.touchui #card.side{top:58%;}
  html.touchui #card.side.in{transform:translate(-50%,-50%) scale(.62) rotate(0);}
  /* while the camera is in on a touchdown: the banner up out of his way, the controls out of the shot */
  #stage.tdcam #callout{top:11%; font-size:clamp(26px,6vw,50px);}
  #stage.tdcam #touch, #stage.tdcam #legend, #stage.tdcam #preBar, #stage.tdcam #skipBtn{visibility:hidden;}
  #spot{position:absolute; inset:0; z-index:5; pointer-events:none; opacity:0; transition:opacity .45s;}
  #kmeter{position:absolute; left:50%; bottom:22px; z-index:9; display:none; width:360px; transform:translateX(-50%);
    padding:10px 14px 12px; background:rgba(12,17,22,.92); border:2px solid var(--gold); border-radius:6px;
    box-shadow:0 12px 32px rgba(0,0,0,.6); pointer-events:none;}
  #kmeter.show{display:block;}
  #kmeter .kt{font-family:'Anton',sans-serif; color:var(--gold); letter-spacing:.06em; font-size:16px; margin-bottom:6px;}
  #kmeter .kt span{font-family:'Barlow Condensed',sans-serif; color:rgba(241,241,236,.75); font-size:12px; letter-spacing:.08em;}
  #kmeter .kl{font:700 11px 'Barlow Condensed',sans-serif; letter-spacing:.12em; color:rgba(241,241,236,.7); margin:4px 0 3px;}
  #kmeter .kbar{position:relative; height:16px; border-radius:3px; background:#1b262e; overflow:hidden; border:1px solid rgba(238,243,232,.15);}
  #kmeter .zone{position:absolute; top:0; bottom:0; background:rgba(79,209,139,.35); border-left:2px solid #4fd18b; border-right:2px solid #4fd18b;}
  #kmeter .nd{position:absolute; top:-2px; bottom:-2px; width:4px; margin-left:-2px; background:#ffd23f; box-shadow:0 0 8px #ffd23f;}
  #kmeter .fill{position:absolute; left:0; top:0; bottom:0; background:linear-gradient(90deg,#4fd18b,#ffd23f,#e0384e);}
  #kmeter .req{position:absolute; top:-2px; bottom:-2px; width:3px; margin-left:-1px; background:#fff; z-index:2; display:none;}
  #coin{position:absolute; left:50%; top:45%; z-index:9; display:none; transform:translate(-50%,-50%);
    width:320px; padding:18px; text-align:center; background:rgba(12,17,22,.94); border:2px solid var(--gold); border-radius:8px;
    box-shadow:0 18px 50px rgba(0,0,0,.65);}
  #coin.show{display:block;}
  #coin .ch{font-family:'Anton',sans-serif; color:var(--gold); font-size:24px; letter-spacing:.06em;}
  #coin .cs{font:600 13px 'Barlow Condensed',sans-serif; color:rgba(241,241,236,.75); margin-bottom:10px;}
  #coin .cc{width:84px; height:84px; margin:6px auto 12px; border-radius:50%; background:radial-gradient(circle at 35% 30%,#ffe98a,#c8a63c 60%,#8a6d1f);
    border:3px solid #6e5616; display:flex; align-items:center; justify-content:center; box-shadow:0 8px 20px rgba(0,0,0,.5);}
  #coin .face{font-family:'Anton',sans-serif; font-size:30px; color:#5a4612;}
  #coin .cc.flipH{animation:coinH 1.4s cubic-bezier(.3,.6,.4,1) forwards;}
  #coin .cc.flipT{animation:coinT 1.4s cubic-bezier(.3,.6,.4,1) forwards;}
  @keyframes coinH{0%{transform:translateY(0) rotateX(0)} 50%{transform:translateY(-70px) rotateX(1080deg)} 100%{transform:translateY(0) rotateX(2160deg)}}
  @keyframes coinT{0%{transform:translateY(0) rotateX(0)} 50%{transform:translateY(-70px) rotateX(1170deg)} 100%{transform:translateY(0) rotateX(2340deg)}}
  #coin .cb{display:flex; gap:10px; justify-content:center;}
  #coin .cb button{background:#1b262e; color:var(--text); border:1px solid rgba(238,243,232,.2); border-radius:4px;
    font-family:'Anton',sans-serif; font-size:15px; padding:9px 16px; cursor:pointer; letter-spacing:.04em;}
  #coin .cb button b{color:var(--gold); margin-right:6px;}
  #coin .cb button:hover{background:#26343f;}
  #coin .cr{font-family:'Anton',sans-serif; color:#f1f1ec; font-size:16px; letter-spacing:.04em; min-height:22px; margin-top:6px;}
  #skipBtn{position:absolute; right:18px; bottom:18px; z-index:9; background:rgba(12,17,22,.85); color:var(--gold);
    border:1px solid var(--gold); border-radius:4px; font-family:'Anton',sans-serif; font-size:13px; letter-spacing:.06em;
    padding:7px 12px; cursor:pointer;}
  #audible{position:absolute; left:50%; bottom:18px; z-index:9; display:none; transform:translateX(-50%);
    gap:6px; padding:8px; background:rgba(12,17,22,.92); border:2px solid var(--gold); border-radius:6px;
    box-shadow:0 12px 32px rgba(0,0,0,.6); align-items:center;}
  #audible.show{display:flex;}
  #audible .ah{font-family:'Anton',sans-serif; color:var(--gold); letter-spacing:.06em; padding:0 6px; font-size:15px;}
  #audible button{background:#1b262e; color:var(--text); border:1px solid rgba(238,243,232,.18); border-radius:4px;
    font-family:'Anton',sans-serif; font-size:13px; padding:7px 10px; cursor:pointer; letter-spacing:.03em;}
  #audible button b{color:var(--gold); margin-right:6px;}
  #audible button.cur{border-color:var(--gold);}
  #audible button:hover{background:#26343f;}
  .card canvas.pd{display:block; width:100%; height:auto; margin:6px 0 5px; border-radius:4px;
    border:1px solid rgba(238,243,232,.12);}
  #superBan{position:absolute; top:12px; left:0; z-index:8; pointer-events:none; opacity:0;
    padding:7px 30px 7px 18px; font-family:'Anton',sans-serif; font-size:24px; letter-spacing:.05em;
    color:#14181c; background:linear-gradient(90deg,#ffd23f,#ffb000);
    clip-path:polygon(0 0,100% 0,90% 100%,0 100%); box-shadow:0 6px 18px rgba(0,0,0,.5);}
  #superBan.away{left:auto; right:0; color:#fff; padding:7px 18px 7px 30px;
    background:linear-gradient(270deg,#e0384e,#9c1a2c); clip-path:polygon(10% 0,100% 0,100% 100%,0 100%);}
  #superBan.go.home{animation:superInL 1.25s cubic-bezier(.2,1,.3,1) forwards;}
  #superBan.go.away{animation:superInR 1.25s cubic-bezier(.2,1,.3,1) forwards;}
  @keyframes superInL{0%{transform:translateX(-110%);opacity:1} 14%{transform:translateX(0)} 78%{transform:translateX(0);opacity:1} 100%{transform:translateX(-110%);opacity:0}}
  @keyframes superInR{0%{transform:translateX(110%);opacity:1} 14%{transform:translateX(0)} 78%{transform:translateX(0);opacity:1} 100%{transform:translateX(110%);opacity:0}}
  /* the card: a metal frame (gold five stars, silver four, bronze three),
     the name across the top, the move in a black bar, the picture, and
     what he just did along the bottom */
  #card{width:272px; padding:7px; border:3px solid #1a1206; border-radius:10px;
    background:linear-gradient(135deg,#fff3b8 0%,#e7bd4a 30%,#b8871d 62%,#f3d27a 100%);}
  #card.silver{background:linear-gradient(135deg,#ffffff 0%,#cfd5dd 32%,#8f98a6 64%,#e6eaf0 100%);}
  #card.bronze{background:linear-gradient(135deg,#ffd9b0 0%,#c98542 34%,#8a4f1c 66%,#dca36a 100%);}
  #card .pcTop{display:flex; align-items:center; gap:8px; padding:1px 2px 6px;
    font-family:'Anton',sans-serif; letter-spacing:.03em;}
  #card .pcPos{font-size:19px; color:#1f6fff; text-shadow:0 1px 0 rgba(255,255,255,.6);}
  #card.away .pcPos{color:#d8203a;}
  #card .pcName{font-size:17px; color:#14100a; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1;}
  #card .pcBadge{flex:none; height:30px; padding:0 10px; border-radius:15px; background:#15120c; color:#ffd23f;
    border:2px solid rgba(255,255,255,.55); display:flex; align-items:center; justify-content:center;
    font-size:14px; line-height:14px; letter-spacing:1px; white-space:nowrap; box-sizing:border-box;}
  #card .pcSig{background:#0c0c0c; color:#fff; font-family:'Anton',sans-serif; font-size:16px;
    letter-spacing:.02em; padding:4px 8px; border-radius:3px 3px 0 0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  #card canvas{display:block; width:100%; height:auto; background:#10151c; border-left:3px solid #0c0c0c; border-right:3px solid #0c0c0c; box-sizing:border-box;}
  #card .pcFoot{display:flex; align-items:center; background:#0c0c0c; padding:5px 8px; border-radius:0 0 3px 3px;}
  #card .pcAct{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:15px; color:#f1f1ec; letter-spacing:.02em;}
  #card.away .pcAct{color:#ffb3bd;}
  #card.away .pcSig, #card.away .pcFoot{background:#3a0c12;}
  #card.away canvas{border-color:#3a0c12;}
  #card .pcNum{margin-left:auto; font-family:'Anton',sans-serif; font-size:14px; color:#ffd23f;}
  #card.gold{animation:cardSpark 1.1s ease-in-out infinite;}
  @keyframes cardSpark{
    0%,100%{box-shadow:0 0 6px 1px rgba(255,210,63,.55), 0 14px 40px rgba(0,0,0,.65);}
    50%{box-shadow:0 0 22px 5px rgba(255,210,63,.95), 0 14px 40px rgba(0,0,0,.65);}
  }

  #touch{position:absolute; inset:0; z-index:6; display:none; pointer-events:none;}
  #touch.on{display:block;}
  #stick{position:absolute; left:16px; bottom:16px; width:118px; height:118px; border-radius:50%; background:rgba(20,28,34,.5); border:1px solid var(--line); pointer-events:auto;}
  #nub{position:absolute; left:50%; top:50%; width:46px; height:46px; margin:-23px 0 0 -23px; border-radius:50%; background:rgba(255,210,63,.8);}

// Where a spot on the field is drawn, in canvas pixels, and how big a man
// stands there. The 3D demo swaps in its own projection.
function worldToScreen(wx,wy){
  return {x:(wx-cam.x)*scale+VW/2, y:(wy-cam.y)*scale+VH/2, s:scale};
}
// The receiver under the cursor, judged by where his body is drawn rather
// than where the click meets the turf. In 3D a click on a man's chest lands
// yards behind his feet, which picked the wrong man or nobody at all.
var EDGE_M=30, EDGE_LEG=null;          // where the move buttons sit, in canvas pixels (phones)
function edgeSpot(q){
  var p=worldToScreen(q.x,q.y), by=p.y-18*p.s;
  var bot = VH - EDGE_M;
  if(TOUCH_UI && EDGE_LEG && p.x > EDGE_LEG.l-18 && p.x < EDGE_LEG.r+18) bot = EDGE_LEG.t-8;   // behind the move buttons counts as off
  if(p.x>=EDGE_M && p.x<=VW-EDGE_M && by>=EDGE_M && by<=bot) return null;
  return {x:Math.max(EDGE_M,Math.min(VW-EDGE_M,p.x)), y:Math.max(EDGE_M,Math.min(bot,by))};
}
function pickOnScreen(cx,cy){
  if(!G || !G.carrier || cx===undefined) return null;
  var r=cv.getBoundingClientRect(), sx=cx-r.left, sy=cy-r.top, best=null, bd=1e9;
  for(var i=0;i<G.players.length;i++){
    var q=G.players[i];
    if(q.team!==G.offense || q===G.carrier) continue;
    if(q.role==='C'||q.role==='OL'||q.role==='BL') continue;
    var p=worldToScreen(q.x,q.y), by=p.y-18*p.s;       // middle of his body
    if(TOUCH_UI){ var es=edgeSpot(q); if(es){ p={x:es.x, y:es.y+18*p.s, s:p.s}; by=es.y; } }
    var d=Math.hypot(p.x-sx, by-sy), reach=Math.max(30, 24*p.s);
    if(d<reach && d<bd){ bd=d; best=q; }
  }
  return best;
}
function aimTarget(){
  return pickOnScreen(G.mouse.cx,G.mouse.cy) || pickTarget(G.mouse.x,G.mouse.y);
}

stage.addEventListener('pointermove',function(e){

  if(G && G.phase==='live'){
    var r0=cv.getBoundingClientRect();
    var w0=screenToWorld(e.clientX,e.clientY);
    var tn=performance.now(), gap=tn-SWIPE.t;
    if(gap>4 && gap<110){
      var sx=(w0.x-SWIPE.x)/(gap/1000), sy=(w0.y-SWIPE.y)/(gap/1000);
      if(!G.drag && Math.hypot(sx,sy) > 620){
        if(NET.on && !NET.host) netSend({t:'dive', x:+sx.toFixed(0), y:+sy.toFixed(0)});
        else swipeTackle(sx,sy,'H');
      }
    }
    SWIPE.x=w0.x; SWIPE.y=w0.y; SWIPE.t=tn;
  }
  var w=screenToWorld(e.clientX,e.clientY);
  G && (G.mouse.x=w.x, G.mouse.y=w.y, G.mouse.on=true, G.mouse.cx=e.clientX, G.mouse.cy=e.clientY);
});

// release the drag: dive along it
function endDrag(e){
  if(e && e.pointerType==='touch') return;
  if(e && e.button===2){ if(G) G.artHold=false; return; }
  if(!G||!G.drag) return;
  var d0=G.drag; G.drag=null;
  if(G.phase!=='live'||iHaveBall()) return;
  var w=screenToWorld(e.clientX,e.clientY);
  var dx=w.x-d0.x, dy=w.y-d0.y;
  if(Math.hypot(dx,dy) < 10) return;          // that was a click, not a drag
  if(NET.on && !NET.host) netSend({t:'dive', x:Math.round(dx*9), y:Math.round(dy*9)});
  else swipeTackle(dx,dy,'H');
}

stage.addEventListener('pointerdown',function(e){

  e.preventDefault();

  if(e.button===2){ G.artHold=true; return; }   // right button: play art while held
  if(G.phase==='kickset'){ G.kickClick=true; return; }

    var wd=screenToWorld(e.clientX,e.clientY);
    G.drag={x:wd.x,y:wd.y,t:performance.now()};
    return;                                   // on defence the button tackles
  }
  if(NET.on && !NET.host){
    // the guest aims in its own camera, then posts field coordinates
    if(G.phase!=='live') return;
    var wg=screenToWorld(e.clientX,e.clientY);
    netSend({t:'thr', x:Math.round(wg.x), y:Math.round(wg.y)});

  }
  if(G.phase==='presnap'){ say('HIT SPACE TO HIKE FIRST',800); return; }
  if(G.phase!=='live'){ G.lastThrow='not live ('+G.phase+')'; return; }
  var hit=pickOnScreen(e.clientX,e.clientY);
  if(hit){ G.lockMan=hit; G.lockT=5; throwAt(hit.x,hit.y,'H'); return; }
  var w=screenToWorld(e.clientX,e.clientY);
  throwAt(w.x,w.y,'H');
});

function setupPlay(playId){
  G.playNo=(G.playNo|0)+1;
  G.aaArmed=null; G.puntK=null; G.tchase=0; G.tchaseEnd=0;
  G.controlled2=null;
  openPlay(playId);
  G.play=playId; G.players=[]; G.thrown=null; G.fx=[]; G.snapT=G.gt;
  G.loose=null; G.hitCd=0; G.diveUntil=0; G.windup=null;
  var d=dir(), mid=FH/2;
  var offCol=G.offense, defCol=G.offense==='H'?'A':'H';
  var youOnO = G.offense==='H';

  // the hero belongs to whoever has the ball, not always to the Heroes
  var OH = sideHero(G.offense);
  var heroIsQB = !!OH && OH.pos==='Quarterback';
  var heroIsWR = !!OH && OH.pos==='Wide Receiver';
  var heroIsRB = !!OH && OH.pos==='Running Back';

  // ---- OFFENSE: C, OL, OL, TE, QB, WR, WR, RB
  var qb=mk(offCol,'QB',G.los-5.5*YD*d,mid, heroIsQB?OH:SUPPORT.QB); if(heroIsQB) applyHero(qb,OH);
  var c =mk(offCol,'C', G.los-1.5*YD*d,mid, SUPPORT.C);
  G.snapC=c;
  var o1=mk(offCol,'OL',G.los-1*YD*d,mid-4.5*YD, SUPPORT.OL1);
  var o2=mk(offCol,'OL',G.los-1*YD*d,mid+4.5*YD, SUPPORT.OL2);
  var te=mk(offCol,'TE',G.los,mid+7.5*YD, SUPPORT.TE);
  var w1=mk(offCol,'WR',G.los,mid-14*YD, heroIsWR?OH:SUPPORT.WR1); if(heroIsWR) applyHero(w1,OH);
  var w2=mk(offCol,'WR',G.los,mid+14*YD, SUPPORT.WR2);
  var rb=mk(offCol,'RB',G.los-11*YD*d,mid+3*YD, heroIsRB?OH:SUPPORT.RB); if(heroIsRB) applyHero(rb,OH);

  var off = youOnO ? G.play : G.aiPlay;
  // the book records the play the offence ran, not your defensive call
  if(G.cur) G.cur.play = playName(off);
  // on a handoff the back lines up beside the quarterback, so it is catch the
  // snap and give it (from eleven yards deep he had to wait for him)
  if(off==='run' || off==='draw'){ rb.x=G.los-7*YD*d; rb.y=mid+2.5*YD; }
  if(off==='deep'){ w1.route='go'; w2.route='go'; te.route='slant'; rb.route='block'; }
  else if(off==='outs'){ w1.route='out'; w2.route='out'; te.route='curl'; rb.route='wheel'; }
  else if(off==='run'){ w1.route='lead'; w2.route='lead'; te.route='block'; rb.route='mesh'; }
  else if(off==='draw'){ w1.route='go'; w2.route='curl'; te.route='block'; rb.route='mesh'; }
  else if(off==='screen'){ w1.route='lead'; w2.route='lead'; te.route='block'; rb.route='screen'; }
  else { w1.route='slant'; w2.route='slant'; te.route='flat'; rb.route='flat'; }
  c.route='block'; o1.route='block'; o2.route='block';
  // lock in which way each man breaks now, so it cannot flip mid-route
  [w1,w2,te,rb].forEach(function(rr){ rr.brk = (rr.y < mid) ? 1 : -1; });
  // ---- DEFENSE: DE, DE, DE, LB, LB, CB, CB, S
  var dplay = youOnO ? G.aiPlay : G.play;
  // What the call actually changes. Until now every defence played man with
  // a different number of rushers, so ZONE COVER was not zone and CONTAIN did
  // not contain anything.
  G.cushion  = (dplay==='press') ? -6 : (dplay==='prevent' ? 7 : 0);
  G.covType  = (dplay==='zone'||dplay==='prevent') ? 'zone' : 'man';
  G.zoneDeep = (dplay==='prevent') ? 8 : 0;
  var lbRush = (dplay==='blitz');
  var deCount = (dplay==='zone'||dplay==='prevent'||dplay==='spy') ? 2 : 3;
  var spec=[
    {r:'RUSH', x:0.9, y:-6,   pos:'DE'},
    {r:'RUSH', x:0.9, y:0,    pos:'DE'},
    {r: deCount>2?'RUSH':'COV', x:0.9, y:6, pos:'DE'},
    {r: lbRush?'RUSH':'COV', x:4.5, y:-5, pos:'LB'},
    {r: lbRush?'RUSH':'COV', x:4.5, y:5,  pos:'LB'},
    {r:'COV', x:6.5,  y:-13.5,  pos:'CB'},
    {r:'COV', x:6.5,  y:13.5,   pos:'CB'},
    {r:'COV', x:13,   y:0,      pos:'S'}
  ];
  var secondary=[], spyMan=null;
  for(var i=0;i<spec.length;i++){
    var dp=mk(defCol, spec[i].r, G.los+spec[i].x*YD*d, mid+spec[i].y*YD, DEFENDERS[i]);
    dp.pos=spec[i].pos;
    // where he sits if he is playing a zone rather than a man
    dp.zy = mid + spec[i].y*YD*1.45;
    dp.zdepth = (spec[i].pos==='S' ? 20 : spec[i].pos==='CB' ? 13 : 7) + G.zoneDeep;
    if(dp.role==='COV') secondary.push(dp);
  }

  // Pair the line man-on-man across the formation. Without a locked
  // assignment every blocker re-solves "who is nearest the ball" each frame
  // and they all end up stacked on the same defender.
  var blockers=[], rushers=[];
  for(var bq=0;bq<G.players.length;bq++){
    var bp=G.players[bq];
    if(bp.team===offCol && bp.route==='block') blockers.push(bp);
    if(bp.team===defCol && bp.role==='RUSH')   rushers.push(bp);
  }
  blockers.sort(function(a,b){return a.y-b.y;});
  rushers.sort(function(a,b){return a.y-b.y;});
  for(var bk=0;bk<blockers.length;bk++){
    blockers[bk].assign = rushers.length ? rushers[bk % rushers.length] : null;
    blockers[bk].blockIdx = bk;
  }
  // how long each rusher needs to work free of his man
  for(var rk=0;rk<rushers.length;rk++){
    rushers[rk].shedAt = (2.9 + Math.random()*1.40) * (rushers[rk].team==='A' && !NET.on ? FOE.shed : 1);   // the pocket holds a little longer
    rushers[rk].engaged = 0;
    rushers[rk].shed = false;
  }
  // each defender attacks from his own lane so they arrive on angles
  var dn=0;
  for(var lk=0;lk<G.players.length;lk++){
    var lp=G.players[lk];
    if(lp.team===defCol){ lp.lane=(dn-3.5)*13; dn++; }
  }


  // CONTAIN keeps a backer home on the passer so he cannot just run out of
  // the pocket, which is the entire point of the call.
  if(dplay==='spy'){
    for(var sy2=0;sy2<G.players.length;sy2++){
      var sp3=G.players[sy2];
      if(sp3.team===defCol && sp3.pos==='LB'){ sp3.spy=true; spyMan=sp3; break; }
    }
  }

  // ---- coverage: corners take the receivers, backers take the underneath
  //      men, the safety plays over the top of everything.
  var eligible=[];
  for(var eq=0;eq<G.players.length;eq++){
    var ep=G.players[eq];
    if(ep.team===offCol && (ep.role==='WR'||ep.role==='TE'||ep.role==='RB')) eligible.push(ep);
  }
  var taken=[];
  for(var cq=0;cq<secondary.length;cq++){
    var cb=secondary[cq];
    if(cb.pos==='S'||cb===spyMan){ cb.cover=null; continue; }        // deep zone, no man
    var pick=null, pd=Infinity;
    for(var eq2=0;eq2<eligible.length;eq2++){
      var cand=eligible[eq2];
      if(taken.indexOf(cand)>=0) continue;
      var dd3=Math.abs(cand.y-cb.y);
      if(dd3<pd){ pd=dd3; pick=cand; }
    }
    cb.cover=pick; if(pick) taken.push(pick);
  }

  G.ball={x:qb.x,y:qb.y,held:true};
  G.carrier=qb;
  if(G.cur) G.cur.qb=qb;
  // The back used to start the play already holding it. Now the passer takes
  // the snap and gives it to him at the mesh point, and you can beat the
  // timer by handing off yourself.
  // a run play is a handoff: catch the snap and give it (the draw shows pass
  // for two steps first); on anything else it is your call (tap the back)
  G.handoffAt = (off==='run') ? SNAP_DUR : (off==='draw' ? 0.36 : null);
  G.controlled = youOnO ? G.carrier : (startLB() || nearestDef());
  if(NET.on && NET.host) G.controlled2 = pickRemoteMan(false);
  G.jukeUntil=0;
  G.phase='presnap'; G.playClock=15;
  // when the CPU has the ball it snaps on its own after a beat
  G.autoSnapAt = (G.offense==='H' || NET.on) ? null : (1.1+Math.random()*1.6);
  for(var s2=0;s2<G.players.length;s2++){ G.players[s2].stance=1; G.players[s2].vx=0; G.players[s2].vy=0; }
}

// The drop, in yards, for each call. Quick game is three steps, intermediate
// five, the deep shot seven. The run is a handoff, so no drop at all, and
// the draw only shows pass for a couple of steps before he goes to the back.
var DROP_YDS = {short:3, outs:5, screen:5, draw:2, deep:6, run:0};
var POCKET_YDS = 6;   // deeper than this behind his snap spot and he is a runner
function snapBall(){
  if(G.phase!=='presnap') return;
  G.phase='live'; G.snapT=G.gt;
  for(var i=0;i<G.players.length;i++) G.players[i].stance=0;
  G.dropLeft = (DROP_YDS[G.offense==='H' ? G.play : G.aiPlay]||0)*YD;
  G.qbSpot=null;
  for(var qi=0;qi<G.players.length;qi++){
    var qq=G.players[qi];
    if(qq.team===G.offense && qq.role==='QB'){ G.qbSpot={x:qq.x,y:qq.y}; break; }
  }         // yards of drop still to take
  burst(G.ball.x,G.ball.y,'#f1f1ec');
}
// Both sides get one. Without this the guest drove a stock Rival at spd 1.00
// against a hero at up to 1.30 with a signature move, and simply could not
// keep up.
function applyHero(p, h){
  h = h || HERO;
  p.hero=true; p.spd=h.spd; p.pwr=h.pwr; p.agi=h.agi;
  p.name=h.name; p.num=h.num; p.skin=h.skin;
  p.stars=heroStars(h); p.sig=h.moveName; p.card='hero-'+h.id; p.title=h.title||'';
}

// whichever hero the guest picked, defaulted so a game works before they choose
var GUEST_HERO = null;
function sideHero(side){
  if(side==='H') return HERO;
  return NET.on ? (GUEST_HERO || HEROES[1]) : null;
}
// One frame of the drop: straight back, quick feet, facing the way he throws.
function dropBack(qb, fwd, dt){
  var v=BASE_SPD*0.95;
  qb.vx=-fwd*v; qb.vy=0;
  qb.backpedal=0.12; qb.dropFace=fwd;
  G.dropLeft=Math.max(0, G.dropLeft - v*dt);
}
// A run play: once he has the snap the quarterback goes to meet the back
// instead of standing still waiting for him to arrive.
function meetBack(qb, dt){
  if(G.gt-G.snapT < SNAP_DUR){ qb.vx*=0.8; qb.vy*=0.8; return; }   // the snap is still on its way
  var back=null, bd=Infinity;
  for(var i=0;i<G.players.length;i++){ var q=G.players[i];
    if(q.team!==G.offense || q.role!=='RB' || q.route!=='mesh' || q.stun>0) continue;
    var dd=Math.hypot(q.x-qb.x,q.y-qb.y); if(dd<bd){ bd=dd; back=q; } }
  if(!back || bd<1.4*YD){ qb.vx*=0.7; qb.vy*=0.7; return; }         // close enough to put it in his belly
  // he steps across into the back's lane (backing up to him would give
  // ground), no more than a yard deeper than he caught it
  var d=dir(), sp=G.qbSpot||{x:qb.x,y:qb.y};
  var gx=((sp.x-qb.x)*d >= YD) ? qb.x : sp.x-d*YD;
  var gy=back.y+(sp.y>=back.y?1:-1)*0.9*YD;
  var tx=gx-qb.x, ty=gy-qb.y, tm=Math.hypot(tx,ty);
  if(tm<0.3*YD){ qb.vx*=0.7; qb.vy*=0.7; return; }
  var v=BASE_SPD*0.95;
  qb.vx=tx/tm*v; qb.vy=ty/tm*v;
}
// On defence you start as the linebacker nearest the ball: the ends start
// locked up with a blocker, which made the stick feel dead at the snap.
function startLB(){
  var best=null,bd=Infinity,me=G.offense==='H'?'A':'H';
  for(var i=0;i<G.players.length;i++){ var p=G.players[i];
    if(p.team!==me || p.pos!=='LB') continue;
    var d=Math.hypot(p.x-G.ball.x,p.y-G.ball.y); if(d<bd){ bd=d; best=p; } }
  return best;
}
function nearestDef(){
  var best=null,bd=Infinity,me=G.offense==='H'?'A':'H';
  for(var i=0;i<G.players.length;i++){var p=G.players[i];
    if(p.team!==me)continue; var d=Math.hypot(p.x-G.ball.x,p.y-G.ball.y);
    if(d<bd){bd=d;best=p;} }
  return best;
}
// How well placed a defender is to make the play: close to where the ball
// carrier will be in half a second, coming at him, in front of him rather
// than chasing, and not tied up with a blocker. Lower is better.
function defScore(q){
  var c=G.carrier, tx, ty, vx=0, vy=0;
  if(c){ tx=c.x+c.vx*0.5; ty=c.y+c.vy*0.5; vx=c.vx; vy=c.vy; }
  else if(G.thrown){ tx=G.thrown.tx; ty=G.thrown.ty; }
  else { tx=G.ball.x; ty=G.ball.y; }
  var dx=tx-q.x, dy=ty-q.y, d=Math.hypot(dx,dy)||1, sc=d;
  var qs=Math.hypot(q.vx,q.vy);
  if(qs>10) sc-=18*((q.vx*dx+q.vy*dy)/(qs*d));                          // coming at him
  var cs=Math.hypot(vx,vy);
  if(c && cs>10){
    var ox=q.x-c.x, oy=q.y-c.y, od=Math.hypot(ox,oy)||1;
    sc-=24*Math.max(0,(ox*vx+oy*vy)/(cs*od));                          // in his way, not behind him
  }
  if((q.engaged||0)>0 && (q.engaged||0)<=(q.shedAt||2.5) && q.eBlk) sc+=12*YD;   // locked up with a blocker
  if(q.stun>0 || q.down>0) sc+=40*YD;
  return sc;
}
function bestDefender(side){
  var best=null, bs=1e9;
  for(var i=0;i<G.players.length;i++){
    var q=G.players[i];
    if(q.team!==side) continue;
    var sc=defScore(q); if(sc<bs){ bs=sc; best=q; }
  }
  return best;
}
// hand control to another man, with a flash and a streak from the old one so
// your eye follows the change
function switchTo(q){
  var old=G.controlled;
  if(!q || q===old) return;
  G.controlled=q; G.switchFlash=0.5; G.switchLockUntil=G.gt+0.9; G.swCarryUntil=G.gt+0.3*(GAME_SPEED||1);
  if(old && !REDUCED) streak(old.x,old.y-10,q.x,q.y-10,'rgba(255,210,63,.75)',2.2,0.3);
}
function nearestOf(p,team,seeAll){
  var best=null,bd=Infinity;
  for(var i=0;i<G.players.length;i++){var q=G.players[i];
    if(q.team!==team)continue;
    if(!seeAll && q.invisUntil && G.gt<q.invisUntil) continue;   // the Invisible Man: nobody reads him
    var d=Math.hypot(q.x-p.x,q.y-p.y);
    if(d<bd){bd=d;best=q;} }
  return best;
}
// Blockers divide the rush between them. Without this every blocker solves
// the same "who is nearest the ball" sum and they all stack on one defender.
function nearestRusher(p){
  var dt2=G.offense==='H'?'A':'H';
  var rush=[];
  for(var i=0;i<G.players.length;i++){
    var q=G.players[i];
    if(q.team!==dt2||q.stun>0) continue;
    if(q.role!=='RUSH' && Math.hypot(q.x-G.ball.x,q.y-G.ball.y)>26*YD) continue;
    rush.push(q);
  }
  if(!rush.length) return null;
  rush.sort(function(a,b){
    return Math.hypot(a.x-G.ball.x,a.y-G.ball.y)-Math.hypot(b.x-G.ball.x,b.y-G.ball.y);
  });
  return rush[(p.blockIdx||0) % rush.length];
}

// ================================================================ passing
// A forward pass is only legal from behind the line of scrimmage. Half a yard
// of grace so a passer standing right on it is not punished for sprite width.
function pastTheLine(p){
  return p && ((p.x - G.los) * dir()) > 7;
}

// The one place a pass target is decided. The aiming ring and the throw both
// call this, so the man with the circle on him is always the man it goes to.
function pickTarget(wx,wy){
  if(!G.carrier) return null;
  var best=null,bd=Infinity,any=false;
  for(var i=0;i<G.players.length;i++){
    var q=G.players[i];
    if(q.team!==G.offense||q===G.carrier) continue;
    if(q.role==='C'||q.role==='OL'||q.role==='BL') continue;
    any=true;
    var dd=Math.hypot(q.x-wx,q.y-wy);
    if(dd<bd){bd=dd;best=q;}
  }
  if(!any) return null;
  if(best && bd<=26*YD) return best;
  // the cursor missed everybody, so take whoever lies nearest that bearing
  var ax=wx-G.carrier.x, ay=wy-G.carrier.y, am=Math.hypot(ax,ay)||1;
  ax/=am; ay/=am;
  var pick=null, bestDot=-2;
  for(var j=0;j<G.players.length;j++){
    var r2=G.players[j];
    if(r2.team!==G.offense||r2===G.carrier) continue;
    if(r2.role==='C'||r2.role==='OL'||r2.role==='BL') continue;
    var rx=r2.x-G.carrier.x, ry=r2.y-G.carrier.y, rm=Math.hypot(rx,ry)||1;
    var dot=(rx/rm)*ax+(ry/rm)*ay;
    if(dot>bestDot){ bestDot=dot; pick=r2; }
  }
  return (pick && bestDot>=0.25) ? pick : null;
}

function throwAt(wx,wy,side){
  if(G.offense!==(side||'H')){ return; }
  if(G.phase!=='live'){ say('BALL IS DEAD',700); G.lastThrow='phase '+G.phase; return; }
  if(G.thrown){ say('ALREADY IN THE AIR',600); G.lastThrow='already in the air'; return; }
  if(G.windup){ G.lastThrow='already throwing'; return; }
  if(G.loose){ say('LOOSE BALL — GO GET IT',700); return; }
  if(!G.carrier){ say('NOBODY HAS THE BALL',900); G.lastThrow='no carrier'; return; }
  if(G.carrier.role!=='QB'){ say('CANNOT PASS — '+G.carrier.role+' HAS IT',1100); G.lastThrow='carrier is '+G.carrier.role; return; }
  if(pastTheLine(G.carrier)){
    say('PAST THE LINE — RUN IT',1000);
    G.lastThrow='past the line'; return;
  }

  var best=pickTarget(wx,wy);
  if(!best){ say('THROWN AWAY',700); G.lastThrow='no target that way'; return; }

  // Throw NOW. The windup state machine could cancel itself between frames
  // (carrier changes, play ends, an exception upstream) and swallow the pass.
  // The arm animation plays out after the release instead.
  G.carrier.throwArm=1;
  if(G.cur){ G.cur.passer=G.carrier; G.cur.target=best; }
  releaseThrow(best);
  G.lastThrow='to '+(best.name||best.role);
}

function releaseThrow(best){
  var qb=G.carrier;
  if(!qb||!best){ G.windup=null; G.lastThrow='no passer/target'; return; }
  if(G.thrown){ return; }
  if(pastTheLine(qb)){                      // illegal forward pass; he keeps it
    G.windup=null; qb.throwArm=0;
    G.rocketArmed=false; G.perfectArmed=false;
    G.lastThrow='past the line'; return;
  }
  var fast = (HERO.move==='rocket' && qb.hero) ? 1.4 : 1;
  var rocket = !!(G.windupWasRocket) || !!G.rocketArmed;
  var perfect = !!G.perfectArmed;
  G.rocketArmed=false; G.perfectArmed=false;
  var speed = (rocket?1500:(perfect?690:530))*fast;
  // Short throws are fired flat and hard; deep ones are lofted and hang.
  var rawYd=Math.hypot(best.x-G.ball.x,best.y-G.ball.y)/YD;
  if(!rocket && !perfect){
    speed *= rawYd<12 ? 1.35 : rawYd<25 ? 1.35-(rawYd-12)/13*0.35 : 1.0-Math.min(0.12,(rawYd-25)*0.008);
  }
  // A clean throw spirals tight. Throwing with a man in your face wobbles,
  // and the star passer throws the tightest ball on the field.
  var prs=nearestOf(qb, qb.team==='H'?'A':'H'), prd=prs?Math.hypot(prs.x-qb.x,prs.y-qb.y):999;
  var wobv=(qb.hero?0.02:0.04)+Math.max(0,1-prd/(4*YD))*0.2;

  // Lead by the actual flight time, not a fixed 0.42 seconds. That constant
  // was about right for a five yard out, but a deep ball hangs for a second
  // and the receiver covers nine yards in it, so the pass landed five yards
  // behind him every time and the catch window is under three. Solve for the
  // meeting point: the further he is, the longer the ball is up, the further
  // ahead he will be when it lands.
  var tx=best.x, ty=best.y, flight=0.14;
  for(var it=0; it<4; it++){
    flight = Math.max(0.14, Math.hypot(tx-G.ball.x, ty-G.ball.y)/speed);
    tx = best.x + best.vx*flight;
    ty = best.y + best.vy*flight;
  }
  // A snap throw scatters; a held lock does not. A perfect pass is exempt,
  // and so is a rocket, because that is what those cost a cooldown for.
  if(!perfect && !rocket){
    var reach = Math.hypot(tx-G.ball.x, ty-G.ball.y);  // how far it has to go
    var lock = (best===G.lockMan) ? Math.min(1, G.lockT/1.05) : 0;
    var miss = (1-lock)*(1-lock);                      // falls away quickly
    if(qb.team==='A' && !NET.on) miss*=FOE.miss;        // how wild their passer is depends on the team
    if(qb.wrapped>0) miss=Math.max(miss,0.9);          // thrown with a man hanging on him: hurried and wild
    if(miss>0.01){
      var spread = (3.0 + Math.min(3.4, reach/(14*YD))) * YD * miss;
      var ma=Math.random()*Math.PI*2, mr=Math.sqrt(Math.random())*spread;
      tx += Math.cos(ma)*mr; ty += Math.sin(ma)*mr;
    }
  }
  if(!isFinite(tx)||!isFinite(ty)){ tx=best.x; ty=best.y; }
  tx = Math.max(6, Math.min(FW-6, tx));
  ty = Math.max(10, Math.min(FH-10, ty));               // not out of bounds
  var dist=Math.hypot(tx-G.ball.x,ty-G.ball.y);
  var hx=qb.x + (qb.face||1)*8, hy=qb.y-25;     // the throwing hand
  burst(hx,hy,'#f1f1ec');
  G.thrown={x:hx,y:hy,tx:tx,ty:ty,target:best,t:0,
            dur:Math.max(0.14,dist/speed),
            arc: rocket ? 4 : Math.max(5, Math.min(72, (dist/YD)*(0.9+Math.min(1,dist/(30*YD))*1.1))),
            sure: rocket||perfect,
            fire: rocket,
            wob: wobv,
            homing: perfect,
            deep: dist > 22*YD};
  G.windupWasRocket=false;
  G.ball.held=false; G.carrier=null;
  qb.throwArm=1;
  say(fast>1?'FIRED!':'IN THE AIR',400);
}

var KITS_AB = {
  QB:['rocket','perfect','forcefield'],
  RB:['dash','stiffarm','teleport'],
  OL:['superblock','clothesline'],
  C: ['superblock','clothesline'],
  WR:['superspeed','spin'],
  TE:['stiffarm','slam'],
  DE:['clothesline','slam'],
  LB:['dash','fumblegen'],
  CB:['aagun'],
  S: ['aagun']
};

// defenders are identified by pos (DE/LB/CB/S), the offence by role
function kitFor(p){
  if(!p) return [];
  var k=KITS_AB[p.pos] || KITS_AB[p.role] || [];
  var sg=p.card && SIG_MOVE[p.card];                 // his own move takes the last slot
  if(!sg) return k;
  return k.length>=3 ? k.slice(0,2).concat([sg]) : k.concat([sg]);
}
// speed from a move: a wolf, a cloud, a flight, or frozen stiff
function buffMul(p){
  var m=1;
  if(G && p.buffUntil && G.gt<p.buffUntil) m*=(p.buffSpd||1);
  if(G && p.flyUntil && G.gt<p.flyUntil) m*=1.25;
  if(p.wrapped>0 && p.wrapDrag && p!==G.controlled && p!==G.controlled2) m*=p.wrapDrag;
  if(p.burst>0 && p!==G.controlled && p!==G.controlled2) m*=1.4;   // a speed burst works for the computer's men too (yours is in driveHuman)   // a computer runner who is held can only drag them along (yours already slows in driveHuman)
  return m;
}
// a swarm of bats from one spot to another
function batSwarm(x0,y0,x1,y1){
  if(REDUCED) return;
  for(var i=0;i<22;i++){
    var t=0.28+Math.random()*0.12, jx=(Math.random()-0.5)*26, jy=(Math.random()-0.5)*14;
    G.fx.push({x:x0+jx*0.5, y:y0-16+jy, vx:(x1-x0+jx)/t, vy:(y1-y0+jy)/t, r:1.8+Math.random()*1.6,
               life:t, max:t, c:(i%3?'#1b0d22':'#6d2a8f')});
  }
  for(var j=0;j<12;j++){
    var a=Math.random()*Math.PI*2, sp=40+Math.random()*80;
    G.fx.push({x:x1, y:y1-16, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp*0.6-20, r:1.8, life:0.5, max:0.5, c:'#2a1036'});
  }
}

// Cooldowns outlive the play, and players are rebuilt every snap, so they are
// keyed by shirt rather than by object.
function abKey(p,id){ return p.team+':'+p.num+':'+id; }
function abLeft(p,id){
  if(!p) return 0;
  var due=G.abCd[abKey(p,id)];
  if(due===undefined) return 0;
  return Math.max(0, due-G.playNo);
}
function abReady(p,id){ return abLeft(p,id)===0; }
function abSpend(p,id){
  G.abCd[abKey(p,id)] = G.playNo + (ABIL[id]?ABIL[id].cd:2) + 1;
  // the moment is for moves a person fires; the computer's own moves stay quiet
  if(ABIL[id] && (p===G.controlled || p===G.controlled2)) superMoment(p, ABIL[id].name);
}
// Heroes' side slides in from the left in gold, Rivals' from the right in red.
function superMoment(p, name){
  if(!p || REDUCED) return;
  if(NET.on && NET.host && G.players.indexOf(p)>=0) netEv(['super',G.players.indexOf(p),String(name)]);
  G.superAt={p:p, t:performance.now()};
  var el=document.getElementById('superBan');
  if(!el){ el=document.createElement('div'); el.id='superBan'; stage.appendChild(el); }
  el.textContent=String(name).toUpperCase()+'!';
  el.className=(p.team==='H')?'home':'away';
  void el.offsetWidth;                     // restart the slide
  el.classList.add('go');
}
function superSpotTick(){
  if(!G || G.phase==='heroIntro') return;
  var sp=document.getElementById('spot');
  var su=G.superAt, age=su?performance.now()-su.t:1e9;
  if(!sp){ if(age>600) return; sp=document.createElement('div'); sp.id='spot'; stage.appendChild(sp); }
  if(age<600 && su.p){
    var k=1-age/600, w=worldToScreen(su.p.x, su.p.y-20);
    sp.style.transition='none';
    sp.style.background='radial-gradient(circle at '+Math.round(w.x)+'px '+Math.round(w.y)+'px, rgba(0,0,0,0) 0, rgba(0,0,0,0) '+Math.round(46*w.s)+'px, rgba(0,0,0,'+(0.5*k).toFixed(2)+') '+Math.round(130*w.s)+'px)';
    sp.style.opacity='1';
  } else if(sp.style.opacity!=='0'){ sp.style.transition='opacity .2s'; sp.style.opacity='0'; }
}

// A move used with nothing to hit still goes off (you asked for it, you get
// it) and it is spent, like a whiff.
function whiffMove(me, id, col, mine){
  var hx=me.x+(me.face||1)*14, hy=me.y-20;
  me.arm=0.6; me.wrapped=0;
  streak(me.x+(me.face||1)*4,hy, hx+(me.face||1)*12,hy, 'rgba(255,255,255,.85)', 2.4, 0.2);
  flash(hx,hy,col||'rgba(255,210,63,.9)',18);
  shock(hx,hy+14,col||'rgba(255,210,63,.7)',2,22,0.24);
  say(String(ABIL[id]?ABIL[id].name:id).toUpperCase()+'!',600,mine?'H':(me===G.controlled2?'A':undefined));
  abSpend(me,id);
}
function fireAbility(seat, IN, slot){
  var me=seat.man;
  function why(t){ if(seat.local) hint(t,1000); }   // only for the person pressing it, never the computer
  if(!me) return;
  if(G.phase!=='live'){ why('AFTER THE SNAP'); return; }
  if(me.stun>0 || me.down>0){ why('GET UP FIRST'); return; }
  var kit=kitFor(me), id=kit[slot];
  if(!id) return;
  if(!abReady(me,id)){ var lf=abLeft(me,id); why(ABIL[id].name.toUpperCase()+': READY IN '+lf+(lf===1?' PLAY':' PLAYS')); return; }

  var d=dir(), mine=seat.local;
  var foeTeam=(me.team==='H')?'A':'H';
  var fwd;
  if(IN && (IN.x||IN.y)) fwd={x:IN.x, y:IN.y};
  else if(me.team===G.offense) fwd={x:d, y:0};
  else {
    var bx=G.ball?G.ball.x:me.x, by=G.ball?G.ball.y:me.y;
    var mx=bx-me.x, my=by-me.y, mm=Math.hypot(mx,my)||1;
    fwd={x:mx/mm, y:my/mm};
  }
  function tell(t,ms){ say(t,ms||600,mine?'H':(me===G.controlled2?'A':undefined)); }   // (a person's move is theirs to see; the computer's, both)
  function foeNear(r){
    var best=null,bd=r;
    for(var i=0;i<G.players.length;i++){
      var q=G.players[i];
      if(q.team!==foeTeam||q.stun>0) continue;
      var dd=Math.hypot(q.x-me.x,q.y-me.y);
      if(dd<bd){ bd=dd; best=q; }
    }
    return best;
  }
  function flatten(rad,stun,push){
    var n=0;
    for(var i=0;i<G.players.length;i++){
      var q=G.players[i];
      if(q.team===me.team) continue;
      var dd=Math.hypot(q.x-me.x,q.y-me.y);
      if(dd>rad) continue;
      n++; q.stun=stun; q.wrapped=0; q.down=Math.max(q.down,0.8);
      launch(q, me.x, me.y, push, 4.0+Math.random()*1.4);
    }
    return n;
  }

  // ---- quarterback ---------------------------------------------------
  if(id==='rocket'){
    if(me!==G.carrier || G.thrown){ whiffMove(me,id,'rgba(255,140,43,.95)',mine); return; }
    G.rocketArmed=true; me.arm=0.5;
    var rhx=me.x+(me.face||1)*9, rhy=me.y-25;
    flash(rhx,rhy,'rgba(255,210,63,.95)',26);
    shock(rhx,rhy,'rgba(255,210,63,.85)',3,26,0.30);
    for(var rk2=0;rk2<5;rk2++){
      streak(rhx,rhy-4+rk2*2, rhx+(me.face||1)*(18+rk2*5), rhy-4+rk2*2,
             'rgba(255,210,63,.6)',1.3,0.22);
    }
    tell('ROCKET ARMED',700);
  }
  else if(id==='perfect'){
    if(me!==G.carrier || G.thrown){ whiffMove(me,id,'rgba(127,216,255,.95)',mine); return; }
    G.perfectArmed=true; me.arm=0.5;
    flash(me.x,me.y-24,'rgba(127,216,255,.9)',22);
    shock(me.x,me.y,'rgba(127,216,255,.9)',4,30,0.38);
    var lock=pickTarget(G.mouse&&G.mouse.on?G.mouse.x:me.x+dir()*200,
                        G.mouse&&G.mouse.on?G.mouse.y:me.y);
    if(lock){
      shock(lock.x,lock.y,'rgba(127,216,255,.95)',26,9,0.5);
      streak(me.x,me.y-22,lock.x,lock.y-14,'rgba(127,216,255,.45)',1.2,0.5);
    }
    tell('PERFECT PASS ARMED',800);
  }
  else if(id==='forcefield'){
    var hit=flatten(52,1.3,210);
    me.iFrames=Math.max(me.iFrames,1.4);
    flash(me.x,me.y-16,'rgba(127,216,255,.95)',46);
    G.fx.push({dome:true,x:me.x,y:me.y+4,c:'rgba(127,216,255,.95)',
               r:52,life:0.75,max:0.75});
    shock(me.x,me.y,'rgba(255,255,255,.95)',6,58,0.34);
    shock(me.x,me.y,'rgba(127,216,255,.6)',6,48,0.55);
    spokes(me.x,me.y-10,'rgba(127,216,255,.85)',12,20,58);
    emit(me,'swirl',1.2,'#7fd8ff');
    dust(me.x,me.y,14,1.3); G.shake=REDUCED?0:18;
    tell(hit?'FORCEFIELD!':'FORCEFIELD',800);
  }

  // ---- backs and backers ----------------------------------------------
  else if(id==='dash'){
    me.burst=0.6; me.iFrames=Math.max(me.iFrames||0,0.25);  // a short explosion that shakes off the first grab
    me.vx=fwd.x*BASE_SPD*2.9*(me.spd||1); me.vy=fwd.y*BASE_SPD*2.9*(me.spd||1);
    shock(me.x,me.y,'rgba(255,140,43,.9)',4,34,0.32);
    dust(me.x,me.y,12,1.1);
    for(var dk=0;dk<4;dk++){
      streak(me.x-fwd.x*(8+dk*7), me.y-fwd.y*(8+dk*7)-12-dk*4,
             me.x-fwd.x*(26+dk*8), me.y-fwd.y*(26+dk*8)-12-dk*4,
             'rgba(255,140,43,.65)',1.7,0.26);
    }
    emit(me,'flame',1.4,'#ff8c2b');
    tell('SUPER DASH!',600);
  }
  else if(id==='stiffarm'){
    var v=foeNear(58);                          // an arm's length and a lunge
    // a swipe tackle already in the air cannot be stiff-armed away
    if(v && v===G.controlled && G.touchDive && performance.now()<G.diveUntil && !mine) return;
    if(!v){                                      // nobody there: the arm still shoots out, and it is spent
      me.arm=0.6; me.wrapped=0;
      var ax2=me.x+(me.face||1)*16, ay2=me.y-18;
      streak(me.x+(me.face||1)*4,ay2, ax2+(me.face||1)*10,ay2,'rgba(255,255,255,.85)',2.4,0.2);
      flash(ax2,ay2,'rgba(255,210,63,.9)',18);
      shock(ax2,ay2+14,'rgba(255,210,63,.7)',2,20,0.24);
      tell('STIFF ARM!',600);
      abSpend(me,id); return;
    }
    me.wrapped=0;
    for(var sa=0;sa<G.players.length;sa++){        // everyone hanging on to him lets go and goes down
      var sq2=G.players[sa];
      if(!(sq2.wrapT>0) || sq2.team===me.team || sq2.gripLock) continue;
      if((sq2.humanWrap || sq2.strongGrab) && !mine) continue;   // the computer's stiff arm does not undo your tackle or a special move's
      breakWrap(sq2,me); sq2.stun=Math.max(sq2.stun,0.9); sq2._pst=sq2.stun;
    }
    if(mine) me.iFrames=Math.max(me.iFrames||0,0.5);   // yours slips every grab; the computer's leaves your own tackle alone
    if((v.humanWrap || v.strongGrab) && !mine && v.wrapT>0){ abSpend(me,id); tell('STIFF ARM!',600); return; }
    v.stun=1.3; v.down=Math.max(v.down,1.0); v.wrapped=0;
    launch(v, me.x, me.y, 230, 5.4);
    spokes(v.x,v.y-16,'rgba(255,210,63,.9)',8,8,30);
    me.arm=0.6; G.shake=REDUCED?0:10;
    flash(v.x,v.y-14,'rgba(255,255,255,.95)',24);
    shock(v.x,v.y,'rgba(255,210,63,.9)',3,26,0.26);
    dust(v.x,v.y,7,0.9);
    tell('STIFF ARM!',600); credit(me,'STIFF ARM');
  }
  else if(id==='teleport'){
    var hop=62;
    portal(me.x,me.y,'#29d3e6');
    for(var t=0;t<9;t++){
      G.fx.push({x:me.x+fwd.x*hop*(t/9), y:me.y+fwd.y*hop*(t/9)-8,
                 vx:0,vy:-10,life:0.36,max:0.36,r:3.4,c:'#7fd8ff'});
    }
    me.x=Math.max(6,Math.min(FW-6,me.x+fwd.x*hop));
    me.y=Math.max(8,Math.min(FH-8,me.y+fwd.y*hop));
    me.iFrames=Math.max(me.iFrames,0.5); me.phase=0.6; me.wrapped=0;
    me.burst=Math.max(me.burst||0,0.5);            // and away: the tight coverage was closing on him the moment he landed
    flash(me.x,me.y-16,'rgba(127,216,255,.95)',30);
    shock(me.x,me.y,'rgba(127,216,255,.9)',2,30,0.30);
    portal(me.x,me.y,'#29d3e6');
    for(var tg=0;tg<4;tg++){
      G.fx.push({gh:true,x:me.x-fwd.x*hop*(tg/4),y:me.y-fwd.y*hop*(tg/4),
                 face:me.face,c:'#7fd8ff',life:0.26,max:0.26});
    }
    tell('TELEPORT!',700);
  }

  // ---- the line --------------------------------------------------------
  else if(id==='superblock'){
    var n2=flatten(46,1.5,195);
    me.z=0.05; me.vz=3.0; G.shake=REDUCED?0:16;   // a hop into the block, not a float
    flash(me.x,me.y-10,'rgba(255,210,63,.85)',40);
    shock(me.x,me.y,'rgba(255,255,255,.9)',5,50,0.30);
    shock(me.x,me.y,'rgba(255,210,63,.8)',5,42,0.46);
    dust(me.x,me.y,18,1.5);
    crack(me.x+(me.face||1)*10,me.y,40,null);
    tell(n2?'PANCAKED!':'SUPER BLOCK',700);
    if(n2) credit(me,'SUPER BLOCK');
  }
  else if(id==='clothesline'){
    // The ball carrier if he is in reach, otherwise the nearest man; he lunges
    // the last few yards to get there.
    var v2 = (G.carrier && G.carrier.team===foeTeam && Math.hypot(G.carrier.x-me.x,G.carrier.y-me.y)<84) ? G.carrier : foeNear(76);
    if(!v2){ whiffMove(me,id,'rgba(255,255,255,.9)',mine); return; }
    lunge(me, v2, 14);
    var onCar=(v2===G.carrier && G.phase==='live');
    if(onCar){
      // On the ball carrier it is a heavy hit, not an automatic tackle (the
      // simulation had it ending the play every single time): 30% of his
      // fight and a stagger that slows him down.
      v2.hp-=30; dmgText(v2,'-30','#ffffff'); pow(v2.x,v2.y-18,'#ffffff');
      v2.buffUntil=G.gt+0.6; v2.buffSpd=0.5; v2.vx*=0.3; v2.vy*=0.3; v2.lean=-0.5; v2.sq=0.22;
      v2.iFrames=0;
    } else {
      v2.stun=1.7; v2.down=Math.max(v2.down,1.3); v2.wrapped=0;
      launch(v2, me.x, me.y, 200, 6.2); v2.spin=1;
    }
    spokes(v2.x,v2.y-18,'rgba(255,255,255,.9)',7,8,28);
    me.arm=0.7; G.shake=REDUCED?0:14;
    var swy=me.y-20;
    streak(me.x-(me.face||1)*6,swy, v2.x+(me.face||1)*16,swy-2,'rgba(255,255,255,.85)',2.6,0.20);
    streak(me.x-(me.face||1)*4,swy+4, v2.x+(me.face||1)*14,swy+2,'rgba(255,255,255,.45)',1.6,0.24);
    flash(v2.x,v2.y-18,'rgba(255,255,255,.95)',26);
    dust(v2.x,v2.y,8,1.0);
    tell('CLOTHESLINE!',700); credit(me,'CLOTHESLINE');
    if(onCar && v2.hp<=0){ v2.down=1.6; if(G.cur) G.cur.tackler=me; endPlay(v2.x,'TACKLED'); }   // only if it finishes him
  }

// the anti-air itself: the beam, the ball bursting, and where it ends up
function laserShot(me){
  function tell(t,ms){ say(t,ms||600); }
  {
    if(!G.thrown) return;
    var tgt=G.thrown.target;
    // A laser from his eyes to the ball where it is IN THE AIR (its height
    // above its shadow), held for half a second, and the ball bursts.
    var bx=G.ball.x, by=G.ball.y-(G.thrown.h||0), ex=me.x+(me.face||1)*2, ey=me.y-33;
    G.fx.push({laser:true,x:ex,y:ey,x2:bx,y2:by,life:0.55,max:0.55});
    flash(ex,ey,'rgba(255,60,60,1)',16);
    flash(bx,by,'rgba(255,255,255,1)',34);
    flash(bx,by,'rgba(255,90,60,.95)',24);
    shock(bx,by,'rgba(255,120,80,.95)',3,34,0.32);
    for(var lz=0;lz<14;lz++){                        // pieces of the ball, falling
      var la=Math.random()*Math.PI*2, ls=60+Math.random()*120;
      G.fx.push({x:bx,y:by,vx:Math.cos(la)*ls,vy:Math.sin(la)*ls-40,grav:260,
                 r:1.6+Math.random()*1.6,life:0.7,max:0.7,c:(lz%3?'#7a4a28':'#ffb070')});
    }
    G.shake=REDUCED?0:12;
    // shot out of the sky: the play is dead
    G.thrown=null;
    tell('SHOT OUT OF THE SKY!',1100); credit(me,'PASS DEFENDED');
    endPlay(G.los,'INCOMPLETE');
  }
}

// ================================================================ specials
var SPECIAL_CD=3;        // plays before a hero's special comes back
function fireSpecial(seat,IN){
  seat=seat||{side:'H',man:G.controlled,M:G,hero:HERO};
  var me=seat.man; if(!me) return;
  var M=seat.M;
  if(M.moveCd>0) return;
  var d=dir();
  var a=IN?{x:IN.x,y:IN.y}:axis();
  var fwd=(a.x||a.y)?a:{x:(seat.side==='H'?d:-d),y:0};

  // a seat without a hero (the guest drives ordinary Rivals) gets a truck
  if(!seat.hero || !me.hero){
    if(M.power<TRUCK_COST) return;
    M.power-=TRUCK_COST; M.moveCd=1.4; me.arm=0.6;
    G.shake=REDUCED?0:12; ring(me.x,me.y,'#e0384e');
    var tn=0;
    for(var tk=0;tk<G.players.length;tk++){
      var vt=G.players[tk];
      if(vt.team===me.team) continue;
      var vd=Math.hypot(vt.x-me.x,vt.y-me.y);
      if(vd>32) continue;
      tn++; vt.stun=0.9+Math.random()*0.4; vt.wrapped=0;
      vt.vx=(vt.x-me.x)/(vd||1)*180; vt.vy=(vt.y-me.y)/(vd||1)*180;
    }
    me.vx=fwd.x*BASE_SPD*1.7*(me.pwr||1); me.vy=fwd.y*BASE_SPD*1.7*(me.pwr||1);
    say(tn?'TRUCKED!':'TRUCK',700,seat.side);
    return;
  }

  var HRO=seat.hero, m=HRO.move;
  // Like every other move it comes back after a few plays, not a second and a half.
  var left=(M.specialDue||0)-G.playNo;
  if(left>0){ if(seat.local!==false && (seat.side==='H'||!NET.on)) hint(HRO.moveName.toUpperCase()+': READY IN '+left+(left===1?' PLAY':' PLAYS'),1000); return; }
  if(M.power<HRO.cost) return;
  M.power-=HRO.cost;
  M.specialDue=G.playNo+SPECIAL_CD+1;
  superMoment(me, HRO.moveName);

  if(m==='quake'){
    // stomp: everyone nearby loses their footing
    M.moveCd=1.5; me.z=0.05; me.vz=3.6; G.shake=REDUCED?0:20;
    ring(me.x,me.y,'#ffd23f'); burst(me.x,me.y,'#ffd23f'); burst(me.x,me.y,'#c8a63c');
    crack(me.x,me.y,72,'rgba(255,120,30,');                     // the ground splits, glowing
    shock(me.x,me.y,'rgba(255,140,40,.9)',6,70,0.45);
    shock(me.x,me.y,'rgba(255,210,63,.6)',6,90,0.7);
    dust(me.x,me.y,26,1.9);
    var n=0, foe=G.offense==='H'?'A':'H';
    for(var i=0;i<G.players.length;i++){
      var q=G.players[i];
      if(q.team!==foe) continue;
      var dd=Math.hypot(q.x-me.x,q.y-me.y);
      if(dd>44) continue;
      n++; q.stun=1.25+Math.random()*0.4;
      launch(q, me.x, me.y, 150, 4.8+Math.random()*1.6);
    }
    say(n?'EARTHQUAKE!':'EARTHQUAKE',760);

  } else if(m==='skyhop'){
    M.moveCd=1.6; me.z=0.05; me.vz=5.6;              // a real leap: up and over, and back down
    M.jukeUntil=performance.now()+900;
    me.vx=fwd.x*BASE_SPD*2.6; me.vy=fwd.y*BASE_SPD*2.6;
    burst(me.x,me.y,'#f1f1ec');
    dust(me.x,me.y,14,1.3); shock(me.x,me.y,'rgba(255,255,255,.8)',4,36,0.3);
    emit(me,'after',0.9,'#e8f4ff');
    say('SKY HOP!',760);

  } else if(m==='afterburner'){
    me.burst=2.0; M.moveCd=2.0; M.stam=Math.min(100,M.stam+45);
    ring(me.x,me.y,'#ff8c2b');
    emit(me,'flame',2.0,'#5fc8ff');                              // blue-white jets
    flash(me.x,me.y-8,'rgba(95,200,255,.9)',30);
    say('AFTERBURNER!',760);

  } else if(m==='phase'){
    me.spin=1.4; M.moveCd=1.2;
    me.phase=0.75;                            // goes half-transparent
    M.jukeUntil=performance.now()+780;
    me.vx=fwd.x*BASE_SPD*2.9; me.vy=fwd.y*BASE_SPD*2.9;
    burst(me.x,me.y,'#7fd8ff');
    emit(me,'swirl',0.9,'#29d3e6');
    say('PHASE SPIN!',760);

  } else if(m==='blur'){
    // short teleport through the rush
    M.moveCd=1.3;
    var hop=34;
    for(var t=0;t<7;t++){
      G.fx.push({x:me.x+fwd.x*hop*(t/7), y:me.y+fwd.y*hop*(t/7)-8,
                 vx:0,vy:-8,life:0.34,max:0.34,r:3.2,c:'#7fd8ff'});
    }
    me.x=Math.max(6,Math.min(FW-6,me.x+fwd.x*hop));
    me.y=Math.max(8,Math.min(FH-8,me.y+fwd.y*hop));
    M.jukeUntil=performance.now()+260;
    if(G.carrier===me){ G.ball.x=me.x; G.ball.y=me.y; }
    for(var bg=1;bg<=5;bg++) G.fx.push({gh:true,x:me.x-fwd.x*hop*(bg/5),y:me.y-fwd.y*hop*(bg/5),
      face:me.face,c:'#b36bff',life:0.2+bg*0.05,max:0.2+bg*0.05});
    flash(me.x,me.y-16,'rgba(179,107,255,.95)',30);
    shock(me.x,me.y,'rgba(179,107,255,.85)',3,30,0.3);
    say('BLUR STEP!',700);

  } else if(m==='rocket'){
    // flat uninterceptable bullet to whoever is most open
    if(me.role!=='QB'||G.carrier!==me||G.thrown||G.windup){ flash(me.x,me.y-20,'rgba(255,140,43,.95)',26); shock(me.x,me.y,'rgba(255,140,43,.8)',3,30,0.3); return; }
    var best=null,bs=-1e9;
    for(var j=0;j<G.players.length;j++){
      var r=G.players[j];
      if(r.team!==G.offense||r===me||r.route==='block') continue;
      var cov=nearestOf(r,G.offense==='H'?'A':'H');
      var op=cov?Math.hypot(cov.x-r.x,cov.y-r.y):70;
      var sc=op*1.2+(r.x-G.los)*d/YD*1.4;
      if(sc>bs){bs=sc;best=r;}
    }
    if(!best){ flash(me.x,me.y-20,'rgba(255,140,43,.95)',26); return; }
    M.moveCd=1.4;
    G.windup={target:best,t:0,dur:0.14,qb:me,rocket:true};
    say('ROCKET!',700);
  }
}

// ---- take over any of your players --------------------------------------
function switchPlayer(side){
  side=side||'H';
  var cur=(side==='H')?G.controlled:G.controlled2;
  var pool=[];
  for(var i=0;i<G.players.length;i++){
    var q=G.players[i];
    if(q.team===side && q.stun<=0 && !(q.down>0)) pool.push(q);
  }
  if(pool.length<2) return;
  // On defence the button ranks your men by how well placed they are to make
  // the play (defScore), not by distance to the ball. The first press gives
  // you the best one; presses in quick succession step down the list.
  var onD=(side!==G.offense) && (G.carrier || G.thrown);
  var bx=G.ball?G.ball.x:0, by=G.ball?G.ball.y:0;
  pool.sort(onD ? function(a,b){ return defScore(a)-defScore(b); }
                : function(a,b){ return Math.hypot(a.x-bx,a.y-by)-Math.hypot(b.x-bx,b.y-by); });
  var nowS=performance.now(), nxt;
  if(G.swCycleUntil>nowS){ var idx=pool.indexOf(cur); nxt=pool[(idx+1)%pool.length]; }
  else if(onD && cur && (pool[0]===cur || defScore(pool[0]) > defScore(cur)-YD)) nxt=null;   // you are already the man: stay on him
  else nxt=(pool[0]===cur) ? pool[1] : pool[0];
  G.swCycleUntil=nowS+1200;
  if(!nxt){ G.switchFlash=0.4; return; }            // (his ring flashes; press again quickly to step down the list)
  if(side==='H') switchTo(nxt);                 // also holds off the automatic switch for a moment
  else { G.controlled2=nxt; }
  say(surname(nxt),600,side);
}



// ------------------------------------------------- effect art
// Five of these are painted white on solid black and composited with
// 'lighter', so the black contributes nothing and the edges blend for free,
// no keying and no fringe. The dust puff is an ordinary opaque sprite, so it
// is the one that gets the magenta treatment.
var FXI={}, FXTINT={};
(function(){
  ['impact','shock','dome','streak','bolt'].forEach(function(n){
    var i=new Image(); i.ready=false; i.tag=n;
    i.onload=function(){ i.ready=true; };
    i.src='parts/fx/fx-'+n+'.png';
    FXI[n]=i;
  });
  var d=new Image();
  d.onload=function(){
    var c=document.createElement('canvas'); c.width=d.width; c.height=d.height;
    var x=c.getContext('2d'); x.drawImage(d,0,0);
    try{
      var im=x.getImageData(0,0,c.width,c.height), a=im.data;
      for(var i=0;i<a.length;i+=4){
        if(a[i]>195 && a[i+1]<80 && a[i+2]>195) a[i+3]=0;
      }
      x.putImageData(im,0,0);
    }catch(e){}
    FXI.dust=c; FXI.dust.ready=true;
  };
  d.src='parts/fx/fx-dust.png';
})();

// rgba(...) or #hex down to a solid colour we can multiply by
function solidOf(c){
  if(!c) return '#ffffff';
  if(c.charAt(0)==='#') return c;
  var m=/rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/.exec(c);
  return m ? ('rgb('+m[1]+','+m[2]+','+m[3]+')') : '#ffffff';
}
// white art multiplied by a colour, cached, because these repeat constantly
function fxTint(img,col){
  if(!img||!img.ready) return null;
  var key=img.tag+'|'+col;
  if(FXTINT[key]) return FXTINT[key];
  var c=document.createElement('canvas'); c.width=img.width; c.height=img.height;
  var x=c.getContext('2d');
  x.drawImage(img,0,0);
  x.globalCompositeOperation='multiply';
  x.fillStyle=col; x.fillRect(0,0,c.width,c.height);
  FXTINT[key]=c; c.ready=true;
  return c;
}
function addSprite(img,x,y,w,h,a,rot,sy){
  if(!img) return false;
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  ctx.globalAlpha=a;
  ctx.translate(x,y);
  if(rot) ctx.rotate(rot);
  if(sy&&sy!==1) ctx.scale(1,sy);
  ctx.drawImage(img,-w/2,-h/2,w,h);
  ctx.restore();
  return true;
}

// ---- swipe to tackle -----------------------------------------------------
// On defence, a quick flick of the cursor sends your man into a diving
// tackle along the swipe. Nothing to click; the gesture is the input.
var SWIPE={x:0,y:0,t:0};
// A swipe on a touch screen is a slide tackle. Your man drops into a low,
// head-first dive and shoots along the swipe for about a third of a second:
//  - the ball carrier within 7 yards and not behind the slide (or within
//    4.5 yards any way): the dive bends onto him and grabs him on contact,
//    then the drain takes him down (the tackle loop);
//  - anyone else from the other team within 3.5 yards: knocked flat;
//  - nobody: he skids a couple of yards on the grass and gets up.
// It is a dive, not a sprint: he is flat out and low the whole way. Your own
// team is never hit.
var TACKLE_REACH=3.5*YD, SLIDE_REACH=9*YD;
// Contact is a clinch, not a hit. A defender who gets to the ball carrier
// squares up and holds him there, and the fight comes out of the carrier one
// punch at a time: the first after BOX_FIRST, then one every BOX_EVERY (game
// seconds). You can see every blow, and answer it with your own.
// All of it tuned in simulation against the old touch-damage numbers
// (yards, sacks, escapes), with the whistle now about a second after the grab.
var BOX_FIRST=0.24, BOX_EVERY=0.3, BOX_RATE=1.2;   // when the punches come, and how hard (x the old drain)
var BOX_YOU=0.6, BOX_YOUHOLD=0.15;                 // your own man punches faster and holds him tighter
var BOX_HOLD=0.45, BOX_HOLDYOU=0.3;                // how far a held runner still moves: the computer's, yours
var BOX_BREAK=0.18, BOX_LOOSEN=0.05;               // your punch: chance to break the grip, grip it takes off
var BOX_CANCEL=true, BOX_REDO=0.08;                // your punch knocks his swing off; he comes back this soon
var BOX_AI_BREAK=0.15, BOX_WRIGGLE=0.002;          // the computer's runner punching back, and spinning out, while held
var BOX_ASSIST=false, BOX_QB_ASSIST=true;          // the automatic sidestep and stiff arm in a clinch: a passer's only
var POW_WORDS=['POW','BAM','WHAM','SMACK','THUD','CRACK','BOOM'];
// Control jumping to the next man up by itself (when the runner beats yours,
// or yours is out of the play): off. He did not want his man changing unless
// he asked; the SWITCH button does it.
var AUTO_NEXT=false, AUTO_FAR=false, AUTO_SWITCH=false;
var PUNCH_DUR=0.19, CP_EVERY=0.3;   // a punch's swing, and how soon the ball carrier can throw the next (game seconds)
// Once the runner is past the line the computer's defenders chase at 1.5x
// (openChase) and yours stayed at 1x, so the man you were steering fell
// behind his own team-mates. He chases as fast as they do now.
var DEF_CHASE=true;
function touchTackle(me,dx,dy){
  if(!G || G.phase!=='live' || !me || me.stun>0 || me.down>0 || G.offense===me.team) return false;
  if(G.diveCd>0) return false;
  G.diveCd=0.45;
  var dm=Math.hypot(dx,dy)||1; dx/=dm; dy/=dm;
  var now=performance.now();
  // the ball carrier first: close, or in front of the slide (a wide cone, so
  // an imperfect swipe still finds him)
  var best=null, car=G.carrier;
  if(car && car.team!==me.team && !(car.down>0)){
    var cx=car.x+car.vx*0.15-me.x, cy=car.y+car.vy*0.15-me.y, cd=Math.hypot(cx,cy)||1;
    // (a swipe on a slanted camera is further off on the field than it looks,
    // so the only slide that does not go at him is one pointed away from him)
    if(cd<TACKLE_REACH*1.3 || (cd<SLIDE_REACH && (cx*dx+cy*dy)/cd > 0)) best=car;
  }
  // otherwise whoever from the other team is right there along the swipe
  if(!best){
    var bs=1e9;
    for(var i=0;i<G.players.length;i++){
      var q=G.players[i];
      if(q.team===me.team || q.down>0 || q===car) continue;
      var qx=q.x-me.x, qy=q.y-me.y, qd=Math.hypot(qx,qy)||1;
      if(qd>TACKLE_REACH) continue;
      var sc=qd*(1.8-(qx*dx+qy*dy)/qd);
      if(sc<bs){ bs=sc; best=q; }
    }
  }
  var gs=GAME_SPEED||1;
  me.z=0.1; me.vz=0; me.arm=0;
  if(best===car && car){
    // the slide: fast enough to cover the gap in about a third of a second
    var tx=car.x+car.vx*0.2-me.x, ty=car.y+car.vy*0.2-me.y, td=Math.hypot(tx,ty)||1;
    var T=Math.max(0.16, Math.min(0.4, 0.12+td/YD*0.03));
    var sp=Math.max(BASE_SPD*1.6, (td-TACKLE_R*0.5)/T);
    me.face=tx>=0?1:-1; me.vx=tx/td*sp; me.vy=ty/td*sp;
    G.touchDive=true; G.diveFly=sp;
    G.diveUntil=now+T/gs*1000+90;
    me.slideAt=now; me.slideUntil=now+T/gs*1000+160;
  } else if(best){
    // a blocker, a receiver, whoever: flattened
    var ox=best.x-me.x, oy=best.y-me.y, od=Math.hypot(ox,oy)||1;
    me.face=ox>=0?1:-1; me.vx=ox/od*Math.max(BASE_SPD,od/0.12); me.vy=oy/od*Math.max(BASE_SPD,od/0.12);
    best.stun=Math.max(best.stun||0,1.0); best.down=Math.max(best.down||0,1.0);
    best.vx=ox/od*70; best.vy=oy/od*70; best.locked=0;
    if(best.assign===me || best.eBlk===me) me.engaged=Math.max(me.engaged||0,(me.shedAt||2.5)+0.01);
    pow((best.x+me.x)/2,best.y-14,'#ffffff'); G.hitStopUntil=now+50;
    G.shake=REDUCED?0:Math.max(G.shake,6);
    G.touchDive=false; G.diveUntil=now+0.2/gs*1000;
    me.slideAt=now; me.slideUntil=now+0.2/gs*1000+160;
  } else {
    // at thin air: a skid of a couple of yards, then up
    me.face=dx>=0?1:-1; me.vx=dx*BASE_SPD*1.5; me.vy=dy*BASE_SPD*1.5;
    G.touchDive=false; G.diveUntil=now+0.26/gs*1000;
    me.slideAt=now; me.slideUntil=now+0.26/gs*1000+200;
    dust(me.x,me.y,6,0.8);
  }
  return true;
}
function swipeTackle(dx,dy,side){
  if(!G||G.phase!=='live') return false;
  var mine=((side||'H')==='H')?G.controlled:G.controlled2;
  if(!mine||mine.stun>0) return false;
  if(G.offense===((side||'H'))) return false;          // defence only
  var M=((side||'H')==='H')?G:G.M2;
  if(M.diveCd>0) return false;
  M.diveCd=0.75;
  var m=Math.hypot(dx,dy)||1; dx/=m; dy/=m;
  // Aim assist: a drag that points roughly at the ball carrier snaps onto
  // him, led by where he is going, so a slightly-off flick still connects.
  var c=G.carrier;
  if(c && c.team!==mine.team){
    var lx=c.x+c.vx*0.25-mine.x, ly=c.y+c.vy*0.25-mine.y, lm=Math.hypot(lx,ly)||1;
    if(lm<9*YD && (dx*lx+dy*ly)/lm > 0.82){ dx=lx/lm; dy=ly/lm; }
  }
  mine.vx=dx*BASE_SPD*3.1; mine.vy=dy*BASE_SPD*3.1;
  mine.z=0.05; mine.vz=2.4;
  if(side==='H') G.diveUntil=performance.now()+430;
  else G.M2.diveUntil=performance.now()+430;
  streak(mine.x,mine.y-16, mine.x+dx*38, mine.y-16+dy*38,'rgba(255,255,255,.75)',2.2,0.20);
  dust(mine.x,mine.y,7,0.9);
  say('DIVE!',420,side);
  return true;
}

// ---- handoff: give it to the back, no risk, no air under it --------------
var HANDOFF_R = 30;
function handoffTarget(){
  if(!G.carrier || G.carrier.role!=='QB') return null;
  var best=null, bd=Infinity;
  for(var i=0;i<G.players.length;i++){
    var q=G.players[i];
    if(q.team!==G.offense||q===G.carrier||q.stun>0) continue;
    if(q.role!=='RB'&&q.role!=='TE') continue;
    var dd=Math.hypot(q.x-G.carrier.x,q.y-G.carrier.y);
    if(dd<bd && dd<HANDOFF_R){ bd=dd; best=q; }
  }
  return best;
}

function handoff(side, auto){
  if(!G.carrier||G.thrown||G.loose||G.windup) return false;
  if(!auto){
    var mine=((side||'H')==='H')?G.controlled:G.controlled2;
    if(mine!==G.carrier) return false;
  }
  var back=handoffTarget();
  if(!back) return false;
  var qb=G.carrier;
  qb.throwArm=0.4;
  if(G.cur && !G.cur.rusher) G.cur.rusher=back;
  G.carrier=back; G.ball.held=true; G.ball.x=back.x; G.ball.y=back.y;
  back.route=null;                       // he is running now, not running a route
  back.burst=0.45;
  G.handoffAt=null;
  if(G.offense==='H') G.controlled=back; else if(NET.on) G.controlled2=back;
  say('HANDOFF',450,G.offense);
  return true;
}

// ---- lateral: pitch it backwards to a trailing team-mate -----------------
function lateral(side){
  var mine=((side||'H')==='H')?G.controlled:G.controlled2;
  if(!G.carrier||mine!==G.carrier||G.thrown||G.loose||G.windup) return;
  var d=dir(), best=null, bd=Infinity;
  for(var i=0;i<G.players.length;i++){
    var q=G.players[i];
    if(q.team!==G.offense||q===G.carrier||q.stun>0) continue;
    if(q.role==='C'||q.role==='OL'||q.role==='BL') continue;   // never pitch it to a lineman
    if((q.x-G.carrier.x)*d > -2) continue;          // must be behind the ball
    var dd=Math.hypot(q.x-G.carrier.x,q.y-G.carrier.y);
    if(dd<bd && dd<30*YD){ bd=dd; best=q; }
  }
  if(!best){ say('NO ONE BACK THERE',600); return; }
  G.thrown={x:G.ball.x,y:G.ball.y,tx:best.x,ty:best.y,target:best,t:0,
            dur:Math.max(0.16,bd/900), lat:true, arc:4};
  G.ball.held=false; G.carrier=null;
  say('LATERAL!',600);
}

// ---- catches, picks and tips --------------------------------------------
function completePass(r, homing, wasLat){
  if(G.cur) G.cur.comp=true;
  G.carrier=r; G.ball.held=true;
  if(G.offense==='H') G.controlled=r; else if(NET.on) G.controlled2=r;
  if(homing){                                  // caught in stride, not standing still
    r.iFrames=Math.max(r.iFrames,0.7); r.burst=1.1; r.wrapped=0;
    burst(r.x,r.y,'#7fd8ff'); ring(r.x,r.y,'#7fd8ff');
  }
  say(wasLat?'GOT IT!':'CAUGHT!',500);
}
function interceptBy(cov){
  // Picked off, and it is live. He can take it all the way back.
  if(G.cur) G.cur.pick=true;
  G.offense=cov.team;
  G.newSeries=true;
  G.carrier=cov; G.ball.held=true;
  G.ball.x=cov.x; G.ball.y=cov.y;
  cov.iFrames=0.4; cov.hp=100;
  if(cov.team==='H') G.controlled=cov; else if(NET.on) G.controlled2=cov;
  burst(cov.x,cov.y,'#ffd23f'); burst(cov.x,cov.y,'#ffffff');
  G.shake=REDUCED?0:14;
  say(cov.team==='H'?'PICKED OFF — RUN IT BACK!':'INTERCEPTED!',1400);
  credit(cov,'INTERCEPTION');
}
// A hand gets on it and it pops up: a short, high, wobbling flight to a new
// spot a few yards off. Nobody owns it. Whoever gets under it first takes it,
// offence or defence; if nobody does, it hits the grass.
function tipBall(by){
  var a=Math.random()*Math.PI*2, r0=(2+Math.random()*3.5)*YD;
  var tx=Math.max(10,Math.min(FW-10, G.ball.x+Math.cos(a)*r0));
  var ty=Math.max(10,Math.min(FH-10, G.ball.y+Math.sin(a)*r0));
  G.thrown={x:G.ball.x, y:G.ball.y, tx:tx, ty:ty, target:null, t:0, dur:0.8,
            arc:34, tip:true, wob:0.45, deep:false};
  burst(G.ball.x, G.ball.y-18, '#ffffff');
  if(by) by.arm=0.5;
  if(G.cur) credit(by,'PASS DEFENDED');
}
function resolveTip(){
  var tc=null, tcd=CATCH_R*1.7;
  for(var i=0;i<G.players.length;i++){
    var q=G.players[i];
    if(q.stun>0 || q.down>0) continue;
    if(q.team===G.offense && (q.role==='C'||q.role==='OL'||q.role==='BL')) continue;   // an offensive lineman may not catch it
    var d=Math.hypot(q.x-G.ball.x, q.y-G.ball.y);
    if(d<tcd){ tcd=d; tc=q; }
  }
  G.thrown=null;
  if(tc && tc.team===G.offense){ completePass(tc,false,false); return; }
  if(tc){ interceptBy(tc); return; }
  endPlay(G.los,'BROKEN UP');
}
// K on defence while the ball is in the air: leap and swing at it.
function swatAt(me){
  me.swatUntil=performance.now()+420;
  me.arm=0.5; me.z=Math.max(me.z||0,0.35);
}

// ---- the ball comes loose ------------------------------------------------
function fumble(from,vx,vy){
  if(G.cur && from && from.team===G.cur.team) G.cur.fum=true;
  G.carrier=null; G.thrown=null; G.windup=null;
  G.ball.held=false;
  // it squirts clear of the pile, so it reads as a loose ball and a
  // scramble, not one more body going down in a tackle
  var ls=Math.hypot(vx,vy);
  if(ls<150){ var la=ls>1 ? Math.atan2(vy,vx) : Math.random()*Math.PI*2; vx=Math.cos(la)*150; vy=Math.sin(la)*150; }
  G.loose={vx:vx,vy:vy,t:0,h:4,vz:190};           // pops up out of his hands
  if(from){
    from.stun=1.2;
    for(var fw=0;fw<G.players.length;fw++){ var fq=G.players[fw]; if(fq.wrapT>0){ fq.wrapT=0; fq.boxV=null; } }   // everyone lets go of him
    flash(from.x, from.y-18, 'rgba(255,255,255,.95)', 30);
    pow(from.x, from.y-30, '#ffffff', 1.4, 'FUMBLE');
  }
}

// The kicking team gets to a kick the receivers never touched: it is dead
// right there and it is the receiving team's ball (in their end zone, a
// touchback).
function downKick(p){
  var x=G.ball.x, d=dir(), own=(d>0)?EZ:FW-EZ;         // the receiving team's own goal line
  G.loose=null; G.ball.held=false;
  burst(x, G.ball.y, '#eef3e8');
  if((x-own)*d < 0){ G.kickReturn=false; kickoffTouchback(20); return; }
  say('DOWNED AT THE '+yardLineLabel(x), 1300);
  endPlay(x, 'DOWNED');
}
function recoverBall(p){
  G.loose=null; G.ball.held=true;
  var wasOff=G.offense;
  var scoopSix = (p.team!==wasOff);

  // Whoever falls on it picks it up and keeps running. A defence that
  // recovers is now the offence and is going the other way.
  G.carrier=p;
  p.iFrames=0.35;                       // a moment to gather it before contact
  if(scoopSix){
    G.offense=p.team;
    G.newSeries=true;                   // endPlay starts a fresh set of downs
    say(p.team==='H'?'YOU SCOOP IT — RUN!':'THEY SCOOP IT',1200);
  } else {
    say('HE HAS IT — GO!',1000);
  }
  if(p.team==='H') G.controlled=p;      // you take over the recovery
  else if(NET.on) G.controlled2=p;
  credit(p, scoopSix?'SCOOP':'RECOVERY');
  burst(p.x,p.y,'#f1f1ec');
  G.shake=REDUCED?0:10;
  // the play stays live
}

// ---- defensive brawling --------------------------------------------------
function bigHit(me,M){
  M=M||G;
  if(M.hitCd>0 && TOUCH_UI){ M.punchBuf=performance.now(); return; }   // tapped a beat early: it goes off when ready
  if(!G.carrier||M.power<45||M.hitCd>0) return;
  M.punchBuf=0;
  var c=G.carrier, dd=Math.hypot(c.x-me.x,c.y-me.y);
