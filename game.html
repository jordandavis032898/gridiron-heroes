  // A punch: he winds up, steps in (a quick lunge, so the fist really lands
  // on the man instead of swinging at air from yards away), and it connects
  // (landPunch). A tenth of his fight, and he snaps back a step.
  var reach=TOUCH_UI ? 4*YD : 2.5*YD;
  M.hitCd=TOUCH_UI ? 0.32 : 0.8; M.power-=45;
  me.punchT=0.001; me.punchDur=PUNCH_DUR; me.punchHit=false;
  me.punchV=(dd<=reach && c.team!==me.team) ? c : null;   // nobody in reach: a jab at the air
  if(me.punchV) me.punchFace=(c.x>=me.x)?1:-1;             // turn to him, wherever he is
  if(!me.punchV && TOUCH_UI){ M.hitCd=0.22; }
}
// The ball carrier punches: the man hanging on to him first, otherwise the
// nearest defender within three yards. On a man who has hold of him it breaks
// the grip about one time in four (a special move's grab less, a person's
// never); otherwise it loosens him and stops the drain for a beat. On a man
// who is only closing in (a rusher on the passer), it knocks him back.
function carrierPunch(me,M,ai){
  M=M||G;
  if(!me || me!==G.carrier || G.phase!=='live' || G.thrown) return;
  if(M.cpCd>0){ M.cpBuf=performance.now(); return; }
  M.cpCd=CP_EVERY; M.cpBuf=0;
  var foe=null, bd=4*YD;                             // (four yards, the same reach as a punch on defence)
  for(var i=0;i<G.players.length;i++){
    var q=G.players[i];
    if(q.team===me.team || q.down>0) continue;
    if(q.wrapT>0){ foe=q; break; }
    var qd=Math.hypot(q.x-me.x,q.y-me.y);
    if(qd<bd && !(q.stun>0)){ bd=qd; foe=q; }
  }
  me.punchT=0.001; me.punchDur=PUNCH_DUR*0.8; me.punchV=null; me.punchHit=true;   // the swing (no step: he keeps his feet under him)
  if(!foe){ me.punchFace=0; return; }
  me.face=me.punchFace=(foe.x>=me.x)?1:-1;           // he turns to the man, even one behind him
  var kx=foe.x-me.x, ky=foe.y-me.y, km=Math.hypot(kx,ky)||1;
  pow((foe.x+me.x)/2, foe.y-18, '#ffd23f', 1.3, powWord()); G.hitStopUntil=performance.now()+50; G.shake=REDUCED?0:7;
  if(foe.wrapT>0){
    var breakChance = foe.humanWrap ? 0 : ((foe.strongGrab||foe.gripLock) ? 0.15 : BOX_BREAK);   // tuned in simulation: about half of grabs broken when you keep punching
    if(ai) breakChance*=BOX_AI_BREAK;
    if(Math.random()<breakChance){
      breakWrap(foe, me);
      foe.stun=Math.max(foe.stun,0.6); foe._pst=foe.stun; launch(foe, me.x, me.y, 130, 2.6);
      me.iFrames=Math.max(me.iFrames||0,0.3);
      if(me===G.controlled) hint('BROKE FREE',700);
    } else {
      foe.wrapT=Math.max(0.25, foe.wrapT-BOX_LOOSEN); G.drainPause=G.gt+0.12;   // rocked: the grip loosens a little
      foe.lean=-0.4; foe.sq=0.2;
      if(!foe.humanWrap){                               // (your own tackle is not knocked off its rhythm)
        // his swing is knocked off, but he comes straight back with it (a
        // fast enough puncher used to keep him from ever landing one)
        if(BOX_CANCEL && foe.boxV && foe.punchT>0){ foe.punchT=0; foe.boxV=null; foe.boxAcc=(foe.boxAcc||0)+(foe.boxDmg||0); foe.boxT=BOX_REDO; }
      }
    }
  } else {
    foe.stun=Math.max(foe.stun,0.22); foe._pst=foe.stun;                    // shoved back a step, not out of the play
    launch(foe, me.x, me.y, 85, 1.8);
  }
}
// A man in a clinch throws one: the swing starts now and the damage lands
// with the fist (punchTick, boxLand).
function boxPunch(t,car){
  // what the contact used to take comes over the first two, not in one
  // knockout blow: boxing, not a single haymaker
  var part=(t.boxHit||0)>24 ? t.boxHit*0.5 : (t.boxHit||0);
  t.boxDmg=(t.boxAcc||0) + part/Math.max(0.7,car.pwr||1);
  t.boxAcc=0; t.boxHit=(t.boxHit||0)-part;
  t.boxFumNow=!!t.boxFum; t.boxFum=false;           // (the first punch of a clinch is the one that can shake it loose)
  t.boxT=BOX_EVERY*(t.humanWrap?BOX_YOU:1)*(0.85+Math.random()*0.3);   // your own man throws them faster
  t.face=(car.x>=t.x)?1:-1;
  t.punchT=0.001; t.punchDur=PUNCH_DUR; t.punchV=null; t.punchHit=false; t.boxV=car; t.punchFace=t.face;
}
function powWord(){ return POW_WORDS[(Math.random()*POW_WORDS.length)|0]; }
function boxLand(me,c,dmg){
  if(!c || G.carrier!==c || G.phase!=='live' || !(me.wrapT>0)){ return; }   // he let go mid-swing
  var mine=(me===G.controlled||me===G.controlled2||c===G.controlled||c===G.controlled2);
  c.hp-=dmg;
  pow((me.x+c.x)/2, c.y-32, me.team==='H'?'#ffd23f':'#ff7a5c', 1.0, powWord());   // at head height, clear of the bodies
  dmgText(c,'-'+Math.round(dmg), me.team==='H'?'#ffffff':'#ff8a94');
  c.lean=-0.5; c.sq=0.22;                          // his head snaps back
  if(mine){ G.hitStopUntil=Math.max(G.hitStopUntil||0, performance.now()+55); G.shake=REDUCED?0:Math.max(G.shake,6); }
  if(me.boxFumNow && c.hp>0 && c.hp<30 && Math.random()<0.025){
    fumble(c, (c.x-me.x)*5+c.vx*0.4, (c.y-me.y)*5+c.vy*0.4);
    say('FUMBLE!',1100);
  }
  me.boxFumNow=false;
}
// linemen locked up trade jabs: you can see them land, they decide nothing
function jab(me,v){
  me.face=(v.x>=me.x)?1:-1;
  me.punchT=0.001; me.punchDur=PUNCH_DUR*0.9; me.punchV=null; me.punchHit=false; me.jabV=v; me.punchFace=me.face;
}
// the frame the fist lands
function landPunch(me,c){
  if(!c || G.carrier!==c || G.phase!=='live') return;
  var fx=c.x-(me.face||1)*3, fy=c.y-20;
  G.hitStopUntil=performance.now()+60;              // a beat of freeze so the hit has weight
  G.shake=REDUCED?0:8;
  pow(fx,fy,'#ffd23f',1.3,powWord());
  c.lean=-0.5; c.sq=0.22;                           // his head snaps back
  var kx=c.x-me.x, ky=c.y-me.y, km=Math.hypot(kx,ky)||1;
  c.vx=c.vx*0.3+kx/km*80; c.vy=c.vy*0.3+ky/km*80;   // and he stumbles back a step
  if(Math.random() < 0.04/Math.max(0.8,c.pwr||1)){
    fumble(c,kx/km*160,ky/km*160);
    say('FUMBLE!',1200); credit(me,'FORCED FUMBLE');
  } else {
    c.hp-=10;
    dmgText(c,'-10','#ffd23f');
    credit(me,'BIG HIT');
    if(c.hp<=0){ c.down=1.6; endPlay(c.x,'BIG HIT'); }
  }
}
// the punch as it plays out: the wind up, then the step in, then the landing
function punchTick(me,dt){
  if(!(me.punchT>0)) return;
  var PD=me.punchDur||0.27, PT=me.punchT;
  me.punchT+=dt;
  var v=me.punchV;
  if(v && !me.punchHit && PT>PD*0.18){
    var lx=v.x-me.x, ly=v.y-me.y, ld=Math.hypot(lx,ly)||1, stop=15;
    me.face=lx>=0?1:-1; me.lean=0.28;
    var left=Math.max(dt, PD*0.6-PT);
    if(ld>stop){ var st=Math.min(ld-stop, (ld-stop)*dt/left + 0.5); me.x+=lx/ld*st; me.y+=ly/ld*st; }
    if(PT>=PD*0.6 || ld<=stop+1.5){ me.punchHit=true; landPunch(me,v); }
  }
  if(me.boxV && !me.punchHit && PT>PD*0.36){ me.punchHit=true; var bv=me.boxV; me.boxV=null; boxLand(me, bv, me.boxDmg||0); }
  if(me.jabV && !me.punchHit && PT>PD*0.36){
    me.punchHit=true; var jv=me.jabV; me.jabV=null;
    pow((me.x+jv.x)/2, jv.y-20, '#ffffff', 0.6);
    jv.lean=-0.25;
  }
  if(me.punchT>=PD){ me.punchT=0; me.punchV=null; me.punchHit=false; me.boxV=null; me.jabV=null; me.punchFace=0; }
}
// a comic-book starburst where a blow lands
function pow(x,y,c,sz,word){
  if(REDUCED) return;
  sz=(sz||1)*(TOUCH_UI?1.3:1);                      // a phone's players are small: so are its hits, unless they are bigger
  var lf=0.16*Math.max(0.8,Math.min(1.9,sz));
  G.fx.push({pow:true,x:x,y:y,c:c||'#ffd23f',rot:Math.random()*6.28,vx:0,vy:0,life:lf,max:lf,sz:sz,word:word||null});
}

function groundPound(me,M){
  M=M||G;
  if(M.power<58||M.hitCd>0) return;
  M.power-=58; M.hitCd=1.3; me.z=0.05; me.vz=3.9;
  G.shake=REDUCED?0:22;
  crack(me.x,me.y,50,'rgba(255,190,60,');
  ring(me.x,me.y,'#ffd23f');
  burst(me.x,me.y,'#ffd23f'); burst(me.x,me.y,'#ff8c2b');
  var hit=0;
  for(var i=0;i<G.players.length;i++){
    var q=G.players[i];
    if(q===me||q.team===me.team) continue;
    var dd=Math.hypot(q.x-me.x,q.y-me.y);
    if(dd>38) continue;
    hit++; q.stun=1.5;
    launch(q, me.x, me.y, 190, 4.4+Math.random()*1.2);
  }
  if(G.carrier && Math.hypot(G.carrier.x-me.x,G.carrier.y-me.y)<38){
    if(Math.random()<0.10){
      fumble(G.carrier,(G.carrier.x-me.x)*3.4,(G.carrier.y-me.y)*3.4);
      say('POUND — FUMBLE!',1300); credit(me,'GROUND POUND'); return;
    }
    G.carrier.hp-=88; G.carrier.vx*=0.15; G.carrier.vy*=0.15;
    say('GROUND POUND!',760); credit(me,'GROUND POUND');
    if(G.carrier.hp<=0) endPlay(G.carrier.x,'POUNDED');
    return;
  }
  say(hit?'GROUND POUND!':'GROUND POUND',700);
}

function burst(x,y,c){
  for(var i=0;i<10;i++){
    var a=Math.random()*Math.PI*2, s=40+Math.random()*90;
    G.fx.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.45,max:0.45,c:c});
  }
}

// ================================================================ simulation
function routePoint(p,since){
  var d=dir(), mid=FH/2;
  // never send a man past the back of the end zone; in the red zone he
  // works across the face of the goal line instead
  var endLine = d>0 ? (FW-EZ*0.45) : (EZ*0.45);
  if(p.route==='go'){
    var cap=G.los+38*YD*d;                        // a streak is not a marathon
    var tx=p.x+40*YD*d;
    if((d>0&&tx>cap)||(d<0&&tx<cap)) tx=cap;
    if((d>0&&tx>endLine)||(d<0&&tx<endLine)){
      return {x:endLine, y:p.y+Math.sin(since*1.9)*5*YD};
    }
    return {x:tx, y:p.y+Math.sin(since*1.6)*1.4*YD};
  }
  var br=p.brk||1;                       // which way he broke, fixed at the snap
  if(p.route==='slant'){
    if(since<0.45) return {x:p.x+6*YD*d, y:p.y};        // stem, then break in
    return {x:p.x+5*YD*d, y:mid+br*6*YD};
  }
  if(p.route==='flat')  return {x:p.x+5*YD*d,  y:p.y-br*9*YD};

  // break for the sideline once he has the depth
  if(p.route==='out'){
    if(since<1.05) return {x:p.x+12*YD*d, y:p.y};
    return {x:p.x+2*YD*d, y:(br>0 ? 4*YD : FH-4*YD)};
  }
  // get depth, then come back to the ball
  if(p.route==='curl'){
    if(since<1.35) return {x:p.x+12*YD*d, y:p.y};
    var cq=G.carrier;
    return {x:p.x-4*YD*d, y:cq?(p.y*0.75+cq.y*0.25):p.y};
  }
  // widen, then straight up the sideline
  if(p.route==='wheel'){
    if(since<0.75) return {x:p.x+2*YD*d, y:p.y-br*8*YD};
    return {x:p.x+30*YD*d, y:p.y};
  }
  // the mesh point: run at the passer and take the ball off him
  if(p.route==='mesh'){
    var mq=G.carrier;
    // The exchange is only on for a moment. No handoff by then and he carries
    // out his job: he leads up the hole and blocks, instead of standing glued
    // to the quarterback waiting for a ball that is not coming.
    var meshT = (G.offense==='H' && !NET.on) ? 1.2 : 1.05;
    if(!mq || mq.role!=='QB' || since>meshT){
      // no handoff: he stays home and blocks the nearest rusher nobody has
      p.route='block';
      var foeT=(p.team==='H')?'A':'H', best=null, bd=1e9;
      for(var bi=0;bi<G.players.length;bi++){ var bq=G.players[bi];
        if(bq.team!==foeT || bq.stun>0) continue;
        var taken=false; for(var bj=0;bj<G.players.length;bj++) if(G.players[bj].assign===bq){ taken=true; break; }
        if(taken) continue;
        var bdd=Math.hypot(bq.x-(mq?mq.x:p.x),bq.y-(mq?mq.y:p.y)); if(bdd<bd){ bd=bdd; best=bq; } }
      p.assign=best;
      return {x:p.x, y:p.y};
    }
    return {x:mq.x+1.6*YD*d, y:mq.y+(p.y>=mq.y?1:-1)*0.8*YD};   // at his hip, not on top of him
  }
  // slip out behind the rush, then turn upfield
  if(p.route==='screen'){
    if(since<0.8) return {x:G.los-4*YD*d, y:p.y-br*7*YD};
    return {x:p.x+20*YD*d, y:p.y};
  }
  return null;
}
// A back left in to block does it with his head up: he picks up whoever is
// coming free at the quarterback, and once nobody is (or he has held his man
// a couple of seconds) he slips out into the flat as the checkdown.
function rbProtect(p, since, dt){
  if(p.route!=='block' || !G.carrier || G.carrier.role!=='QB' || G.thrown || pastTheLine(G.carrier)) return;
  var qb=G.carrier, threat=null, td=6.5*YD, foeT=(p.team==='H')?'A':'H';
  for(var i=0;i<G.players.length;i++){
    var q=G.players[i];
    if(q.team!==foeT || q.stun>0 || q.down>0) continue;
    if(q.eBlk && q.eBlk!==p && (q.engaged||0)>0 && (q.engaged||0)<=(q.shedAt||2.5)) continue;   // a lineman has him
    var dq=Math.hypot(q.x-qb.x,q.y-qb.y);
    if(dq<td){ td=dq; threat=q; }
  }
  p.protT=(p.protT||0)+dt;
  if(threat){ p.assign=threat; p.quietT=0; }
  else p.quietT=(p.quietT||0)+dt;
  if(since>0.9 && (p.quietT>0.5 || p.protT>2.1)){ p.route='flat'; p.assign=null; }   // nobody to pick up: out he goes
}
// Full pursuit speed only once the ball is at or past the line. Applying it
// to a pocket rush makes blocking mathematically impossible.
function openChase(){
  if(!G.carrier) return 1.0;
  var past=(G.carrier.x-G.los)*dir();
  return past > -2 ? 1.5 : 1.0;
}

// Sample headings and take the one with the most daylight toward the goal.
// A carrier who only flees the nearest man runs straight into everyone else.
function runLane(p,d){
  var best={x:d,y:0}, bestScore=-1e9;
  var foes=[], foeTeam=(p.team==='H'?'A':'H');
  for(var i=0;i<G.players.length;i++){
    var q=G.players[i];
    if(q.team!==foeTeam||q.stun>0) continue;
    if(Math.hypot(q.x-p.x,q.y-p.y)>34*YD) continue;
    foes.push(q);
  }
  for(var a=-1.15;a<=1.15;a+=0.19){
    var vx=Math.cos(a)*d, vy=Math.sin(a);
    var sc=vx*d*130;                                  // reward going forward
    var px=p.x+vx*58, py=p.y+vy*58;                   // where that heading puts him
    for(var f=0;f<foes.length;f++){
      var q2=foes[f];
      var qx=q2.x+q2.vx*0.4, qy=q2.y+q2.vy*0.4;       // lead their pursuit
      var gap=Math.hypot(qx-px,qy-py);
      if(gap<70) sc-=(70-gap)*(70-gap)*0.045;
    }
    if(py<52||py>FH-52) sc-=90;                       // do not run at the sideline
    if(sc>bestScore){ bestScore=sc; best={x:vx,y:vy}; }
  }
  return best;
}

function aim(p,tx,ty,spd){
  if(!isFinite(tx)||!isFinite(ty)||!isFinite(spd)) return;   // refuse nowhere
  if(p.team==='A' && !NET.on) spd*=FOE.spd;                   // the team you picked sets their pace
  spd*=buffMul(p);
  var dx=tx-p.x,dy=ty-p.y,m=Math.hypot(dx,dy)||1;
  p.vx=dx/m*spd; p.vy=dy/m*spd;
}

// ---- CPU signature moves, so the AI is not just running in a straight line
// How often each move gets considered, per frame, once the situation fits.
// The cheap ones fire freely; the ones that decide a play are rationed hard
// so the computer cannot open with a teleport on every snap.
// The simulation had the computer firing 4 to 5 moves every play, the common
// ones (block, clothesline, stiff arm) almost the moment they were ready,
// which drowned out everything else. They come out far less often now.
var AI_ODDS = {
  stiffarm:0.018, spin:0.016, clothesline:0.012, superblock:0.012,
  dash:0.014, superspeed:0.012, slam:0.012, rocket:0.020,
  forcefield:0.018, fumblegen:0.007, teleport:0.014, perfect:0.014,   // (fumblegen: a tackle now takes a second, so he is in reach longer)
  aagun:0.011
};

// The computer now plays out of the same kits the player does, rather than a
// separate hard-coded set of specials.
function cpuAbilities(dt,now){
  // a pass in the air: Peter Pan flies up for it, Robin Hood makes it sure,
  // and a Dracula on the other side may come down on the man it is thrown to
  if(G.thrown && G.phase==='live' && !G.thrown.lat && !G.thrown.kickoff && !G.thrown.sigTried && G.thrown.target){
    G.thrown.sigTried=true;
    var rt=G.thrown.target;
    if(rt!==G.controlled && rt!==G.controlled2 && !(rt.stun>0)){
      var rk=kitFor(rt);
      ['flight','bullseye'].forEach(function(m){
        if(G.thrown && rk.indexOf(m)>=0 && abReady(rt,m) && Math.random()<0.85) fireAbility({man:rt,local:false}, null, rk.indexOf(m));
      });
    }
    for(var bi=0;bi<G.players.length && G.thrown;bi++){
      var bq=G.players[bi];
      if(bq.team===G.offense || bq===G.controlled || bq===G.controlled2 || bq.stun>0) continue;
      var bk=kitFor(bq);
      if(bk.indexOf('bats')<0 || !abReady(bq,'bats') || sigSpent(bq.team)) continue;
      if(Math.random() < 0.3*(bq.team==='A' && !NET.on ? FOE.abil : 1)){ G.sigUsed[bq.team]=G.playNo; fireAbility({man:bq,local:false}, null, bk.indexOf('bats')); }
    }
  }
  if(!G.carrier||G.phase!=='live') return;
  var car=G.carrier, d=dir();

  for(var i=0;i<G.players.length;i++){
    var q=G.players[i];
    if(q===G.controlled||q===G.controlled2||q.stun>0) continue;
    if(q.aiCd>0){ q.aiCd-=dt; continue; }
    var kit=kitFor(q);
    if(!kit.length) continue;

    var foe=(q.team==='H')?'A':'H';
    var near=nearestOf(q,foe);
    var nd=near?Math.hypot(near.x-q.x,near.y-q.y):9999;
    var toCar=Math.hypot(car.x-q.x,car.y-q.y);
    var want=null;

    if(q.team===G.offense){
      if(q===car){
        if(q.role==='QB'){
          if(nd<28 && kit.indexOf('forcefield')>=0) want='forcefield';
        } else {
          if(nd<34 && kit.indexOf('stiffarm')>=0)        want='stiffarm';
          else if(nd<30 && kit.indexOf('spin')>=0)       want='spin';
          else if(nd<46 && kit.indexOf('teleport')>=0)   want='teleport';
          else if(nd>62 && kit.indexOf('dash')>=0)       want='dash';
          else if(nd>54 && kit.indexOf('superspeed')>=0) want='superspeed';
        }
      } else if(q.route==='block'||q.route==='lead'){
        if(nd<36){
          if(kit.indexOf('superblock')>=0 && Math.random()<0.5) want='superblock';
          else if(kit.indexOf('clothesline')>=0)               want='clothesline';
          else if(kit.indexOf('slam')>=0)                      want='slam';
        }
      } else if(q.route){
        if(nd<26 && kit.indexOf('superspeed')>=0) want='superspeed';
        else if(nd<22 && kit.indexOf('spin')>=0)  want='spin';
      }
    } else {
      if(G.thrown && kit.indexOf('aagun')>=0 &&
         Math.hypot(G.thrown.tx-q.x,G.thrown.ty-q.y) < 24*YD){
        want='aagun';
      }
      else if(toCar<46 && kit.indexOf('fumblegen')>=0)  want='fumblegen';
      else if(toCar<38 && kit.indexOf('clothesline')>=0) want='clothesline';
      else if(toCar<40 && kit.indexOf('slam')>=0)        want='slam';
      else if(toCar>74 && toCar<190 && kit.indexOf('dash')>=0) want='dash';
    }

    if(!want){
      var sg=kit[kit.length-1];
      if(sg && IS_SIG[sg] && !sigSpent(q.team)){
        var handing = car.role==='QB' && G.handoffAt!=null;   // about to give it to the back: not worth a move
        if(handing){}
        else if(q.team===G.offense){
          if(q===car){
            if(sg==='pumpkin' && nd<120) want=sg;
            else if((sg==='cloud'||sg==='flight') && nd<55) want=sg;
            else if(sg==='bullseye' && nd<90) want=sg;
          }
        } else {
          if(sg==='bats' && toCar>70 && toCar<320) want=sg;
          else if(sg==='lightning' && toCar<280) want=sg;
          else if(sg==='shadow' && toCar>60 && toCar<260) want=sg;
          else if(sg==='grip' && toCar<60) want=sg;
          else if((sg==='moon'||sg==='fury') && toCar<220) want=sg;
          else if(sg==='frost' && toCar<75) want=sg;
          else if(sg==='vanish' && toCar<260) want=sg;
        }
      }
    }
    if(!want) continue;
    if(!abReady(q,want)) continue;
    if(IS_SIG[want] && sigSpent(q.team)) continue;
    if(Math.random() > (AI_ODDS[want]||0.02) * (q.team==='A' && !NET.on ? FOE.abil : 1)) continue;

    if(IS_SIG[want]) G.sigUsed[q.team]=G.playNo;
    fireAbility({man:q, local:false}, null, kit.indexOf(want));
    q.aiCd = 1.4 + Math.random()*1.3;
  }
}

// one of the cast's own moves a play for each side the computer runs
function sigSpent(team){ G.sigUsed=G.sigUsed||{}; return G.sigUsed[team]===G.playNo; }

// ---- the CPU quarterback: drop, read the field, throw or scramble -------
function cpuQB(now){
  if(G.offense==='H') return;
  if(NET.on) return;          // the Rivals offence is the guest, a person
  if(G.handoffAt!=null) return;   // he is giving it to the back, not throwing
  if(pastTheLine(G.carrier)) return;   // he has crossed; he is a runner now
  if(!G.carrier||G.carrier.role!=='QB'||G.thrown||G.windup||G.loose) return;
  var qb=G.carrier, d=dir(), since=G.gt-G.snapT;
  var rush=nearestOf(qb,'H');
  var pressure=rush?Math.hypot(rush.x-qb.x,rush.y-qb.y):999;
  if(since<0.55 && pressure>32) return;              // let him finish the drop

  var best=null, bestScore=-1e9;
  for(var i=0;i<G.players.length;i++){
    var r=G.players[i];
    if(r.team!==G.offense||r===qb||r.role==='C'||r.role==='OL'||r.role==='BL') continue;   // linemen are not eligible
    var cov=nearestOf(r,'H');
    var open=cov?Math.hypot(cov.x-r.x,cov.y-r.y):70;
    var gain=Math.min((r.x-G.los)*d, Math.max(0,yardsToGoal()*YD))/YD;  // capped at the goal
    var score=open*1.6+gain*1.2;
    if(open<15) score-=70;                           // blanketed, do not force it
    if(r.role==='RB'||r.role==='TE') score+=9;       // the checkdown is always there
    if(score>bestScore){ bestScore=score; best=r; }
  }
  var desperate=(pressure<26||since>1.9);
  if(qb.wrapped>0 && Math.random()>0.03) return;   // held: no clean throw (now and then a desperate heave)
  if(best && (bestScore>22 || desperate)){
    // arm a special throw before letting it go, same as a player would
    var qk=kitFor(qb);
    if(desperate && abReady(qb,'rocket') && Math.random()<0.45){
      fireAbility({man:qb,local:false}, null, qk.indexOf('rocket'));
    } else if(bestScore>46 && abReady(qb,'perfect') && Math.random()<0.30){
      fireAbility({man:qb,local:false}, null, qk.indexOf('perfect'));
    }
    G.windup={target:best,t:0,dur:0.17,qb:qb};
  }
}

// ---- CPU play calling, by down and distance rather than at random -------
function yardsToGoal(){
  var d=dir();
  return d>0 ? ((FW-EZ)-G.los)/YD : (G.los-EZ)/YD;
}
function pickAiOffense(){
  var r=Math.random(), togo=G.toGo, ytg=yardsToGoal();
  if(G.down>=4){
    if(ytg+17 <= 48) return 'fg';
    if(togo > 2) return 'punt';
  }
  // goal line: there is no deep, so pound it
  if(ytg<=5)  return r<0.74?'run':'short';
  if(ytg<=12) return r<0.60?'run':'short';
  if(ytg<=22) return r<0.46?'run':(r<0.90?'short':'deep');
  if(G.down>=3 && togo>=7) return r<0.44?'deep':(r<0.72?'outs':'screen');
  if(togo<=3) return r<0.52?'run':(r<0.78?'draw':'short');
  return r<0.28?'short':(r<0.48?'run':(r<0.64?'deep':(r<0.80?'outs':
         (r<0.92?'draw':'screen'))));
}
function pickAiDefense(){
  var r=Math.random(), togo=G.toGo, ytg=yardsToGoal();
  // backed up near their own goal line, crowd the box
  if(ytg<=8) return r<0.6?'blitz':'spy';
  if(G.down>=3 && togo>=12) return r<0.5?'prevent':'zone'; // sit on the sticks
  if(G.down>=3 && togo>=7) return r<0.42?'zone':(r<0.74?'press':'spy');
  if(togo<=3) return r<0.55?'blitz':'spy';                // they will run
  return r<0.26?'blitz':(r<0.48?'zone':(r<0.70?'spy':'press'));
}

// The whistle does not freeze a football field. Everyone coasts to a stop,
// the tackled man goes down, and the pile settles for a beat.
function deadTick(dt){
  var damp=Math.pow(0.035,dt);
  if(G.celebrate>0){
    G.celebrate-=dt;
    if(Math.random()<dt*22 && G.celAt) confetti(G.celAt.x,G.celAt.y);
    for(var ci=0;ci<G.players.length;ci++){
      var cp=G.players[ci];
      if(!G.celAt) break;
      if(cp.team===G.scoringTeam){
        var dx=G.celAt.x-cp.x, dy=G.celAt.y-cp.y, dm=Math.hypot(dx,dy)||1;
        var mob=(G.tdKind==='team')?300:150;          // for a team celebration they sprint in
        if(dm>26){ cp.vx=dx/dm*mob; cp.vy=dy/dm*mob; }   // mob the scorer
        else { cp.cel=Math.max(cp.cel,0.6); }
      }
    }
    damp=Math.pow(0.6,dt);
  }
  for(var i=0;i<G.players.length;i++){
    var q=G.players[i];
    q.vx*=damp; q.vy*=damp;
    q.x+=q.vx*dt; q.y+=q.vy*dt;
    q.y=Math.max(8,Math.min(FH-8,q.y)); q.x=Math.max(6,Math.min(FW-6,q.x));
    var sp=Math.hypot(q.vx,q.vy);
    q.run += (q.down>0||q.stun>0 ? 0 : Math.max(sp*0.075, 1.5))*dt;
    if(Math.abs(q.vx)>5) q.face=q.vx>0?1:-1;
    q.lean += ((sp>6?Math.min(0.3,sp*0.0016):0)-q.lean)*Math.min(1,dt*9);
    if(q.stun>0)   q.stun-=dt;
    if(q.down>0)   q.down-=dt;
    if(!isFinite(q.x)||!isFinite(q.y)){
      q.x=G.los; q.y=FH/2; q.vx=0; q.vy=0;
    }
    if(!isFinite(q.vx)) q.vx=0;
    if(!isFinite(q.vy)) q.vy=0;
    if(q.stun>0) q.down=Math.max(q.down, Math.min(q.stun,0.95));
    if(q.down>0||q.stun>0){ var dmp=Math.pow(0.002,dt); q.vx*=dmp; q.vy*=dmp; }
    if(q.burst>0 && sp>60){
      if(Math.random()<dt*26) ghost(q);
      if(Math.random()<dt*20) speedLines(q, q.team==='H'?'rgba(255,210,63,.5)':'rgba(255,138,148,.5)');
    }
    if(q.vz){ q.vz-=9*dt; q.z=Math.max(0,q.z+q.vz*dt); if(q.z<=0) q.vz=0; }
    else if(q.z>0) q.z=Math.max(0,q.z-dt*1.7);
    if(q.spin>0)   q.spin=Math.max(0,q.spin-dt*2.1);
    if(q.arm>0)    q.arm=Math.max(0,q.arm-dt*1.9);
    if(q.cel>0)    q.cel-=dt;
    if(q.phase>0)  q.phase=Math.max(0,q.phase-dt*1.1);
  }
  // bodies still take up space in the pile
  var SEP=23;
  for(var a1=0;a1<G.players.length;a1++){
    for(var a2=a1+1;a2<G.players.length;a2++){
      var A=G.players[a1], B=G.players[a2];
      var dx=B.x-A.x, dy=B.y-A.y, dq=dx*dx+dy*dy;
      if(dq>SEP*SEP||dq<0.01) continue;
      var dl=Math.sqrt(dq), sh=(SEP-dl)/SEP*30*dt;
      A.x-=dx/dl*sh; A.y-=dy/dl*sh; B.x+=dx/dl*sh; B.y+=dy/dl*sh;
    }
  }
  for(var f=G.fx.length-1;f>=0;f--){
    var e=G.fx[f]; e.life-=dt;
    if(e.ringed) e.r+=dt*130;
    else if(e.vx!==undefined){ e.x+=e.vx*dt; e.y+=e.vy*dt; e.vx*=0.93; e.vy*=0.93; }   // cracks and trails stay put
    if(e.life<=0) G.fx.splice(f,1);
  }
  if(G.thrown){ G.thrown=null; }
}


// ==================================================================== kicks
// Fourth down gives you a choice: go for it, punt it away, or take the three.

function fgDistance(){ return Math.round(yardsToGoal()) + 17; }   // snap + end zone

function fgChance(dist){
  if(dist < 25) return 0.94;
  if(dist < 35) return 0.86;
  if(dist < 45) return 0.68;
  if(dist < 55) return 0.44;
  return 0.20;
}

function offensePlays(){
  var list = PLAYS.H.slice();
  if(G.down >= 4){
    list.push({id:'punt', name:'PUNT', desc:'Kick it away and pin them deep.'});
    var dist = fgDistance();
    if(dist <= 58){
      list.push({id:'fg', name:'FIELD GOAL',
        desc: dist + ' yard try. About ' + Math.round(fgChance(dist)*100) + '% from here.'});
    }
  }
  return keyed(list);
}

// the sheet numbers itself, so the playbook can grow without renumbering
function keyed(list){
  for(var i=0;i<list.length;i++) list[i].key=String(i+1);
  return list;
}
function callSheet(){ return iHaveBall() ? offensePlays() : keyed(PLAYS.A.slice()); }

function startKick(kind){
  elOv.classList.remove('show');
  var d = dir();
  var k = { kind:kind, t:0, dur: kind==='fg' ? 1.5 : 1.9 };
  k.x0 = G.los - 6*YD*d;
  k.y0 = FH/2;
  if(kind === 'fg' || kind === 'pat'){
    k.dist = (kind==='pat') ? 33 : fgDistance();
    k.good = Math.random() < ((kind==='pat') ? 0.94 : fgChance(k.dist));
    k.x1 = goalX(d); k.hf=0.75; k.arc=110;
    k.y1 = FH/2 + (k.good ? (Math.random()-0.5)*5*YD : (Math.random()<0.5?-1:1)*(10+Math.random()*7)*YD);
    k.arc = 58;
    aimAtPosts(k, k.x1, k.y1);
  } else {
    var net = 36 + Math.random()*17;
    k.x1 = G.los + net*YD*d;
    k.y1 = FH/2 + (Math.random()-0.5)*16*YD;
    k.arc = 66;
    k.touchback = (d > 0) ? (k.x1 >= FW-EZ) : (k.x1 <= EZ);
  }
  G.playNo=(G.playNo|0)+1;
  openPlay(kind); if(G.cur) G.cur.kick=kind;
  G.kick = k;
  G.phase = 'kick';
  G.players.length = 0;
  G.ball = {x:k.x0, y:k.y0, held:false};
  G.carrier = null; G.thrown = null; G.loose = null;
  say(kind==='pat' ? 'EXTRA POINT' : kind==='fg' ? (k.dist + ' YARD ATTEMPT') : 'PUNT IS AWAY', 1100);
}

// A kick at the posts flies like a ball: steady speed forward, up and then
// down under gravity. It is judged the moment it crosses the goal line and
// keeps going, through the uprights or past them, until it comes down behind.
function aimAtPosts(k, xp, yp){
  var tp=1.5, ta=tp*0.62, H=130;                    // at the posts it is still well over the bar
  k.phys=true; k.xp=xp; k.dir=(xp>k.x0)?1:-1;
  k.vx=(xp-k.x0)/tp; k.vy=(yp-k.y0)/tp;
  k.g=2*H/(ta*ta); k.vz=k.g*ta;
}
function fgFlight(k){
  var t=k.t;
  G.ball.x=k.x0+k.vx*t; G.ball.y=k.y0+k.vy*t;
  k.h=Math.max(0, k.vz*t-0.5*k.g*t*t);
  (k.trail = k.trail || []).push({x:G.ball.x, y:G.ball.y - k.h});
  if(k.trail.length > 26) k.trail.shift();
  if(!k.judged && (G.ball.x-k.xp)*k.dir>=0){
    k.judged=true;
    if(k.good){
      var pts=(k.kind==='pat')?1:3;
      if(G.offense==='H') G.scoreH += pts; else G.scoreA += pts;
      say(k.kind==='pat' ? 'EXTRA POINT IS GOOD!' : 'IT IS GOOD!', 1700);
      for(var i=0;i<26;i++) confetti(k.xp, FH/2);
      G.shake = REDUCED?0:12;
    } else {
      say('NO GOOD', 1500);
    }
    if(G.cur) logPlay(k.xp, k.good?'GOOD':'NO GOOD', false);
  }
  if(t>0.2 && k.h<=0){                              // down behind the end line
    burst(G.ball.x, G.ball.y, '#eef3e8');
    if(k.good && k.kicker){                        // the kicking team mobs the kicker
      G.scoringTeam=G.offense; G.celebrate=1.6; G.celAt={x:k.kicker.x, y:k.kicker.y};
    }
    afterKick(k.kind, k.good);
  }
}

function kickTick(dt){
  var k = G.kick; if(!k) return;
  k.t += dt;
  if(k.phys){ fgFlight(k); return; }
  var p = Math.min(1, k.t / k.dur);
  G.ball.x = k.x0 + (k.x1-k.x0)*p;
  G.ball.y = k.y0 + (k.y1-k.y0)*p;
  k.h = Math.sin(p*Math.PI*(k.hf||1)) * k.arc;       // a kick at the posts is still high as it gets there
  (k.trail = k.trail || []).push({x:G.ball.x, y:G.ball.y - k.h});
  if(k.trail.length > 26) k.trail.shift();
  if(p < 1) return;

  var d = dir();
  if(k.kind === 'fg' || k.kind === 'pat'){
    if(k.good){
      var pts=(k.kind==='pat')?1:3;
      if(G.offense==='H') G.scoreH += pts; else G.scoreA += pts;
      say(k.kind==='pat' ? 'EXTRA POINT IS GOOD!' : 'IT IS GOOD!', 1700);
      for(var i=0;i<26;i++) confetti(k.x1, FH/2);
      G.shake = REDUCED?0:12;
    } else {
      say('NO GOOD', 1500);
    }
    if(G.cur) logPlay(k.x1, k.good?'GOOD':'NO GOOD', false);
    afterKick(k.kind, k.good);
  } else {
    burst(G.ball.x, G.ball.y, '#eef3e8');
    G.kick = null; G.phase='dead'; G.clockRunning=false;
    turnover();
    if(k.touchback){
      say('TOUCHBACK', 1300);
      G.los = (G.offense==='H') ? EZ+25*YD : FW-EZ-25*YD;
    } else {
      say('DOWNED AT THE ' + yardLineLabel(k.x1), 1400);
      G.los = Math.max(EZ+2, Math.min(FW-EZ-2, k.x1));
    }
    setTimeout(function(){ if(!G.over) G.phase='playcall'; }, 1500);
  }
}

function drawKick(){
  var k = G.kick; if(!k) return;
  if(k.trail){
    for(var i=1;i<k.trail.length;i++){
      var a=k.trail[i-1], b=k.trail[i], f=i/k.trail.length;
      ctx.strokeStyle='rgba(241,241,236,'+(f*0.45).toFixed(3)+')';
      ctx.lineWidth=0.6+f*2.4; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
    }
  }
  ctx.fillStyle='rgba(0,0,0,.28)';
  ctx.beginPath(); ctx.ellipse(G.ball.x, G.ball.y, Math.max(1.2,6-k.h*0.035), Math.max(0.6,2.6-k.h*0.015), 0, 0, Math.PI*2); ctx.fill();
  ctx.save();
  ctx.translate(G.ball.x, G.ball.y - (k.h||0));
  ctx.rotate(k.t*13);
  if(BALL_IMG.ready){
    ctx.drawImage(BALL_IMG,-7.0,-4.3,14.0,8.6);
  } else {
    ctx.fillStyle='#7a4a28';
    ctx.beginPath(); ctx.ellipse(0,0,6.2,3.7,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#f1f1ec'; ctx.lineWidth=0.9;
    ctx.beginPath(); ctx.moveTo(-2.4,0); ctx.lineTo(2.4,0); ctx.stroke();
  }
  ctx.restore();
}

function confetti(x,y){
  var cols=['#ffd23f','#f1f1ec','#c8a63c','#ff8c2b','#7fd8ff'];
  var a=Math.random()*Math.PI*2, s=60+Math.random()*180;
  G.fx.push({x:x+(Math.random()-0.5)*40, y:y-20-Math.random()*40,
             vx:Math.cos(a)*s, vy:Math.sin(a)*s-90,
             life:1.1+Math.random()*0.7, max:1.8,
             r:2.2+Math.random()*2.2, c:cols[(Math.random()*cols.length)|0]});
}

// ---- pre-snap: everyone set, play clock running, waiting on the hike -----
function presnap(dt){
  if(G.paused) return;                              // the menu is up
  G.playClock-=dt;
  if(G.clockRunning){
    if(!G.training) G.clock-=dt;
    if(G.clock<=0){ G.clock=0; gameOver(); return; }
  }
  for(var i=0;i<G.players.length;i++){
    var p=G.players[i];
    p.vx=0; p.vy=0;
    var tgt=(p.team===G.offense?0.07:-0.07)+Math.sin(p.run*0.9+p.num)*0.05;
    p.lean += (tgt-p.lean)*Math.min(1,dt*5);
  }
  // On defence you can walk your man around before the snap (the stick),
  // anywhere on your side of the ball, never across the line.
  var pm=G.controlled;
  if(pm && !NET.on && G.offense!==mySide() && pm.team===mySide()){
    var pa=axis();
    if(pa.x||pa.y){
      var psp=DEF_SPD*0.75, pd=dir();
      pm.x+=pa.x*psp*dt; pm.y+=pa.y*psp*dt;
      var lineX=G.los+pd*1.1*YD;
      if((pm.x-lineX)*pd<0) pm.x=lineX;                  // your side of the ball only
      pm.y=Math.max(8,Math.min(FH-8,pm.y));
      pm.run+=dt*9; if(Math.abs(pa.x)>0.2) pm.face=pa.x>0?1:-1;
      pm.stance=0;
    }
  }
  if(G.autoSnapAt!==null && (15-G.playClock) >= G.autoSnapAt){ snapBall(); return; }
  if(NET.on && NET.host &&
     (!G.controlled2 || G.controlled2.team!=='A' || G.players.indexOf(G.controlled2)<0)){
    G.controlled2 = pickRemoteMan(false);
  }
  if(tapSwitch()) switchPlayer('H');
  // the guest can shuffle his man pre-snap too
  if(NET.on && NET.host && NET.remoteIn && NET.remoteIn.sw){
    NET.remoteIn.sw=0; switchPlayer('A');
  }
  // only the side with the ball can put it in play
  var mineToSnap = (G.offense==='H');
  if(mineToSnap && (tapHike()||tapJuke())){ snapBall(); return; }
  if(NET.on && NET.host && !mineToSnap && NET.remoteHike){ NET.remoteHike=false; snapBall(); return; }
  if(G.playClock<=0){ say('DELAY — SNAPPED',700); snapBall(); }
}


// =============================================================== the seats
// A seat is one person at the controls: the side they play, the man they are
// driving right now, and their own meters. Host sits in H, guest sits in A,
// and both run driveHuman(). Anything the host can do, the guest can do.

function hostSeat(){
  return {side:'H', man:G.controlled, M:G, hero:HERO, local:true};
}
function guestSeat(){
  if(!G.controlled2||G.controlled2.stun>0||G.controlled2.team!=='A'||
     G.players.indexOf(G.controlled2)<0){
    G.controlled2=pickRemoteMan(false);
  }
  return {side:'A', man:G.controlled2, M:G.M2, hero:sideHero('A'), local:false};
}

// keyboard, touch stick and the on-screen buttons, in the shape driveHuman wants
function localInput(){
  var a=axis();
  return {x:a.x, y:a.y, sp:wantSprint()?1:0,
          b1:tapJuke()?1:0, b2:tapMove()?1:0, b3:tapQ()?1:0,
          sw:tapSwitch()?1:0, tg:tapTarget(),
          k1:tapAb1()?1:0, k2:tapAb2()?1:0, k3:tapAb3()?1:0};
}

// whatever the guest last sent. Taps latch on arrival and are spent here.
function remoteInput(){
  var r=NET.remoteIn;
  if(!r) return {x:0,y:0,sp:0,b1:0,b2:0,b3:0,sw:0,tg:-1,k1:0,k2:0,k3:0,cp:0,sd:0};
  var out={x:r.x, y:r.y, sp:r.sp, b1:r.b1, b2:r.b2, b3:r.b3, sw:r.sw,
           k1:r.k1, k2:r.k2, k3:r.k3, cp:r.cp||0, sd:r.sd||0,
           tg:(NET.remoteTarget===undefined?-1:NET.remoteTarget)};
  r.b1=r.b2=r.b3=r.sw=r.k1=r.k2=r.k3=r.cp=0; r.sd=0;
  NET.remoteTarget=-1;
  return out;
}

function driveHuman(seat, IN, dt, now){
  var M=seat.M, me=seat.man, d=dir();
  if(M.moveCd>0) M.moveCd-=dt;
  if(M.hitCd>0)  M.hitCd-=dt;
  if(M.jukeCd>0) M.jukeCd-=dt;
  if(M.latCd>0)  M.latCd-=dt;
  if(M.diveCd>0) M.diveCd-=dt;
  if(M.assistCd>0) M.assistCd-=dt;
  if(!me) return;

  var onO = (G.offense===seat.side);
  var fwd = (seat.side==='H') ? d : -d;      // downfield, from this seat's view
  var a={x:IN.x, y:IN.y};
  var sprinting = IN.sp && M.stam>2 && (a.x||a.y);
  if(sprinting) M.stam=Math.max(0,M.stam-33*dt); else M.stam=Math.min(100,M.stam+20*dt);
  if(me.burst>0) me.burst-=dt;

  if(IN.sw){
    switchPlayer(seat.side);
    me = seat.man = (seat.side==='H') ? G.controlled : G.controlled2;
    if(!me) return;
  }
  // Flat on the turf is flat on the turf. The stick used to keep driving a
  // man who had been knocked down, so he slid along the grass on his side.
  if(me.stun>0 || me.down>0){ me.vx*=0.8; me.vy*=0.8; return; }
  if(IN.tg>=0 && onO){
    var rl=eligibleReceivers();
    if(rl[IN.tg]) throwAt(rl[IN.tg].x, rl[IN.tg].y, seat.side);
  }

  // Auto-assist: when a tackler is right on you, your man reacts by himself.
  // Same instinct the CPU carriers have, so you are never a sitting duck.
  // (a runner in a clinch boxes his own way out; a passer in the pocket still
  // fights a rusher off by himself as well)
  if(onO && me===G.carrier && M.assistCd<=0 && (BOX_ASSIST || !(me.wrapped>0) || (BOX_QB_ASSIST && me.role==='QB' && !pastTheLine(me)))){
    var foe=(seat.side==='H')?'A':'H';
    var thr=nearestOf(me,foe);
    var thd2=thr?Math.hypot(thr.x-me.x,thr.y-me.y):999;
    if(thd2<27){
      var roll=Math.random();
      if(roll<0.55 && M.power>=JUKE_COST){
        M.power-=JUKE_COST; M.assistCd=1.1;
        M.jukeUntil=now+JUKE_MS;
        var away=(me.y-thr.y)>=0?1:-1;
        me.vx=fwd*BASE_SPD*1.9*me.agi; me.vy=away*BASE_SPD*2.3*me.agi;
        if(seat.local) say('SIDESTEP!',420);
      } else if(roll<0.85 && M.power>=34){
        M.power-=34; M.assistCd=1.2; me.arm=0.5;
        thr.stun=1.0; thr.vx=(thr.x-me.x)*6.5; thr.vy=(thr.y-me.y)*6.5;
        burst(thr.x,thr.y,'#ffd23f'); G.shake=REDUCED?0:10;
        if(seat.local) say('STIFF ARM!',520);
      }
    }
  }

  if(!onO){
    // ---- you are on defense: brawler controls
    if(IN.b3) groundPound(me,M);
    if(IN.b2){ if(G.thrown && !G.thrown.tip) swatAt(me); else bigHit(me,M); }
    else if(M.punchBuf && M.hitCd<=0 && !G.thrown){ if(now-M.punchBuf<900) bigHit(me,M); else M.punchBuf=0; }
    if(IN.b1 && M.power>=26 && M.jukeCd<=0){
      M.power-=26; M.jukeCd=1.05; M.diveUntil=now+400;
      var dv=(a.x||a.y)?a:{x:fwd,y:0};
      me.vx=dv.x*BASE_SPD*2.9; me.vy=dv.y*BASE_SPD*2.9;
      say('DIVE!',320,seat.side);
    }
  } else {
    if(IN.b3 && M.latCd<=0){
      if(handoff(seat.side)) M.latCd=0.9;
      else { M.latCd=1.4; lateral(seat.side); }
    }
    if(IN.b2) fireSpecial(seat, IN);
    if(M.cpCd>0) M.cpCd-=dt;
    if(seat.local && (touchCPunch || eat('f'))){ touchCPunch=false; carrierPunch(me, M); }
    else if(!seat.local && IN.cp) carrierPunch(me, M);             // the guest's tap with the ball
    else if(M.cpBuf && !(M.cpCd>0)){ if(now-M.cpBuf<900) carrierPunch(me, M); else M.cpBuf=0; }   // (a tap in the cooldown waits for it)
    // a swipe on a touch screen while carrying: spin out of it along the swipe
    var sdIn = seat.local ? touchSpinDir : (IN.sd ? {x:IN.sd[0], y:IN.sd[1]} : null);   // (the guest's swipe comes over the wire)
    if(sdIn){
      var sd=sdIn; if(seat.local) touchSpinDir=null;
      if(me===G.carrier && M.power>=JUKE_COST && M.jukeCd<=0){
        M.power-=JUKE_COST; M.jukeCd=0.95; M.jukeUntil=now+JUKE_MS;
        me.spin=1; me.iFrames=Math.max(me.iFrames||0,0.32); me.wrapped=0;
        me.vx=sd.x*BASE_SPD*2.4*(me.agi||1); me.vy=sd.y*BASE_SPD*2.4*(me.agi||1);
        burst(me.x,me.y,'#7fd8ff');
        say('SPIN!',320,seat.side);
      }
    }
    if(IN.b1 && M.power>=JUKE_COST && M.jukeCd<=0){
      M.power-=JUKE_COST; M.jukeCd=0.95; M.jukeUntil=now+JUKE_MS;
      var jd=(seat.local&&touchJukeDir)?touchJukeDir:((a.x||a.y)?a:{x:fwd,y:0});
      if(seat.local) touchJukeDir=null;
      me.vx=jd.x*BASE_SPD*2.6*me.agi; me.vy=jd.y*BASE_SPD*2.6*me.agi;
      if(seat.local) say('JUKE!',300);
    }
  }
  if(IN.k1) fireAbility(seat, IN, 0);
  if(IN.k2) fireAbility(seat, IN, 1);
  if(IN.k3) fireAbility(seat, IN, 2);
  M.power=100; M.stam=100;                        // no meters: moves are held back by cooldowns

  var jk=now<M.jukeUntil, diving=now<M.diveUntil;
  // on defence the AI runs at DEF_SPD, so a human on that side has to as well
  // or he is permanently behind his own team-mates
  var base = onO ? BASE_SPD : DEF_SPD;
  // with the ball he runs as fast as the computer runs its ball carrier (a
  // passer is not a runner until he is over the line)
  if(onO && me===G.carrier && (me.role!=='QB' || pastTheLine(me))) base=BASE_SPD*CARRY_SPD;
  if(!onO && DEF_CHASE){
    // as fast as the computer runs a man in his spot (it runs every defender
    // at these, whatever his own rating)
    var aiSp=1.02;                                                    // in coverage
    if(G.thrown && !G.thrown.lat) aiSp=1.18;                        // breaking on the ball
    else if(G.carrier && G.carrier.team!==me.team) aiSp=Math.max(aiSp, (me.role==='RUSH'?1.10:0.96)*openChase());   // the chase
    base=DEF_SPD*aiSp;
  }
  var mult=(sprinting?SPRINT:1)*(me.burst>0?1.4:1)*(onO ? me.spd : Math.max(1,me.spd||1))*buffMul(me);   // a burst is 1.4x (1.7x broke away three times in four); on defence his rating only ever helps
  // In a clinch the ball carrier is held where he stands and boxes his way
  // out. (The hold used to be applied after he had already moved each frame,
  // so however many men were on him he crept on at a quarter of his speed.)
  if(onO && me===G.carrier && me.wrapped>0) mult*=BOX_HOLDYOU;
  if(!diving && seat.local){                          // a dive that is over no longer homes...
    G.touchDive=false;
  }
  // A slide on a touch screen from further off: he charges the ball carrier,
  // leading him, and leaves his feet once he is close enough to get there.
  if(seat.local && G.tchase && !diving){
    var hc2=G.carrier;
    if(!hc2 || hc2.team===me.team || now>G.tchase || G.phase!=='live' || onO) G.tchase=0;
    else {
      var lx2=hc2.x+hc2.vx*0.22-me.x, ly2=hc2.y+hc2.vy*0.22-me.y, lm2=Math.hypot(lx2,ly2)||1;
      if(lm2 < 3.2*YD){
        G.tchase=0;
        if(swipeTackle(lx2,ly2,'H')!==false){ G.touchDive=true; G.diveUntil=now+640; }
      } else {
        var cs=DEF_SPD*2.05*(me.spd||1);
        me.vx+=(lx2/lm2*cs-me.vx)*0.45; me.vy+=(ly2/lm2*cs-me.vy)*0.45;
        if(Math.random()<dt*18) speedLines(me,'rgba(255,255,255,.55)');
        return;
      }
    }
  }
  if(diving){
    me.vx*=0.988; me.vy*=0.988;                       // ride the dive out
    // A swipe tackle on a touch screen homes in: the dive bends toward the
    // ball carrier while you are in the air, so a slide is a tackle, not a dash.
    var hc=G.carrier;
    if(seat.local && G.touchDive && hc && hc.team!==me.team){
      var hx=hc.x+hc.vx*0.12-me.x, hy=hc.y+hc.vy*0.12-me.y, hm=Math.hypot(hx,hy)||1;
      if(hm<TACKLE_R && (hc.iFrames>0 || hc.z>0.15)){
        // he is slippery for a beat (a juke, a fresh handoff): stay on him
        // instead of sailing past, and the tackle lands when it wears off
        me.vx=hc.vx+hx*4; me.vy=hc.vy+hy*4;
      } else if(hm<SLIDE_REACH*1.3){
        var sp=Math.max(Math.hypot(me.vx,me.vy), (G.diveFly||0)*0.85);
        var k=Math.min(1,dt*12);
        me.vx+=(hx/hm*sp-me.vx)*k; me.vy+=(hy/hm*sp-me.vy)*k;
      }
    }
  }
  else if(onO && me===G.carrier && me.role==='QB' && G.dropLeft>0 && !G.thrown){
    if(a.x||a.y){ G.dropLeft=0; me.vx=a.x*base*mult; me.vy=a.y*base*mult; }   // you took over
    else dropBack(me, fwd, dt);
  }
  else if(onO && me===G.carrier && me.role==='QB' && G.handoffAt!=null && !G.thrown && !(a.x||a.y)){
    meetBack(me, dt);                                // a run play: he takes it to the back
  }
  else if(!jk||me.z>0){
    // A key is all or nothing, so ease in and out of it over about a tenth
    // of a second: he gets up to speed and plants to stop instead of snapping.
    var ramp=1-Math.exp(-dt/0.045);
    var tvx=a.x*base*mult, tvy=a.y*base*mult;
    var nvx=me.vx+(tvx-me.vx)*ramp, nvy=me.vy+(tvy-me.vy)*ramp;
    // Just switched to him on defence: he keeps the speed he had while he
    // turns to where your thumb is pointing (blending his old line into the
    // new one used to bleed off a third of his speed for a moment)
    if(!onO && (a.x||a.y) && G.swCarryUntil>G.gt){
      var cur=Math.hypot(me.vx,me.vy), nsp=Math.hypot(nvx,nvy), keep=Math.max(cur, Math.hypot(tvx,tvy));
      var turn=cur>20 ? (a.x*me.vx+a.y*me.vy)/cur : 1;   // (a turning run keeps its speed; turning right round still has to slow)
      if(turn>-0.2 && nsp>1 && nsp<keep){ nvx*=keep/nsp; nvy*=keep/nsp; }
    }
    me.vx=nvx; me.vy=nvy;
  }
  else { me.vx*=0.90; me.vy*=0.90; }
}

// particles
function fxAge(dt){
  for(var f=G.fx.length-1;f>=0;f--){
    var e=G.fx[f]; e.life-=dt;
    if(e.ringed){ e.r+=dt*130; }
    else if(e.emit){ if(e.p) emitTick(e,dt); }
    else if(e.shock||e.flash||e.streak||e.gh||e.dome||e.bolt||e.laser||e.crack||e.pow||e.dmg){ /* on a timer */ }
    else { e.x+=e.vx*dt; e.y+=e.vy*dt; e.vx*=0.93; e.vy*=0.93;
           if(e.grav){ e.vy+=e.grav*dt; } }
    if(e.life<=0) G.fx.splice(f,1);
  }
}

function step(dt){
  G.gt+=dt;
  var d=dir(), now=performance.now(), since=G.gt-G.snapT;
  if(G.fgKick && fgKickTick(dt)) return;
  if(G.puntK && puntTick(dt)) return;
  if(!G.training) G.clock-=dt;
  if(G.clock<=0){ G.clock=0; gameOver(); return; }
  if(G.handoffAt!=null && since>G.handoffAt && G.carrier && G.carrier.role==='QB'){
    if(handoff(G.offense,true)) G.handoffAt=null;
  }
  // Lock-on: the longer you keep the cursor on a receiver, the better the
  // ball goes. Snap it off the moment you see him and it sails.
  if(G.carrier && G.carrier.role==='QB' && !G.thrown && iHaveBall() &&
     G.mouse && G.mouse.on && !pastTheLine(G.carrier)){
    var lt=aimTarget();
    if(lt && lt===G.lockMan) G.lockT=Math.min(1.5, G.lockT+dt);
    else { G.lockMan=lt; G.lockT=0; }
  } else { G.lockMan=null; G.lockT=0; }

  applyRemoteInput(dt);
  driveHuman(hostSeat(), localInput(), dt, now);
  if(NET.on && NET.host) driveHuman(guestSeat(), remoteInput(), dt, now);

  // AI
  for(var i=0;i<G.players.length;i++){
    var p=G.players[i];
    if(p===G.controlled){ if(p.stun>0) p.stun-=dt; continue; }
    if(p.role==='RB' && p.team===G.offense && p!==G.carrier && p!==G.controlled2) rbProtect(p, G.gt-G.snapT, dt);
    if(p===G.controlled2){
      // a human is driving this one; only run down his stun for him
      if(p.stun>0){ p.stun-=dt; p.vx*=0.8; p.vy*=0.8; }
      continue;
    }
    if(p.stun>0){ p.stun-=dt; if(!(p.z>0.02)){ p.vx*=0.9; p.vy*=0.9; } continue; }   // no drag in the air; a skid on landing
    if(p.down>0){ p.vx*=0.8; p.vy*=0.8; continue; }
    if(p.route==='hold'){ if(!G.fgKick || G.fgKick.kicker!==p){ p.vx=0; p.vy=0; } continue; }   // holder and kicker
    if(G.loose){ aim(p,G.ball.x,G.ball.y,BASE_SPD*1.06*p.spd); continue; }
    var offTeam=G.offense;
    if(p.team===offTeam){
      if(p===G.carrier){
        var th=nearestOf(p,offTeam==='H'?'A':'H');
        var thd=th?Math.hypot(th.x-p.x,th.y-p.y):999;
        // AI ball carriers evade: a juke, a spin, or a stiff arm under pressure
        if(p.aiCd>0) p.aiCd-=dt;
        // in your grip (or a special move's) he rarely wriggles free; in an
        // ordinary grab now and then, more often against the better teams
        else if(thd<30 && p.role!=='QB' && Math.random()<(heldHard() ? BOX_WRIGGLE*FOE.abil : (p.wrapped>0 ? 0.013*FOE.abil : 0.035))){   // (held longer now the tackle is a fight: a smaller chance each moment)
          var pick=Math.random();
          p.aiCd=1.3;
          if(pick<0.4){
            p.spin=1; p.iFrames=0.28;
            p.vx=d*BASE_SPD*2.2; p.vy=(p.y-th.y>0?1:-1)*BASE_SPD*1.5;
            burst(p.x,p.y,'#7fd8ff');
          } else if(pick<0.75){
            p.iFrames=0.24;
            p.vx=d*BASE_SPD*1.6; p.vy=(p.y-th.y>0?1:-1)*BASE_SPD*2.4;
          } else {
            p.arm=0.5; th.stun=1.0;
            th.vx=(th.x-p.x)*6; th.vy=(th.y-p.y)*6;
            burst(th.x,th.y,'#ffd23f'); G.shake=REDUCED?0:9;
          }
        }
        // held: he boxes back at the man on him
        if(p.cpCd>0) p.cpCd-=dt;
        else if(p.wrapped>0){ carrierPunch(p, p, true); p.cpCd=0.45+Math.random()*0.35; }
        if(p.role==='QB' && G.dropLeft>0 && !G.windup && thd>30){
          dropBack(p, d, dt);
        } else if(p.role==='QB' && G.handoffAt!=null && !G.windup){
          meetBack(p, dt);                                 // a run play: he takes it to the back
        } else if(p.role==='QB' && since<1.5 && thd>30 && !G.windup){
          // stay in the pocket: drift back and slide off the rush
          var slide=th?Math.sign(p.y-th.y)||1:1;
          p.vx=-d*BASE_SPD*0.34; p.vy=slide*BASE_SPD*0.30;
        } else {
          // sprint, and pick the lane with the most daylight
          var lane2=runLane(p,d);
          // (through buffMul and the team's pace like everyone else: this set its
          // own speed, so a grab, a freeze and the difficulty never slowed him)
          var spd2=BASE_SPD*CARRY_SPD*(p.spd||1)*buffMul(p)*((p.team==='A' && !NET.on) ? FOE.spd : 1);
          p.vx=lane2.x*spd2; p.vy=lane2.y*spd2;
        }
      } else if(p.route==='lead'){
        // Lead blocking: get out in front of whoever has the ball and go hit
        // the man closest to him. Not pass protection, which is what these
        // two used to do from fourteen yards outside.
        var car=G.carrier, dTeam=(offTeam==='H'?'A':'H');
        if(car){
          var mark=nearestOf(car,dTeam);
          if(mark && Math.hypot(mark.x-car.x,mark.y-car.y)<30*YD){
            aim(p, mark.x, mark.y, BASE_SPD*1.36*p.spd);
          } else {
            aim(p, car.x+d*7*YD, car.y, BASE_SPD*1.24*p.spd);
          }
        }
      } else if(p.route&&p.route!=='block'){
        var tp=routePoint(p,since);
        // Scramble drill. This used to fire on a timer: at 2.6 seconds every
        // receiver abandoned his route and ran back at the quarterback. Since
        // a deep ball needs longer than that to develop, the passer was
        // always throwing to a man who had just turned round, which read as a
        // badly underthrown pass. It now waits for him to actually break the
        // pocket, and a streak keeps streaking regardless.
        var qbOut = G.carrier && G.carrier.role==='QB' &&
                    ((G.carrier.x-G.los)*d > -3*YD);
        if(qbOut && since>1.6 && p.route!=='go'){
          tp={x:G.carrier.x+d*9*YD, y:p.y*0.7+G.carrier.y*0.3};
        }
        // Once the ball is his, he plays the ball, not the route. The throw
        // is led off his velocity at the release, so a man caught mid-cut,
        // or coming back to a scrambling passer, had the ball land where he
        // was heading and then ran off to finish his route, which is how a
        // good throw across the field landed ten yards short of everybody.
        if(G.thrown && (!G.thrown.lat || G.thrown.kickoff) && (G.thrown.target===p ||
           (G.thrown.tip && Math.hypot(G.thrown.tx-p.x,G.thrown.ty-p.y)<12*YD))){
          tp={x:G.thrown.tx, y:G.thrown.ty};
          var tl=Math.hypot(tp.x-p.x,tp.y-p.y);
          aim(p,tp.x,tp.y, tl<5 ? 0 : BASE_SPD*1.08*p.spd);
        } else if(tp)
        aim(p,tp.x,tp.y,BASE_SPD*1.02*p.spd);
      } else {
        // stay on the ball side of your man and wall him off
        var foe = (p.assign && p.assign.stun<=0) ? p.assign : nearestRusher(p);
        if(foe){
          // mirror him from the ball side; sprint to get square, then hold
          var gx=foe.x - d*9, gy=foe.y;
          // pass set: shade to the inside, between him and the quarterback
          if(G.carrier && G.carrier.role==='QB') gy=foe.y*0.8+G.carrier.y*0.2;
          var gd=Math.hypot(gx-p.x,gy-p.y);
          var spd = gd>34 ? 1.48 : (gd>14 ? 1.24 : 0.94);
          aim(p,gx,gy, BASE_SPD*spd);
        }
      }
    } else {
      // Still a passing play? Cover. Ball out or in a runner's hands? Rally.
      // A passer who steps up is still a passer. Coverage used to switch off
      // the instant he crossed the line by a single pixel, so every back
      // dropped his man and ran at the ball and the receivers were wide open.
      // The corners and the safety stay home until he is genuinely running;
      // the backers are the ones who come up to meet him.
      var hasBall = G.carrier && G.carrier.role==='QB' && !G.loose && !G.thrown;
      var past    = hasBall ? (G.carrier.x-G.los)*d : 9999;
      var inPocket = hasBall && past < 4;
      // He is a runner the moment he is a yard over the line. This used to be
      // nine yards, so a scrambling quarterback ran straight past corners who
      // were still carrying receivers down the field.
      var stillAThreat = hasBall && past < 1*YD;
      var deepBack = (p.pos==='CB'||p.pos==='S');
      if(p.role==='COV' && (inPocket || (stillAThreat && deepBack))){
        if(p.spy){
          // shadow the passer, stay between him and the open field
          var qs=G.carrier;
          if(qs){ aim(p, qs.x - d*3*YD, qs.y, DEF_SPD*1.02); continue; }
        }
        if(G.covType==='zone'){
          // Sit on your landmark and squeeze whoever walks into it. This is
          // the difference between zone and man: nobody is chasing a single
          // receiver across the field, they are guarding grass.
          var zx=G.los + d*(p.zdepth||10)*YD, zy=p.zy||FH/2;
          var claim=null, cbest=1e9;
          for(var zq=0;zq<G.players.length;zq++){
            var zp=G.players[zq];
            if(zp.team!==offTeam||zp.route==='block'||zp.role==='QB') continue;
            var zd=Math.hypot(zp.x-zx, zp.y-zy);
            if(zd<15*YD && zd<cbest){ cbest=zd; claim=zp; }
          }
          if(claim) aim(p, claim.x + d*3, claim.y, DEF_SPD*1.0);
          else      aim(p, zx, zy, DEF_SPD*0.95);
          continue;
        }
        if(p.pos==='S'){
          // safety over the top: split the deepest threats
          var deep=null, deepest=-1e9;
          for(var sq=0;sq<G.players.length;sq++){
            var sp2=G.players[sq];
            if(sp2.team!==offTeam||sp2.route==='block'||sp2.role==='QB') continue;
            var prog=(sp2.x-G.los)*d;
            if(prog>deepest){ deepest=prog; deep=sp2; }
          }
          var sy = deep?(deep.y*0.5+FH/2*0.5):FH/2;
          aim(p, G.los+Math.max(16,deepest/YD+6)*YD*d, sy, DEF_SPD*0.98);
        } else if(p.cover && p.cover.stun<=0){
          // trail your man with a cushion toward your own end zone
          var r=p.cover;
          var lead=0.13;
          aim(p, r.x + r.vx*lead + d*((p.pos==='CB'?2.5:2)+(G.cushion||0)),   // tight: at 5 yards off, 72% of throws landed with nobody within 4 yards
                 r.y + r.vy*lead, DEF_SPD*1.02);
        } else {
          aim(p, G.ball.x+d*10*YD, G.ball.y, DEF_SPD*0.9);
        }
        continue;
      }
      var bx=G.ball.x,by=G.ball.y;
      if(G.thrown){ bx=G.thrown.tx; by=G.thrown.ty; }
      var lane=p.lane||0;
      var ax=bx, ay=by;
      if(G.carrier){
        var rx=G.carrier.x-p.x, ry=G.carrier.y-p.y;
        var dist=Math.hypot(rx,ry)||1;
        var cvx=G.carrier.vx, cvy=G.carrier.vy, cs=Math.hypot(cvx,cvy);
        // Only lead him when he is running away from me. A defender who is
        // already downfield of the carrier has him coming the other way, and
        // leading there aims at a spot further downfield still, so he backs
        // off the man he is supposed to be closing on. That looked exactly
        // like the defence running away.
        var away = cs>1 ? ((cvx*rx + cvy*ry)/(cs*dist)) : 0;   // +1 fleeing me
        var leadT = Math.min(1.2, dist/(DEF_SPD*1.15)) * Math.max(0, away);
        ax=G.carrier.x+cvx*leadT;
        ay=G.carrier.y+cvy*leadT;
        // The lane spreads the pursuit so they do not arrive in single file,
        // but it is an offset from the man. Held all the way in, it parked
        // rushers two or three yards beside a passer who stood still, and had
        // backs running alongside a carrier instead of hitting him. It shrinks
        // to nothing over the last few yards.
        lane *= Math.max(0, Math.min(1, (dist - 3*YD) / (6*YD)));
      }
      if(G.thrown && !G.thrown.lat && Math.hypot(bx-p.x,by-p.y)<12*YD){
        aim(p, bx, by, DEF_SPD*1.18);                 // the ball is in the air near him: break on it, straight at the spot
        continue;
      }
      aim(p, ax, ay+lane, DEF_SPD*(p.role==='RUSH'?1.10:0.96)*openChase());
    }
  }

  // Blocking is a physical wall, not a speed penalty. A blocker who is
  // engaged holds his man on the far side of himself until the block is
  // shed. Slowing a rusher down was never enough to buy the passer time.
  var d2=dir();
  for(var b=0;b<G.players.length;b++){
    var blk=G.players[b];
    if(blk.team!==G.offense||blk.route!=='block') continue;
    if(blk===G.carrier||blk.stun>0) continue;
    for(var r2=0;r2<G.players.length;r2++){
      var ru=G.players[r2];
      if(ru.team===G.offense||ru.stun>0) continue;
      if(blk.assign && ru!==blk.assign) continue;
      var dy2=Math.abs(ru.y-blk.y);
      if(dy2>BLOCK_R) continue;                       // he is around the edge
      // and he has to be on him, not merely level with him. Only the width
      // was ever checked, so a rusher who had already beaten his man and was
      // yards past him got snapped straight back to the blocker's side of
      // the line, which read as the rush bouncing off an invisible wall.
      if(Math.abs(ru.x-blk.x) > BLOCK_R*1.8) continue;
      ru.engaged=(ru.engaged||0)+dt;
      if(ru.furyUntil && G.gt<ru.furyUntil){          // Stitched Fury: straight through the man
        blk.stun=Math.max(blk.stun,1.0); blk._pst=blk.stun; blk.down=Math.max(blk.down,1.0);
        launch(blk, ru.x, ru.y, 140, 3.4); burst(blk.x,blk.y,'#7dff9a');
        ru.engaged=(ru.shedAt||2.5)+0.01; continue;
      }
      var youRu=(ru===G.controlled||ru===G.controlled2);
      if(youRu && TOUCH_UI && (G.tchase>0 || G.touchDive)) continue;   // charging on a swipe: he slips the block
      if(ru.engaged > (youRu ? Math.min(ru.shedAt||2.5, 1.0) : (ru.shedAt||2.5))) continue;   // he has beaten the block (you get off it in a second)
      ru.eBlk=blk;

      // hand fighting: they trade jabs while they are locked up (the rush
      // moves below decide it; the jabs are what you see)
      if(!(ru.punchT>0) && Math.random()<dt*2.2) jab(ru, blk);
      if(!(blk.punchT>0) && Math.random()<dt*2.2) jab(blk, ru);

      // A rusher does not just lean on his man. A little way into the rep he
      // tries a move: rip, swim, spin or bull rush. Win it and he is through;
      // lose it and the blocker has him for longer.
      if(!(ru.moveT>0) && ru.engaged > (ru.moveAt||0.45)){
        ru.moveAt = ru.engaged + 0.8 + Math.random()*0.6;
        var mk = RUSH_MOVES[Math.floor(Math.random()*RUSH_MOVES.length)];
        var side = (ru.lane||0)>=0 ? 1 : -1;
        if(Math.random()<0.35) side=-side;
        var won = Math.random() < 0.34*(ru.pwr||1)/(blk.pwr||1);
        ru.moveKind=mk; ru.moveT=0.42; ru.moveSide=side; ru.moveWon=won;
        if(mk==='spin') ru.spin=1;
        if(mk==='swim') ru.throwArm=1;
        if(mk==='rip')  ru.arm=0.5;
        if(won){ ru.engaged=(ru.shedAt||2.5)+0.01; blk.beat=0.5; continue; }
        ru.shedAt=(ru.shedAt||2.5)+0.45;
      }

      // hard line: he may not get to the passer's side of his blocker
      var line = blk.x - d2*4;
      var past = (line - ru.x)*d2;                    // positive once he is through
      if(past > 0){
        ru.x = line;
        if(ru.vx*d2 < 0) ru.vx = 0;                   // kill the push through
        ru.vy *= 0.5;
      }
      // and he gets bogged down while engaged (not the man you are steering:
      // he can slide off it or back out, just not straight through)
      if(!youRu && Math.abs(ru.x-blk.x) < BLOCK_R*1.4){
        ru.vx*=0.35; ru.vy*=0.55;
      }
      // locked up chest to chest: square to each other, driving in
      var fc=(blk.x>=ru.x)?1:-1;
      ru.locked=0.12; ru.lockDir=fc; blk.locked=0.12; blk.lockDir=-fc;
    }
  }

  // In the pocket (behind the line, no more than six yards behind where he
  // took the snap) the quarterback is a passer: eyes downfield, ball at his
  // chest, feet shuffling whichever way he slides. Leave it and he runs.
  var qbc=G.carrier;
  if(qbc && qbc.role==='QB' && !G.thrown && G.qbSpot){
    var qback=(G.qbSpot.x-qbc.x)*d2, overLine=(qbc.x-G.los)*d2>0;
    if(qback<=POCKET_YDS*YD && !overLine){ qbc.backpedal=0.12; qbc.dropFace=d2; qbc.pocket=0.12; }
  }

  // rush moves in motion, and blockers who just got beaten
  for(var mv=0;mv<G.players.length;mv++){
    var mq=G.players[mv];
    if(mq.beat>0){ mq.beat-=dt; mq.vx*=0.3; mq.vy*=0.3; }
    if(!(mq.moveT>0)) continue;
    mq.moveT-=dt;
    if(mq.stun>0 || mq.down>0 || mq.team===G.offense){ mq.moveT=0; continue; }
    var toQB=-d2, ms=mq.moveSide||1, gain=mq.moveWon?1:0.4;
    if(mq.moveKind==='bull'){
      // drive him straight back into the pocket
      mq.vx=toQB*DEF_SPD*0.75*gain; mq.vy*=0.3;
      if(mq.eBlk && mq.moveWon){ mq.eBlk.vx=mq.vx*0.9; mq.eBlk.vy=mq.vy; }
    } else {
      // rip, swim and spin all get round the edge of him
      var lat = mq.moveKind==='spin' ? 1.35 : 1.2;
      mq.vx=toQB*DEF_SPD*0.5*gain; mq.vy=ms*DEF_SPD*lat*gain;
    }
    if(mq.moveKind==='rip') mq.arm=0.5;
  }

  var qp=G.carrier||G.ball;
  for(var ci2=0;ci2<G.players.length;ci2++){
    var ol=G.players[ci2];
    if(ol.team!==G.offense || ol.route!=='block' || ol===G.carrier || ol.stun>0 || ol.down>0) continue;
    for(var cj=0;cj<G.players.length;cj++){
      var dfn=G.players[cj];
      if(dfn.team===G.offense || dfn.stun>0 || dfn.down>0) continue;
      if(dfn.eBlk===ol && (dfn.engaged||0)<=(dfn.shedAt||2.5)) continue;   // the block handles him
      if(TOUCH_UI && dfn===G.controlled && (G.tchase>0 || G.touchDive)) continue;   // charging on a swipe: he slips round bodies
      var cx=dfn.x-ol.x, cy=dfn.y-ol.y, cd=Math.hypot(cx,cy);
      if(cd>=LINE_COL || cd<0.01) continue;
      var nx=cx/cd, ny=cy/cd;
      dfn.x=ol.x+nx*LINE_COL; dfn.y=ol.y+ny*LINE_COL;       // out to the edge of him
      var vn=dfn.vx*nx+dfn.vy*ny;
      if(vn<0){                                              // still heading into him
        var sp0=Math.hypot(dfn.vx,dfn.vy), tx2=-ny, ty2=nx;
        var gx2=(qp?qp.x:dfn.x)-dfn.x, gy2=(qp?qp.y:dfn.y)-dfn.y;
        if(tx2*gx2+ty2*gy2<0){ tx2=-tx2; ty2=-ty2; }         // round the side nearer the ball
        dfn.vx=tx2*sp0*0.9; dfn.vy=ty2*sp0*0.9;
      }
    }
  }

  // integrate + animation state
  for(var j=0;j<G.players.length;j++){
    var q=G.players[j];
    q.x+=q.vx*dt; q.y+=q.vy*dt;
    var dvx=q.vx-(q._pvx||0), dvy=q.vy-(q._pvy||0);
    q.sq=Math.max(Math.min(0.16, Math.hypot(dvx,dvy)/900), (q.sq||0)*Math.pow(0.02,dt));
    q._pvx=q.vx; q._pvy=q.vy;
    if(q.catchT>0) q.catchT-=dt;
    q.y=Math.max(8,Math.min(FH-8,q.y)); q.x=Math.max(6,Math.min(FW-6,q.x));
    var sp=Math.hypot(q.vx,q.vy);
    q.run += (q.backpedal>0 && q.vx*(q.dropFace||q.face)<0 ? -1:1)*Math.max(sp*0.075, 2.1)*dt;    // idle still animates; backpedal runs it backwards
    if(q.punchT>0 && q.punchFace){
      q.face=q.punchFace;                             // mid-punch: facing the man he is hitting
      if(q.backpedal>0) q.backpedal-=dt;
      if(q.locked>0) q.locked-=dt;
    } else if(q.backpedal>0){
      // backpedalling: eyes downfield, weight back, never turn his back
      q.backpedal-=dt; q.face=q.dropFace||q.face;
      if(q.pocket>0) q.pocket-=dt;
      q.lean += (-0.10 - q.lean)*Math.min(1,dt*9);
    } else if(q.locked>0){
      // locked in a block: squared up, weight forward into the other man
      q.locked-=dt; q.face=q.lockDir||q.face;
      q.lean += (0.30 - q.lean)*Math.min(1,dt*9);
    } else {
      if(Math.abs(q.vx)>5) q.face = q.vx>0?1:-1;
      q.lean += ((sp>6? Math.min(0.34, sp*0.0016) :0) - q.lean)*Math.min(1,dt*9);
    }
    if(q.spin>0) q.spin=Math.max(0,q.spin-dt*2.1);
    // a fresh stun is a hit: put him in the air rather than just tipping him over
    if(q.stun > (q._pst||0)+0.5 && !(q.vz>0) && q.z<=0.01 && !REDUCED) q.vz=3.0;
    q._pst=q.stun;
    if(q.flyUntil && G.gt<q.flyUntil){               // flying (Peter Pan, the cloud): he stays up
      q.vz=0; q.z+=((q.flyZ||1.1)-q.z)*Math.min(1,dt*6);
      if((q.flyZ||1.1)>=1) q.lean+=(0.9-q.lean)*Math.min(1,dt*8);   // flying: laid out forward
    }
    else if(q.vz){
      q.vz-=9*dt; q.z=Math.max(0,q.z+q.vz*dt);
      if(q.z<=0){ q.vz=0; burst(q.x,q.y,'#cfd8cf'); }   // lands in a puff of turf
    }
    else if(q.z>0) q.z=Math.max(0,q.z-dt*1.7);
    if(q.arm>0)  q.arm=Math.max(0,q.arm-dt*1.9);
    if(q.throwArm>0 && !G.windup) q.throwArm=Math.max(0,q.throwArm-dt*2.3);
    if(q.phase>0) q.phase=Math.max(0,q.phase-dt*1.1);
    if(q.iFrames>0) q.iFrames-=dt;
    if(q.wrapped>0) q.wrapped-=dt;
    if(q.punchT>0) punchTick(q,dt);
    if(q.burst>0 && q!==G.controlled && q!==G.controlled2) q.burst-=dt;   // (yours counts down in driveHuman)
    if(!REDUCED){                                    // the moves you can see running
      if(q.flyUntil && G.gt<q.flyUntil && Math.random()<dt*20)
        G.fx.push({x:q.x+(Math.random()-0.5)*10, y:q.y-4, vx:(Math.random()-0.5)*20, vy:10, r:1.2+Math.random(),
                   life:0.5, max:0.5, c:(q.flyZ<1?'#fff4cc':'#fff3a0')});
      if(q.furyUntil && G.gt<q.furyUntil && Math.random()<dt*14)
        G.fx.push({x:q.x+(Math.random()-0.5)*14, y:q.y-10-Math.random()*18, vx:(Math.random()-0.5)*60, vy:-24,
                   r:1.3, life:0.25, max:0.25, c:'#7dff9a'});
      if(q.wolfUntil && G.gt<q.wolfUntil && Math.random()<dt*8) speedLines(q,'rgba(220,230,255,.55)');
    }
    if(q.cel>0)  q.cel-=dt;
    if(q.down>0) q.down=Math.max(0,q.down-dt);
  }

  // flame trail behind anyone moving at full tilt
  var hot=G.controlled;
  if(hot && !REDUCED){
    var hs=Math.hypot(hot.vx,hot.vy);
    var burning = hot.burst>0 || (wantSprint()&&G.stam>2&&hs>140);
    if(burning && Math.random()<0.85){
      var big = hot.burst>0;
      G.fx.push({x:hot.x-hot.face*5+(Math.random()-0.5)*5, y:hot.y-6+(Math.random()-0.5)*7,
        vx:-hot.vx*0.28, vy:-26-Math.random()*22,
        life:big?0.5:0.34, max:big?0.5:0.34, r:big?4.4:3,
        c: Math.random()<0.45 ? '#ffd23f' : (Math.random()<0.6 ? '#ff8c2b' : '#ff4d2e')});
    }
  }

  // Bodies occupy space. Without this every pursuer converges on the exact
  // same point and the play collapses into a single stack of sprites.
  var SEP=23;
  for(var i1=0;i1<G.players.length;i1++){
    for(var i2=i1+1;i2<G.players.length;i2++){
      var A=G.players[i1], B=G.players[i2];
      var ddx=B.x-A.x, ddy=B.y-A.y;
      var dsq=ddx*ddx+ddy*ddy;
      if(dsq>SEP*SEP||dsq<0.01) continue;
      var dlen=Math.sqrt(dsq);
      var shove=(SEP-dlen)/SEP*46*dt;
      // the ball carrier holds his ground a little better than the crowd
      var wA=(A===G.carrier)?0.35:((A.down>0||A.stun>0)?0.06:1);
      var wB=(B===G.carrier)?0.35:((B.down>0||B.stun>0)?0.06:1);
      A.x-=ddx/dlen*shove*wA; A.y-=ddy/dlen*shove*wA;
      B.x+=ddx/dlen*shove*wB; B.y+=ddy/dlen*shove*wB;
    }
  }
  for(var i3=0;i3<G.players.length;i3++){
    var pp3=G.players[i3];
    pp3.y=Math.max(8,Math.min(FH-8,pp3.y));
    pp3.x=Math.max(6,Math.min(FW-6,pp3.x));
  }

  fxAge(dt);

  cpuQB(now);
  cpuAbilities(dt,now);

  // ---- throwing motion: arm cocks back, then whips through
  if(G.windup){
    var W=G.windup; W.t+=dt;
    W.qb.throwArm=Math.min(1,W.t/W.dur);
    if(!G.carrier||G.carrier!==W.qb){ W.qb.throwArm=0; G.windup=null; }
    else if(W.t>=W.dur){ var tg=W.target; G.windupWasRocket=!!W.rocket; G.windup=null;
      if(G.cur){ G.cur.passer=W.qb; G.cur.target=tg; }
      releaseThrow(tg); }
  }

  // ball in flight
  if(G.thrown){
    var t=G.thrown; t.t+=dt;
    var k=Math.min(1,t.t/t.dur);
    if(t.homing && t.target && t.target.stun<=0){
      t.tx=t.target.x; t.ty=t.target.y;      // a perfect pass follows him
    }
    if(!t.homing && !t.lat && t.target && k>0.7 && t.target.stun<=0){
      var mr=t.target;
      if(Math.hypot(mr.x-t.tx, mr.y-t.ty) < CATCH_R*3){
        var mp=Math.min(1, dt*6); t.tx+=(mr.x-t.tx)*mp; t.ty+=(mr.y-t.ty)*mp;
      }
    }
    if(t.target && (1-k)*t.dur < 0.4) t.target.catchT=0.14;   // hands up for it
    G.ball.x=t.x+(t.tx-t.x)*k; G.ball.y=t.y+(t.ty-t.y)*k;
    t.h=Math.sin(k*Math.PI)*(t.arc||0);          // height above the turf
    (t.trail=t.trail||[]).push({x:G.ball.x,y:G.ball.y-t.h});
    if(t.fire && !REDUCED){
      for(var fi=0;fi<3;fi++) G.fx.push({x:G.ball.x+(Math.random()-0.5)*5, y:G.ball.y-t.h+(Math.random()-0.5)*5,
        vx:(Math.random()-0.5)*30, vy:-12-Math.random()*16, life:0.34, max:0.34,
        r:2+Math.random()*2.4, c:['#ff5a1f','#ff9a2a','#ffd23f'][fi]});
    }
    if(G.aaArmed && !t.lat && !t.kickoff && t.t>0.16 && G.aaArmed.team!==G.offense &&
       G.players.indexOf(G.aaArmed)>=0 && !(G.aaArmed.stun>0)){
      var aa=G.aaArmed; G.aaArmed=null; laserShot(aa);
      if(!G.thrown) return;
    }
    if(t.homing && !REDUCED && Math.random()<0.7){
      G.fx.push({x:G.ball.x+(Math.random()-0.5)*10, y:G.ball.y-t.h+(Math.random()-0.5)*8,
        vx:(Math.random()-0.5)*20, vy:10+Math.random()*16, r:1.4+Math.random()*1.4, life:0.5, max:0.5,
        c:(Math.random()<0.5?'#ffd23f':'#ffffff')});
    }
    if(t.trail.length>18) t.trail.shift();
    if(k>=1){
      if(t.kickoff && t.tb){ G.thrown=null; kickoffTouchback(t.punt?20:25); return; }
      if(t.tip){ resolveTip(); return; }              // nobody's ball: first to it
      var r=t.target, cov=nearestOf(r,G.offense==='H'?'A':'H',true);
      if(r && ((r.flyUntil && G.gt<r.flyUntil) || r.sureHands)) t.sure=true;   // Peter Pan up in the air, Robin Hood's hands
      var covd=cov?Math.hypot(cov.x-r.x,cov.y-r.y):999;
      var near=Math.hypot(r.x-G.ball.x,r.y-G.ball.y);
      var wasLat=t.lat;
      var win = wasLat ? CATCH_R*3.4 : (t.sure ? CATCH_R*3.2 : CATCH_R*(t.deep?3.1:2.4));
      var caught, pickIt=false, tipIt=false;
      // a defender swinging at it counts as the man on the ball if he is close
      var hs=G.controlled;
      if(hs && hs.team!==G.offense && hs.swatUntil>performance.now() &&
         Math.hypot(hs.x-G.ball.x,hs.y-G.ball.y)<CATCH_R*1.8){
        cov=hs; covd=Math.hypot(cov.x-r.x,cov.y-r.y);
      }
      var swat = cov && cov.swatUntil>performance.now();
      if(wasLat||t.sure) caught = near<win;
      else if(near>=win) caught=false;
      else if(covd>4*YD) caught=true;                 // nobody within about four yards: his
      // (it used to be a yard, so nearly everything was caught)
      else {
        // Contested. Both men are on the ball: whoever is better placed to it,
        // with the quicker hands, usually wins. The loser either knocks it
        // away or, if the defender is right on it, takes it.
        var dd=Math.hypot(cov.x-G.ball.x,cov.y-G.ball.y);
        var rS=Math.max(0.05,1-near/win)*(r.agi||1), dS=Math.max(0.05,1-dd/(win*1.7))*(cov.agi||1)*0.9*(swat?1.8:1);   // a defender dives for it from further
        var pC=Math.max(0.15, Math.min(0.72, 0.12+0.62*rS/(rS+dS)));   // (covered receivers were winning 83% of the time)
        var roll=Math.random();
        caught = roll<pC;
        pickIt = !caught && dd<CATCH_R*1.3 && roll > 1-(1-pC)*0.4;
        tipIt  = !caught && !pickIt && Math.random() < (swat ? 0.65 : 0.4);
      }
      G.thrown=null;
      if(wasLat && !caught){
        if(t.kickoff){
          // a punt or a kickoff that comes down untouched: the receiving team
          // may pick it up and run, but if the kicking team gets to it first
          // it is dead there, their ball (G.offense is already the receivers)
          G.ball.held=false; G.loose={vx:t.tx>t.x?60:-60, vy:(Math.random()-0.5)*50, t:0, kick:true, recv:G.offense};
          say(t.punt?'THE PUNT HITS THE TURF':'THE KICK HITS THE TURF',1100);
          return;
        }
        // a dropped pitch is a live ball, same as real football
        G.ball.held=false; G.loose={vx:(Math.random()-0.5)*220,vy:(Math.random()-0.5)*220,t:0};
        say('PITCH ON THE GROUND!',1100); G.shake=REDUCED?0:10;
        return;
      }
      if(caught) completePass(r, t.homing, wasLat);
      else if(cov && (pickIt || (near>=win && covd<10.5))) interceptBy(cov);
      else if(tipIt) tipBall(cov);
      else { endPlay(G.los, covd<=16?'BROKEN UP':'INCOMPLETE'); return; }
    }
  } else if(G.loose){
    // ---- loose ball bouncing free
    G.loose.t+=dt;
    G.ball.x+=G.loose.vx*dt; G.ball.y+=G.loose.vy*dt;
    if(G.loose.vz===undefined){ G.loose.vz=110; G.loose.h=2; }
    G.loose.vz-=520*dt; G.loose.h=(G.loose.h||0)+G.loose.vz*dt;
    if(G.loose.h<=0){
      G.loose.h=0;
      if(G.loose.vz<-45){                              // a bounce, off at an angle
        G.loose.vz=-G.loose.vz*0.42;
        var ba=(Math.random()-0.5)*1.4, bc=Math.cos(ba), bs=Math.sin(ba);
        var nvx=G.loose.vx*bc-G.loose.vy*bs, nvy=G.loose.vx*bs+G.loose.vy*bc;
        G.loose.vx=nvx*0.8; G.loose.vy=nvy*0.8;
      } else G.loose.vz=0;
    }
    var gdrag=(G.loose.h>0)?0.99:0.955;               // it carries in the air, scrubs on the grass
    G.loose.vx*=gdrag; G.loose.vy*=gdrag;
    G.ball.x=Math.max(4,Math.min(FW-4,G.ball.x));
    G.ball.y=Math.max(4,Math.min(FH-4,G.ball.y));
    if(Math.random()<0.5) G.fx.push({x:G.ball.x,y:G.ball.y,vx:0,vy:-14,
      life:0.3,max:0.3,r:2,c:'#ffffff'});
    if(G.loose.t>0.35){
      for(var lb=0;lb<G.players.length;lb++){
        var pl=G.players[lb];
        if(pl.stun>0) continue;
        if((G.loose.h||0)<7 && Math.hypot(pl.x-G.ball.x,pl.y-G.ball.y)<12){
          if(G.loose.kick && pl.team!==G.loose.recv){ downKick(pl); return; }   // the kicking team downs it: no return
          recoverBall(pl); return;
        }
      }
    }
    if(G.loose.t>6){ endPlay(G.ball.x,'DEAD BALL'); return; }
  } else if(G.carrier){ G.ball.x=G.carrier.x; G.ball.y=G.carrier.y; }

  if(G.offense==='A' && !NET.on){
    var cm=G.controlled, outFor=cm ? Math.max(cm.stun||0, cm.down||0) : 9;
    var free=!(G.switchLockUntil>G.gt);
    // Your man only changes when he is really out of it: a quick knock down
    // keeps you on him. Then you get the defender best placed to make the
    // play, not simply the one nearest the ball, so control does not jump
    // across the field.
    // (With AUTO_SWITCH off, which is how he wants it, your man only changes
    // when you press SWITCH; the button pulses when he is out of the play.)
    if(!cm || cm.team!=='H' || (AUTO_SWITCH && outFor>0.6)){
      var n2=bestDefender('H');
      if(n2 && n2!==cm && !(n2.stun>0) && !(n2.down>0)) switchTo(n2);
    }
    // They throw it: you get the man nearest where it is going (once a throw)
    else if(AUTO_SWITCH && free && G.thrown && !G.thrown.swDone && !G.thrown.lat && !G.thrown.kickoff){
      G.thrown.swDone=true;
      var nt=null, ntd=1e9;
      for(var tn=0;tn<G.players.length;tn++){ var tq=G.players[tn];
        if(tq.team!=='H' || tq.stun>0 || tq.down>0) continue;
        var td3=Math.hypot(tq.x-G.thrown.tx,tq.y-G.thrown.ty); if(td3<ntd){ ntd=td3; nt=tq; } }
      if(nt && nt!==cm && ntd+3*YD < Math.hypot(cm.x-G.thrown.tx,cm.y-G.thrown.ty)) switchTo(nt);
    }
    // a new ball carrier (a handoff, a catch): only if someone else is far better placed
    else if(AUTO_SWITCH && free && G.carrier && G.carrier!==G.swCar && G.gt-G.snapT>0.3){
      G.swCar=G.carrier;
      if(!(cm.wrapT>0)){
        var nb=bestDefender('H');
        if(nb && nb!==cm && defScore(cm)-defScore(nb) > 7*YD) switchTo(nb);
      }
    }
    // Next man up: the runner has got past your man and is pulling away from
    // him. Control goes to the defender best placed to stop him, so you are
    // not left chasing from behind (a tap is a punch now, not a switch).
    else if(AUTO_NEXT && free && G.carrier && !G.thrown && G.carrier.team!=='H' && !(cm.wrapT>0) &&
            !(G.diveUntil>now) && !(cm.slideUntil>now)){
      var bc=G.carrier, bx2=bc.x-cm.x, by2=bc.y-cm.y, bdist=Math.hypot(bx2,by2);
      var pastHim=bx2*d > YD, pulling=(bx2*(bc.vx-cm.vx)+by2*(bc.vy-cm.vy)) > 0;
      var beaten=pastHim && pulling && bdist>5*YD, outOfIt=AUTO_FAR && bdist>SLIDE_REACH;   // beaten, or nowhere near it
      if(beaten || outOfIt) G.beatT=(G.beatT||0)+dt; else G.beatT=0;
      if(G.beatT>0.3){
        var nm=bestDefender('H'); G.beatT=0;
        var nmIn = nm && Math.hypot(nm.x-bc.x,nm.y-bc.y) < SLIDE_REACH;   // (out of it: only to a man who can make the play now)
        if(nm && nm!==cm && !(nm.stun>0) && !(nm.down>0) && defScore(nm) < defScore(cm)-3*YD && (beaten || nmIn)){ switchTo(nm); say(surname(nm),600); }
      }
    }
    if(G.carrier && G.gt-G.snapT<=0.3) G.swCar=G.carrier;
    // SWITCH pulses when your man is out of it: flat on the turf, or well
    // behind the play while a team-mate is close enough to make it
    var hintMe=false;
    if(cm && cm.team==='H' && G.phase==='live'){
      if(outFor>0.3) hintMe=true;
      else if(G.carrier && G.carrier.team!=='H' && Math.hypot(G.carrier.x-cm.x,G.carrier.y-cm.y)>SLIDE_REACH){
        var hb=bestDefender('H');
        hintMe = !!(hb && hb!==cm && Math.hypot(G.carrier.x-hb.x,G.carrier.y-hb.y)<SLIDE_REACH && defScore(hb)<defScore(cm)-3*YD);
      }
    }
    G.swHint=hintMe;
  } else G.swHint=false;
  if(G.switchFlash>0) G.switchFlash-=dt;

  // Tackling is a struggle, not a touch. Defenders wrap up and drain the
  // carrier's footing; he goes down when it runs out. One man takes a while,
  // three bring him down fast, and a powerful back resists all of it.
  if(G.carrier){
    var jking=(((G.controlled===G.carrier)&&(performance.now()<G.jukeUntil||G.carrier.z>0.15))
             ||((G.controlled2===G.carrier)&&performance.now()<G.M2.jukeUntil))
               || (G.carrier.iFrames>0) || (G.carrier.z>0.15);
    var defTeam=G.offense==='H'?'A':'H';
    var car=G.carrier, res=Math.max(0.7,car.pwr||1), tnow=performance.now();
    // a new ball carrier (a catch, a pick) starts with nobody on him
    if(G.wrapCar!==car){
      for(var wc=0;wc<G.players.length;wc++){ G.players[wc].wrapT=0; G.players[wc].boxAcc=0; G.players[wc].boxHit=0; G.players[wc].boxV=null; }
      G.wrapCar=car;
    }
    var grabbers=0, lastT=null, hw=0, bite=0, strong=0;   // hw: your own tackles on him; bite: a wolf or a grip on him; strong: a grab from a move
    for(var m2=0;m2<G.players.length;m2++){
      var t2=G.players[m2];
      if(t2.team!==defTeam) continue;
      if(t2.tackleCd>0) t2.tackleCd-=dt;

      if(t2.wrapT>0){
        // already hanging on. A juke or spin shakes him, and so does a back
        // who keeps his legs churning long enough. Your own tackle does not
        // run out: it holds until he is down, unless he spins or jukes free.
        if(TOUCH_UI && t2===G.controlled && G.touchDive && !t2.humanWrap){   // already on him when you swiped: it is your tackle now
          t2.humanWrap=true; t2.wrapT=99; G.touchDive=false; car.iFrames=0;
          car.hp-=25/res; dmgText(car,'-'+Math.round(25/res),'#ffffff'); G.dotAcc=0; t2.boxT=0.06;
        }
        if(t2.humanWrap || t2.gripLock || t2.strongGrab) t2.stun=0;   // a knock does not shake yours or a special move's
        var holdFast = t2.gripLock || (t2.invisUntil && G.gt<t2.invisUntil) ||
                       (t2.wolfUntil && G.gt<t2.wolfUntil) || (t2.furyUntil && G.gt<t2.furyUntil);   // grip, invisible, wolf or monster: no shaking them
        if(!holdFast && (jking || t2.stun>0)){ breakWrap(t2,car); continue; }
        t2.wrapT-=dt;
        if(t2.wrapT<=0){
          breakWrap(t2,car);
          if(G.controlled===car||G.controlled2===car) say('BROKE THE TACKLE!',700);
          continue;
        }
        grabbers++; lastT=t2; if(t2.humanWrap) hw++;
        var gBite = t2.gripLock || (t2.wolfUntil && G.gt<t2.wolfUntil) || (t2.furyUntil && G.gt<t2.furyUntil);
        if(gBite) bite++;
        if(t2.strongGrab || gBite) strong++;
        // what used to drain off him every frame, he banks and throws as a punch
        // (your own man, a wolf or a grip bank faster, as they drained faster)
        if(!(G.drainPause && G.gt<G.drainPause) || t2.humanWrap){   // (a punch that rocks the others does not knock your own man off his rhythm)
