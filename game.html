          t2.boxAcc=(t2.boxAcc||0) + BOX_RATE*((68 + (t2.humanWrap?50:0) + (gBite?58:0) + ((t2.strongGrab||gBite)?25:0))/res)*dt;
          t2.boxT=(t2.boxT===undefined ? BOX_FIRST : t2.boxT) - dt;
          if(t2.boxT<=0 && !(t2.punchT>0)) boxPunch(t2, car);
        }
        continue;
      }
      // A touch-screen swipe tackle: when the dive gets to him you hit him
      // (a quarter of his fight) and grab on. Then it is damage over time:
      // you drag him down to a crawl and drain him until he is on the turf.
      if(TOUCH_UI && t2===G.controlled && !(t2.stun>0) && ((G.touchDive && tnow<G.diveUntil) || G.tchase>0)){
        var ttd=Math.hypot(t2.x-car.x,t2.y-car.y);
        if(ttd < TACKLE_R+14){
          car.iFrames=0;                               // a dodge left over from before does not slip it
          var th=25/res; car.hp-=th; car.vx*=0.3; car.vy*=0.3;
          t2.wrapT=99; t2.humanWrap=true; t2.wrapA=Math.atan2(t2.y-car.y,t2.x-car.x);
          t2.z=0; t2.vz=0; t2.arm=0.5; t2.boxAcc=0; t2.boxHit=0; t2.boxT=0.06;
          flash(car.x,car.y-16,'rgba(255,255,255,1)',34);
          shock(car.x,car.y,'rgba(255,210,63,.9)',4,36,0.3);
          spokes(car.x,car.y-16,'rgba(255,210,63,.9)',8,8,32);
          dmgText(car,'-'+Math.round(th),'#ffffff');
          pow((car.x+t2.x)/2, car.y-16, '#ffffff'); car.sq=0.24; car.lean=-0.35;
          G.hitStopUntil=performance.now()+70;
          G.shake=REDUCED?0:12; G.tchase=0; G.touchDive=false; G.dotAcc=0;
          grabbers++; hw++; lastT=t2;
          continue;
        }
      }
      if(jking || t2.stun>0 || t2.down>0 || t2.tackleCd>0) continue;

      var diving=((t2===G.controlled&&tnow<G.diveUntil)||
                  (t2===G.controlled2&&tnow<G.M2.diveUntil));
      var tdx=t2.x-car.x, tdy=t2.y-car.y, td=Math.hypot(tdx,tdy)||1;
      if(td>(diving?TACKLE_R+10:TACKLE_R)) continue;

      // trucking still blows one man clean off you
      var human=(G.controlled===car);
      if(human&&wantSprint()&&G.power>=TRUCK_COST/car.pwr){
        G.power-=TRUCK_COST/car.pwr;
        t2.stun=1.1; t2.vx=(t2.x-car.x)*7; t2.vy=(t2.y-car.y)*7;
        burst(t2.x,t2.y,'#ffd23f'); G.shake=REDUCED?0:13; say('TRUCKED!',520);
        continue;
      }

      // The tackle itself. Contact is a clinch, not a hit: he squares up and
      // holds the ball carrier, and nothing comes off him for the touch. The
      // damage comes from the punches he throws from there (boxPunch); what
      // the contact used to take rides on his first two, which come sooner
      // if he met him head on or diving.
      var hit=30*(t2.pwr||1)*(diving?1.7:1);
      var cs2=Math.hypot(car.vx,car.vy);
      var headOn=cs2>1 && (tdx*car.vx+tdy*car.vy)/(cs2*td) > 0.5;
      if(headOn) hit*=1.3;
      t2.boxHit=hit; t2.boxAcc=0; t2.boxT=BOX_FIRST*((headOn||diving)?0.6:1); t2.boxFum=true;
      t2.wrapT=(1.5+Math.random()*0.8)*((t2.pwr||1)/res);   // long enough to finish him most of the time
      if(TOUCH_UI && t2===G.controlled){   // your man ran into him: your tackle
        t2.wrapT=99; t2.humanWrap=true; hw++; G.dotAcc=0;
      }
      t2.wrapA=Math.atan2(tdy,tdx);
      car.sq=0.2; t2.lean=0.3; t2.face=(car.x>=t2.x)?1:-1;   // chest to chest
      flash((car.x+t2.x)/2, car.y-14, 'rgba(255,255,255,.75)', 14);
      G.shake=REDUCED?0:Math.max(G.shake,4);
      grabbers++; lastT=t2;
    }
    if(grabbers>0){
      // (they only hold him here: the damage comes from their punches)
      var drag=Math.max(0.18, 1-grabbers*0.42);       // held up as they hang on
      if(strong) drag=Math.min(drag,0.3);             // a grab from a special move stops him like yours does
      if(hw) drag=Math.min(drag,BOX_YOUHOLD);         // you hold him to a crawl
      if(car===G.controlled || car===G.controlled2 || hw) G.brawlUntil=performance.now()+450;   // the camera comes in on it
      car.vx*=drag; car.vy*=drag;
      // (the drag also goes into his running speed, see buffMul): your own grab
      // and a special move's grab stop him; an ordinary one only slows him, or
      // the computer's runners could not get anywhere at all
      car.wrapped=0.25; car.wrapDrag=(hw||strong) ? drag : Math.max(drag,BOX_HOLD); G.freeT=0;
      // the men on him are dragged along with him, arms round him
      for(var w2=0;w2<G.players.length;w2++){
        var wq=G.players[w2];
        if(wq.team!==defTeam || !(wq.wrapT>0)) continue;
        wq.x=car.x+Math.cos(wq.wrapA)*11; wq.y=car.y+Math.sin(wq.wrapA)*7;
        wq.vx=car.vx; wq.vy=car.vy; wq.arm=0.5;
        wq.face=(car.x>=wq.x)?1:-1;
      }
      if(Math.random()<dt*7) burst(car.x,car.y-8,'#e8eef2');
      if(car.hp<=0){
        burst(car.x,car.y,'#ffffff');
        G.shake=REDUCED?0:10;
        car.down=1.5;
        for(var w3=0;w3<G.players.length;w3++){
          var wz=G.players[w3];
          if(wz.wrapT>0){ wz.wrapT=0; wz.down=0.8; }
        }
        if(lastT) lastT.down=0.8;
        credit(lastT, car.role==='QB' ? 'SACK' : 'TACKLE');
        if(G.cur) G.cur.tackler=lastT;
        if(car.role==='QB' && (car.x-G.los)*dir()<0) G.wasSack=true;   // the banner says so
        endPlay(car.x,'TACKLED'); return;
      }
    } else {
      G.freeT=(G.freeT||0)+dt;
      if(G.freeT>0.7) G.carrier.hp=Math.min(100, G.carrier.hp + 7*dt);
    }
    // sideline: getting out stops the clock, which is the whole point
    if(G.carrier.y<=9 || G.carrier.y>=FH-9){
      burst(G.carrier.x,G.carrier.y,'#eef3e8');
      say('OUT OF BOUNDS',950);
      endPlay(G.carrier.x,'OUT OF BOUNDS'); return;
    }
    var goal=dir()>0?FW-EZ:EZ;
    if((dir()>0&&G.carrier.x>=goal)||(dir()<0&&G.carrier.x<=goal)){ score(); return; }
  }

  if(!G.training) G.clock-=dt;
  if(G.clock<=0){ G.clock=0; gameOver(); }
}

// ================================================================ outcomes
function yardLineLabel(x){ var y=Math.round((x-EZ)/YD); return String(Math.max(1, y<=50?y:100-y)); }

function endPlay(atX,label){
  logPlay(atX,label,false);
  // an incompletion, a ball carrier out of bounds, or a score stops the clock;
  // a tackle in the field of play does not
  G.clockRunning = !(label==='OUT OF BOUNDS'||label==='INCOMPLETE'||
                     label==='BROKEN UP'||label==='DEAD BALL');
  G.phase='dead'; G.carrier=null; G.thrown=null; G.windup=null;
  if(G.kickReturn){
    G.kickReturn=false; G.newSeries=false;
    G.los=Math.max(EZ+2,Math.min(FW-EZ-2,atX)); G.down=1; G.toGo=10;
    postPlay(null);
    return;
  }
  if(G.newSeries){
    // possession changed hands during the play; spot it and reset the chains
    G.newSeries=false;
    G.los=Math.max(EZ+2,Math.min(FW-EZ-2,atX));
    G.down=1; G.toGo=10;
    postPlay('TURNOVER — '+(G.offense==='H'?'YOUR BALL':'THEIR BALL'));
    return;
  }
  var gained=(atX-G.los)*dir()/YD;
  G.los=Math.max(EZ+2,Math.min(FW-EZ-2,atX));
  G.toGo-=gained;
  var txt=label;
  if(G.toGo<=0){ G.down=1; G.toGo=10; txt='FIRST DOWN'; G.stats[G.offense].fd++; }
  else { G.down+=1; if(G.down>4){ turnover(); txt='TURNOVER ON DOWNS'; } }
  if(G.wasSack && txt===label) txt='SACK!';
  if(G.stopBanner && txt===label) txt='DEFENSIVE STOP!';
  G.stopBanner=false;
  G.wasSack=false;
  postPlay(txt);
}
function postPlay(txt, minHold, then){
  var banner = !!txt && SAY_OK.test(String(txt));
  if(banner) say(txt, 1400);
  var q=G.cardQ; G.cardQ=null; var g0=G;
  var td=!!G.tdCard; G.tdCard=false;
  var cardAt = td ? 700 : (banner ? 1500 : 250);    // a touchdown: the card comes up beside him almost at once
  if(q && q.p){
    setTimeout(function(){
      if(G.over) return;
      if(td){ showCard(q.p, q.act, Math.random()<0.5?'sL':'sR'); return; }   // his dance is already going
      showCard(q.p, q.act);
      if(/PICK|INTERCEPT|FUMBLE|SCOOP|TOUCHDOWN/.test(String(q.act)))
        G.broadcast={p:q.p, until:performance.now()+2100};
      q.p.cel=Math.max(q.p.cel||0, 2.0); q.p.celKind=q.dance||'pump';               // his celebration runs with the card
    }, cardAt);
  }
  var done = cardAt + (q && q.p ? (td?3100:1500) : 500);
  setTimeout(function(){
    if(G!==g0 || G.over) return;
    if(then) then(); else G.phase='playcall';
  }, Math.max(minHold||0, done));
}
function turnover(){ G.offense=G.offense==='H'?'A':'H'; G.down=1; G.toGo=10; }
// A touchdown celebration: the camera goes in close on the scorer and he
// does something, different most times: a dance, a dab, a shuffle, a snow
// angel on his back, or the whole team jumps with him. His card pops up
// beside him.
var TD_DANCES=['td','angel','dab','shuffle','team'];
function pickTdDance(){
  var k; do { k=TD_DANCES[(Math.random()*TD_DANCES.length)|0]; } while(k===G.lastDance && Math.random()<0.8);
  G.lastDance=k; return k;
}
function startTdDance(p, kind){
  var now=performance.now();
  p.cel=4.0; p.celKind=(kind==='team')?'pump':kind; p.celAt=now; p.vx*=0.3; p.vy*=0.3;
  G.broadcast={p:p, until:now+3900, td:true, wide:(kind==='team')};
  if(kind==='team'){                                   // everybody jumps together
    for(var i=0;i<G.players.length;i++){
      var q=G.players[i];
      if(q.team===p.team && q!==p){ q.cel=4.0; q.celKind='pump'; q.celAt=now; }
    }
  }
}
function score(){
  var scorer=G.carrier;
  G.tdKind=pickTdDance();
  logPlay(G.ball?G.ball.x:G.los, 'TOUCHDOWN', true);
  if(G.offense==='H') G.scoreH+=6; else G.scoreA+=6;      // the extra point is kicked
  G.scoringTeam=G.offense;
  credit(G.carrier,'TOUCHDOWN');
  if(scorer) startTdDance(scorer, G.tdKind);
  G.tdCard=true;
  burst(G.ball.x,G.ball.y,'#ffd23f'); burst(G.ball.x,G.ball.y,'#ffffff');
  say('TOUCHDOWN!',2600); G.shake=REDUCED?0:18; G.clockRunning=false;
  for(var cf=0;cf<44;cf++) confetti(G.ball.x, G.ball.y);
  G.celebrate=2.6; G.celAt={x:G.ball.x,y:G.ball.y};
  G.phase='dead'; G.carrier=null; G.thrown=null; G.windup=null;
  G.newSeries=false; G.kickReturn=false;
  G.clockRunning=false;
  postPlay('TOUCHDOWN!', 4000, startPAT);                  // the celebration, then the extra point
}
// The try: snapped from the 15, so a 33-yard kick. The scoring side keeps
// the ball for it; the kickoff that follows is the turnover.
function startPAT(){
  var d=dir(), goal=(d>0)?FW-EZ:EZ;
  G.los=goal-15*YD*d;
  startFieldGoal('pat');
}
function gameOver(){ G.over=true; G.phase='over'; showOver(); }

var callTimer=null;
// Only these get words on the screen. Every hit and move used to shout its
// own name in the middle of the field, which was noise.
var SAY_OK=/BLOCKED|TOUCHBACK|KICKOFF|YARD ATTEMPT|EXTRA POINT|STAR PLAYER|DEFENSIVE STOP|FUMBLE|INTERCEPT|PICKED OFF|FIRST DOWN|SACK|TOUCHDOWN|TURNOVER|SAFETY|IT IS GOOD|NO GOOD|HIKE FIRST|WAITING|OTHER PLAYER|YOU ARE THE|THEY ARE IN|LIBRARY|PLAY IN/;
// A small note just above the move buttons: why a move did not go, what to
// do next. The big callout is kept for the moments that matter (the filter).
var hintTimer=null;
function hint(text,ms){
  var el=document.getElementById('hint');
  if(!el){ el=document.createElement('div'); el.id='hint'; stage.appendChild(el); }
  el.textContent=String(text); el.classList.add('on');
  if(hintTimer) clearTimeout(hintTimer);
  hintTimer=setTimeout(function(){ el.classList.remove('on'); }, ms||900);
}
// only: 'H' the host alone sees it, 'A' the guest alone (a callout about a
// move one of them made). Online, everything else the host shows goes to the
// guest's screen too.
function say(text,ms,only){
  if(NET.on && NET.host){
    if(only!=='H') netEv(['say',String(text),ms||700]);
    if(only==='A') return;
  }
  if(!SAY_OK.test(String(text))) return;
  elCall.textContent=text; elCall.style.transition=''; elCall.style.opacity='1';
  if(callTimer) clearTimeout(callTimer);
  callTimer=setTimeout(function(){
    elCall.style.transition='opacity .3s'; elCall.style.opacity='0';
  },ms||700);
}

// ================================================================ render
function resize(){
  dpr=Math.min(2,window.devicePixelRatio||1);
  VW=stage.clientWidth; VH=stage.clientHeight;
  cv.width=Math.round(VW*dpr); cv.height=Math.round(VH*dpr);
  if(!scale||scale<=0) scale=VH/(VIEW_YDS*YD);
}
window.addEventListener('resize',resize);


// ---- the static field, baked once -----------------------------------------
var fieldCanvas = (function(){
  var c=document.createElement('canvas');
  c.width=FW; c.height=FH;
  var g=c.getContext('2d');

  for(var s=0;s<FW;s+=5*YD){
    g.fillStyle=((s/(5*YD))%2===0)?'#2a6a3b':'#317446';
    g.fillRect(s,0,5*YD,FH);
  }
  g.fillStyle='#245b34'; g.fillRect(0,0,EZ,FH); g.fillRect(FW-EZ,0,EZ,FH);

  // Grass. A small tile of blades (random light and dark flecks, stretched
  // along the grain) laid over the whole field in overlay mode, then the
  // second mowing direction, then wear where the play actually happens.
  var gt=document.createElement('canvas'); gt.width=gt.height=96;
  var gg=gt.getContext('2d'), gd=gg.createImageData(96,96), ga=gd.data;
  for(var gi=0;gi<ga.length;gi+=4){ var gv=128+(Math.random()-0.5)*70; ga[gi]=ga[gi+1]=ga[gi+2]=gv; ga[gi+3]=255; }
  gg.putImageData(gd,0,0);
  for(var bl=0;bl<420;bl++){                          // blades
    var bxp=Math.random()*96, byp=Math.random()*96, bh=2+Math.random()*4;
    gg.strokeStyle=Math.random()<0.5?'rgba(255,255,255,.35)':'rgba(0,0,0,.35)';
    gg.lineWidth=0.7; gg.beginPath(); gg.moveTo(bxp,byp); gg.lineTo(bxp+(Math.random()-0.5)*1.2,byp-bh); gg.stroke();
  }
  g.save();
  g.globalCompositeOperation='overlay'; g.globalAlpha=0.5;
  g.fillStyle=g.createPattern(gt,'repeat'); g.fillRect(0,0,FW,FH);
  g.globalCompositeOperation='source-over'; g.globalAlpha=1;
  for(var mb=0;mb<6;mb++){                            // cross-mow: checkerboard with the stripes
    if(mb%2===0) continue;
    g.fillStyle='rgba(255,255,255,.035)'; g.fillRect(EZ, mb*FH/6, FW-2*EZ, FH/6);
  }
  for(var sh=0;sh<FW;sh+=5*YD){                       // each mowed band catches the light
    var sgr=g.createLinearGradient(0,0,0,FH);
    sgr.addColorStop(0,'rgba(255,255,230,.05)'); sgr.addColorStop(0.5,'rgba(0,0,0,0)'); sgr.addColorStop(1,'rgba(0,0,0,.07)');
    g.fillStyle=sgr; g.fillRect(sh,0,5*YD,FH);
  }
  var wear=[[0.5,0.5,9],[0.42,0.47,6],[0.58,0.53,6],[0.35,0.5,5],[0.65,0.5,5],[0.5,0.36,4],[0.5,0.64,4]];
  wear.forEach(function(w){                           // worn turf between the hashes
    var wx=EZ+(FW-2*EZ)*w[0], wy=FH*w[1], wr=w[2]*YD;
    var wg=g.createRadialGradient(wx,wy,0,wx,wy,wr);
    wg.addColorStop(0,'rgba(120,112,72,.16)'); wg.addColorStop(1,'rgba(120,112,72,0)');
    g.fillStyle=wg; g.fillRect(wx-wr,wy-wr,wr*2,wr*2);
  });
  g.restore();

  for(var y=0;y<=100;y+=5){
    var x=EZ+y*YD;
    g.strokeStyle = (y===50) ? 'rgba(238,243,232,.85)'
                  : (y%10===0) ? 'rgba(238,243,232,.62)'
                  : 'rgba(238,243,232,.26)';
    g.lineWidth=(y===50)?2.4:1.4;
    g.beginPath(); g.moveTo(x,0); g.lineTo(x,FH); g.stroke();
  }

  // hash marks: one path for all of them instead of 200 strokes
  g.strokeStyle='rgba(238,243,232,.3)'; g.lineWidth=1;
  g.beginPath();
  for(var h=0;h<=100;h++){
    var hx=EZ+h*YD;
    g.moveTo(hx,FH*0.36-3); g.lineTo(hx,FH*0.36+3);
    g.moveTo(hx,FH*0.64-3); g.lineTo(hx,FH*0.64+3);
  }
  g.stroke();

  g.strokeStyle='rgba(238,243,232,.55)'; g.lineWidth=2.5;
  g.strokeRect(0,0,FW,FH);

  var NUMY1=9*YD, NUMY2=FH-9*YD;
  g.textAlign='center'; g.textBaseline='middle';
  g.font='700 30px "Barlow Condensed", sans-serif';
  for(var y2=10;y2<=90;y2+=10){
    var nx=EZ+y2*YD, lb=(y2<=50?y2:100-y2);
    g.fillStyle='rgba(238,243,232,.30)';
    g.fillText(lb,nx,NUMY1); g.fillText(lb,nx,NUMY2);
    if(lb!==50){
      var toLeft=(y2<50);
      g.fillStyle='rgba(238,243,232,.26)';
      [NUMY1,NUMY2].forEach(function(ny){
        var ox=nx+(toLeft?-24:24);
        g.beginPath();
        g.moveTo(ox+(toLeft?-5:5), ny);
        g.lineTo(ox+(toLeft?2:-2), ny-6);
        g.lineTo(ox+(toLeft?2:-2), ny+6);
        g.closePath(); g.fill();
      });
    }
  }

  // the midfield logo: a shield on the 50, painted over the grass
  (function(){
    var lx=EZ+50*YD, ly=FH/2, R=4.6*YD;
    g.save();
    g.globalAlpha=0.82;
    g.fillStyle='#1f2d54'; g.beginPath(); g.arc(lx,ly,R,0,Math.PI*2); g.fill();
    g.lineWidth=5; g.strokeStyle='#c8a63c'; g.stroke();
    g.lineWidth=2; g.strokeStyle='rgba(241,241,236,.8)';
    g.beginPath(); g.arc(lx,ly,R-8,0,Math.PI*2); g.stroke();
    g.fillStyle='#c8a63c'; g.textAlign='center'; g.textBaseline='middle';
    g.font='700 40px "Anton", sans-serif'; g.fillText('HM', lx, ly-4);
    g.fillStyle='#f1f1ec'; g.font='700 11px "Barlow Condensed", sans-serif';
    g.fillText('HAIL  MYTHERY', lx, ly+R*0.52);
    for(var st=-1;st<=1;st++){                          // three stars across the top
      var sx=lx+st*16, sy=ly-R*0.58; g.beginPath();
      for(var sp=0;sp<10;sp++){ var sr=sp%2?3:7, sa=sp*Math.PI/5-Math.PI/2; g.lineTo(sx+Math.cos(sa)*sr, sy+Math.sin(sa)*sr); }
      g.closePath(); g.fill();
    }
    g.restore();
  })();

  g.font='700 34px "Anton", sans-serif';
  g.fillStyle='rgba(238,243,232,.16)';
  g.save(); g.translate(EZ/2,FH/2); g.rotate(-Math.PI/2); g.fillText('END ZONE',0,0); g.restore();
  g.save(); g.translate(FW-EZ/2,FH/2); g.rotate(Math.PI/2); g.fillText('END ZONE',0,0); g.restore();
  return c;
})();

function draw(){
  // Frame everyone who matters: zoom out when the play spreads, in when it
  // collapses, so no player is ever off screen.
  // Frame the action, not the whole formation. Fitting every player means a
  // deep safety alone can shrink everyone to specks, so the window is capped
  // and weighted toward the ball.
  var minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9,n=0;
  var bx=G.ball?G.ball.x:FW/2, by=G.ball?G.ball.y:FH/2;
  var passing = (G.phase==='live' && G.carrier && G.carrier.role==='QB' && !G.thrown);
  for(var q=0;q<G.players.length;q++){
    var pl=G.players[q];
    // While the passer has the ball, the men he can throw to must be on
    // screen or he cannot pick them, which is why long passes felt impossible.
    var reach = 30*YD;
    if(passing && pl.team===G.offense && pl!==G.carrier &&
       pl.role!=='C' && pl.role!=='OL' && pl.role!=='BL') reach = 40*YD;
    if(!isFinite(pl.x)||!isFinite(pl.y)) continue;
    if(Math.hypot(pl.x-bx,pl.y-by) > reach) continue;
    if(pl.x<minX)minX=pl.x; if(pl.x>maxX)maxX=pl.x;
    if(pl.y<minY)minY=pl.y; if(pl.y>maxY)maxY=pl.y; n++;
  }
  if(!n){ minX=maxX=bx; minY=maxY=by; n=1; }
  if(bx<minX)minX=bx; if(bx>maxX)maxX=bx;
  if(by<minY)minY=by; if(by>maxY)maxY=by;

  var padX=64, padTop=76, padBot=34;
  var needW=Math.min((maxX-minX)+padX*2, (passing?86:62)*YD);
  var needH=Math.min((maxY-minY)+padTop+padBot, (passing?46:40)*YD);
  var want=Math.min(VW/needW, VH/needH);
  if(!isFinite(want)) want=1;
  want=Math.max(passing?0.76:0.82, Math.min(1.5, want));
  scale += (want-scale)*0.06;

  // centre mostly on the ball so the play stays where your eye already is
  var cx=(minX+maxX)/2, cy=(minY+maxY)/2+(padTop-padBot)/2;
  var tx=bx*0.62+cx*0.38, ty=by*0.62+cy*0.38;
  if(!isFinite(tx)) tx=FW/2;
  if(!isFinite(ty)) ty=FH/2;
  cam.x += (tx-cam.x)*0.11; cam.y += (ty-cam.y)*0.11;

  // the viewport itself can come back wrong after a resize
  if(!isFinite(VW)||!isFinite(VH)||VW<40||VH<40){ resize(); }
  if(!isFinite(scale)||scale<=0.05) scale=VH/(VIEW_YDS*YD);
  scale=Math.max(0.45,Math.min(2.4,scale));
  if(!isFinite(cam.x)) cam.x=FW/2;
  if(!isFinite(cam.y)) cam.y=FH/2;

  var halfW=VW/scale/2, halfH=VH/scale/2;
  cam.x = (FW>halfW*2) ? Math.max(halfW,Math.min(FW-halfW,cam.x)) : FW/2;
  cam.y = (FH>halfH*2) ? Math.max(halfH,Math.min(FH-halfH,cam.y)) : FH/2;

  var sx=0,sy=0;
  if(G.shake>0.3){ sx=(Math.random()-0.5)*G.shake; sy=(Math.random()-0.5)*G.shake; G.shake*=0.86; }

  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#0c1114'; ctx.fillRect(0,0,VW,VH);
  ctx.save();
  ctx.translate(VW/2+sx,VH/2+sy); ctx.scale(scale,scale); ctx.translate(-cam.x,-cam.y);

  // The turf never changes, so it is painted once into an offscreen canvas
  // and blitted. Re-stroking 200-odd hash marks every frame was costing more
  // than everything else in the renderer put together.
  if(!SKIP_FIELD) ctx.drawImage(fieldCanvas, 0, 0);

  var fd=G.los+G.toGo*YD*dir();
  ctx.lineWidth=2.5; ctx.strokeStyle='#3aa0ff';
  ctx.beginPath(); ctx.moveTo(G.los,0); ctx.lineTo(G.los,FH); ctx.stroke();
  if(fd>EZ&&fd<FW-EZ){ ctx.strokeStyle='#ffd23f';
    ctx.beginPath(); ctx.moveTo(fd,0); ctx.lineTo(fd,FH); ctx.stroke(); }

  // pass targeting reticle
  if((G.phase==='live'||G.phase==='presnap')&&G.mouse.on&&G.carrier&&G.carrier.role==='QB'&&iHaveBall()&&!G.thrown&&!pastTheLine(G.carrier)){
    var tgt=aimTarget();
    if(tgt && Math.hypot(tgt.x-G.carrier.x,tgt.y-G.carrier.y) < 46*YD){
      var lk=(tgt===G.lockMan)?Math.min(1,G.lockT/1.05):0;
      var col=lk>0.92 ? '79,209,139' : (lk>0.45 ? '255,210,63' : '224,140,63');
      ctx.strokeStyle='rgba('+col+',.85)'; ctx.lineWidth=2.1; ctx.setLineDash([6,5]);
      ctx.beginPath(); ctx.moveTo(G.carrier.x,G.carrier.y); ctx.lineTo(tgt.x,tgt.y); ctx.stroke();
      ctx.setLineDash([]);
      // the ring closes in as the lock builds
      var rw=17+(1-lk)*15;
      ctx.lineWidth=1.6+lk*2.0;
      ctx.strokeStyle='rgba('+col+',.95)';
      ctx.beginPath(); ctx.ellipse(tgt.x,tgt.y,rw,rw*0.41,0,0,Math.PI*2); ctx.stroke();
      if(lk>0.92){
        ctx.beginPath(); ctx.ellipse(tgt.x,tgt.y,rw+5,(rw+5)*0.41,0,0,Math.PI*2); ctx.stroke();
      }
      ctx.fillStyle='rgba('+col+',.95)';
      ctx.font='700 8px "Barlow Condensed", sans-serif'; ctx.textAlign='center';
      ctx.fillText(lk>0.92?'LOCKED':'THROW', tgt.x, tgt.y-24);
    }
  }

  // the tackle you are winding up, drawn while you hold the button
  if(G.drag && G.phase==='live' && G.mouse && G.mouse.on){
    var me0=G.controlled;
    if(me0){
      var ddx=G.mouse.x-G.drag.x, ddy=G.mouse.y-G.drag.y;
      var dm=Math.hypot(ddx,ddy);
      if(dm>8){
        var un=Math.min(1,dm/70);
        ctx.strokeStyle='rgba(255,255,255,'+(0.35+un*0.5).toFixed(2)+')';
        ctx.lineWidth=1.4+un*1.8; ctx.setLineDash([5,4]);
        ctx.beginPath(); ctx.moveTo(me0.x,me0.y-12);
        ctx.lineTo(me0.x+ddx/dm*(18+un*30), me0.y-12+ddy/dm*(18+un*30));
        ctx.stroke(); ctx.setLineDash([]);
      }
    }
  }

  if(!G._p3) drawGoalposts();                     // the 3D build draws them after its ground
  if(!G._p3) drawCracks(null);                     // on the turf, under the players (the 3D build draws them after its ground)
  // depth sort so players nearer the bottom overlap the ones behind them
  var order=G.players.slice().sort(function(a,b){ return a.y-b.y; });
  for(var i=0;i<order.length;i++) drawGuy(order[i]);

  for(var f=0;f<G.fx.length;f++){
    var e=G.fx[f], k2=Math.max(0,e.life/e.max);
    // one bad number in a particle used to take the whole frame down with it
    if(!isFinite(e.x)||!isFinite(e.y)||!isFinite(k2)) continue;
    if(e.r!==undefined && !isFinite(e.r)) continue;
    if(e.x2!==undefined && (!isFinite(e.x2)||!isFinite(e.y2))) continue;
    ctx.globalAlpha=k2;
    if(e.ringed){
      ctx.strokeStyle=e.c; ctx.lineWidth=2.4*k2;
      ctx.beginPath(); ctx.ellipse(e.x,e.y,e.r,e.r*0.42,0,0,Math.PI*2); ctx.stroke();
    } else if(e.shock){
      var ggg=1-k2, rr2=e.r0+(e.r1-e.r0)*ggg;
      if(!addSprite(fxTint(FXI.shock,solidOf(e.c)),e.x,e.y,rr2*2.2,rr2*2.2,k2,e.rot,0.40)){
        ctx.strokeStyle=e.c; ctx.lineWidth=0.8+3.6*k2;
        ctx.beginPath(); ctx.ellipse(e.x,e.y,rr2,rr2*0.40,0,0,Math.PI*2); ctx.stroke();
      }
    } else if(e.dome){
      var dr=e.r*(0.5+(1-k2)*0.6);
      addSprite(fxTint(FXI.dome,solidOf(e.c)),e.x,e.y-dr*0.28,dr*2,dr*2,k2*0.9,0,0.8);
    } else if(e.crack){
      /* drawn under the players, in drawCracks */
    } else if(e.laser){
      // red glow, orange body, white-hot core, flickering, thinning as it ends
      var fl=0.85+Math.random()*0.3, lw=k2*fl;
      ctx.save(); ctx.globalAlpha=1; ctx.lineCap='round';
      ctx.globalCompositeOperation='lighter';
      ctx.strokeStyle='rgba(255,40,40,'+(0.35*k2).toFixed(3)+')'; ctx.lineWidth=11*lw;
      ctx.beginPath(); ctx.moveTo(e.x,e.y); ctx.lineTo(e.x2,e.y2); ctx.stroke();
      ctx.strokeStyle='rgba(255,120,60,'+(0.8*k2).toFixed(3)+')'; ctx.lineWidth=5*lw;
      ctx.beginPath(); ctx.moveTo(e.x,e.y); ctx.lineTo(e.x2,e.y2); ctx.stroke();
      ctx.strokeStyle='rgba(255,255,255,'+k2.toFixed(3)+')'; ctx.lineWidth=1.8*lw;
      ctx.beginPath(); ctx.moveTo(e.x,e.y); ctx.lineTo(e.x2,e.y2); ctx.stroke();
      ctx.fillStyle='rgba(255,90,70,'+(0.9*k2).toFixed(3)+')';            // the glow at his eyes
      ctx.beginPath(); ctx.arc(e.x,e.y,4.5*lw,0,Math.PI*2); ctx.fill();
      ctx.restore();
    } else if(e.bolt){
      var bl=Math.hypot(e.x2-e.x,e.y2-e.y), ba=Math.atan2(e.y2-e.y,e.x2-e.x);
      addSprite(fxTint(FXI.bolt,solidOf(e.c)),(e.x+e.x2)/2,(e.y+e.y2)/2,
                bl,bl*0.5*(128/256),k2,ba,1);
    } else if(e.pow){
      var pk=1-k2, pr2=(10+pk*16)*(e.sz||1);
      ctx.save(); ctx.translate(e.x,e.y); ctx.rotate(e.rot); ctx.globalAlpha=Math.min(1,k2*2.2);
      ctx.beginPath();
      for(var pp=0;pp<20;pp++){ var pa3=pp/20*Math.PI*2, prr=(pp%2?pr2*0.5:pr2); ctx.lineTo(Math.cos(pa3)*prr, Math.sin(pa3)*prr*0.8); }
      ctx.closePath(); ctx.fillStyle=e.c; ctx.fill();
      ctx.lineWidth=1.6; ctx.strokeStyle='rgba(20,14,4,.9)'; ctx.stroke();
      ctx.beginPath(); ctx.arc(0,0,pr2*0.3,0,Math.PI*2); ctx.fillStyle='#fffbe8'; ctx.fill();
      ctx.restore();
      if(e.word){
        ctx.save(); ctx.globalAlpha=Math.min(1,k2*2.6);
        var wsz=Math.round(11*(e.sz||1)), wy=e.y+1-pk*3;
        ctx.font='700 '+wsz+'px "Anton", Impact, sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.lineWidth=3.2; ctx.lineJoin='round'; ctx.strokeStyle='rgba(20,14,4,.95)'; ctx.strokeText(e.word,e.x,wy);
        ctx.fillStyle='#fff3c4'; ctx.fillText(e.word,e.x,wy);
        ctx.restore();
      }
    } else if(e.dmg){
      ctx.save(); ctx.globalAlpha=Math.min(1,k2*1.8);
      ctx.font='700 15px "Anton", Impact, sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      var dy2=e.y-52-(1-k2)*20;
      ctx.lineWidth=3.5; ctx.strokeStyle='rgba(0,0,0,.85)'; ctx.strokeText(e.txt,e.x,dy2);
      ctx.fillStyle=e.c; ctx.fillText(e.txt,e.x,dy2);
      ctx.restore();
    } else if(e.flash){
      var fr=e.r*(0.45+(1-k2)*1.5);
      if(!addSprite(fxTint(FXI.impact,solidOf(e.c)),e.x,e.y,fr*2.6,fr*2.6,k2,e.rot,1)){
        var gr=ctx.createRadialGradient(e.x,e.y,0,e.x,e.y,fr);
        gr.addColorStop(0,e.c); gr.addColorStop(1,'rgba(255,255,255,0)');
        ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(e.x,e.y,fr,0,Math.PI*2); ctx.fill();
      }
    } else if(e.streak){
      var sl=Math.hypot(e.x2-e.x,e.y2-e.y), sa=Math.atan2(e.y2-e.y,e.x2-e.x);
      if(!addSprite(fxTint(FXI.streak,solidOf(e.c)),(e.x+e.x2)/2,(e.y+e.y2)/2,
                    sl,Math.max(3,e.w*3.2),k2,sa,1)){
        ctx.strokeStyle=e.c; ctx.lineWidth=e.w; ctx.lineCap='round';
        ctx.beginPath(); ctx.moveTo(e.x,e.y); ctx.lineTo(e.x2,e.y2); ctx.stroke();
      }
    } else if(e.puff){
      if(FXI.dust && FXI.dust.ready){
        ctx.save(); ctx.globalAlpha=k2*0.85;
        ctx.translate(e.x,e.y); ctx.rotate(e.rot);
        ctx.drawImage(FXI.dust,-e.r,-e.r,e.r*2,e.r*2);
        ctx.restore();
      } else {
        ctx.fillStyle=e.c; ctx.beginPath();
        ctx.arc(e.x,e.y,e.r*0.3,0,Math.PI*2); ctx.fill();
      }
    } else if(e.gh){
      ctx.globalAlpha=k2*0.40; ctx.fillStyle=e.c;
      ctx.beginPath(); ctx.ellipse(e.x,e.y-15,5.2,11,0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(e.x+e.face*0.8,e.y-28,4.3,0,Math.PI*2); ctx.fill();
    } else {
      ctx.fillStyle=e.c;
      ctx.beginPath(); ctx.arc(e.x,e.y,(e.r||2.6)*(0.4+k2*0.8),0,Math.PI*2); ctx.fill();
    }
  }
  ctx.globalAlpha=1;

  drawPlayArt();
  if(!G._p3) drawSnap(null);
  if(G.kick) drawKick();
  else if(G.thrown||(G.ball&&!G.ball.held)) drawBall();
  ctx.restore();
}

// Flat-vector limb: solid colour with a darker plane down one side.
function limb(x0,y0,a1,l1,a2,l2,w1,w2,c1,c2){
  var kx=x0+Math.sin(a1)*l1, ky=y0+Math.cos(a1)*l1;
  var hx=kx+Math.sin(a2)*l2, hy=ky+Math.cos(a2)*l2;
  ctx.lineCap='round';
  ctx.strokeStyle=c1; ctx.lineWidth=w1;
  ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(kx,ky); ctx.stroke();
  ctx.strokeStyle=c2; ctx.lineWidth=w2;
  ctx.beginPath(); ctx.moveTo(kx,ky); ctx.lineTo(hx,hy); ctx.stroke();
  // shading plane on the trailing edge
  ctx.globalAlpha=0.22; ctx.strokeStyle='#000';
  ctx.lineWidth=w1*0.38; ctx.beginPath();
  ctx.moveTo(x0-w1*0.3,y0); ctx.lineTo(kx-w1*0.3,ky); ctx.stroke();
  ctx.lineWidth=w2*0.38; ctx.beginPath();
  ctx.moveTo(kx-w2*0.3,ky); ctx.lineTo(hx-w2*0.3,hy); ctx.stroke();
  ctx.globalAlpha=1;
  return {x:hx,y:hy};
}
function ink(){}   // flat-vector style carries no outline

// ================================================================ sprites
// Seven body parts, drawn once, rigged onto the same skeleton the vector
// version uses. Heroes wear the art as-is; Rivals get the navy recoloured.
var PART_FILES = {
  helmet:'parts/football-helmet.png', torso:'parts/football-torso.png',
  uarm:'parts/football-upper-arm.png', farm:'parts/football-forearm.png',
  thigh:'parts/football-thigh.png', shin:'parts/football-lower-leg.png',
  cleat:'parts/football-cleat.png',
  torsoOL:'parts/football-torso-lineman.png',      // heavier build for the line
  helmetAlt:'parts/football-helmet-alt.png',       // second lid, for variety
  farmHand:'parts/football-forearm-hand.png'       // open glove, for the reach
};
var SPR = { ready:false, H:{}, A:{}, raw:{}, T:{}, pending:0 };   // raw: the art as drawn; T: each team's tinted set

// The ball. Lace-free on purpose: a spiral is rotation about the long axis,
// so the laces sweep across the face rather than orbiting with the sprite,
// and they are drawn on top per frame.
var BALL_IMG = new Image(); BALL_IMG.ready=false;
BALL_IMG.onload = function(){ BALL_IMG.ready=true; };
BALL_IMG.src = 'parts/football-body.png';

// recolour the navy kit to the away team's colours, leaving skin and white alone
function tintAway(img, kit){
  var K=kit||FOE.kit;
  var c=document.createElement('canvas'); c.width=img.width; c.height=img.height;
  var x=c.getContext('2d'); x.drawImage(img,0,0);
  try{
    var d=x.getImageData(0,0,c.width,c.height), a=d.data;
    for(var i=0;i<a.length;i+=4){
      if(a[i+3]<8) continue;
      var r=a[i],g=a[i+1],b=a[i+2];
      // navy = blue clearly dominant and not too bright
      if(b>r+24 && b>g+14 && b<210){
        var lum=(r*0.3+g*0.59+b*0.11)/255, tk=Math.min(1,lum*K.g);
        a[i]=Math.round(K.lo[0]+(K.hi[0]-K.lo[0])*tk);
        a[i+1]=Math.round(K.lo[1]+(K.hi[1]-K.lo[1])*tk);
        a[i+2]=Math.round(K.lo[2]+(K.hi[2]-K.lo[2])*tk);
      }
    }
    x.putImageData(d,0,0);
  }catch(e){ /* tainted canvas: fall back to the untinted art */ }
  return c;
}

// Give a body part its cartoon outline, once: a dark ring round the art,
// grown outward so the part keeps its size. padX/padY tell drawPart how far
// to widen the box it draws into, so joints still meet where they did.
function outlinePart(img){
  var w=img.width, h=img.height; if(!w||!h) return img;
  var P=Math.max(3, Math.round(Math.max(w,h)*0.04));
  var c=document.createElement('canvas'); c.width=w+2*P; c.height=h+2*P;
  var g=c.getContext('2d');
  for(var k=0;k<16;k++){ var an=k*Math.PI/8; g.drawImage(img, P+Math.cos(an)*P, P+Math.sin(an)*P); }
  g.globalCompositeOperation='source-in'; g.fillStyle='#0a0c10'; g.fillRect(0,0,c.width,c.height);
  g.globalCompositeOperation='source-over'; g.drawImage(img,P,P);
  c.padX=P/w; c.padY=P/h;
  return c;
}
// Gear. The passer always wears a towel at his waist and a sleeve on his
// throwing arm; everyone else's comes from his shirt number, so a man looks
// the same every play.
function gearOf(p){
  var n=p.num||0, line=(p.role==='OL'||p.role==='C'||p.role==='BL'), qb=(p.role==='QB');
  return { towel: qb || (!line && n%3===0) || (line && n%4===1),
           sf: qb || n%2===0,                        // a sleeve on the front forearm
           sb: !qb && n%4===0,                       // and on the back one
           sc: (n%5===0) ? '#eef0ea' : '#14161b' };  // black mostly, some white
}
function sleeve(ex,ey,a,len,w,c){
  var sx=Math.sin(a), sy=Math.cos(a);
  ctx.strokeStyle=c; ctx.lineWidth=w; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(ex+sx*0.8, ey+sy*0.8); ctx.lineTo(ex+sx*len, ey+sy*len); ctx.stroke();
}
function drawPart(img,x,y,w,h){
  if(img.padX){ var ex=w*img.padX, ey=h*img.padY; ctx.drawImage(img,x-ex,y-ey,w+2*ex,h+2*ey); }
  else ctx.drawImage(img,x,y,w,h);
}

(function loadParts(){
  var keys=Object.keys(PART_FILES);
  SPR.pending=keys.length;
  keys.forEach(function(k){
    var im=new Image();
    im.onload=function(){
      SPR.raw[k]=im; SPR.H[k]=outlinePart(im); SPR.A[k]=outlinePart(tintAway(im));
      if(--SPR.pending===0) SPR.ready=true;
    };
    im.onerror=function(){ SPR.pending--; };   // stay on the vector fallback
    im.src=PART_FILES[k];
  });
})();

// A padded thigh in the team's pants, drawn rather than stretched from art.
// Swap back to boneV(S.thigh,...) the moment football-thigh.png is real.
function thighBone(x,y,a,len,wid,pants,stripe){
  ctx.save(); ctx.translate(x,y); ctx.rotate(-a);
  var w=wid*1.06;
  ctx.fillStyle=pants;
  roundRect(-w/2, 0, w, len, w*0.42); ctx.fill();
  ctx.fillStyle='rgba(0,0,0,.13)';                 // shaded back edge
  roundRect(w*0.12, 0, w*0.38, len, w*0.2); ctx.fill();
  ctx.fillStyle=stripe;                            // seam stripe
  ctx.fillRect(-w*0.46, len*0.10, w*0.17, len*0.82);
  ctx.strokeStyle='#0a0c10'; ctx.lineWidth=0.5;    // same outline as the art
  roundRect(-w/2, 0, w, len, w*0.42); ctx.stroke();
  ctx.restore();
  return {x:x+Math.sin(a)*len, y:y+Math.cos(a)*len};
}

// draw a part whose artwork runs top-to-bottom, pivoting at (x,y)
function boneV(img,x,y,a,len,wid){
  ctx.save(); ctx.translate(x,y); ctx.rotate(-a);
  drawPart(img,-wid/2,0,wid,len); ctx.restore();
  return {x:x+Math.sin(a)*len, y:y+Math.cos(a)*len};
}
// draw a part whose artwork runs left-to-right, pivoting at (x,y)
function boneH(img,x,y,a,len,thk){
  ctx.save(); ctx.translate(x,y); ctx.rotate(Math.PI/2-a);
  drawPart(img,0,-thk/2,len,thk); ctx.restore();
  return {x:x+Math.sin(a)*len, y:y+Math.cos(a)*len};
}

function drawSprite(p){
  var S = p.team==='H' ? SPR.H : SPR.A;
  var TORSO  = (p.role==='OL'||p.role==='C'||p.role==='BL') && S.torsoOL ? S.torsoOL : S.torso;
  var PANTS  = p.team==='H' ? '#f1f1ec' : '#e8e8e2';
  var STRIPE = p.team==='H' ? '#1f2d54' : FOE.stripe;
  var HELMET = (S.helmetAlt && (p.num%2===1)) ? S.helmetAlt : S.helmet;
  // Torso carries the figure; the helmet must read smaller than the shoulders.
  var HIP=-16, SHO=-28.5, GR=gearOf(p);
  var TH=9.6, WTH=5.6, SHN=7.6, WSHN=3.2, CL=4.5, HCL=2.2;
  var UA=7, HUA=4.16, FA=6.5, HFA=3.5;         // thicker arms for the padded sleeve and glove art
  var sp=Math.hypot(p.vx,p.vy), moving=sp>8 && p.down<=0 && p.stun<=0, ph=p.run;
  var gait=Math.min(1.25, 0.55+sp/150);       // stride opens up with speed

  // A running leg is not a pendulum: the knee tucks hard through the forward
  // recovery and straightens again just before the foot plants.
  function leg(phase){
    var thigh=Math.sin(phase)*0.95*gait;
    var tuck=Math.max(0,Math.cos(phase-0.3));     // swinging through: fold the knee
    return {t:thigh, s:thigh-0.20-tuck*1.7};
  }
  var LF,LB,bob,AF,AB,EF=0.45,EB=0.45, KD=p._pose;
  if(KD){
    // knocked down, or getting back up: see knockPose
    LF={t:KD.lt, s:KD.ls};
    LB={t:KD.bt, s:KD.bs};
    bob=0; AF=KD.af; AB=KD.ab; EF=KD.ef; EB=KD.eb;
  } else if(moving){
    LF=leg(ph); LB=leg(ph+Math.PI);
    bob=-Math.abs(Math.sin(ph))*2.2;                 // rises twice per stride
    var armSwing=1.05*gait;
    EF=1.2; EB=1.2;                                   // elbows at ninety, pumping
    AF=-Math.sin(ph)*armSwing; AB=-Math.sin(ph+Math.PI)*armSwing;
  } else {
    // idle: weight shifting foot to foot, chest rising, hands never still.
    // Linemen in a stance settle; skill players bounce on their toes.
    var amp = (p.role==='C'||p.role==='OL') ? 0.45 : 1.0;
    var w=Math.sin(ph*1.7), w2=Math.sin(ph*1.7+2.1), br=Math.sin(ph*2.6);
    LF={t: 0.17+w*0.10*amp,  s: 0.03+w*0.07*amp};
    LB={t:-0.17+w2*0.10*amp, s:-0.31+w2*0.07*amp};
    bob = br*0.85*amp - 0.4;
    AF = -0.15+Math.sin(ph*1.7+0.9)*0.22*amp;
    AB =  0.15+Math.sin(ph*1.7+2.6)*0.22*amp;
  }

  // pre-snap stance for his position (body lean and drop are in drawGuy)
  var HB=0, LOOK=false;                       // head bob, and a glance back
  if(!KD && p.stance>0){
    var STp=stancePose(p), ft=performance.now()/1000, sd=((p.num||1)*2.399)%6.283;
    LF={t:STp.lt, s:STp.ls}; LB={t:STp.bt, s:STp.bs};
    AF=STp.af; EF=STp.ef; AB=STp.ab; EB=STp.eb; bob=0;
    // Nobody stands like a statue. Each man fidgets on his own clock (seeded
    // by his number) so the whole defence does not move in step.
    HB=Math.sin(ft*1.7+sd)*0.35;             // breathing, head bobbing
    if(STp===STANCES.lb || STp===STANCES.db){
      var shf=Math.sin(ft*2.6+sd);            // little shuffle steps
      if(shf>0.6){ LF.t+=0.25*(shf-0.6)/0.4; LF.s+=0.1; }
      if(shf<-0.6){ LB.t-=0.2*(-shf-0.6)/0.4; }
      var clp=(ft/4.5+sd)%1;                  // now and then, a clap
      if(clp<0.12){
        var cc=Math.sin(clp/0.12*Math.PI);
        AF+=(1.35-AF)*cc; AB+=(1.35-AB)*cc; EF+=(0.9-EF)*cc; EB+=(0.9-EB)*cc;
      }
    }
    if(STp===STANCES.lb || STp===STANCES.db || STp===STANCES.qb){
      LOOK=((ft/5.5+sd*0.37)%1)<0.13;         // a look over the shoulder
    }
  }
  // celebrating: both fists up and pumping (the hop comes from cel in drawGuy)
  if(!KD && p.cel>0 && p!==G.carrier){
    var ct=performance.now()/1000;
    if(p.celKind==='td'){
      // touchdown dance: arms trading up and down, hips swinging (see drawGuy)
      var dw=Math.sin(ct*8);
      AF=1.3+1.3*dw; EF=0.9; AB=1.3-1.3*dw; EB=0.9;
      LF={t: 0.25*dw, s: 0.25*dw-0.35}; LB={t:-0.25*dw, s:-0.25*dw-0.35};
    } else if(p.celKind==='dab'){
      var db=Math.sin(ct*3)*0.05;
      AF=2.2+db; EF=0.15; AB=0.95+db; EB=2.0;          // one arm out high, the other folded across his face
      LF={t:0.28, s:0.06}; LB={t:-0.22, s:-0.3};       // feet planted
    } else if(p.celKind==='shuffle'){
      var sh2=Math.sin(ct*9);                          // side to side, arms pumping
      LF={t:0.3*sh2, s:0.3*sh2-0.25}; LB={t:-0.3*sh2, s:-0.3*sh2-0.25};
      AF=0.8+0.7*sh2; EF=1.5; AB=0.8-0.7*sh2; EB=1.5;
    } else if(p.celKind==='flex'){
      // the flex: upper arms out, fists up by the ears, a little shake
      var fs=Math.sin(ct*22)*0.06;
      AF=1.57+fs; EF=1.6; AB=-1.57-fs; EB=-1.6;
    } else {
      AF= 2.75+Math.sin(ct*13)*0.35; EF=-0.3;
      AB=-2.55+Math.sin(ct*13+1.7)*0.35; EB=0.3;
    }
  }
  // locked in a block: both hands out on the other man's chest
  if(!KD && p.locked>0 && !(p.cel>0)){
    var lkt=performance.now()/1000;
    AF=1.35+Math.sin(lkt*9+(p.num||0))*0.12; EF=0.25; AB=1.15; EB=0.3;
  }
  // reaching for a catch: hands up and out to the ball
  if(!KD && p.catchT>0 && !(p.throwArm>0)){ AF=2.35; EF=-0.25; AB=2.1; EB=-0.2; }
  // the passer in the pocket: both hands on the ball at his chest
  var POCKET = !KD && p===G.carrier && p.role==='QB' && p.pocket>0 && !(p.throwArm>0);
  if(POCKET){ AF=0.25; EF=2.15; AB=0.2; EB=2.2; }
  // Off the ground (a leap, a slam, a flight, the cloud) he is never running.
  var AIR = !KD && (p.z||0)>0.22 && !(p.cel>0) && !(p.stance>0);
  if(AIR){
    var flying = p.flyUntil && G && G.gt<p.flyUntil;
    if(flying && (p.flyZ||1.1)>=1){                     // flying: laid out, arms reaching ahead
      AF=2.7; EF=0.1; AB=2.4; EB=0.2; LF={t:-0.35,s:-0.15}; LB={t:-0.75,s:-0.25};
    } else if(flying){                                  // riding the cloud: crouched, arms out for balance
      AF=1.3; EF=0.4; AB=-1.1; EB=0.4; LF={t:0.95,s:-1.0}; LB={t:0.35,s:-1.3};
    } else {                                            // a jump: knees up, arms up on the way, out on the way down
      var goingUp=(p.vz||0)>0;
      AF=goingUp?2.3:1.2; EF=0.5; AB=goingUp?2.0:-0.6; EB=0.5; LF={t:1.1,s:-1.3}; LB={t:0.45,s:-1.5};
    }
  }

  // When he changes what he is doing (stops, starts, sets, catches, gets
  // up) the limbs ease over for a moment instead of snapping to the new pose.
  var pmode = KD ? 'kd' : (AIR ? 'air' : (p.stance>0 ? 'st' : (p.cel>0 ? 'cel' : (p.locked>0 ? 'lk' :
              (p.catchT>0 ? 'ct' : (POCKET ? 'pk' : (moving ? 'run' : 'idle')))))));
  var pnow=performance.now();
  if(p._pm!==pmode){ if(p._pa && pmode!=='kd' && p._pm!=='kd'){ p._pb0=pnow; p._pf=p._pa; } p._pm=pmode; }
  if(p._pb0 && p._pf && pnow-p._pb0<140){
    var bk=(pnow-p._pb0)/140; bk=bk*bk*(3-2*bk); var PF=p._pf;
    AF=PF.AF+(AF-PF.AF)*bk; AB=PF.AB+(AB-PF.AB)*bk; EF=PF.EF+(EF-PF.EF)*bk; EB=PF.EB+(EB-PF.EB)*bk;
    LF={t:PF.LFt+(LF.t-PF.LFt)*bk, s:PF.LFs+(LF.s-PF.LFs)*bk};
    LB={t:PF.LBt+(LB.t-PF.LBt)*bk, s:PF.LBs+(LB.s-PF.LBs)*bk};
  }
  p._pa={AF:AF,AB:AB,EF:EF,EB:EB,LFt:LF.t,LFs:LF.s,LBt:LB.t,LBs:LB.s};

  ctx.translate(0,bob);

  // ---- back leg, then back arm
  ctx.globalAlpha=0.82*GA;
  var kB=thighBone(-1.8,HIP,LB.t,TH,WTH,PANTS,STRIPE);
  var fB=boneV(S.shin,kB.x,kB.y,LB.s,SHN,WSHN);
  boneH(S.cleat,fB.x-1,fB.y-0.6,LB.s+1.25,CL,HCL);
  var elB=boneH(S.uarm,-3.6,SHO+1,AB,UA,HUA);
  boneH(S.farm,elB.x,elB.y,AB+EB,FA,HFA);   // elbow held near 90 degrees
  if(GR.sb) sleeve(elB.x,elB.y,AB+EB,FA*0.7,HFA*1.3,GR.sc);
  ctx.globalAlpha=GA;

  // ---- torso: the widest thing on the figure
  drawPart(TORSO, TORSO===S.torso?-5.4:-6.3, SHO-3.5, TORSO===S.torso?10.8:12.6, 15);

  // the art has a 12 painted on it, so patch it out and stamp the real number
  ctx.fillStyle = p.team==='H' ? '#223058' : FOE.patch;
  roundRect(-0.2, SHO+3.2, 3.6, 5.6, 0.9); ctx.fill();
  ctx.save(); ctx.scale(p.face,1);
  ctx.fillStyle = p.team==='H' ? '#c8a63c' : '#f1f1ec';
  ctx.font='700 4.4px "JetBrains Mono", monospace';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(String(p.num), p.face*1.6, SHO+6);
  ctx.restore();

  // ---- front leg
  var kF=thighBone(1.8,HIP,LF.t,TH,WTH,PANTS,STRIPE);
  var fF=boneV(S.shin,kF.x,kF.y,LF.s,SHN,WSHN);
  boneH(S.cleat,fF.x-1,fF.y-0.6,LF.s+1.25,CL,HCL);

  // ---- the towel tucked in at his waist, flapping behind him when he runs
  if(GR.towel){
    var tsw=(moving ? 0.55 : 0.05)+Math.sin((p.run||0)*2+(p.num||0))*(moving?0.22:0.06);
    ctx.save(); ctx.translate(2.2,HIP-0.6); ctx.rotate(tsw);
    ctx.fillStyle='#ffffff'; roundRect(-1.6,0,3.2,7.4,0.7); ctx.fill();
    ctx.strokeStyle='#0a0c10'; ctx.lineWidth=0.7; ctx.stroke();          // outlined, or it vanishes on white pants
    ctx.fillStyle=(p.team==='H')?'#1f2d54':FOE.stripe; ctx.fillRect(-1.6,5.2,3.2,0.9);
    ctx.restore();
  }

  // ---- helmet: must sit narrower than the shoulders, or it reads bobblehead
  if(LOOK){ ctx.save(); ctx.scale(-1,1); drawPart(HELMET,-4.8,SHO-10.7+HB,9.2,8.2); ctx.restore(); }
  else drawPart(HELMET,-4.4,SHO-10.7+HB,9.2,8.2);

  // ---- front arm: throw, stiff arm, or normal swing
  if(!KD && p.throwArm>0){
    var u=1-p.throwArm;               // 0 at the release, 1 by the follow-through
    // cock it back, then whip over the top. This ran backwards before.
    var ta = u<0.32 ? (-0.5 - u*4.4)
                    : (-1.91 + (u-0.32)*5.0);
    var elT=boneH(S.uarm,3.6,SHO+1,ta,UA,HUA);
    boneH(S.farm,elT.x,elT.y,ta+0.35,FA,HFA);
    if(GR.sf) sleeve(elT.x,elT.y,ta+0.35,FA*0.7,HFA*1.3,GR.sc);
  } else if(!KD && p.punchT>0){
    var pu=p.punchT/(p.punchDur||0.27), pa, pe;
    if(pu<0.18){ var pw=pu/0.18; pa=0.2-1.15*pw; pe=0.6+1.35*pw; }                       // wind up: a flick of the shoulder
    else if(pu<0.6){ var ps=(pu-0.18)/0.42; ps=1-(1-ps)*(1-ps)*(1-ps); pa=-0.95+2.5*ps; pe=1.95-1.9*ps; }   // strike: straight out, fast
    else { var pr=(pu-0.6)/0.4; pa=1.55-1.3*pr; pe=0.05+0.85*pr; }                        // and back
    var elP=boneH(S.uarm,3.6,SHO+1,pa,UA,HUA);
    var fist=boneH(S.farm,elP.x,elP.y,pa+pe,FA,HFA);
    if(GR.sf) sleeve(elP.x,elP.y,pa+pe,FA*0.7,HFA*1.3,GR.sc);
    if(pu>0.18 && pu<0.72){                          // the blow: a fist you can pick out, and the air it moved
      var wk=Math.max(0,1-Math.abs((pu-0.42)/0.3));
      ctx.save(); ctx.globalAlpha=wk; ctx.lineCap='round';
      ctx.strokeStyle='rgba(255,255,255,.95)'; ctx.lineWidth=1.5;
      ctx.beginPath();
      ctx.moveTo(fist.x-9,fist.y-2.5); ctx.lineTo(fist.x-3,fist.y-1.2);
      ctx.moveTo(fist.x-10,fist.y+1);  ctx.lineTo(fist.x-3.5,fist.y+0.6);
      ctx.moveTo(fist.x-8,fist.y+4);   ctx.lineTo(fist.x-3,fist.y+2.4);
      ctx.stroke();
      ctx.fillStyle='#fffdf2'; ctx.strokeStyle='rgba(20,14,4,.9)'; ctx.lineWidth=0.9;
      ctx.beginPath(); ctx.arc(fist.x,fist.y,2.9,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.restore();
    }
  } else if(!KD && p.arm>0){
    var k=p.arm/0.55;
    var elS=boneH(S.uarm,3.6,SHO+1,1.38*k,UA,HUA);
    boneH(S.farmHand||S.farm,elS.x,elS.y,1.52*k,FA+1.4,HFA+0.5);
    if(GR.sf) sleeve(elS.x,elS.y,1.52*k,(FA+1.4)*0.62,HFA*1.3,GR.sc);
  } else {
    // upper arm, then the ball, then the forearm over it: the ball sits in
    // the crook of the arm instead of pasted on top of the hand
    var elF=boneH(S.uarm,3.6,SHO+1,AF,UA,HUA);
    var fa=AF+EF;
    if(p===G.carrier && !snapPos()){
      heldBall(p, elF.x+Math.sin(fa)*(FA-1.4), elF.y+Math.cos(fa)*(FA-1.4), fa, POCKET);
      var held=true;
    }
    boneH(S.farm,elF.x,elF.y,fa,FA,HFA);
    if(GR.sf) sleeve(elF.x,elF.y,fa,FA*0.7,HFA*1.3,GR.sc);
  }
  // mid-throw or mid-stiff-arm the ball rides at his hip
  if(p===G.carrier && !held && !snapPos()) heldBall(p, 4.8, HIP-9, null, false);
}

// The snap. Before it the ball is on the turf under the center's hands; at
// the snap it flies back to the quarterback (or to the holder on a kick), and
// only then is it in his hands.
var SNAP_DUR=0.22;
function snapPos(){
  if(!G) return null;
  var c=G.snapC; if(!c || G.players.indexOf(c)<0) return null;
  var d=dir(), bx=c.x+d*8, by=c.y;
  var fk=G.fgKick, pre=(G.phase==='presnap' || G.phase==='kickset');
  if(pre) return {x:bx, y:by, h:1.5, flat:true};
  var pk=G.puntK;
  var to = fk ? fk.holder : (pk ? pk.punter : G.carrier);
  if(!to || G.phase!=='live') return null;
  var k=(G.gt-G.snapT)/SNAP_DUR;
  if(k>=1){
    if(fk){ to.stance=1; return {x:to.x+d*5, y:to.y, h:5, upright:true}; }   // the holder, down on one knee, holds it on the spot
    if(pk) return {x:to.x+d*5, y:to.y, h:17, flat:true};             // in the punter's hands
    return null;
  }
  if(k<0) k=0;
  return {x:bx+(to.x+d*4-bx)*k, y:by+(to.y-by)*k, h:1.5+Math.sin(k*Math.PI)*9+k*9, k:k};
}
function drawSnap(P){
  var sp=snapPos(); if(!sp || G.kick) return;
  if(P) at3D(P,sp.x,sp.y);
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,.28)';
  ctx.beginPath(); ctx.ellipse(sp.x,sp.y,5.5,2.3,0,0,Math.PI*2); ctx.fill();
  ctx.translate(sp.x, sp.y-sp.h);
  ctx.rotate(sp.upright ? -Math.PI/2 : (sp.flat ? 0 : (sp.k||0)*Math.PI*3));   // upright under the holder's finger, or a spiral back
  if(BALL_IMG.ready) ctx.drawImage(BALL_IMG,-7.9,-4.9,15.8,9.8);
  else { ctx.fillStyle='#7a4a28'; ctx.beginPath(); ctx.ellipse(0,0,7.1,4.2,0,0,Math.PI*2); ctx.fill(); }
  ctx.restore();
}
// The ball in a man's grip. It sways with his stride so it has weight, and
// when he is wrapped up or nearly spent it rattles in his hands: the lower
// his footing, the harder it shakes. That is the tell that it could come out.
function heldBall(p, x, y, fa, pocket){
  var sway=Math.sin((p.run||0)*2), hp=(p.hp===undefined?100:p.hp);
  var shake=Math.min(1.3, Math.max(0,(60-hp)/45) + (p.wrapped>0?0.55:0));
  ctx.save();
  ctx.translate(x + (Math.random()-0.5)*shake*2.4, y + sway*0.5 + (Math.random()-0.5)*shake*2.4);
  var rot = pocket ? -1.25 : (fa===null ? -0.45 : Math.atan2(Math.cos(fa),Math.sin(fa)));
  ctx.rotate(rot + sway*0.10 + (Math.random()-0.5)*shake*0.7);
  ctx.fillStyle='#7a4a28'; ctx.beginPath(); ctx.ellipse(0,0,4,2.5,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#0a0c10'; ctx.lineWidth=0.5; ctx.stroke();
  ctx.fillStyle='rgba(0,0,0,.22)';
  ctx.beginPath(); ctx.ellipse(-1.2,0.5,2.4,1.6,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#f1f1ec'; ctx.lineWidth=0.7;
  ctx.beginPath(); ctx.moveTo(-1.8,-0.2); ctx.lineTo(1.8,-0.2); ctx.stroke();
  ctx.restore();
}

// ---- knockdown: fall, stay down, then climb back to his feet -------------
// Poses are in the player's own frame (after the facing flip), so everyone
// goes over backwards from the way he was facing. rot turns the body about
// the hip; drop lowers the hip toward the turf. Leg and arm angles are the
// same bone angles drawSprite uses, so the whole rig moves, not a stiff cutout.
// ---- pre-snap stances, one per position ------------------------------------
// Same joints as the knockdown poses: rot leans the whole man forward over his
// hips, drop sinks the hips, and the leg angles are given in his own frame, so
// they carry that lean (world angle = local angle minus rot). The old stance
// squashed the standing sprite and tipped it, which read as a short man
// falling over rather than a lineman down in his stance.
var STANCES={
  three:{rot:1.15, drop:2.9, lt:2.05, ls:0.8,  bt:1.75, bs:0.35,  af:1.25, ef:0,   ab:1.65, eb:0.6},   // one hand down
  four: {rot:1.15, drop:2.9, lt:2.05, ls:0.8,  bt:1.75, bs:0.35,  af:1.25, ef:0,   ab:1.2,  eb:0},     // both hands down
  lb:   {rot:0.45, drop:1.1, lt:1.05, ls:0.05, bt:0.85, bs:-0.05, af:0.95, ef:0.2, ab:0.85, eb:0.2},   // hands on knees
  db:   {rot:0.30, drop:0,   lt:0.65, ls:0.0,  bt:0.5,  bs:-0.1,  af:0.5,  ef:0.8, ab:0.3,  eb:0.8},   // light, ready to turn
  wr:   {rot:0.40, drop:1.1, lt:1.1,  ls:0.25, bt:0.1,  bs:-0.3,  af:0.1,  ef:1.0, ab:0.9,  eb:0.9},   // sprinter's stagger
  qb:   {rot:0.15, drop:0,   lt:0.45, ls:-0.05,bt:-0.05,bs:-0.4,  af:1.1,  ef:1.2, ab:1.0,  eb:1.2}    // hands up for the snap
};
function stancePose(p){
  var r=p.role, pos=p.pos||'';
  if(r==='C'||r==='OL'||r==='TE'||r==='BL') return STANCES.three;
  if(pos==='DE') return (p.num%2) ? STANCES.four : STANCES.three;
  if(pos==='LB'||r==='RB') return STANCES.lb;
  if(pos==='CB'||pos==='S'||r==='COV') return STANCES.db;
  if(r==='WR') return STANCES.wr;
  if(r==='QB') return STANCES.qb;
  return STANCES.lb;
}

var KD_STAND={rot:0,    drop:0,   lt:0.17, ls:0.03, bt:-0.17, bs:-0.31, af:-0.15, ef:0.45,  ab:0.15,  eb:0.45};
var KD_LIE  ={rot:-1.45,drop:10.5,lt:-0.15,ls:0.0,  bt:0.45,  bs:-0.55, af:-2.3,  ef:0.4,   ab:-2.9,  eb:0.2};
var KD_SIT  ={rot:-0.2, drop:13,  lt:1.3,  ls:1.2,  bt:0.9,   bs:-0.5,  af:0.2,   ef:0.5,   ab:-0.8,  eb:0};
var KD_KNEEL={rot:0.35, drop:5.5, lt:1.8,  ls:0.4,  bt:0.25,  bs:-1.15, af:1.25,  ef:0.4,   ab:0.65,  eb:0.5};
var KD_FALL=0.25, KD_GETUP=0.75;
function kdMix(a,b,t){
  t=t*t*(3-2*t);
  var o={}; for(var k in a) o[k]=a[k]+(b[k]-a[k])*t; return o;
}
var KD_SLIDE={rot:1.3, drop:7, lt:-0.25, ls:-0.1, bt:-0.5, bs:-0.35, af:2.75, ef:0.1, ab:2.5, eb:0.15};
function knockPose(p){
  // a slide tackle: flat out head first, then back up on his feet
  if(p.slideUntil && performance.now()<p.slideUntil+170 && !(p.down>0) && !(p.stun>0)){
    var st=performance.now()-(p.slideAt||0), sl=p.slideUntil-(p.slideAt||0);
    var sk = st<70 ? st/70 : (st<sl ? 1 : Math.max(0, 1-(st-sl)/170));
    var sp2=kdMix(KD_STAND, KD_SLIDE, sk);
    sp2.flat=Math.min(1,Math.abs(sp2.rot)/1.45)*0.6;
    return sp2;
  }
  // a snow angel in the end zone: down on his back, arms and legs sweeping
  if(p.cel>0 && p.celKind==='angel'){
    var at=(performance.now()-(p.celAt||0))/1000, aw=Math.sin(at*7);
    var lie={rot:KD_LIE.rot, drop:KD_LIE.drop, lt:0.05+aw*0.32, ls:0, bt:0.25-aw*0.32, bs:-0.2,
             af:-1.7+aw*1.15, ef:0.15, ab:-1.7+aw*1.15, eb:0.15};
    var ak=Math.min(1,at/0.35)*Math.min(1,p.cel/0.4);   // down onto his back, and up again at the end
    var ap=kdMix(KD_STAND, lie, ak);
    ap.flat=Math.min(1,Math.abs(ap.rot)/1.45);
    return ap;
  }
  var r=Math.max(p.down||0,p.stun||0);
  if(!(r>0)){ p._kd0=0; p._kdLast=0; return null; }
  if(!p._kd0 || r>p._kdLast+0.02){
    // a fresh knockdown starts from the fall; a second hit on a man already
    // down keeps him down rather than replaying the fall
    p._kd0 = r + (p._kd0 ? KD_FALL : 0);
  }
  p._kdLast=r;
  var total=p._kd0, e=total-r;
  var fall=Math.min(KD_FALL,total*0.3);
  var up=Math.min(KD_GETUP,total*0.55);
  var pose;
  if(e<fall){
    var u=e/fall; pose=kdMix(KD_STAND,KD_LIE,u*u);        // gravity: slow, then fast
  } else if(r>up){
    pose=kdMix(KD_LIE,KD_LIE,0);
  } else {
    var g=1-r/up;                                         // 0 flat, 1 standing
    pose = g<0.35 ? kdMix(KD_LIE,KD_SIT,g/0.35)
         : g<0.70 ? kdMix(KD_SIT,KD_KNEEL,(g-0.35)/0.35)
         :          kdMix(KD_KNEEL,KD_STAND,(g-0.70)/0.30);
  }
  pose.flat=Math.min(1,Math.abs(pose.rot)/1.45);
  return pose;
}

// is the ball carrier in your tackle right now (see the tackle loop)
// is he in a grab that holds: yours, or one from a special move
function heldHard(){
  for(var i=0;i<G.players.length;i++){ var q=G.players[i]; if(q.wrapT>0 && (q.humanWrap || q.strongGrab || q.gripLock)) return true; }
  return false;
}
function heldByYou(){
  for(var i=0;i<G.players.length;i++){ var q=G.players[i]; if(q.humanWrap && q.wrapT>0) return true; }
  return false;
}
// A tackler who loses his grip ends up on the grass.
function breakWrap(t,car){
  t.wrapT=0; t.tackleCd=1.1; t.arm=0; t.humanWrap=false; t.gripLock=false; t.strongGrab=false;
  t.boxAcc=0; t.boxHit=0; t.boxV=null; t.boxT=undefined;
  t.down=Math.max(t.down||0,0.85);
  var bx=t.x-car.x, by=t.y-car.y, bm=Math.hypot(bx,by)||1;
  t.vx=bx/bm*90; t.vy=by/bm*90;
}

var GA=1;               // how solid the man being drawn is (the Invisible Man is not)
var SKIP_FIELD=false;   // the 3D build keeps the field in its own canvas and only repaints what moved
var GUY_PASS=null;   // 'marks' or 'body' to draw half a player; null draws all of him
// The outline is baked into every body part once at load (outlinePart), so
// a player draws in one pass. The per-frame outline pass it replaced cost
// more than drawing the players and made every input feel late.
function drawGuy(p){
  var inv = G && p.invisUntil && G.gt<p.invisUntil;
  if(inv){ GA = (p.team===mySide()) ? 0.4 : 0.1+0.06*Math.sin(performance.now()/90); ctx.globalAlpha=GA; }
  drawGuyRaw(p);
  if(inv){ GA=1; ctx.globalAlpha=1; }
}
function drawGuyRaw(p){
  var K=KITS[p.team];
  var ctrl=(p===G.controlled), carry=(p===G.carrier);
  var hop=(p.cel>0 && p.celKind!=='dab' && p.celKind!=='shuffle' && p.celKind!=='angel');   // those stay on the ground
  var lift=p.z*15 + (hop?Math.abs(Math.sin(p.cel*9))*10:0);
  var sp=Math.hypot(p.vx,p.vy), moving=sp>8;
  var ph=p.run;
  var legF=moving?Math.sin(ph):0.18, legB=moving?Math.sin(ph+Math.PI):-0.18;

  // ---- ground marks (stay flat on the turf)
  var sh=1-Math.min(0.6,p.z*0.6);
  var kd=p._pose=knockPose(p);
  var lay=kd?kd.flat:0;
  if(GUY_PASS!=='body'){
  ctx.fillStyle='rgba(0,0,0,'+(0.38*sh)+')';
  ctx.beginPath();
  ctx.ellipse(p.x, p.y+lay*5, (8.5+lay*8)*sh, (3.4+lay*1.2)*sh,
              0, 0, Math.PI*2);
  ctx.fill();
  if(p.flyUntil && G && G.gt<p.flyUntil && (p.flyZ||1.1)<1){   // Sun Wukong's cloud, under his feet
    var cly=p.y-lift+3, cwob=Math.sin(performance.now()/120)*0.8;
    ctx.fillStyle='rgba(255,246,214,.96)'; ctx.strokeStyle='rgba(214,170,70,.75)'; ctx.lineWidth=1.1;
    [[-10,1,6],[-4,-2,7.5],[4,-1.5,7],[10,1,5.5],[0,2.5,8.5]].forEach(function(c){
      ctx.beginPath(); ctx.ellipse(p.x+c[0], cly+c[1]+cwob, c[2], c[2]*0.55, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke(); });
  }
  if(ctrl){
    // red and pulsing when the ball carrier is close enough to tackle or punch
    var inR = G.phase==='live' && G.carrier && G.carrier.team!==p.team &&
              Math.hypot(G.carrier.x-p.x,G.carrier.y-p.y) < SLIDE_REACH;
    var rp = inR ? 13+Math.sin(performance.now()/60)*1.6 : 13;
    ctx.strokeStyle= inR ? 'rgba(255,70,70,.95)' : 'rgba(238,243,232,.9)'; ctx.lineWidth= inR ? 2.4 : 1.5;
    ctx.beginPath(); ctx.ellipse(p.x,p.y,rp,rp*0.4,0,0,Math.PI*2); ctx.stroke();
    if(G.switchFlash>0){
      var sf=G.switchFlash/0.5, rr=13+(1-sf)*18;
      ctx.strokeStyle='rgba(255,210,63,'+sf.toFixed(2)+')'; ctx.lineWidth=2.2;
      ctx.beginPath(); ctx.ellipse(p.x,p.y,rr,rr*0.4,0,0,Math.PI*2); ctx.stroke();
    }
  }
  if(NET.on && p===G.controlled2){
    // the other human. The host has to be able to see which Rival is a person.
    ctx.strokeStyle='rgba(224,56,78,.95)'; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.ellipse(p.x,p.y,13,5.2,0,0,Math.PI*2); ctx.stroke();
  }
  if(carry){
    ctx.strokeStyle='#c78a3e'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.ellipse(p.x,p.y,16.5,6.6,0,0,Math.PI*2); ctx.stroke();
    // footing bar: how much fight he has left before he goes down
    var hpv=Math.max(0,Math.min(100,p.hp===undefined?100:p.hp));
    if(hpv<100){
      var bw=TOUCH_UI?32:22, bh=TOUCH_UI?4:2.4, bx2=p.x-bw/2, by2=p.y-48-lift;
      ctx.fillStyle='rgba(8,12,16,.78)';
      roundRect(bx2-1.2,by2-1.2,bw+2.4,bh+2.4,1.6); ctx.fill();
      ctx.fillStyle = hpv>55?'#4fd18b' : (hpv>25?'#ffd23f':'#e0384e');
      roundRect(bx2,by2,bw*(hpv/100),bh,1.2); ctx.fill();
    }
  }
  }
  if(GUY_PASS==='marks') return;

  ctx.save();
  ctx.translate(p.x,p.y-lift);
  ctx.scale(p.face,1);
  if(p.spin>0){
    var spc=Math.cos(p.spin*Math.PI*2);
    ctx.scale(Math.abs(spc)<0.14 ? (spc<0?-0.14:0.14) : spc, 1);
  }
  if(p.sq>0.01 && !(p.down>0||p.stun>0)) ctx.scale(1+p.sq, 1-p.sq*0.6);   // squash and stretch
  if(p.cel>0 && p.celKind==='td') ctx.rotate(Math.sin(performance.now()/1000*8)*0.16);   // hips
  ctx.rotate(p.lean);
  // three-point stance before the snap
  if(p.stance>0 && !kd){                 // his stance: lean over the hips and sink
    var STg=stancePose(p);
    var wsh=Math.sin(performance.now()/1000*1.3+(p.num||1)*1.1)*0.035;   // weight shifting
    ctx.translate(0,STg.drop); ctx.translate(0,-16); ctx.rotate(STg.rot+wsh); ctx.translate(0,16);
  }
  ctx.globalAlpha=GA*(p.phase>0 ? 1-p.phase*0.62 : 1);
  if(kd){                            // on the turf, or climbing off it
    ctx.translate(0,kd.drop);
    ctx.translate(0,-16); ctx.rotate(kd.rot); ctx.translate(0,16);
  }
  if(p.stun>0) ctx.globalAlpha=0.62*GA;

  if(SPR.ready){ drawSprite(p); ctx.restore(); heroTag(p,lift); return; }

  // Vector fallback, used until the art finishes loading.
  // Flat-vector athlete, ~36 tall. Head a fifth, legs just under half.
  var HIP=-17, SHO=-25.5, HY=-31.2, HR=4.3;
  var TH=9, SH=8.5;
  var UA=7,  FA=6.5;
  var DK='rgba(0,0,0,.20)';

  // ---- back leg
  var tB=legB*0.84, sB=tB+Math.max(0,-legB)*1.15;
  var footB=limb(-1.8,HIP,tB,TH,sB,SH, 5,3.5, shade(K.pants,-26), shade(K.sock,-4));
  ctx.fillStyle='#14161a';
  ctx.beginPath(); ctx.ellipse(footB.x+1.5,footB.y+0.5,3,1.5,0,0,Math.PI*2); ctx.fill();

  // ---- back arm
  var aB=-legB*0.78, eB=aB-0.62;
  var hB=limb(-3.6,SHO+1,aB,UA,eB,FA, 3.6,2.9, shade(K.sleeve,-26), shade(p.skin,-22));
  ctx.fillStyle=shade(K.glove,-8);
  ctx.beginPath(); ctx.arc(hB.x,hB.y,2,0,Math.PI*2); ctx.fill();

  // ---- pants
  ctx.fillStyle=K.pants;
  ctx.beginPath();
  ctx.moveTo(-5,HIP-6.5); ctx.lineTo(5,HIP-6.5);
  ctx.lineTo(5.6,HIP+1.5); ctx.lineTo(-5.6,HIP+1.5);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle=DK; ctx.fillRect(-5.6,HIP-6.5,2.2,8);          // shade plane
  // side stripe: team colour with a gold hairline, like the reference
  ctx.fillStyle=K.jersey; ctx.fillRect(3.2,HIP-6.5,1.5,8);
  ctx.fillStyle=K.stripe; ctx.fillRect(4.7,HIP-6.5,0.7,8);

  // ---- torso
  ctx.fillStyle=K.jersey;
  ctx.beginPath();
  ctx.moveTo(-4.6,HIP-4.5);
  ctx.quadraticCurveTo(-6,HIP-11, -6,SHO+2);
  ctx.lineTo(6,SHO+2);
  ctx.quadraticCurveTo(6,HIP-11, 4.6,HIP-4.5);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle=DK;
  ctx.beginPath();
  ctx.moveTo(-4.6,HIP-4.5);
  ctx.quadraticCurveTo(-6,HIP-11, -6,SHO+2);
  ctx.lineTo(-3,SHO+2); ctx.lineTo(-2.4,HIP-4.5);
  ctx.closePath(); ctx.fill();

  // ---- shoulder pads under the jersey: broad but not cartoonish
  ctx.fillStyle=K.jersey;
  ctx.beginPath();
  ctx.moveTo(-6.2,SHO+3);
  ctx.quadraticCurveTo(-8.6,SHO+0.4, -6.6,SHO-2.4);
  ctx.quadraticCurveTo(-3.4,SHO-4, 0,SHO-4);
  ctx.quadraticCurveTo(3.4,SHO-4, 6.6,SHO-2.4);
  ctx.quadraticCurveTo(8.6,SHO+0.4, 6.2,SHO+3);
  ctx.closePath(); ctx.fill();
  // gold shoulder flashes
  ctx.fillStyle=K.stripe;
  ctx.beginPath();
  ctx.moveTo(-7.2,SHO+0.6); ctx.quadraticCurveTo(-5.4,SHO-2.8, -2.6,SHO-3.6);
  ctx.lineTo(-2.6,SHO-2.1); ctx.quadraticCurveTo(-4.8,SHO-1.4, -6.2,SHO+1.4);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(7.2,SHO+0.6); ctx.quadraticCurveTo(5.4,SHO-2.8, 2.6,SHO-3.6);
  ctx.lineTo(2.6,SHO-2.1); ctx.quadraticCurveTo(4.8,SHO-1.4, 6.2,SHO+1.4);
  ctx.closePath(); ctx.fill();

  // number
  ctx.save(); ctx.scale(p.face,1);
  ctx.fillStyle=K.num; ctx.font='700 6.2px "JetBrains Mono", monospace';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(String(p.num),0,SHO+8);
  ctx.restore();

  // ---- front leg
  var tF=legF*0.84, sF=tF+Math.max(0,-legF)*1.15;
  var footF=limb(1.8,HIP,tF,TH,sF,SH, 5.4,3.8, K.pants, K.sock);
  ctx.fillStyle='#1c1f25';
  ctx.beginPath(); ctx.ellipse(footF.x+1.6,footF.y+0.5,3.2,1.6,0,0,Math.PI*2); ctx.fill();

  // ---- neck
  ctx.strokeStyle=shade(p.skin,-14); ctx.lineWidth=3; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(0.2,SHO-1); ctx.lineTo(0.7,SHO-4); ctx.stroke();

  // ---- helmet: flat shell, gold stripe, dark cage
  ctx.fillStyle=p.skin;
  ctx.beginPath(); ctx.arc(1.2,HY+1.4,HR-0.7,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=K.helmet;
  ctx.beginPath(); ctx.arc(0.4,HY,HR,0,Math.PI*2); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.arc(0.4,HY,HR,0,Math.PI*2); ctx.clip();
  ctx.fillStyle=DK; ctx.fillRect(-HR-1,HY-HR,HR*0.9,HR*2.2);
  ctx.fillStyle=K.stripe; ctx.fillRect(-0.6,HY-HR-1,1.7,HR*1.1);
  ctx.restore();
  ctx.fillStyle='rgba(0,0,0,.30)';
  ctx.beginPath(); ctx.arc(-1.5,HY+0.5,1.1,0,Math.PI*2); ctx.fill();
  // facemask
  ctx.strokeStyle=K.mask; ctx.lineCap='round'; ctx.lineWidth=1.25;
  ctx.beginPath(); ctx.arc(1.8,HY+1.2,3.7,-0.9,1.05); ctx.stroke();
  ctx.lineWidth=0.9;
  ctx.beginPath(); ctx.moveTo(2.6,HY-1.1); ctx.lineTo(5.2,HY+0.6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(2.4,HY+2.3); ctx.lineTo(4.9,HY+2.3); ctx.stroke();

  // ---- front arm + ball
  if(p.arm>0){
    var k=p.arm/0.55;
    var hS=limb(3.6,SHO+1, 1.38*k, UA, 1.52*k, FA, 3.9,3.1, K.sleeve, p.skin);
    ctx.fillStyle=K.glove;
    ctx.beginPath(); ctx.arc(hS.x,hS.y,2.3,0,Math.PI*2); ctx.fill();
  } else {
    var aF=-legF*0.78, eF=aF-0.62;
    var hand=limb(3.6,SHO+1,aF,UA,eF,FA, 3.9,3.1, K.sleeve, p.skin);
    ctx.fillStyle=K.glove;
    ctx.beginPath(); ctx.arc(hand.x,hand.y,2.2,0,Math.PI*2); ctx.fill();
  }
  if(carry){
    ctx.save(); ctx.translate(4.8,HIP-9); ctx.rotate(-0.45);
    ctx.fillStyle='#7a4a28'; ctx.beginPath(); ctx.ellipse(0,0,4,2.5,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(0,0,0,.22)';
    ctx.beginPath(); ctx.ellipse(-1.2,0.5,2.4,1.6,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#f1f1ec'; ctx.lineWidth=0.7;
    ctx.beginPath(); ctx.moveTo(-1.8,-0.2); ctx.lineTo(1.8,-0.2); ctx.stroke();
    ctx.restore();
  }

  ctx.restore();

  heroTag(p,lift);
}

function heroTag(p,lift){
  if(GUY_PASS==='body') return;               // drawn on top of the outline instead
  // Labelling all sixteen turns to mush the moment two players overlap.
  var ctrl=(p===G.controlled), carry=(p===G.carrier);
  if(!ctrl && !carry && !p.hero) return;
  var last=surname(p)||String(p.name||'').toUpperCase();
  ctx.save();
  ctx.textAlign='center'; ctx.textBaseline='top';
  ctx.font=(ctrl?'700 7.6px':'700 6.8px')+' "Barlow Condensed", sans-serif';
  var w=ctx.measureText(last).width;
  ctx.fillStyle='rgba(10,14,18,.66)';
  roundRect(p.x-w/2-2.4, p.y+4.2, w+4.8, 8.8, 1.8); ctx.fill();
  ctx.fillStyle = ctrl ? '#ffd23f' : (carry ? '#ffe9a8' : 'rgba(226,234,244,.85)');
  ctx.fillText(last, p.x, p.y+5);
  ctx.restore();
}


// lighten (+) or darken (-) a hex colour by an amount
function shade(hex,amt){
  var n=parseInt(hex.slice(1),16);
  var r=Math.max(0,Math.min(255,(n>>16)+amt));
  var g=Math.max(0,Math.min(255,((n>>8)&255)+amt));
  var b=Math.max(0,Math.min(255,(n&255)+amt));
  return 'rgb('+r+','+g+','+b+')';
}
// A thrown ball spirals: nose along the flight path, laces rotating around
// the long axis. A fumble tumbles end over end instead.
function drawBall(){
  var t=G.thrown, spiral=!!t && !t.lat;
  var ang, phase, hh=(t&&t.h)||(G.loose&&G.loose.h)||0;
  if(t){
    ang=Math.atan2(t.ty-t.y, t.tx-t.x);
    phase=(t.t/GAME_SPEED)*(t.lat?11:52);
    if(t.kickoff) ang+=phase*1.2;                   // a kick turns end over end, it does not spiral
  } else if(G.loose){
    ang=Math.atan2(G.loose.vy,G.loose.vx);
    phase=G.loose.t*11;               // loose ball tumbles
    ang+=phase;
  } else { ang=0; phase=0; }

  // vapour trail along the flight path
  if(t&&t.trail&&t.trail.length>1){
    for(var i=1;i<t.trail.length;i++){
      var a0=t.trail[i-1], a1=t.trail[i], f=i/t.trail.length;
      ctx.strokeStyle = t.homing ? ('rgba(127,216,255,'+(f*0.85).toFixed(3)+')')
                                 : ('rgba(241,241,236,'+(f*0.5).toFixed(3)+')');
      ctx.lineWidth=(t.homing?1.1:0.5)+f*2.2; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(a0.x,a0.y); ctx.lineTo(a1.x,a1.y); ctx.stroke();
    }
  }
  // ground shadow tracks the ball while it hangs
  if(hh>0.5){
    ctx.fillStyle='rgba(0,0,0,'+(0.30-Math.min(0.2,hh/140)).toFixed(3)+')';
    ctx.beginPath();
    ctx.ellipse(G.ball.x,G.ball.y,Math.max(1.2,5.5-hh*0.035),Math.max(0.6,2.4-hh*0.014),0,0,Math.PI*2);   // never a negative size on a sky-high kick
    ctx.fill();
  }

  ctx.save();
  ctx.translate(G.ball.x,G.ball.y-hh);
  ctx.rotate(ang);

  // nose wobble on a spiral, full tumble on a fumble
  var wv=(t && t.wob!==undefined) ? t.wob : 0.05;
  var wob = spiral ? Math.sin(phase*0.5)*wv + Math.sin(phase*1.9)*wv*0.4 : 0;
  ctx.rotate(wob);

  // body
  if(BALL_IMG.ready){
    ctx.drawImage(BALL_IMG,-7.9,-4.9,15.8,9.8);
  } else {
    ctx.fillStyle='#7a4a28';
    ctx.beginPath(); ctx.ellipse(0,0,7.1,4.2,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(0,0,0,.22)';
    ctx.beginPath(); ctx.ellipse(0,1.3,7.1,2.9,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#f1f1ec'; ctx.lineWidth=0.9;
    ctx.beginPath(); ctx.arc(4.5,0,2.2,-1.05,1.05); ctx.stroke();
    ctx.beginPath(); ctx.arc(-4.5,0,2.2,Math.PI-1.05,Math.PI+1.05); ctx.stroke();
  }

  if(t && t.homing && !REDUCED){
    var flap=Math.sin(t.t*34);
    ctx.save(); ctx.rotate(-ang);                   // wings stay upright whatever the flight
    for(var wg=0; wg<2; wg++){
      var sx2=wg?1:-1;
      ctx.save(); ctx.scale(sx2,1); ctx.rotate(-0.25-flap*0.35);
      ctx.beginPath(); ctx.moveTo(1,-2);
      ctx.quadraticCurveTo(6,-13,16,-15); ctx.quadraticCurveTo(12,-10,14,-8);
      ctx.quadraticCurveTo(9,-7,10,-4); ctx.quadraticCurveTo(6,-4,4,-1); ctx.closePath();
      ctx.fillStyle='rgba(255,255,255,.96)'; ctx.fill();
      ctx.strokeStyle='rgba(140,170,220,.9)'; ctx.lineWidth=0.6; ctx.stroke();
      ctx.restore();
    }
    ctx.strokeStyle='rgba(255,210,63,.95)'; ctx.lineWidth=1.3;         // the halo
    ctx.beginPath(); ctx.ellipse(0,-10,5.5,1.8,0,0,Math.PI*2); ctx.stroke();
    ctx.restore();
  }
  if(spiral){
    // Two seams half a turn apart. One of them is always on the near side, so
    // the spin reads as continuous rotation instead of the laces blinking on
    // and off once a revolution.
    // A spiral turns about the LONG axis, so a seam travels across the ball,
    // up and over and under, not from nose to tail. It was sliding lengthways,
    // which reads as the ball rolling end over end.
    for(var sg=0; sg<2; sg++){
      var ph=phase+sg*Math.PI, c2=Math.cos(ph);
      if(c2<=0.02) continue;                      // that seam is round the back
      var sy=Math.sin(ph)*3.5;                    // how far across the face
      var half=6.0*Math.sqrt(Math.max(0.04,1-(sy/4.3)*(sy/4.3)));
      ctx.globalAlpha=0.26+0.50*c2;
      ctx.strokeStyle='#f1f1ec'; ctx.lineWidth=0.8;
      ctx.beginPath(); ctx.moveTo(-half,sy); ctx.lineTo(half,sy); ctx.stroke();
      ctx.globalAlpha=1;
    }
    // the laces ride the near seam, so they travel across it too
    var c=Math.cos(phase);
    if(c>0){
      var ly=Math.sin(phase)*3.5;
      ctx.globalAlpha=Math.min(1,c*1.6);
      ctx.strokeStyle='#f1f1ec';
      ctx.lineWidth=0.95;
      ctx.beginPath(); ctx.moveTo(-2.7,ly); ctx.lineTo(2.7,ly); ctx.stroke();
      ctx.lineWidth=0.75;
      var rung=0.85+0.5*c;                        // rungs foreshorten near the rim
      for(var i=-2;i<=2;i++){
        ctx.beginPath();
        ctx.moveTo(i*1.25,ly-rung); ctx.lineTo(i*1.25,ly+rung); ctx.stroke();
      }
      ctx.globalAlpha=1;
    }
    // faint motion streak behind the nose
    ctx.globalAlpha=0.28; ctx.strokeStyle='#f1f1ec'; ctx.lineWidth=0.7;
    ctx.beginPath(); ctx.moveTo(-7,0); ctx.lineTo(-13,0); ctx.stroke();
    ctx.globalAlpha=1;
  } else {
    ctx.strokeStyle='#f1f1ec'; ctx.lineWidth=0.9;
    ctx.beginPath(); ctx.moveTo(-2.4,0); ctx.lineTo(2.4,0); ctx.stroke();
  }
  ctx.restore();
}

function roundRect(x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

// ================================================================ hud
// Which team this browser is driving. The guest is always the Rivals.
function mySide(){ return (NET.on && !NET.host) ? 'A' : 'H'; }
function iHaveBall(){ return G.offense === mySide(); }

function hud(){
  stage.classList.toggle('tdcam', !!(G.broadcast && G.broadcast.td && G.broadcast.until>performance.now()));
  var bSw=document.getElementById('bSwitch');
  if(bSw){ bSw.classList.toggle('on', (G.phase==='live'||G.phase==='presnap') && !iHaveBall()); bSw.classList.toggle('pulse', !!G.swHint && G.phase==='live'); }
  elH.textContent=G.scoreH; elA.textContent=G.scoreA;
  var mm=Math.floor(G.clock/60), ss=Math.floor(G.clock%60);
  elClock.textContent=G.training ? 'PRACTICE' : mm+':'+(ss<10?'0':'')+ss;
  var ord=['','1st','2nd','3rd','4th'][Math.min(4,G.down)];
  elDD.textContent=ord+' & '+Math.max(1,Math.round(G.toGo))+'  ·  ball on '+yardLineLabel(G.los);
  if(G.phase==='presnap'){
    elPoss.textContent=(G.clockRunning?'CLOCK RUNNING':'CLOCK STOPPED')+
      '  ·  HIKE :'+(G.playClock<10?'0':'')+Math.max(0,Math.ceil(G.playClock));
    elPoss.style.color=G.clockRunning?'#e0384e':'#4fd18b';
  } else {
    elPoss.textContent=iHaveBall()?'Your ball':(mySide()==='H'?FOE.name+' ball — you’re on D':'Heroes ball — you’re on D');
    elPoss.style.color=iHaveBall()?'#ffd23f':'#e0384e';
  }
  var dbg=document.getElementById('dbg');
  if(dbg){
    var net = NET.on ? ((NET.host?'ONLINE HOST':'ONLINE GUEST')+
                        ' · room '+NET.code+
                        ' · '+((NET.conn&&NET.conn.open)?'linked':'dropped')) : '';
    var thr = G.lastThrow ? ('pass: '+G.lastThrow) : '';
    dbg.textContent = net && thr ? (net+'  ·  '+thr) : (net||thr);
    dbg.style.color = NET.on ? ((NET.conn&&NET.conn.open)?'#4fd18b':'#e0384e') : '#6d818f';
  }
  var guest=(NET.on&&!NET.host);
  var pw=guest?G.M2.power:G.power;
  var st=guest?G.M2.stam:G.stam;
  barPw.style.width=pw+'%'; barSt.style.width=st+'%';
  var onD=!iHaveBall();
  var rdy = onD ? (G.hitCd>0?0:Math.min(100,(G.power/45)*100))
                : (HERO.move==='cannon'?100:(G.moveCd>0?0:Math.min(100,(G.power/Math.max(1,HERO.cost))*100)));
  barMv.style.width=rdy+'%';
  elMvName.textContent = onD ? 'Big Hit' : HERO.moveName;
  abilities(onD);
}

function ab(i){ return AB[i] || (AB[i]=document.getElementById('ab'+i)); }
// Until the painted icons exist, each move gets its own colour behind its drawing.
var AB_COL={rocket:'#ff8c2b', perfect:'#7fd8ff', forcefield:'#3fa0ff', dash:'#ff8c2b', stiffarm:'#ffd23f',
  teleport:'#29d3e6', superblock:'#8b93a3', clothesline:'#e0384e', superspeed:'#4fd18b', spin:'#48b8ff',
  slam:'#c0772b', fumblegen:'#b36bff', aagun:'#ff4b4b', bighit:'#ffd23f', pound:'#d9822b', pitch:'#9ad14f',

// A card used to pop for every hit, block and spin, so the corner of the
// screen was a slideshow. Nothing shows a card mid-play now; the play is
// credited as it goes, and one card comes up at the whistle for whoever
// actually decided it.
var ACT_WEIGHT = {
  'TOUCHDOWN':100, 'PICK SIX':100, 'INTERCEPTION':90, 'FORCED FUMBLE':85,
  'SCOOP':80, 'SACK':70, 'RECOVERY':60, 'PASS DEFENDED':55,
  'GROUND POUND':50, 'BIG HIT':45, 'CLOTHESLINE':42, 'SLAM':42,
  'SUPER BLOCK':32, 'STIFF ARM':30, 'TACKLE':20
};
function credit(p, action){
  if(!G.cur || !p) return;
  var side = (p.team===G.cur.team) ? 'o' : 'd';
  var w = ACT_WEIGHT[action] || 10;
  if(w >= (G.cur[side+'W']||0)){
    G.cur[side+'Star']=p; G.cur[side+'Act']=action; G.cur[side+'W']=w;
  }
}

// ================================================================== the book
// Every play gets written down: who called what, who touched it, how far it
// went and how it ended. The box score is just the log added up.
function freshSide(){
  return {plays:0, yards:0, pa:0, pc:0, py:0, ptd:0, ints:0,
          ra:0, ry:0, rtd:0, sacks:0, sy:0, fum:0, fd:0};
}
function freshStats(){ return {log:[], H:freshSide(), A:freshSide()}; }

function playName(id){
  var all=PLAYS.H.concat(PLAYS.A);
  for(var i=0;i<all.length;i++) if(all[i].id===id) return all[i].name;
  if(id==='punt') return 'PUNT';
  if(id==='fg')   return 'FIELD GOAL';
  if(id==='pat')  return 'EXTRA POINT';
  return String(id||'').toUpperCase();
}
function surname(p){
  var src=p && (p.player||p.name);            // the football name when he has one (as on his card)
  if(!src) return '';
  var bits=src.split(' ');
  return bits[bits.length-1].toUpperCase();
}

// opened at the snap, closed at the whistle
function openPlay(playId){
  G.cur = {no:G.playNo, team:G.offense, down:G.down, toGo:Math.max(1,Math.round(G.toGo)),
           los:G.los, play:playName(playId), passer:null, target:null,
           comp:false, pick:false, rusher:null, fum:false, kick:null, qb:null,
           oStar:null, oAct:'', oW:0, dStar:null, dAct:'', dW:0};
}

function logPlay(atX, label, scored){
  var c=G.cur; if(!c) return;
  G.cur=null;                                  // exactly one entry per play
  var d=(c.team==='H')?1:-1;
  var gained=Math.round((atX-c.los)*d/YD);
  var S=G.stats[c.team];
  var car=G.carrier;
  var designedRun = (c.play==='POWER RUN'||c.play==='DRAW');
  var sack = !c.comp && !c.pick && !c.passer && !c.rusher && !c.kick &&
             !designedRun && gained<0;

  S.plays++;
  if(!c.kick){
    S.yards+=gained;
    if(c.passer){
      S.pa++;
      if(c.comp){ S.pc++; S.py+=gained; if(scored) S.ptd++; }
      if(c.pick) S.ints++;
    } else if(sack){
      S.sy+=gained;                        // a sack is not a carry
    } else {
      S.ra++; S.ry+=gained; if(scored) S.rtd++;
    }
  }
  if(sack) S.sacks++;
  if(c.fum) S.fum++;

  var who = c.comp  ? (surname(c.passer)+' to '+surname(c.target))
          : c.pick  ? (surname(c.passer)+' picked off')
          : c.rusher? surname(c.rusher)
          : c.passer? (surname(c.passer)+' incomplete')
          : sack    ? surname(c.qb)
          : car     ? surname(car) : '';

  // Six yards or a score is the offence's play, and the card goes to the man
  // who had the ball: the runner, the receiver who caught it, the quarterback
  // who scrambled for it. A blocker's move never takes it from him. Five or
  // less, or a pick or a fumble, belongs to the defender who made it so: the
  // man who made the tackle, unless someone did something bigger (a sack, a
  // pick, a forced fumble, a pass knocked down).
  var offenceWon = scored || gained >= 6;
  var star, act;
  if(scored && car && car.team!==c.team){
    star=car; act = c.pick ? 'PICK SIX' : 'SCOOP AND SCORE';
  } else if(offenceWon){
    star = (car && car.team===c.team) ? car : (c.target || c.rusher || c.qb);
    act  = scored ? 'TOUCHDOWN'
         : (c.oAct && c.oStar===star) ? c.oAct
         : c.comp ? 'BIG CATCH' : (star && star.role==='QB') ? 'QB SCRAMBLE' : 'BIG GAIN';
  } else {
    var big = (ACT_WEIGHT[c.dAct]||0) >= 55;           // sack, pick, fumble, pass defended
    star = big ? c.dStar : (c.tackler || c.dStar);
    act  = (big || c.dStar===star) && c.dAct ? c.dAct
         : (c.pick?'INTERCEPTION' : c.fum?'FORCED FUMBLE'
         : sack?'SACK' : (c.passer&&!c.comp)?'PASS DEFENDED' : 'TACKLE');
    if(!star){ star = car || c.qb; act = c.passer?'INCOMPLETE':'NO GAIN'; }
  }
  // The end-of-play checklist, top down. Whoever it lands on gets the card,
  // and the kind of play decides how he celebrates.
  var tackled = (label==='TACKLED' || label==='BIG HIT');
  var firstDown = !scored && !c.pick && !c.kick && gained >= (c.toGo||99);
  var dance = 'pump';
  if(scored){ dance=G.tdKind||'td'; }
  else if(sack){ dance='flex'; }
  else if(firstDown && car && car.team===c.team){ star=car; act='FIRST DOWN'; }
  else if(label==='OUT OF BOUNDS' && car && car.team===c.team){ star=car; act='OUT OF BOUNDS'; }
  else if(tackled && gained<=5 && (c.tackler||c.dStar)){
    star=c.tackler||c.dStar; act=(star===c.dStar&&c.dAct)?c.dAct:'TACKLE'; dance='flex';
    G.stopBanner=true;                                  // "DEFENSIVE STOP!"
  }
  if(star) G.cardQ={p:star, act:act, dance:dance};    // shown after the banner, in postPlay

  G.stats.log.push({no:c.no, team:c.team, down:c.down, toGo:c.toGo,
                    spot:yardLineLabel(c.los), play:c.play, yds:gained,
                    res: scored?'TOUCHDOWN':(sack?'SACK':(label||'')), who:who});
  if(G.stats.log.length>60) G.stats.log.shift();
}

    '<b style="color:#e8eef2">Last play:</b> '+e.play+' &middot; '+sign+e.yds+
